 Lisboa. Em Executiva a poltrona reclina — vale dormir logo após o serviço de jantar para chegar descansadas.","dica":"Ajustem o relógio para o horário de Lisboa assim que embarcarem. Paris está 5 horas à frente de BH em setembro.","lat":-19.6336,"lng":-43.9686}],"deslocamentos":["Casa → Aeroporto de Confins: carro/transfer · ~50 min do centro de BH","Localizador TAP: AAAAAA · Classe Executiva"]},{"num":2,"data":"2026-09-11","titulo":"Chegada a Paris","energia":"🔋 Moderado","resumo":"Pouso em Orly às 06:55. Dia de aterrissar em Paris com calma: depositar as malas, um primeiro passeio pelo centro e dormir cedo.","atividades":[{"horario":"06:55 – 08:00","nome":"Desembarque em Paris-Orly (ORY) + Imigração Schengen","descricao":"A imigração Schengen já foi feita em Lisboa, então em Orly a chegada é doméstica — só retirada de bagagem. Saída rápida.","dica":"⚠️ Não há hospedagem reservada para as noites de 11 e 12/09. É o primeiro ponto a fechar deste roteiro.","lat":48.7262,"lng":2.3652},{"horario":"08:00 – 09:30","nome":"Transfer Orly → Centro de Paris","descricao":"Orlyval + RER B, ou o novo Metrô 14 direto de Orly até Châtelet (cerca de 25 min, sem baldeação). Táxi tem tarifa fixa para a Margem Direita e Margem Esquerda.","dica":"O Metrô 14 é a opção mais simples com malas — vai direto de Orly ao centro.","lat":48.7262,"lng":2.3652},{"horario":"10:00 – 12:00","nome":"Île de la Cité e Notre-Dame","descricao":"Primeiro contato com Paris sem exigir energia: caminhada pela ilha, fachada de Notre-Dame reaberta, Pont Neuf e as margens do Sena.","dica":"Se as malas ainda não puderam ser deixadas no hotel, usem consignas de bagagem nas estações (Nannybag / Bounce).","lat":48.853,"lng":2.3499},{"horario":"12:30 – 14:00","nome":"Almoço no Marais","descricao":"Bairro histórico com ritmo leve, boas padarias e bistrôs. Ideal para o primeiro almoço depois de uma noite de voo.","dica":"Depois de voo noturno, o segredo é não dormir à tarde: segurem até as 21h e o fuso se ajusta em um dia.","lat":48.859,"lng":2.362},{"horario":"15:00 – 18:00","nome":"Torre Eiffel e Champ de Mars","descricao":"Ver a Torre de perto no primeiro dia resolve a ansiedade da viagem. O Champ de Mars é o melhor lugar para sentar, descansar e fotografar sem fila.","dica":"Se quiserem subir, comprem online com antecedência — no dia, as filas passam de 2 horas.","lat":48.8584,"lng":2.2945},{"horario":"19:30 – 21:00","nome":"Jantar leve e recolher cedo","descricao":"Jantar simples e sem deslocamento longo. O corpo ainda está no fuso brasileiro e amanhã é o dia cheio em Paris.","lat":48.8584,"lng":2.2945}],"deslocamentos":["Orly → Centro: Metrô Linha 14 (~25 min) ou táxi tarifa fixa (~€36 Margem Esquerda / €44 Margem Direita)","Dentro de Paris: metrô é sempre mais rápido que carro. Vale o Navigo Easy ou pagamento por aproximação."]},{"num":3,"data":"2026-09-12","titulo":"Paris Clássica","energia":"🔋 Intenso","resumo":"Único dia inteiro em Paris. Roteiro concentrado no eixo Louvre–Tuileries–Champs-Élysées, com Montmartre no fim da tarde.","atividades":[{"horario":"09:00 – 12:00","nome":"Museu do Louvre","descricao":"Com um dia só, o Louvre pede recorte: Gioconda, Vitória de Samotrácia, Vênus de Milo e as galerias de pintura italiana. Duas a três horas resolvem bem.","dica":"Ingresso com horário marcado é obrigatório. Entrada pela Porte des Lions ou Carrousel costuma ter menos fila que a Pirâmide.","lat":48.8606,"lng":2.3376},{"horario":"12:00 – 13:30","nome":"Jardim das Tulherias + Almoço","descricao":"Saída natural do Louvre. Jardim clássico com cadeiras verdes à beira dos lagos — bom lugar para descansar as pernas antes de seguir.","lat":48.8635,"lng":2.3275},{"horario":"14:00 – 15:30","nome":"Praça da Concórdia e Champs-Élysées","descricao":"Caminhada pela avenida mais famosa da cidade, do obelisco até o Arco do Triunfo. Trecho de ~2 km, plano e agradável.","dica":"Quem quiser encurtar: metrô Concorde → Charles de Gaulle-Étoile, três estações.","lat":48.8656,"lng":2.3212},{"horario":"15:30 – 16:30","nome":"Arco do Triunfo — Terraço","descricao":"O terraço do Arco tem a melhor vista das 12 avenidas em estrela e da Torre Eiffel ao fundo. São 284 degraus (há elevador para mobilidade reduzida).","dica":"Não atravessem a rotatória a pé — o acesso é pelo túnel subterrâneo na Champs-Élysées.","lat":48.8738,"lng":2.295},{"horario":"17:30 – 19:30","nome":"Montmartre e Sacré-Cœur","descricao":"Fim de tarde na colina: a basílica branca, a Place du Tertre com os pintores e a vista sobre toda Paris no pôr do sol.","dica":"Subam de funicular (aceita bilhete de metrô) e desçam a pé pelas ruelas — poupa as pernas e o passeio fica mais bonito.","lat":48.8867,"lng":2.3431},{"horario":"20:00 – 22:00","nome":"Jantar em Montmartre + Malas prontas","descricao":"Jantar na região de Abbesses, com clima de bairro. Voltar cedo: amanhã é dia de TGV para a Provence.","dica":"Deixem as malas fechadas hoje. O TGV para Aix sai da Gare de Lyon e não espera ninguém.","lat":48.8841,"lng":2.338}],"deslocamentos":["Louvre → Arco do Triunfo: a pé pelas Tulherias e Champs-Élysées (~45 min) ou metrô Linha 1","Arco do Triunfo → Montmartre: metrô Linha 2 até Anvers (~20 min)"]},{"num":4,"data":"2026-09-13","titulo":"Paris → Aix-en-Provence","energia":"🔋 Moderado","resumo":"TGV da Gare de Lyon até a Provence, retirada do Peugeot 3008 na Alamo e check-in em Aix por 3 noites. Fim de tarde no Cours Mirabeau.","atividades":[{"horario":"08:30 – 09:30","nome":"Gare de Lyon — Embarque no TGV","descricao":"TGV direto Paris → Aix-en-Provence TGV em cerca de 3h10. Compra antecipada na SNCF Connect reduz muito o preço.","dica":"Cheguem 30 min antes: a plataforma só é anunciada uns 20 min antes da partida e o trem é longo.","lat":48.8443,"lng":2.3743},{"horario":"09:30 – 12:45","nome":"TGV Paris → Aix-en-Provence TGV","descricao":"Viagem confortável atravessando a Borgonha e o Vale do Ródano. Vale garantir assentos juntos na hora da compra.","dica":"A estação Aix-en-Provence TGV fica a 15 km do centro — não confundam com a Gare Routière do centro.","lat":48.8443,"lng":2.3743},{"horario":"13:00 – 14:00","nome":"🚗 Retirada do carro — Alamo (Peugeot 3008 ou similar)","descricao":"Retirada hoje, 13/09, conforme confirmação 1694941667COUNT. Confiram franquia, seguro, política de combustível e o vinheta Crit'Air se forem entrar em zonas restritas.","dica":"Levem CNH + Permissão Internacional para Dirigir e o cartão de crédito do titular. A Alamo bloqueia caução no cartão.","lat":43.4553,"lng":5.317},{"horario":"14:30 – 15:30","nome":"🏨 Check-in · City Résidence Aix-en-Provence","descricao":"Check-in em 13/09 · Check-out em 16/09 · 3 noites · 3 hóspedes · Confirmação 33375389/33375389. Base fixa para explorar toda a Provence de carro.","dica":"Confirmem estacionamento do apart-hotel — no centro de Aix, vaga é o principal problema.","lat":43.5297,"lng":5.4474},{"horario":"16:30 – 19:00","nome":"Cours Mirabeau e Centro Histórico de Aix","descricao":"A avenida arborizada com fontes e cafés antigos é o coração de Aix. A partir dela, as ruelas do Vieil Aix, a Place d'Albertas e a catedral Saint-Sauveur.","dica":"Domingo à noite muita coisa fecha cedo em Aix — jantem por volta das 19h30.","lat":43.5283,"lng":5.4497},{"horario":"19:30 – 21:30","nome":"Jantar provençal em Aix","descricao":"Primeiro jantar no sul: ratatouille, peixe, azeite e rosé da Provence. Aix tem ótima densidade de restaurantes a pé do centro.","lat":43.5283,"lng":5.4497}],"deslocamentos":["Paris Gare de Lyon → Aix-en-Provence TGV: TGV ~3h10","Estação Aix TGV → Centro de Aix: ~20 min de carro pela A51","🚗 Carro Alamo em uso de 13/09 a 20/09"]},{"num":5,"data":"2026-09-14","titulo":"Luberon — Vilarejos da Provence","energia":"🔋 Moderado","resumo":"Dia clássico de estrada pelo Luberon: Gordes empoleirada na rocha, a abadia de Sénanque e o ocre vermelho de Roussillon.","atividades":[{"horario":"08:30 – 09:45","nome":"Saída de Aix → Gordes","descricao":"Cerca de 1h de estrada por paisagem de vinhedos e oliveiras. Sair cedo garante Gordes sem ônibus de excursão.","dica":"Abasteçam em Aix — nos vilarejos o combustível é mais caro e os postos fecham cedo.","lat":43.5297,"lng":5.4474},{"horario":"09:45 – 11:30","nome":"Gordes — Vilarejo e Mirante","descricao":"Um dos vilarejos mais bonitos da França, construído em terraços de pedra clara sobre o vale. O mirante da entrada é a foto-cartão.","dica":"Estacionem no parking do alto e desçam a pé. As ruelas centrais são estreitas demais para o 3008.","lat":43.9114,"lng":5.2004},{"horario":"11:45 – 12:45","nome":"Abadia de Sénanque","descricao":"Mosteiro cisterciense do século XII no fundo de um vale. Em setembro a lavanda já foi colhida, mas o conjunto arquitetônico continua sendo o ponto alto.","dica":"Visita interna só com reserva prévia no site da abadia. Sem reserva, dá para ver o exterior e o vale.","lat":43.9285,"lng":5.193},{"horario":"13:00 – 14:30","nome":"Almoço em Roussillon","descricao":"Almoço tranquilo na praça do vilarejo, com vista para as fachadas em tons de ocre.","lat":43.9026,"lng":5.2929},{"horario":"14:30 – 16:30","nome":"Sentier des Ocres — Roussillon","descricao":"Trilha curta (30 a 50 min) entre falésias de ocre vermelho e amarelo. Cenário totalmente diferente do resto da Provence.","dica":"Evitem sapato e roupa clara — o pó de ocre gruda e não sai.","lat":43.9026,"lng":5.2929},{"horario":"17:00 – 18:30","nome":"L'Isle-sur-la-Sorgue","descricao":"Cidade das águas e dos antiquários, com rodas d'água e canais. Parada leve e agradável no caminho de volta.","dica":"As lojas de antiguidades concentram-se aos domingos, mas o centro vale a caminhada qualquer dia.","lat":43.9186,"lng":5.0517},{"horario":"19:30 – 21:30","nome":"Retorno a Aix + Jantar","descricao":"Volta de cerca de 1h. Segunda noite no City Résidence.","lat":43.5297,"lng":5.4474}],"deslocamentos":["Aix → Gordes: ~1h · A51 + D900","Gordes → Sénanque: ~10 min · estrada estreita e sinuosa","Roussillon → L'Isle-sur-la-Sorgue: ~30 min","L'Isle-sur-la-Sorgue → Aix: ~1h"]},{"num":6,"data":"2026-09-15","titulo":"Cassis, Calanques e Marselha","energia":"🔋 Moderado","resumo":"Do interior para o mar: o porto de Cassis, passeio de barco pelas calanques e fim de tarde em Marselha, com Notre-Dame de la Garde no alto.","atividades":[{"horario":"08:30 – 09:30","nome":"Aix → Cassis","descricao":"Cerca de 45 min de carro. Chegar cedo é essencial: o estacionamento de Cassis lota antes das 10h.","dica":"Usem o parking Les Gorguettes com shuttle para o centro em dias cheios — é o que evita 40 min rodando atrás de vaga.","lat":43.5297,"lng":5.4474},{"horario":"09:30 – 11:30","nome":"Passeio de barco pelas Calanques","descricao":"Saídas do porto de Cassis, com opções de 45 min (3 calanques) a 1h30 (8 calanques). Falésias brancas caindo em água turquesa — o ponto alto do trecho francês.","dica":"Comprem no cais logo na chegada. Em caso de mistral forte, os barcos não saem — plano B é a caminhada até Port-Miou.","lat":43.2148,"lng":5.5384},{"horario":"11:30 – 13:00","nome":"Porto de Cassis + Almoço de frutos do mar","descricao":"Almoço à beira do porto, com os barcos de pesca na frente. Peixe grelhado e um rosé de Cassis, que é denominação própria.","lat":43.2148,"lng":5.5384},{"horario":"14:00 – 15:00","nome":"Route des Crêtes (Cassis → Marselha)","descricao":"Estrada panorâmica sobre as falésias mais altas da França. Curta, com vários mirantes para parar.","dica":"A estrada pode ser fechada por risco de incêndio — confiram no dia. Se fechada, sigam pela A50.","lat":43.2073,"lng":5.5225},{"horario":"15:30 – 17:00","nome":"Vieux-Port de Marselha e Le Panier","descricao":"O porto velho e o bairro mais antigo da cidade, com ruelas coloridas e arte de rua. Cidade grande, viva e bem diferente do interior provençal.","dica":"Em Marselha, deixem o carro em estacionamento fechado e nada visível dentro dele.","lat":43.2951,"lng":5.374},{"horario":"17:15 – 18:30","nome":"Notre-Dame de la Garde","descricao":"A basílica no ponto mais alto da cidade tem vista de 360° sobre Marselha, o porto e as ilhas. Melhor luz no fim da tarde.","dica":"Subam de carro até o estacionamento — a pé é uma subida bem íngreme.","lat":43.284,"lng":5.3714},{"horario":"19:30 – 21:30","nome":"Retorno a Aix + Última noite","descricao":"Volta de ~40 min pela A51. Última noite no City Résidence — vale já organizar as malas para o check-out.","lat":43.5297,"lng":5.4474}],"deslocamentos":["Aix → Cassis: ~45 min","Cassis → Marselha: ~35 min pela Route des Crêtes / ~30 min pela A50","Marselha → Aix: ~40 min pela A51"]},{"num":7,"data":"2026-09-16","titulo":"Aix → Sainte-Maxime e Saint-Tropez","energia":"🔋 Moderado","resumo":"Check-out de Aix e travessia para o Golfo de Saint-Tropez. Uma noite só em Sainte-Maxime — dia de aproveitar a tarde do outro lado da baía.","atividades":[{"horario":"09:00 – 10:00","nome":"🏨 Check-out · City Résidence Aix-en-Provence","descricao":"Check-out em 16/09, encerrando as 3 noites em Aix. Conferir cofre, tomadas e sacada antes de entregar as chaves.","dica":"Aproveitem para abastecer e comprar água antes de pegar a estrada.","lat":43.5297,"lng":5.4474},{"horario":"10:00 – 12:00","nome":"Aix → Sainte-Maxime","descricao":"Cerca de 1h40 pela A8, saindo em Le Muy. Trecho tranquilo, com o relevo mudando para o maciço dos Maures.","lat":43.5297,"lng":5.4474},{"horario":"12:30 – 14:00","nome":"Almoço em Sainte-Maxime + Porto","descricao":"Cidade balneária tranquila em frente a Saint-Tropez, com praia de areia e passeio à beira-mar. Almoço no porto.","lat":43.3092,"lng":6.6386},{"horario":"14:00 – 15:00","nome":"🏨 Check-in · B&B Hotel Sainte-Maxime Golfe De Saint-Tropez","descricao":"Check-in em 16/09 · Check-out em 17/09 · 1 noite · 3 hóspedes · Confirmação 197-14625374. É uma noite só — deixem na mala apenas o necessário.","dica":"Como é pernoite único, tirem só a bolsa de mão do carro. Não vale desfazer as malas.","lat":43.3092,"lng":6.6386},{"horario":"15:30 – 18:30","nome":"Saint-Tropez","descricao":"Travessia de barco desde Sainte-Maxime (~20 min) evita o trânsito notório da estrada da baía. Vieux Port, Place des Lices e a Citadelle no alto.","dica":"Vão de barco, não de carro. Em setembro a temporada afrouxa, mas estacionar em Saint-Tropez continua sendo um problema.","lat":43.2677,"lng":6.6407},{"horario":"19:00 – 21:00","nome":"Port Grimaud ou jantar em Sainte-Maxime","descricao":"Port Grimaud, a 'Veneza provençal', é uma parada curta e bonita no fim de tarde. Alternativa: jantar direto no porto de Sainte-Maxime.","dica":"Amanhã a estrada até Nice é panorâmica e vale ser feita sem pressa — dormir cedo ajuda.","lat":43.2733,"lng":6.58}],"deslocamentos":["Aix → Sainte-Maxime: ~1h40 · A8 saída Le Muy","Sainte-Maxime ↔ Saint-Tropez: barco Bateaux Verts ~20 min (recomendado) ou ~40 min de carro","Sainte-Maxime → Port Grimaud: ~15 min"]},{"num":8,"data":"2026-09-17","titulo":"Rumo a Nice pela Riviera","energia":"🔋 Moderado","resumo":"Check-out em Sainte-Maxime e subida da Côte d'Azur até Nice, onde ficam as 3 últimas noites da França.","atividades":[{"horario":"09:30 – 10:00","nome":"🏨 Check-out · B&B Hotel Sainte-Maxime","descricao":"Check-out em 17/09 após a noite única no Golfo de Saint-Tropez.","lat":43.3092,"lng":6.6386},{"horario":"10:00 – 12:00","nome":"Estrada Sainte-Maxime → Cannes","descricao":"Cerca de 1h20 pela A8. Se houver tempo e disposição, a costeira via Fréjus e Saint-Raphaël é mais bonita e mais lenta.","lat":43.3092,"lng":6.6386},{"horario":"12:30 – 14:00","nome":"Almoço e caminhada em Cannes — La Croisette","descricao":"Parada no meio do caminho: a avenida beira-mar, o Palais des Festivals e o porto dos iates. Uma hora e meia resolve bem.","dica":"Estacionamento subterrâneo no Palais des Festivals é o mais prático.","lat":43.5513,"lng":7.0128},{"horario":"14:30 – 15:30","nome":"Antibes — Vieil Antibes","descricao":"Cidade murada com um dos mercados provençais mais bonitos da costa e vista para os Alpes ao fundo.","dica":"O Marché Provençal fecha por volta das 13h — se quiserem mercado, é preciso inverter a ordem do dia.","lat":43.5808,"lng":7.125},{"horario":"16:30 – 17:30","nome":"🏨 Check-in · D'Ostende Hotel — Nice","descricao":"Check-in em 17/09 · Check-out em 20/09 · 3 noites · 3 hóspedes · Confirmação 55532031/53399402. Base para os últimos dias na França.","dica":"Confirmem estacionamento com o hotel. Em Nice, garagem custa em torno de €25–30/dia e a rua é zona azul.","lat":43.695,"lng":7.265},{"horario":"18:00 – 20:00","nome":"Promenade des Anglais e Vieux Nice","descricao":"Fim de tarde na orla e nas ruelas coloridas da cidade velha. A Cours Saleya concentra restaurantes e bares.","dica":"Provem a socca, a panqueca de grão-de-bico típica de Nice, no Vieux Nice.","lat":43.696,"lng":7.276},{"horario":"20:00 – 22:00","nome":"Jantar no Vieux Nice","descricao":"Cozinha niçoise: salade niçoise de verdade, pissaladière, peixe do dia.","lat":43.696,"lng":7.276}],"deslocamentos":["Sainte-Maxime → Cannes: ~1h20 pela A8","Cannes → Antibes: ~25 min","Antibes → Nice: ~35 min"]},{"num":9,"data":"2026-09-18","titulo":"Èze, Mônaco e as Corniches","energia":"🔋 Moderado","resumo":"O trecho mais cinematográfico da Riviera: as estradas em cornija, o vilarejo suspenso de Èze e Monte-Carlo à noite.","atividades":[{"horario":"09:00 – 09:40","nome":"Nice → Villefranche-sur-Mer","descricao":"Primeira parada da Basse Corniche, a 15 min de Nice. Baía profunda, casario ocre e um dos portos naturais mais bonitos do Mediterrâneo.","lat":43.695,"lng":7.265},{"horario":"09:40 – 10:30","nome":"Villefranche-sur-Mer","descricao":"Caminhada curta pela orla e pela rue Obscure medieval. Parada rápida, mas obrigatória.","lat":43.704,"lng":7.311},{"horario":"11:00 – 13:00","nome":"Èze Village — Jardin Exotique","descricao":"Vilarejo medieval a 400 m acima do mar, todo em pedra. O Jardim Exótico no topo tem a vista mais impressionante de toda a costa.","dica":"Subida a pé de uns 10 min em ladeira desde o estacionamento. Sapato fechado e confortável faz diferença.","lat":43.7279,"lng":7.362},{"horario":"13:15 – 14:30","nome":"Almoço em Èze ou La Turbie","descricao":"Èze tem restaurantes com vista, mais caros. La Turbie, logo acima na Grande Corniche, é mais simples e igualmente bonita.","lat":43.7279,"lng":7.362},{"horario":"15:00 – 19:00","nome":"Mônaco e Monte-Carlo","descricao":"Rocher com o Palácio Príncipe e a catedral, Jardim Exótico, Museu Oceanográfico, o circuito de F1 pelas ruas e o Cassino de Monte-Carlo.","dica":"Estacionem no Parking des Pêcheurs ou do Cassino. Mônaco é outro país — levem passaporte, embora não haja controle de fronteira.","lat":43.7396,"lng":7.4276},{"horario":"19:00 – 20:00","nome":"Cassino de Monte-Carlo — Praça e fachada","descricao":"Mesmo sem entrar, a praça com os carros e a fachada Belle Époque iluminada valem o fim de tarde.","dica":"Para entrar no cassino há dress code e taxa de entrada. A praça é gratuita.","lat":43.7396,"lng":7.4276},{"horario":"20:30 – 22:00","nome":"Retorno a Nice pela Moyenne Corniche","descricao":"Volta de ~30 min. A Moyenne Corniche à noite, com as luzes da costa embaixo, é um passeio por si só.","lat":43.695,"lng":7.265}],"deslocamentos":["Nice → Villefranche: ~15 min pela Basse Corniche","Villefranche → Èze: ~20 min pela Moyenne Corniche","Èze → Mônaco: ~20 min","Mônaco → Nice: ~30 min"]},{"num":10,"data":"2026-09-19","titulo":"Saint-Paul-de-Vence e Último Dia na França","energia":"🔋 Leve","resumo":"Dia mais leve: um vilarejo de artistas no interior, tarde livre em Nice e preparação para a travessia à Itália.","atividades":[{"horario":"09:30 – 10:15","nome":"Nice → Saint-Paul-de-Vence","descricao":"Cerca de 40 min subindo para o interior. Estrada tranquila entre oliveiras.","lat":43.695,"lng":7.265},{"horario":"10:15 – 13:00","nome":"Saint-Paul-de-Vence","descricao":"Vilarejo medieval murado que virou reduto de artistas — Chagall viveu e está enterrado aqui. Galerias de arte em quase todas as portas.","dica":"Chegar antes das 11h faz enorme diferença nas ruelas, que são estreitas e enchem rápido.","lat":43.6959,"lng":7.1222},{"horario":"13:00 – 14:30","nome":"Almoço em Saint-Paul ou Vence","descricao":"Vence, a 10 min, é uma cidade maior e menos turística, com boa opção de almoço e a Chapelle du Rosaire decorada por Matisse.","dica":"A Chapelle Matisse tem horários bem restritos — confiram antes de contar com ela.","lat":43.6959,"lng":7.1222},{"horario":"15:30 – 18:00","nome":"Nice — Colline du Château e orla","descricao":"Retorno a Nice. Subida à Colline du Château (há elevador gratuito) para a vista clássica sobre a Baie des Anges e a cidade velha.","dica":"O elevador fica no fim da Promenade des Anglais, junto ao Vieux Nice. Poupa toda a escadaria.","lat":43.6947,"lng":7.281},{"horario":"18:00 – 20:00","nome":"Compras finais e organização das malas","descricao":"Última noite na França e último dia com carro. Vale reorganizar as malas: a partir de amanhã tudo será feito em trem e a pé.","dica":"⚠️ Amanhã o carro precisa ser devolvido. Confiram nível de combustível e limpeza interna hoje à noite.","lat":43.695,"lng":7.265},{"horario":"20:00 – 22:00","nome":"Jantar de despedida em Nice","descricao":"Jantar mais caprichado para fechar o trecho francês. O Vieux Nice e o Port Lympia concentram as melhores opções.","lat":43.696,"lng":7.276}],"deslocamentos":["Nice → Saint-Paul-de-Vence: ~40 min","Saint-Paul → Nice: ~40 min","Dentro de Nice: tudo a pé ou de tram"]},{"num":11,"data":"2026-09-20","titulo":"Nice → Milão · Entrada na Itália","energia":"🔋 Moderado","resumo":"Check-out em Nice, devolução do Peugeot e travessia para a Itália. Noite de chegada em Milão, com 2 pessoas a partir daqui.","atividades":[{"horario":"08:30 – 09:30","nome":"🏨 Check-out · D'Ostende Hotel — Nice","descricao":"Check-out em 20/09, encerrando as 3 noites em Nice e todo o trecho francês.","dica":"⚠️ A partir de hoje as reservas estão em nome de 2 hóspedes. Confirmem se há mudança na composição do grupo.","lat":43.695,"lng":7.265},{"horario":"09:30 – 10:30","nome":"🚗 Devolução do carro — Alamo","descricao":"Devolução prevista para 20/09 conforme a reserva 1694941667COUNT. Devolver abastecido e com tempo de sobra para a vistoria.","dica":"⚠️ Confirmar o local exato de devolução na reserva (Aeroporto de Nice ou centro). Devolução em local diferente do contratado gera cobrança pesada.","lat":43.6653,"lng":7.215},{"horario":"11:00 – 14:00","nome":"Travessia Nice → Milão","descricao":"Duas opções: voo direto Nice–Milão (~1h10, Linate ou Malpensa) ou trem via Ventimiglia/Gênova (~5h a 6h, com baldeações).","dica":"⚠️ Este trecho não aparece na documentação da viagem. Precisa ser reservado — o voo é bem mais simples e costuma sair barato com antecedência.","lat":43.6653,"lng":7.215},{"horario":"15:00 – 16:00","nome":"🏨 Check-in · ibis Milano Centro","descricao":"Check-in em 20/09 · Check-out em 22/09 · 2 noites · 2 hóspedes · Confirmação 207-16552797. Localização central, a pé da Estação Centrale e do metrô.","lat":45.4838,"lng":9.193},{"horario":"16:30 – 19:00","nome":"Duomo di Milano e Galleria Vittorio Emanuele II","descricao":"Primeiro contato com Milão: a catedral gótica e a galeria de vidro e ferro do século XIX ao lado. É domingo — a piazza estará cheia e viva.","dica":"Ingresso combinado Duomo + Terraços vale muito a pena e evita fila dupla. Ombros cobertos são exigidos para entrar.","lat":45.4642,"lng":9.19},{"horario":"19:30 – 21:30","nome":"Aperitivo e jantar no centro de Milão","descricao":"O aperitivo milanês (drink + buffet, das 18h30 às 21h) é instituição local. Boa forma de começar a Itália.","dica":"⚠️ Amanhã é segunda-feira: Cenacolo, Pinacoteca de Brera e museus do Castello fecham. Se quiserem a Última Ceia, hoje é impossível — programem-se.","lat":45.4642,"lng":9.19}],"deslocamentos":["Nice → Milão: voo ~1h10 (NCE→LIN/MXP) ou trem ~5h30 via Ventimiglia — ⚠️ a reservar","Aeroporto de Milão → Centro: Malpensa Express ~50 min · Linate metrô M4 ~15 min","Em Milão: metrô resolve tudo. Bilhete urbano ~€2,20"]},{"num":12,"data":"2026-09-21","titulo":"Milão a Pé","energia":"🔋 Moderado","resumo":"Dia inteiro em Milão numa segunda-feira: terraços do Duomo, Castello Sforzesco por fora, Brera e Navigli no fim da tarde.","atividades":[{"horario":"09:00 – 11:00","nome":"Terraços do Duomo","descricao":"Subida entre as agulhas góticas e as estátuas, com vista para a cidade e, em dia limpo, para os Alpes. É o melhor programa de Milão.","dica":"Elevador poupa 250 degraus e custa poucos euros a mais. Vão cedo — a luz da manhã é melhor para fotos.","lat":45.4642,"lng":9.19},{"horario":"11:15 – 12:30","nome":"Castello Sforzesco e Parco Sempione","descricao":"O castelo dos Sforza e o parque atrás dele. Na segunda-feira os museus internos fecham, mas os pátios e o parque continuam abertos e gratuitos.","dica":"Atravessem o parque até o Arco della Pace — caminhada agradável de 15 min.","lat":45.4707,"lng":9.1795},{"horario":"12:45 – 14:00","nome":"Almoço no bairro de Brera","descricao":"Bairro de ruelas de paralelepípedo, ateliês e trattorias. Melhor lugar de Milão para almoçar sem cair em armadilha turística.","lat":45.472,"lng":9.188},{"horario":"14:30 – 16:30","nome":"Quadrilatero della Moda e Corso Buenos Aires","descricao":"Duas caras das compras milanesas: o quadrilátero do luxo (Montenapoleone, Della Spiga) e o Corso Buenos Aires, mais popular e prático.","dica":"Lojas italianas costumam abrir às 10h e algumas fecham para o almoço. Segunda de manhã, várias só abrem às 15h30.","lat":45.469,"lng":9.195},{"horario":"17:00 – 19:00","nome":"Navigli — Canais","descricao":"Os canais projetados por Leonardo, hoje o polo de aperitivo da cidade. Fim de tarde à beira d'água é o ponto alto do dia.","dica":"Metrô M2 até Porta Genova. O Naviglio Grande é o mais movimentado.","lat":45.4508,"lng":9.1735},{"horario":"19:00 – 21:30","nome":"Jantar nos Navigli + Malas prontas","descricao":"Última noite em Milão. Amanhã o trem para Veneza sai da Centrale.","dica":"Comprem o bilhete Milão–Veneza com antecedência: Frecciarossa antecipado sai por uma fração do preço de balcão.","lat":45.4508,"lng":9.1735}],"deslocamentos":["Hotel → Duomo: metrô M3 até Duomo (~10 min)","Duomo → Castello: a pé ~15 min pela Via Dante","Brera → Navigli: metrô M2 Lanza → Porta Genova (~15 min)"]},{"num":13,"data":"2026-09-22","titulo":"Milão → Veneza","energia":"🔋 Moderado","resumo":"Frecciarossa até Santa Lucia e chegada em Veneza. Check-in a poucos passos de San Marco e primeiro fim de tarde nos canais.","atividades":[{"horario":"09:00 – 10:00","nome":"🏨 Check-out · ibis Milano Centro + Milano Centrale","descricao":"Check-out em 22/09. O hotel fica a caminho da Centrale, o que facilita o deslocamento com malas.","lat":45.4838,"lng":9.193},{"horario":"10:00 – 12:30","nome":"Frecciarossa Milão → Venezia Santa Lucia","descricao":"Cerca de 2h25 direto. A estação Santa Lucia fica dentro de Veneza, com o Grande Canal na porta.","dica":"Desçam em Santa Lucia, não em Mestre. Mestre fica no continente.","lat":45.4869,"lng":9.205},{"horario":"12:45 – 13:45","nome":"Vaporetto Santa Lucia → San Marco","descricao":"A linha 1 percorre todo o Grande Canal em cerca de 40 min. É a chegada mais bonita possível em Veneza — vale mais que qualquer passeio pago.","dica":"Comprem o passe de vaporetto de 48h ao chegar. Compensa a partir de 3 trajetos por dia.","lat":45.4408,"lng":12.321},{"horario":"14:00 – 15:00","nome":"🏨 Check-in · Antica Locanda Al Gambero","descricao":"Check-in em 22/09 · Check-out em 24/09 · 2 noites · 2 hóspedes · Confirmação 207-16552809. Fica na Calle dei Fabbri, a 3 minutos a pé de San Marco.","dica":"Em Veneza não existe táxi de rua nem carro. Do vaporetto ao hotel é a pé, com mala, por ponte e degrau — vale mala leve.","lat":45.4351,"lng":12.3364},{"horario":"15:30 – 18:00","nome":"Piazza San Marco e Ponte de Rialto","descricao":"Reconhecimento do centro: a praça, a fachada da basílica, o Campanile e a caminhada até Rialto pelas Mercerie.","dica":"Fim de tarde é o melhor horário em San Marco — os grupos de excursão de bate-volta já foram embora.","lat":45.4341,"lng":12.3388},{"horario":"18:30 – 20:00","nome":"Pôr do sol em Dorsoduro — Punta della Dogana","descricao":"A ponta de Dorsoduro, em frente a San Marco, tem o melhor pôr do sol de Veneza, com a Basílica della Salute ao lado.","lat":45.431,"lng":12.328},{"horario":"20:00 – 22:00","nome":"Cicchetti e jantar veneziano","descricao":"Os cicchetti — petiscos de balcão em bacari — são a melhor forma de jantar em Veneza. Zona de Rialto e Cannaregio concentram os bons.","dica":"Fujam de restaurantes com foto no cardápio e cantor na porta perto de San Marco.","lat":45.438,"lng":12.3358}],"deslocamentos":["Milano Centrale → Venezia Santa Lucia: Frecciarossa ~2h25","Santa Lucia → San Marco: vaporetto linha 1 ~40 min (cênico) ou linha 2 ~25 min","Em Veneza: tudo a pé ou de vaporetto"]},{"num":14,"data":"2026-09-23","titulo":"Veneza — Basílica e Ilhas","energia":"🔋 Intenso","resumo":"Único dia inteiro em Veneza: Basílica de São Marco, Palácio Ducal pela manhã e Murano e Burano à tarde.","atividades":[{"horario":"08:30 – 09:30","nome":"Basílica de São Marco","descricao":"Mosaicos dourados cobrindo 8 mil m² de abóbada. Vale o adicional para a Pala d'Oro e para a loggia dos cavalos, com vista sobre a praça.","dica":"Reserva de horário online é praticamente obrigatória. Mochilas grandes não entram — há guarda-volumes gratuito ao lado.","lat":45.4345,"lng":12.3396},{"horario":"09:45 – 11:30","nome":"Palácio Ducal e Ponte dos Suspiros","descricao":"Sede do poder da República por mil anos: salas monumentais, o Salão do Maior Conselho e a travessia da Ponte dos Suspiros até as prisões.","dica":"O ingresso combinado com o Museu Correr é o padrão. Comprem online e entrem pela Porta del Frumento.","lat":45.4337,"lng":12.3403},{"horario":"11:45 – 13:00","nome":"Campanile de San Marco + Almoço","descricao":"Elevador até o topo do campanário, com a vista aérea da praça, da laguna e dos telhados. Depois, almoço nas ruelas atrás da praça.","lat":45.4341,"lng":12.3388},{"horario":"13:30 – 15:30","nome":"Murano — Vidro","descricao":"Vaporetto linha 12 ou 4.1 desde Fondamente Nove. Ateliês de sopro de vidro e o Museu do Vidro. Uma demonstração de sopro leva 20 min e vale a parada.","dica":"Recusem os 'transfers gratuitos' oferecidos em San Marco — são levadas a lojas com comissão.","lat":45.4586,"lng":12.354},{"horario":"15:45 – 18:00","nome":"Burano — Casas Coloridas","descricao":"A ilha das casas pintadas em cores fortes e da renda artesanal. Cerca de 40 min de Murano pela linha 12. Fim de tarde ali é o melhor momento de luz.","dica":"Confiram o horário do último vaporetto de volta antes de relaxar demais na ilha.","lat":45.4853,"lng":12.4167},{"horario":"19:00 – 20:00","nome":"Retorno a Veneza","descricao":"Volta de vaporetto até Fondamente Nove e caminhada por Cannaregio, o bairro mais residencial e autêntico da cidade.","lat":45.4408,"lng":12.321},{"horario":"20:00 – 22:00","nome":"Jantar em Cannaregio + Malas","descricao":"Última noite em Veneza. Amanhã é dia de trem para Florença.","lat":45.4408,"lng":12.321}],"deslocamentos":["San Marco → Fondamente Nove: a pé ~20 min","Fondamente Nove → Murano: vaporetto ~10 min","Murano → Burano: vaporetto linha 12 ~40 min","Burano → Veneza: vaporetto ~45 min"]},{"num":15,"data":"2026-09-24","titulo":"Veneza → Florença","energia":"🔋 Moderado","resumo":"Manhã de trem até Santa Maria Novella, check-in em Oltrarno e o primeiro pôr do sol no Piazzale Michelangelo.","atividades":[{"horario":"09:00 – 10:00","nome":"🏨 Check-out · Antica Locanda Al Gambero + Santa Lucia","descricao":"Check-out em 24/09. Da Calle dei Fabbri até a estação, vaporetto linha 2 é o caminho mais direto com malas.","dica":"Saiam com folga: com mala, atravessar Veneza sempre leva mais tempo do que o mapa sugere.","lat":45.4351,"lng":12.3364},{"horario":"10:30 – 12:45","nome":"Frecciarossa Veneza → Firenze Santa Maria Novella","descricao":"Cerca de 2h05 direto. Santa Maria Novella fica no centro de Florença, a 15 min a pé do Duomo.","lat":45.4408,"lng":12.321},{"horario":"13:00 – 14:30","nome":"Almoço e chegada em Florença","descricao":"Almoço na região do Mercato Centrale, a poucos minutos da estação. Bom lugar para o primeiro contato com a comida toscana.","lat":43.7765,"lng":11.248},{"horario":"15:00 – 16:00","nome":"🏨 Check-in · La Torre Del Cestello","descricao":"Check-in em 24/09 · Check-out em 26/09 · 2 noites · 2 hóspedes · Confirmação 72077181984767. Fica no Oltrarno, bairro de artesãos, atravessando o rio.","dica":"O Oltrarno é o lado mais tranquilo e mais autêntico de Florença — ótima escolha de localização.","lat":43.7716,"lng":11.2432},{"horario":"16:30 – 18:00","nome":"Ponte Vecchio e Centro Histórico","descricao":"A ponte das ourivesarias, a Piazza della Signoria com a cópia do Davi e a Loggia dei Lanzi, que é um museu de esculturas ao ar livre e gratuito.","lat":43.768,"lng":11.2531},{"horario":"18:30 – 19:45","nome":"Piazzale Michelangelo — Pôr do Sol","descricao":"A vista clássica de Florença, com o Duomo e o Arno na mesma foto. Subida a pé de ~25 min desde o Oltrarno ou ônibus 12/13.","dica":"Chegar 40 min antes do pôr do sol garante lugar na mureta. Levem uma garrafa de água para a subida.","lat":43.7629,"lng":11.265},{"horario":"20:00 – 22:00","nome":"Jantar no Oltrarno","descricao":"Santo Spirito e San Frediano concentram as melhores trattorias de Florença, com preço muito melhor que o centro.","dica":"Bistecca alla fiorentina é servida malpassada e por peso — costuma pesar 1 kg e serve duas pessoas.","lat":43.7716,"lng":11.2432}],"deslocamentos":["Venezia Santa Lucia → Firenze SMN: Frecciarossa ~2h05","Estação SMN → La Torre Del Cestello: ~15 min a pé ou táxi curto","Em Florença: tudo a pé — o centro é compacto"]},{"num":16,"data":"2026-09-25","titulo":"Florença — Duomo e Uffizi","energia":"🔋 Intenso","resumo":"Dia inteiro de Renascimento: complexo do Duomo pela manhã, Uffizi à tarde e o Oltrarno à noite.","atividades":[{"horario":"08:30 – 11:00","nome":"Complexo do Duomo — Cúpula de Brunelleschi","descricao":"Catedral, Batistério com as Portas do Paraíso, Campanile de Giotto e a subida dos 463 degraus até a cúpula, entre os afrescos do Juízo Final.","dica":"A subida à cúpula exige reserva de horário específico e não é feita por elevador. Quem tiver claustrofobia deve preferir o Campanile.","lat":43.7731,"lng":11.256},{"horario":"11:15 – 12:30","nome":"Galleria dell'Accademia — Davi","descricao":"O Davi original de Michelangelo, além dos Prisioneiros inacabados, que muita gente acha ainda mais impressionantes.","dica":"Ingresso com horário marcado. Sem reserva, a fila passa fácil de 1h30.","lat":43.777,"lng":11.2588},{"horario":"12:30 – 14:00","nome":"Almoço no Mercato Centrale","descricao":"Andar de cima do mercado é uma praça de alimentação de alto nível, com pratos toscanos bem executados e preço justo.","lat":43.7765,"lng":11.2537},{"horario":"14:30 – 17:30","nome":"Galeria Uffizi","descricao":"Botticelli, Leonardo, Caravaggio, Michelangelo. É um dos maiores museus do mundo — 3 horas é o mínimo razoável.","dica":"Entrada com horário marcado. O corredor com vista para o Ponte Vecchio, no fim do percurso, é uma das melhores vistas de Florença.","lat":43.7678,"lng":11.2553},{"horario":"18:00 – 19:30","nome":"Santa Croce e Oltrarno","descricao":"A basílica onde estão Michelangelo, Galileu e Maquiavel. Depois, travessia para o Oltrarno pelo Ponte alle Grazie.","lat":43.7686,"lng":11.2621},{"horario":"20:00 – 22:00","nome":"Jantar em Santo Spirito","descricao":"Última noite em Florença. A praça de Santo Spirito à noite tem clima de bairro e boa mesa.","dica":"⚠️ Se quiserem um dia na Toscana (Siena, San Gimignano, Chianti), ele teria de substituir este dia — não há folga no calendário.","lat":43.766,"lng":11.2478}],"deslocamentos":["Tudo a pé — Duomo, Accademia, Uffizi e Santa Croce ficam em raio de 1 km","Uffizi → Oltrarno: ~10 min a pé pelo Ponte Vecchio"]},{"num":17,"data":"2026-09-26","titulo":"Florença → Roma","energia":"🔋 Moderado","resumo":"Última mudança de cidade. Frecciarossa até Termini e check-in em Roma, onde ficam as 4 noites finais da viagem.","atividades":[{"horario":"09:30 – 10:30","nome":"🏨 Check-out · La Torre Del Cestello","descricao":"Check-out em 26/09, encerrando as 2 noites em Florença.","lat":43.7716,"lng":11.2432},{"horario":"11:00 – 12:35","nome":"Frecciarossa Firenze → Roma Termini","descricao":"Apenas 1h35 de viagem. É o trecho mais curto de trem de toda a viagem.","dica":"Comprem com antecedência: o mesmo trem pode custar €19 ou €95 dependendo do dia da compra.","lat":43.7765,"lng":11.248},{"horario":"13:00 – 14:00","nome":"Almoço perto de Termini + Traslado","descricao":"Almoço rápido e deslocamento até o hotel. Termini fica a cerca de 15 min de táxi da região de Piazza Colonna.","lat":41.901,"lng":12.502},{"horario":"14:00 – 15:00","nome":"🏨 Check-in · Colonna Luxury Suites","descricao":"Check-in em 26/09 · Check-out em 30/09 · 4 noites · 2 hóspedes · Confirmação 72077182123356. Localização excepcional, no centro histórico, a passos da Fontana di Trevi e do Panteão.","dica":"Ficar aqui significa que Trevi, Panteão e Piazza Navona são todos alcançáveis a pé. Aproveitem isso à noite.","lat":41.9008,"lng":12.4797},{"horario":"16:00 – 18:00","nome":"Panteão e Piazza Navona","descricao":"O Panteão, com o óculo aberto no topo da cúpula, e a Piazza Navona com as fontes de Bernini. Estão a minutos do hotel.","dica":"O Panteão hoje cobra entrada e pede reserva online. A Piazza Navona é livre.","lat":41.8986,"lng":12.4769},{"horario":"18:30 – 19:30","nome":"Fontana di Trevi","descricao":"Melhor às 18h30, quando o sol já baixou e as luzes acendem. É lotada em qualquer horário — o truque é ir também de madrugada, ao voltar do jantar.","dica":"Cuidado com carteiristas na multidão em volta da fonte. Bolsa à frente do corpo.","lat":41.9009,"lng":12.4833},{"horario":"20:00 – 22:00","nome":"Jantar no centro histórico","descricao":"Primeira noite em Roma. Ruelas atrás do Panteão e da Via del Governo Vecchio têm boas trattorias.","dica":"Cacio e pepe, carbonara e amatriciana são os três pratos romanos que valem a pena repetir.","lat":41.8992,"lng":12.4731}],"deslocamentos":["Firenze SMN → Roma Termini: Frecciarossa ~1h35","Termini → Colonna Luxury Suites: táxi ~15 min ou metrô A até Barberini + 10 min a pé","Em Roma: o centro histórico é todo caminhável a partir do hotel"]},{"num":18,"data":"2026-09-27","titulo":"Roma Antiga","energia":"🔋 Intenso","resumo":"Coliseu, Fórum Romano e Palatino pela manhã, Capitólio à tarde e Trastevere à noite.","atividades":[{"horario":"08:30 – 10:30","nome":"Coliseu","descricao":"O anfiteatro mais famoso do mundo. O ingresso padrão dá acesso às arquibancadas; a arena e os subterrâneos são bilhetes separados e bem mais concorridos.","dica":"Ingresso com horário marcado, comprado direto no site oficial. É domingo — chegar às 8h30 evita o pico.","lat":41.8902,"lng":12.4922},{"horario":"10:45 – 13:00","nome":"Fórum Romano e Monte Palatino","descricao":"Mesmo ingresso do Coliseu, válido para o conjunto. O Palatino, onde ficavam os palácios imperiais, tem a melhor vista sobre o Fórum.","dica":"Quase não há sombra nem água no percurso. Levem garrafa e boné — as fontanelle de Roma são potáveis e gratuitas.","lat":41.8925,"lng":12.4853},{"horario":"13:15 – 14:30","nome":"Almoço no Monti","descricao":"Bairro logo acima do Fórum, com ritmo de vizinhança e restaurantes muito melhores que os da Via dei Fori Imperiali.","lat":41.8946,"lng":12.4913},{"horario":"15:00 – 17:00","nome":"Capitólio e Vittoriano","descricao":"A Piazza del Campidoglio desenhada por Michelangelo e o terraço do Vittoriano, que tem a vista mais completa sobre os Fóruns.","dica":"O elevador panorâmico do Vittoriano é pago, mas a vista de 360° sobre Roma justifica.","lat":41.894,"lng":12.483},{"horario":"17:30 – 19:00","nome":"Bocca della Verità e Circo Máximo","descricao":"Caminhada tranquila pelo Foro Boario, com os templos redondos, a Bocca della Verità e o gramado do antigo circo de corridas.","lat":41.888,"lng":12.4813},{"horario":"19:30 – 22:00","nome":"Trastevere — Jantar","descricao":"O bairro do outro lado do Tibre, de ruelas com hera e trattorias tradicionais. É onde Roma janta melhor.","dica":"Domingo à noite Trastevere fica cheio. Vale reservar ou jantar a partir das 21h, no horário italiano.","lat":41.889,"lng":12.47}],"deslocamentos":["Hotel → Coliseu: metrô B (Colosseo) ~15 min ou 25 min a pé","Fórum → Capitólio: a pé ~10 min","Circo Máximo → Trastevere: a pé ~20 min pelo Ponte Palatino"]},{"num":19,"data":"2026-09-28","titulo":"Vaticano","energia":"🔋 Intenso","resumo":"Museus Vaticanos, Capela Sistina e Basílica de São Pedro. Tarde no Castel Sant'Angelo e fim de tarde mais leve.","atividades":[{"horario":"08:00 – 11:30","nome":"Museus Vaticanos e Capela Sistina","descricao":"Quatro séculos de acervo até chegar na Sistina de Michelangelo. O percurso é longo e não tem atalho — reserve 3 horas.","dica":"Segunda-feira é dia de museu aberto e movimento alto. Reserva com horário no site oficial é indispensável.","lat":41.9065,"lng":12.4536},{"horario":"11:30 – 13:00","nome":"Basílica de São Pedro","descricao":"A maior igreja do mundo, com a Pietà de Michelangelo logo à direita da entrada e o baldaquino de Bernini sob a cúpula.","dica":"Da Sistina existe uma saída lateral direta para a Basílica que economiza a volta pela praça — vale perguntar ao guarda.","lat":41.9022,"lng":12.4539},{"horario":"13:00 – 14:30","nome":"Almoço em Prati / Borgo Pio","descricao":"O Borgo Pio, a duas quadras da praça, tem restaurantes muito melhores que os das ruas de acesso ao Vaticano.","lat":41.9028,"lng":12.46},{"horario":"15:00 – 16:00","nome":"Cúpula de São Pedro","descricao":"Subida à cúpula: elevador até o terraço e depois 320 degraus em escada estreita e inclinada. A vista sobre a Praça de São Pedro é única.","dica":"A parte final é apertada e sem alternativa. Quem tiver claustrofobia deve parar no terraço.","lat":41.9022,"lng":12.4539},{"horario":"16:30 – 18:00","nome":"Castel Sant'Angelo","descricao":"O mausoléu de Adriano virado em fortaleza papal, com a passagem secreta que ligava ao Vaticano. Terraço com boa vista do Tibre.","dica":"A Ponte Sant'Angelo, com os anjos de Bernini, é a foto obrigatória no fim da tarde.","lat":41.9031,"lng":12.4663},{"horario":"19:00 – 22:00","nome":"Piazza di Spagna e jantar","descricao":"Fim de tarde na Escadaria Espanhola e nas ruas de compras ao redor, tudo a pé do hotel.","dica":"Sentar nos degraus da escadaria é proibido e multado desde 2019.","lat":41.9058,"lng":12.4823}],"deslocamentos":["Hotel → Museus Vaticanos: metrô A até Ottaviano (~20 min) ou táxi ~15 min","Vaticano → Castel Sant'Angelo: a pé ~15 min pela Via della Conciliazione","Castel Sant'Angelo → Piazza di Spagna: a pé ~20 min"]},{"num":20,"data":"2026-09-29","titulo":"Último Dia em Roma","energia":"🔋 Leve","resumo":"Dia mais leve para fechar a viagem: Villa Borghese, compras finais e um jantar de despedida. Voo é logo cedo amanhã.","atividades":[{"horario":"09:00 – 11:00","nome":"Galleria Borghese","descricao":"O melhor museu de Roma em relação tamanho/impacto: as esculturas de Bernini e os Caravaggios, em visita de 2 horas com horário fixo.","dica":"Entrada estritamente por horário marcado e com semanas de antecedência. Se não conseguirem, o parque em volta é gratuito e lindo.","lat":41.9142,"lng":12.4922},{"horario":"11:00 – 12:30","nome":"Parque de Villa Borghese e Terraço do Pincio","descricao":"Caminhada pelo maior parque do centro de Roma até o terraço do Pincio, com vista sobre a Piazza del Popolo e os telhados da cidade.","lat":41.911,"lng":12.478},{"horario":"12:30 – 14:00","nome":"Piazza del Popolo + Almoço","descricao":"Descida pela rampa até a praça, com as igrejas gêmeas e a Santa Maria del Popolo, que guarda dois Caravaggios — de graça.","lat":41.9107,"lng":12.4763},{"horario":"14:30 – 17:00","nome":"Via del Corso e Compras Finais","descricao":"A via principal de compras liga Piazza del Popolo a Piazza Venezia e passa a poucos metros do hotel. Bom trecho para as últimas lembranças.","dica":"Guardem espaço e peso na mala. Lembrem do limite de líquidos na bagagem de mão.","lat":41.9008,"lng":12.4797},{"horario":"17:30 – 19:00","nome":"Volta ao hotel e arrumação das malas","descricao":"⚠️ O voo de volta sai do Fiumicino às 10:10 e o check-out é no mesmo dia. Malas prontas hoje, sem exceção.","dica":"Peçam ao Colonna Luxury Suites para agendar o transfer para o aeroporto ainda hoje.","lat":41.9008,"lng":12.4797},{"horario":"19:30 – 21:30","nome":"Jantar de despedida + Fontana di Trevi à noite","descricao":"Último jantar da viagem no centro histórico e uma passada final na Fontana di Trevi, bem mais tranquila depois das 22h.","dica":"Dormir cedo: amanhã a saída do hotel é por volta das 06:30.","lat":41.9009,"lng":12.4833}],"deslocamentos":["Hotel → Villa Borghese: a pé ~20 min ou metrô A até Spagna","Villa Borghese → Piazza del Popolo: a pé pela rampa do Pincio ~10 min","Piazza del Popolo → Hotel: a pé ~15 min pela Via del Corso"]},{"num":21,"data":"2026-09-30","titulo":"Roma → Belo Horizonte","energia":"🔋 Leve","resumo":"Check-out no Colonna e voo TP839 das 10:10 no Fiumicino, com conexão em Lisboa e chegada em Confins às 15:50.","atividades":[{"horario":"06:30 – 07:00","nome":"🏨 Check-out · Colonna Luxury Suites","descricao":"Check-out em 30/09, encerrando as 4 noites em Roma e os 21 dias de viagem. Conferir cofre, gavetas e carregadores.","dica":"⚠️ Check-out e voo no mesmo dia com saída às 10:10 é apertado. Transfer agendado na véspera é obrigatório.","lat":41.9008,"lng":12.4797},{"horario":"07:00 – 07:50","nome":"Traslado até o Aeroporto de Fiumicino (FCO)","descricao":"Cerca de 45 min de carro do centro. Táxi tem tarifa fixa oficial centro–Fiumicino, o que evita surpresa.","dica":"O Leonardo Express sai de Termini e leva 32 min, mas obriga a ir antes até Termini com as malas — o táxi porta a porta é mais seguro no horário.","lat":41.8003,"lng":12.2389},{"horario":"07:50 – 10:10","nome":"Check-in TAP e Restituição de IVA","descricao":"Fiumicino é grande. Se tiverem compras com direito a tax free, façam o carimbo e a restituição ANTES do despacho da bagagem.","dica":"Localizador AAAAAA · TP839 FCO–LIS e TP103 LIS–CNF, em Executiva. Sala VIP disponível em ambos os aeroportos.","lat":41.8003,"lng":12.2389},{"horario":"10:10","nome":"Decolagem TP839 · Roma → Lisboa → Belo Horizonte","descricao":"Conexão em Lisboa e chegada em Confins no mesmo dia, às 15:50.","lat":41.8003,"lng":12.2389},{"horario":"15:50","nome":"Chegada em Belo Horizonte (CNF)","descricao":"Desembarque internacional, alfândega e fim da viagem.","dica":"Guardem os comprovantes de compra — a Receita exige declaração acima da cota de US$ 1.000 por pessoa.","lat":-19.6336,"lng":-43.9686}],"deslocamentos":["Colonna Luxury Suites → FCO: táxi tarifa fixa ~€55 · ~45 min","FCO → LIS → CNF: TAP TP839 + TP103 · Executiva"]}],"documentos":[{"icon":"✈️","titulo":"Passagens Aéreas","meta":"CNF→ORY","badge":"Confirmado"},{"icon":"🏨","titulo":"Vouchers de Hotel","meta":"Antica Locanda Al Gambero · ibis Milano Centro · Colonna Luxury Suites · La Torre Del Cestello · B&B Hotel Sainte-Maxime Golfe De Saint-Tropez · City Résidence Aix-en-Provence · D'Ostende Hotel","badge":"Confirmado"},{"icon":"🚌","titulo":"Locação de Veículo","meta":"Alamo","badge":"Confirmado"},{"icon":"🛂","titulo":"Passaportes","meta":"Amira Zaidan","badge":"Verificar validade","badgeClass":"pending"}],"_slug":"interior-frances-e-italiano","footerNote":"Interior francês e italiano · Amira Zaidan"};
function fmtDateBR(iso){if(!iso)return'';var p=iso.split('-');if(p.length===3)return p[2]+'/'+p[1]+'/'+p[0];return iso;}
function bVC(v){return'<div class="voo-card"><div class="voo-lado"><div class="voo-city">'+(v.origemIata||'???')+'</div><div class="voo-airport">'+(v.origemNome||'')+'</div><div class="voo-time">'+(v.horaPartida||'—')+'</div><div class="voo-date">'+(v.data?fmtDateBR(v.data):'')+'</div></div><div class="voo-center"><span class="voo-arrow">✈</span><div class="voo-duration">Voo '+(v.tipo==='ida'?'Ida':'Volta')+(v.nvoo?' · '+v.nvoo:'')+'</div><span class="voo-badge">'+(v.cia||'Companhia a confirmar')+(v.classe?' · '+v.classe:'')+'</span>'+(v.conexao?'<div style="font-size:11px;color:var(--muted);margin-top:4px">Conexão: '+v.conexao+'</div>':'')+(v.pnr?'<div class="voo-pnr">Localizador: <strong>'+v.pnr+'</strong></div>':'')+'</div><div class="voo-lado" style="text-align:right"><div class="voo-city">'+(v.destinoIata||'???')+'</div><div class="voo-airport">'+(v.destinoNome||'')+'</div><div class="voo-time">'+(v.horaChegada||'—')+'</div><div class="voo-date">'+(v.dataChegada?fmtDateBR(v.dataChegada):'')+'</div></div></div>';}
function bHC(h){return'<div class="hotel-card"><div class="hotel-icon">🏨</div><div class="hotel-info"><div class="hotel-nome">'+(h.nome||'Hotel')+'</div><div class="hotel-meta">'+(h.cidade?'<span>📍 '+h.cidade+'</span>':'')+(h.hospedes?'<span>👥 '+h.hospedes+'</span>':'')+(h.noites?'<span>🌙 '+h.noites+' noite'+(h.noites!=1?'s':'')+'</span>':'')+'</div><div class="hotel-periodo">'+(h.checkin?fmtDateBR(h.checkin):'')+(h.checkout?' → '+fmtDateBR(h.checkout):'')+'</div>'+(h.conf?'<span class="hotel-conf">Conf. '+h.conf+'</span>':'')+'</div></div>';}

function rR(){if(typeof ROTEIRO_DATA==='undefined')return;var D=ROTEIRO_DATA;if(D.heroImage)document.getElementById('hero-img').style.backgroundImage="url('"+D.heroImage+"')";document.getElementById('hero-eyebrow').textContent=D.eyebrow||'Travel Concierge';document.getElementById('hero-title').innerHTML=(D.titulo||'').replace(' & ','<br>');document.getElementById('hero-subtitle').textContent=D.subtitulo||'';document.getElementById('hero-pills').innerHTML=(D.pills||[]).map(function(p){return'<span class="pill">'+p+'</span>';}).join('');var nl=[['#visao-geral','Visão Geral']].concat(D.voos&&D.voos.length?[['#voos','Voos']]:[]).concat(D.hospedagem&&D.hospedagem.length?[['#hospedagem','Hotel']]:[]).concat(D.servicos&&D.servicos.length?[['#servicos','Serviços']]:[]).concat(D.dias&&D.dias.length?[['#roteiro','Roteiro']]:[]).concat(D.documentos&&D.documentos.length?[['#documentos','Documentos']]:[]);document.getElementById('topbar-nav').innerHTML=nl.map(function(n){return'<a href="'+n[0]+'">'+n[1]+'</a>';}).join('');var cards=D.visaoGeral||[];document.getElementById('overview-grid').innerHTML=cards.map(function(c){return'<div class="info-card '+(c.variant||'')+'"><span class="info-card-label">'+c.label+'</span><span class="info-card-value">'+c.value+'</span></div>';}).join('');if(D.obs){document.getElementById('obs-box').style.display='';document.getElementById('obs-text').innerHTML=D.obs;}if(D.voos&&D.voos.length){document.getElementById('voos').style.display='';document.getElementById('voos-container').innerHTML=D.voos.slice().sort(function(a,b){return((a.data||'')+' '+(a.horaPartida||'')).localeCompare((b.data||'')+' '+(b.horaPartida||''));}).map(bVC).join('');}if(D.hospedagem&&D.hospedagem.length){document.getElementById('hospedagem').style.display='';document.getElementById('hr-hospedagem').style.display='';document.getElementById('hospedagem-container').innerHTML=D.hospedagem.slice().sort(function(a,b){return(a.checkin||'').localeCompare(b.checkin||'');}).map(bHC).jo function toggleDay(btn){var c=btn.nextElementSibling;btn.classList.toggle('open',!btn.classList.contains('open'));c.classList.toggle('open',!c.classList.contains('open'));}const PROXY='https://cdv-proxy-production.up.railway.app';let _docsUploadados={};let _docsList=[];async function _metaGet(slug){try{const r=await fetch(PROXY+'/roteiros/doc-upload?slug='+encodeURIComponent(slug)+'&_='+Date.now());const d=await r.json();return(d.ok&&d.docs)?d.docs:{};}catch(e){return{};}}async function _metaSave(slug,meta){try{await fetch(PROXY+'/roteiros/doc-meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:slug,meta:meta})});}catch(e){}}function _fileListHtml(docId){const files=_docsUploadados[docId]||[];if(!files.length)return'';return files.map(function(f,fi){const short=f.nome.length>20?f.nome.substring(0,17)+'...':f.nome;return'<div class="doc-uploaded" style="margin-top:4px">✅ <a href="'+f.rawUrl+'" target="_blank" class="doc-uploaded-link" title="'+f.nome+'">'+short+'</a><button class="doc-del-btn" title="Remover arquivo" onclick="removerDocArquivo(&quot;'+docId+'&quot;,'+fi+')">✕</button></div>';}).join('');}function _redrawDocs(){const grid=document.getElementById('docs-grid');grid.innerHTML=_docsList.map(function(doc){const docId=doc.docId;const titulo=(doc.titulo||'doc').replace(/'/g,'');return '<div class="doc-card" id="doccard-'+docId+'" style="position:relative"><button class="doc-card-del" title="Remover este cartao" onclick="removerDocCard(&quot;'+docId+'&quot;)" style="position:absolute;top:8px;right:8px;background:none;border:none;color:var(--muted2);cursor:pointer;font-size:13px;line-height:1;padding:0" onmouseover="this.style.color=&quot;var(--accent)&quot;" onmouseout="this.style.color=&quot;var(--muted2)&quot;">✕</button><span class="doc-icon">'+(doc.icon||'📄')+'</span><span class="doc-title">'+(doc.titulo||'')+'</span><span class="doc-meta">'+(doc.meta||'')+'</span>'+(doc.badge?'<span class="doc-badge '+(doc.badgeClas  extraCards){if(!existingIds.has(ex.docId))_docsList.push(ex);}_docsUploadados={};Object.entries(meta).forEach(function(entry){const fileName=entry[0];const info=entry[1];if(fileName.indexOf('_')===0)return;const fileId=fileName.replace(/\.[^.]+$/,'');const docId=fileId.replace(/_\d+$/,'');const rawUrl='https://raw.githubusercontent.com/davileles/roteiros/main/'+slug+'/docs/'+fileName;if(!_docsUploadados[docId])_docsUploadados[docId]=[];if(!_docsUploadados[docId].some(function(x){return x.fileId===fileId;}))_docsUploadados[docId].push({nome:info.nome||fileName,rawUrl:rawUrl,mediaType:info.mediaType||'',fileId:fileId});});_redrawDocs();}function renderDocCards(documentos){_docsList=documentos.map(function(doc,i){return Object.assign({},doc,{docId:doc.docId||('doc_'+i)});});_redrawDocs();const slug=ROTEIRO_DATA&&ROTEIRO_DATA._slug;if(slug)carregarDocsUpload(slug);}function triggerUpload(docId){const el=document.getElementById('input-'+docId);if(el)el.click();}async function handleDocUpload(docId,nomeDoc,input){const selecionados=Array.from(input.files||[]);if(!selecionados.length)return;const slug=ROTEIRO_DATA&&ROTEIRO_DATA._slug;if(!slug){alert('Slug do roteiro nao definido.');input.value='';return;}const maxMB=8;const grandes=selecionados.filter(function(f){return f.size>maxMB*1024*1024;});const fila=selecionados.filter(function(f){return f.size<=maxMB*1024*1024;});if(grandes.length)alert('Ignorado(s) por passar de '+maxMB+'MB:\n'+grandes.map(function(f){return f.name;}).join('\n'));if(!fila.length){input.value='';return;}const elUp=document.getElementById('uploading-'+docId);const erros=[];for(var i=0;i<fila.length;i++){const file=fila[i];if(elUp){elUp.textContent=fila.length>1?('Enviando '+(i+1)+'/'+fila.length+'...'):'Enviando...';elUp.style.display='';}const ext=file.name.split('.').pop().toLowerCase();const fileId=docId+'_'+(Date.now()+i);const fileName=fileId+'.'+ext;try{const b64=await new Promise(function(res,rej){const r=new FileReader();r.onload=function(){res(r.result.split(',')[1]);};r.onerror=rej;r.readAsDataURL(file);});const resp=await fetch(PROXY+'/roteiros/doc-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:slug,docId:fileName,nome:file.name,tipo:ext,base64:b64,mediaType:file.type})});const data=await resp.json();if(!data.ok)throw new Error(data.erro||'Erro no upload');if(!_docsUploadados[docId])_docsUploadados[docId]=[];_docsUploadados[docId].push({nome:file.name,rawUrl:data.rawUrl,mediaType:file.type,fileId:fileId});const st=document.getElementById('upload-status-'+docId);if(st)st.innerHTML=_fileListHtml(docId);}catch(e){erros.push(file.name+' - '+e.message);}}if(elUp){elUp.style.display='none';elUp.textContent='Enviando...';}if(erros.length)alert('Erro ao enviar arquivo(s):\n'+erros.join('\n'));input.value='';}async function removerDocArquivo(docId,fi){const files=_docsUploadados[docId]||[];const f=files[fi];if(!f)return;if(!confirm('Remover "'+f.nome+'"?'))return;_docsUploadados[docId].splice(fi,1);document.getElementById('upload-status-'+docId).innerHTML=_fileListHtml(docId);const slug=ROTEIRO_DATA&&ROTEIRO_DATA._slug;if(!slug)return;const ext=f.rawUrl.split('.').pop().toLowerCase();const fileName=f.fileId+'.'+ext;try{await fetch(PROXY+'/roteiros/doc-upload',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:slug,docId:fileName})});}catch(e){}}async function removerDocCard(docId){if(!confirm('Remover este cartao de documento?'))return;const slug=ROTEIRO_DATA&&ROTEIRO_DATA._slug;_docsList=_docsList.filter(function(d){return d.docId!==docId;});delete _docsUploadados[docId];_redrawDocs();if(!slug)return;const meta=await _metaGet(slug);const deleted=new Set(meta._deletedCards||[]);deleted.add(docId);const extras=(meta._extraCards||[]).filter(function(e){return e.docId!==docId;});meta._deletedCards=Array.from(deleted);meta._extraCards=extras;await _metaSave(slug,meta);}async function adicionarDocCard(){const titulo=prompt('Nome do documento:');if(!titulo)return;const slug=ROTEIRO_DATA&&ROTEIRO_DATA._slug;const newId='doc_extra_'+Date.now();const novoCard={docId:newId,icon:'📄',titulo:titulo,meta:'Adicionado manualmente',badge:''};_docsList.push(novoCard);_redrawDocs();if(!slug)return;const meta=await _metaGet(slug);meta._extraCards=(meta._extraCards||[]).concat([novoCard]);await _metaSave(slug,meta);}function mostrarDocAnexado(docId){}async function removerDoc(docId){await removerDocArquivo(docId,0);}
