<script>
const ROTEIRO_DATA = {"titulo":"Aniversário de casamento R&J","subtitulo":"Aniversário de casamento R&J","eyebrow":"Travel Concierge by @davileles","heroImage":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/Fernando_de_Noronha-Praia_do_Sancho.jpg/1920px-Fernando_de_Noronha-Praia_do_Sancho.jpg?utm_source=pt.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail","pills":["📅 22/09/2026 – 27/09/2026","👤 Rodolpho e Jamilli","🏨 Pousada Maria Bonita","🌴 6 dias em Noronha"],"visaoGeral":[{"label":"Destino","value":"Fernando de Noronha","variant":"coral"},{"label":"Período","value":"22/09/2026 a 27/09/2026"},{"label":"Viajantes","value":"Rodolpho e Jamilli"},{"label":"Hospedagem","value":"Pousada Maria Bonita Noronha"}],"obs":"<strong>Taxas obrigatórias.</strong> A TPA custa R$ 105,79 por noite e é paga em noronha.pe.gov.br — para as 5 noites, cerca de R$ 529 por pessoa. O ingresso do Parque Nacional Marinho custa R$ 192 por pessoa (brasileiros), vale 10 dias e é comprado em parnanoronha.com.br. Os dois QR Codes são exigidos: o da TPA no desembarque, o do parque na entrada de Sancho, Cacimba do Padre, Bode e Sueste. Valores vigentes — confirmar antes do pagamento.<br><br><strong>Fuso horário.</strong> Noronha opera em UTC−2, uma hora à frente de Brasília. Todos os horários deste roteiro estão no horário local da ilha.<br><br><strong>Perfil do roteiro.</strong> Montado sem trilhas guiadas, sem mergulho com cilindro e sem nado com tubarões, conforme combinado. A descida da Praia do Sancho é feita por escadas, não por trilha. O ensaio fotográfico subaquático ficou como opção para vocês avaliarem. O passeio de barco convencional foi retirado: a única navegação do roteiro é o entardecer privativo, na noite do aniversário. O último dia está livre de qualquer programação: apenas café, check-out e aeroporto.<br><br><strong>Setembro em Noronha.</strong> Estação seca, mar de dentro calmo e boa visibilidade na água. O sol se põe por volta das 17h30 no horário local.","voos":[{"tipo":"ida","origemIata":"CNF","origemNome":"Belo Horizonte","destinoIata":"FEN","destinoNome":"Fernando de Noronha","data":"2026-09-22","dataChegada":"2026-09-22","horaPartida":"08:25","horaChegada":"15:50","cia":"Azul","nvoo":"5089, 4255","conexao":"","classe":"Econômica","pnr":"VLBSGM"},{"tipo":"volta","origemIata":"FEN","origemNome":"Fernando de Noronha","destinoIata":"CNF","destinoNome":"Belo Horizonte","data":"2026-09-27","dataChegada":"2026-09-27","horaPartida":"11:10","horaChegada":"19:40","cia":"Azul","nvoo":"4719, 2930","conexao":"REC","classe":"Econômica","pnr":"VLBSGM"}],"hospedagem":[{"nome":"Pousada Maria Bonita Noronha","cidade":"Fernando de Noronha","checkin":"2026-09-22","checkout":"2026-09-27","noites":"5","conf":"72078606702198","hospedes":"2"}],"servicos":[{"icon":"🚙","nome":"Aluguel de buggy","meta":"23/09 a 26/09 · 4 diárias · retirada e devolução na pousada","badge":"A reservar"},{"icon":"🛶","nome":"Canoa havaiana ao amanhecer","meta":"25/09 · 05h20 · Porto de Santo Antônio","badge":"A reservar"},{"icon":"🌅","nome":"Entardecer privativo no mar","meta":"25/09 · barco exclusivo para o casal","badge":"A reservar"},{"icon":"🍽️","nome":"Festival Gastronômico do Zé Maria","meta":"23/09 · 20h · quartas e sábados","badge":"A reservar"},{"icon":"📸","nome":"Ensaio fotográfico subaquático","meta":"26/09 · em apneia, sem cilindro","badge":"Avaliar"},{"icon":"🎫","nome":"TPA + ingresso do Parque Nacional","meta":"Pagamento online antes do embarque","badge":"Pendente"},{"icon":"🚕","nome":"Transfer aeroporto → pousada","meta":"22/09 · 15h50 · chegada do voo","badge":"A reservar"},{"icon":"🚖","nome":"Transfer pousada → aeroporto","meta":"27/09 · 09h15 · voo das 11h10","badge":"A reservar"}],"dias":[{"num":1,"data":"2026-09-22","titulo":"Chegada","energia":"🟢 Leve","resumo":"Desembarque, check-in e o primeiro entardecer da ilha","atividades":[{"horario":"15:50","nome":"Desembarque em Fernando de Noronha (FEN)","descricao":"Na saída da aeronave há conferência do voucher da TPA e do documento com foto. O processo costuma levar de 20 a 30 minutos.","dica":"Noronha tem fuso próprio (UTC−2), uma hora à frente de Brasília. Ajustem o relógio assim que pousarem — todos os horários deste roteiro estão no horário local da ilha.","lat":-3.8564413,"lng":-32.4284106},{"horario":"16:30","nome":"Check-in na Pousada Maria Bonita","descricao":"Tempo para desfazer as malas, tomar um banho e respirar. A pousada fica na Floresta Nova, a poucos minutos da Vila dos Remédios.","dica":"Deixem a bagagem de mão com repelente e protetor solar à mão — a primeira saída é logo em seguida.","lat":-3.8474418,"lng":-32.4121651},{"horario":"17:00","nome":"Pôr do sol no Bar do Meio","descricao":"Primeiro entardecer da viagem, com vista para o Morro do Pico e o mar de dentro. Deque sobre a Praia do Meio, drinks e música ao vivo em alguns dias.","dica":"A casa trabalha com consumação mínima que varia conforme a área escolhida. Perguntem o valor antes de sentar.","lat":-3.839736,"lng":-32.4147713},{"horario":"20:00","nome":"Jantar no Restaurante Varanda","descricao":"Cozinha regional bem executada, ambiente informal e uma das melhores relações custo-benefício da ilha. Boa escolha para a primeira noite, sem formalidade.","dica":"Reservem pelo WhatsApp ainda de Belo Horizonte — a casa lota rápido na alta temporada.","lat":-3.8441185,"lng":-32.4057676}],"deslocamentos":["Aeroporto → Pousada Maria Bonita: cerca de 10 minutos de táxi","Táxi na ilha opera com tarifa por trecho; combine o valor antes de embarcar","Nesta noite ainda sem buggy — a retirada está prevista para o dia 23"]},{"num":2,"data":"2026-09-23","titulo":"Mar de dentro","energia":"🟢 Leve","resumo":"Retirada do buggy, praias do mar de dentro e Festival Gastronômico à noite","atividades":[{"horario":"06:30","nome":"Café da manhã na pousada","descricao":"Vale acordar cedo: o café da Maria Bonita é um dos pontos mais elogiados da casa.","lat":-3.8474418,"lng":-32.4121651},{"horario":"07:30","nome":"Retirada do buggy","descricao":"Primeira coisa do dia, para já sair com o veículo em mãos. A locadora costuma entregar na própria pousada. Confiram pneus, estepe, freios e tirem fotos do buggy antes de assinar.","dica":"Abasteçam ainda hoje: há um único posto na ilha e ele fecha cedo. O combustível em Noronha é bem mais caro que no continente.","lat":-3.8474418,"lng":-32.4121651},{"horario":"08:30","nome":"Praia do Porto","descricao":"A praia mais protegida da ilha e a de acesso mais fácil: entrada suave, água calma e boa visibilidade logo na beirada. É comum encontrar tartarugas e cardumes a poucos metros da areia, com máscara e snorkel.","dica":"Dá para alugar máscara e snorkel ali mesmo, na área do porto. Melhor na maré alta, quando a água fica mais clara.","lat":-3.8344673,"lng":-32.4013927},{"horario":"11:00","nome":"Vila dos Remédios e Praia do Cachorro","descricao":"Volta calma pela Vila, o centro histórico da ilha, com as igrejinhas e as lojas. A Praia do Cachorro fica logo abaixo e guarda o Buraco da Raquel, uma piscina natural que aparece na maré baixa.","dica":"Confiram a tábua de marés: a piscina só existe quando a maré está baixa.","lat":-3.842019,"lng":-32.4107087},{"horario":"13:00","nome":"Almoço no Mergulhão","descricao":"Fica a poucos metros do porto, com vista para o Morro do Pico e o mar. Peixes e frutos do mar frescos, num dos ambientes mais agradáveis da ilha.","dica":"Fecha aos domingos. Como vocês voltam num domingo, este é um bom dia para conhecer.","lat":-3.8346,"lng":-32.400452},{"horario":"15:30","nome":"Tarde na Praia da Conceição","descricao":"Areia larga, mar calmo e o Morro do Pico ao fundo. Barracas com cadeira, guarda-sol e água de coco. É a praia mais fácil para ficar sem compromisso até o fim do dia, incluindo o pôr do sol.","dica":"Levem repelente para o fim de tarde — os mosquitos aparecem quando o sol começa a cair.","lat":-3.8418634,"lng":-32.4180075},{"horario":"20:00","nome":"Festival Gastronômico do Zé Maria","descricao":"O jantar mais tradicional da ilha, servido às quartas e sábados a partir das 20h. Mais de 40 pratos entre peixes, frutos do mar, carnes, comida japonesa e uma mesa de sobremesas à parte.","dica":"As mesas são compartilhadas e as bebidas não estão inclusas. Comprem a experiência com antecedência — a fila na porta é comum.","lat":-3.8481594,"lng":-32.4169763}],"deslocamentos":["A partir da manhã de hoje, todos os deslocamentos são de buggy","Pousada → Porto de Santo Antônio: cerca de 8 minutos","Porto → Vila dos Remédios: cerca de 4 minutos"]},{"num":3,"data":"2026-09-24","titulo":"Buggy","energia":"🟡 Moderado","resumo":"Dia de buggy pelo Parque Nacional: Sancho, Cacimba do Padre e Bode","atividades":[{"horario":"07:30","nome":"Café da manhã e saída de buggy","descricao":"Dia inteiro no volante, no ritmo de vocês. Levem o QR Code do ingresso do Parque Nacional no celular — ele é conferido na entrada das praias.","lat":-3.8474418,"lng":-32.4121651},{"horario":"08:30","nome":"Mirante e Praia do Sancho","descricao":"A praia eleita várias vezes a mais bonita do mundo. Primeiro o mirante, no alto do paredão, e depois a descida até a areia por uma sequência de escadas metálicas encaixadas numa fenda de rocha — leva cerca de cinco minutos e não é trilha.","dica":"Cheguem logo na abertura: a escada é estreita, funciona em sentido único e forma fila a partir das 10h. Levem apenas uma bolsa pequena e à prova d’água.","lat":-3.8546893,"lng":-32.4436958},{"horario":"11:30","nome":"Praia da Cacimba do Padre","descricao":"Faixa larga de areia com o Morro Dois Irmãos ao fundo — o cartão-postal mais fotografado de Noronha. Em setembro o mar costuma estar calmo, sem o swell da temporada de surfe.","dica":"Melhor luz para foto do Dois Irmãos é no fim da tarde, mas a praia é mais vazia pela manhã. Se quiserem só a foto, voltem aqui outro dia no fim do dia.","lat":-3.8498785,"lng":-32.4387858},{"horario":"13:00","nome":"Almoço na região do Boldró","descricao":"Há opções de restaurante e quiosque na altura do Boldró e da Cacimba, evitando ter que voltar à Vila no meio do dia.","lat":-3.8460301,"lng":-32.4291381},{"horario":"14:30","nome":"Praia do Bode","descricao":"Vizinha da Cacimba e bem mais reservada. Na maré baixa formam-se piscinas naturais rasas do lado direito, ótimas para ficar boiando com máscara e snorkel.","dica":"Confiram a tábua de marés na véspera — a praia rende muito mais na maré baixa.","lat":-3.8478101,"lng":-32.4345458},{"horario":"17:00","nome":"Pôr do sol no Mirante do Boldró","descricao":"Um dos melhores pontos da ilha para ver o sol entrar no mar, com o Morro Dois Irmãos recortado à esquerda. Bar e restaurante no local.","dica":"Em setembro o sol se põe por volta das 17h30 no horário local. Cheguem umas 16h40 para pegar lugar.","lat":-3.8460301,"lng":-32.4291381},{"horario":"20:00","nome":"Jantar no Restaurante Cacimba","descricao":"Uma das cozinhas mais consistentes da ilha. A moqueca e os pastéis de lagosta são os pedidos mais elogiados.","dica":"Reserva recomendada. Fica na Vila do Trinta, a poucos minutos de buggy da pousada.","lat":-3.8465142,"lng":-32.4076493}],"deslocamentos":["Pousada → Sancho: cerca de 15 minutos de buggy pela BR-363","Sancho → Cacimba do Padre: cerca de 8 minutos","Cacimba do Padre → Bode: cerca de 4 minutos"]},{"num":4,"data":"2026-09-25","titulo":"Aniversário","energia":"🟡 Moderado","resumo":"Canoa havaiana ao amanhecer e entardecer privativo no mar","atividades":[{"horario":"05:20","nome":"Canoa havaiana ao amanhecer","descricao":"Saída do Porto de Santo Antônio em canoa polinésia com instrutor, remando pelo mar de dentro enquanto o sol nasce. Cerca de duas horas de água, ritmo tranquilo, sem exigência de experiência prévia. É o horário com maior chance de encontrar os golfinhos-rotadores voltando da noite em mar aberto.","dica":"Vistam roupa de banho e levem uma muda seca. Câmera só se for à prova d’água — a canoa embarca água o tempo todo.","lat":-3.8344673,"lng":-32.4013927},{"horario":"08:30","nome":"Café da manhã e descanso na pousada","descricao":"Volta para a pousada, banho e um café sem pressa depois de acordar de madrugada.","lat":-3.8474418,"lng":-32.4121651},{"horario":"11:00","nome":"Manhã livre na Praia do Boldró","descricao":"Praia tranquila do mar de dentro, com acesso curto por escada a partir da estrada e bem menos movimento que as vizinhas. Na maré baixa formam-se poças rasas ótimas para ficar boiando.","dica":"Dia mais longo da viagem, com a canoa de madrugada e o entardecer privativo à noite. Se preferirem, troquem esta manhã por descanso na pousada.","lat":-3.8460301,"lng":-32.4291381},{"horario":"14:00","nome":"Tarde livre na pousada","descricao":"Descanso antes do programa da noite. Bom momento para um banho demorado e para se arrumar com calma.","lat":-3.8474418,"lng":-32.4121651},{"horario":"16:00","nome":"Entardecer privativo no mar","descricao":"Barco exclusivo para o casal saindo do Porto de Santo Antônio, com navegação pelo mar de dentro até o momento do pôr do sol. Roteiro e ritmo definidos por vocês, espumante a bordo e nenhuma outra pessoa além da tripulação. É a versão reservada do passeio de entardecer — pensada para a noite do aniversário.","dica":"Combinem com antecedência qualquer personalização: decoração a bordo, brinde específico, música. Peçam também que a tripulação registre algumas fotos.","lat":-3.8344673,"lng":-32.4013927},{"horario":"20:00","nome":"Jantar de aniversário no Mergulhão","descricao":"Vista para o mar, iluminação baixa e a cozinha mais bem apresentada do porto. Fecha o dia mais especial da viagem.","dica":"Avisem na reserva que é comemoração de aniversário de casamento — a casa costuma preparar algo. Alternativa igualmente forte: o Restaurante Cacimba.","lat":-3.8346,"lng":-32.400452}],"deslocamentos":["Pousada → Porto de Santo Antônio: cerca de 8 minutos de buggy","A saída da canoa é de madrugada; deixem o buggy abastecido na véspera"]},{"num":5,"data":"2026-09-26","titulo":"Praia","energia":"🟢 Leve","resumo":"Dia sem pressa nas praias favoritas, pôr do sol no Forte e devolução do buggy","atividades":[{"horario":"08:00","nome":"Ensaio fotográfico subaquático (opcional — a avaliar)","descricao":"Sessão com fotógrafo especializado nas águas rasas do mar de dentro, geralmente na Praia do Porto ou no Sancho. Dura cerca de uma hora e meia e é feita em apneia, na superfície e a pouca profundidade — não envolve cilindro nem equipamento de mergulho. As fotos são entregues tratadas em poucos dias.","dica":"Deixei como opção para vocês avaliarem. Se decidirem fazer, precisa ser reservado com antecedência: são poucos fotógrafos na ilha e a agenda fecha rápido.","lat":-3.8344673,"lng":-32.4013927},{"horario":"11:00","nome":"Praia do Sancho, sem pressa","descricao":"Segunda visita à praia, agora sem o roteiro do dia anterior. Vale ficar boiando no canto direito, onde a água é mais clara e há mais peixe.","dica":"Se preferirem trocar, a Cacimba do Padre no fim da manhã também rende. Decidam na hora, conforme a disposição.","lat":-3.8546893,"lng":-32.4436958},{"horario":"13:00","nome":"Almoço na Vila dos Remédios","descricao":"A Vila concentra as opções mais simples e rápidas da ilha, boas para um almoço leve no meio do dia.","lat":-3.842019,"lng":-32.4107087},{"horario":"16:00","nome":"Forte dos Remédios e pôr do sol","descricao":"Ruínas do forte do século XVIII no alto da Vila, com vista aberta para o mar. Visita curta, de caminhada plana e sem esforço, e um dos melhores pontos da ilha para ver o sol entrar no mar no fim da tarde.","dica":"O ingresso do forte vale por dez dias. Em setembro o sol se põe por volta das 17h30 no horário local.","lat":-3.8382591,"lng":-32.4102444},{"horario":"18:30","nome":"Devolução do buggy na pousada","descricao":"Última diária do buggy. Devolvam com o tanque no mesmo nível da retirada para evitar cobrança extra, e confiram junto com a locadora as fotos feitas no dia 23.","dica":"Como o voo de domingo é às 11h10 e não haverá programação no último dia, não compensa manter mais uma diária só para ir ao aeroporto — o táxi resolve.","lat":-3.8474418,"lng":-32.4121651},{"horario":"20:00","nome":"Jantar na Vila","descricao":"Última noite completa na ilha. O Festival do Zé Maria também acontece aos sábados, se quiserem repetir; caso contrário, Varanda e Cacimba seguem como boas escolhas.","dica":"Com o buggy já devolvido, o deslocamento desta noite é de táxi. Se optarem por repetir o Festival, comprem os dois ingressos juntos ainda no início da viagem.","lat":-3.8481594,"lng":-32.4169763}],"deslocamentos":["Pousada → Sancho: cerca de 15 minutos de buggy","Vila dos Remédios → Forte dos Remédios: cerca de 3 minutos","Depois das 18h30, deslocamentos de táxi"]},{"num":6,"data":"2026-09-27","titulo":"Retorno","energia":"🟢 Leve","resumo":"Sem programação: café, check-out e voo de volta a Belo Horizonte","atividades":[{"horario":"07:30","nome":"Café da manhã e arrumação das malas","descricao":"Dia reservado apenas para a volta, sem nenhuma atividade marcada. Vale deixar as malas praticamente prontas na noite anterior.","dica":"Confiram que não há areia, conchas ou pedras na bagagem — a fiscalização confere na saída e a multa é alta.","lat":-3.8474418,"lng":-32.4121651},{"horario":"09:00","nome":"Check-out na Pousada Maria Bonita","descricao":"Peçam o táxi na recepção com alguma antecedência; no domingo de manhã a demanda concentra nos horários de voo.","lat":-3.8474418,"lng":-32.4121651},{"horario":"09:30","nome":"Chegada ao Aeroporto de Noronha","descricao":"O terminal é pequeno e concentra as saídas em poucos horários, então enche. Chegar com folga evita aperto.","dica":"Não há muita opção de alimentação depois do raio-x. Se quiserem comer algo, façam antes de passar pela inspeção.","lat":-3.8564413,"lng":-32.4284106},{"horario":"11:10","nome":"Voo FEN → CNF com conexão em Recife","descricao":"Azul, voos 4719 e 2930, com conexão em Recife. Chegada prevista em Belo Horizonte às 19:40.","dica":"Localizador VLBSGM. Façam o check-in online 24h antes, ainda na ilha.","lat":-3.8564413,"lng":-32.4284106}],"deslocamentos":["Pousada → Aeroporto: cerca de 10 minutos de táxi"]}],"documentos":[{"icon":"✈️","titulo":"Passagens Aéreas","meta":"CNF → FEN → CNF · Azul · VLBSGM","badge":"Confirmado"},{"icon":"🏨","titulo":"Voucher da Pousada","meta":"Pousada Maria Bonita · 22 a 27/09","badge":"Confirmado"},{"icon":"🎫","titulo":"Voucher da TPA","meta":"5 noites · noronha.pe.gov.br","badge":"Pendente","badgeClass":"pending"},{"icon":"🌊","titulo":"Ingresso do Parque Nacional","meta":"parnanoronha.com.br · válido 10 dias","badge":"Pendente","badgeClass":"pending"},{"icon":"🪪","titulo":"Documento com foto","meta":"RG ou CNH · Rodolpho e Jamilli","badge":"Verificar validade","badgeClass":"pending"},{"icon":"📋","titulo":"Vouchers dos Passeios","meta":"Barco, buggy, canoa e entardeceres","badge":"A reservar","badgeClass":"pending"}],"_slug":"aniversario-de-casamento-r-j","footerNote":"Aniversário de casamento R&J · Rodolpho Junior Sanz"};
function fmtDateBR(iso){if(!iso)return'';var p=iso.split('-');if(p.length===3)return p[2]+'/'+p[1]+'/'+p[0];return iso;}
function bVC(v){return'<div class="voo-card"><div class="voo-lado"><div class="voo-city">'+(v.origemIata||'???')+'</div><div class="voo-airport">'+(v.origemNome||'')+'</div><div class="voo-time">'+(v.horaPartida||'—')+'</div><div class="voo-date">'+(v.data?fmtDateBR(v.data):'')+'</div></div><div class="voo-center"><span class="voo-arrow">✈</span><div class="voo-duration">Voo '+(v.tipo==='ida'?'Ida':'Volta')+(v.nvoo?' · '+v.nvoo:'')+'</div><span class="voo-badge">'+(v.cia||'Companhia a confirmar')+(v.classe?' · '+v.classe:'')+'</span>'+(v.conexao?'<div style="font-size:11px;color:var(--muted);margin-top:4px">Conexão: '+v.conexao+'</div>':'')+(v.pnr?'<div class="voo-pnr">Localizador: <strong>'+v.pnr+'</strong></div>':'')+'</div><div class="voo-lado" style="text-align:right"><div class="voo-city">'+(v.destinoIata||'???')+'</div><div class="voo-airport">'+(v.destinoNome||'')+'</div><div class="voo-time">'+(v.horaChegada||'—')+'</div><div class="voo-date">'+(v.dataChegada?fmtDateBR(v.dataChegada):'')+'</div></div></div>';}
function bHC(h){return'<div class="hotel-card"><div class="hotel-icon">🏨</div><div class="hotel-info"><div class="hotel-nome">'+(h.nome||'Hotel')+'</div><div class="hotel-meta">'+(h.cidade?'<span>📍 '+h.cidade+'</span>':'')+(h.hospedes?'<span>👥 '+h.hospedes+'</span>':'')+(h.noites?'<span>🌙 '+h.noites+' noite'+(h.noites!=1?'s':'')+'</span>':'')+'</div><div class="hotel-periodo">'+(h.checkin?fmtDateBR(h.checkin):'')+(h.checkout?' → '+fmtDateBR(h.checkout):'')+'</div>'+(h.conf?'<span class="hotel-conf">Conf. '+h.conf+'</span>':'')+'</div></div>';}
function bSC(s){return'<div class="serv-card"><div class="serv-card-header"><span class="serv-icon">'+(s.icon||'📋')+'</span><span class="serv-nome">'+(s.nome||'')+'</span></div><div class="serv-meta">'+(s.meta||'')+'</div>'+(s.badge?'<span class="serv-badge">'+s.badge+'</span>':'')+'</div>';}

function bDB(d){var dc=['#126eff','#22c55e','#f59e0b','#60a5fa','#a78bfa','#fb923c','#34d399'];var dots=(d.atividades||[]).slice(0,4).map(function(_,i){return'<div class="day-nav-dot" style="background:'+dc[i%dc.length]+'"></div>';}).join('');var ah=(d.atividades||[]).map(function(a,ai){var tb='';var next=(d.atividades||[])[ai+1];if(next)tb=bTB(a,next);return'<div class="atracao"><div class="atracao-header"><span class="atracao-time">'+(a.horario||'')+'</span><span class="atracao-nome">'+(a.nome||'')+'</span></div>'+(a.descricao?'<div class="atracao-desc">'+a.descricao+'</div>':'')+(a.dica?'<div class="atracao-tip">💡 '+a.dica+'</div>':'')+tb+'</div>';}).join('');var dh=(d.deslocamentos||[]).length?'<span class="day-section-label">Deslocamentos</span>'+(d.deslocamentos.map(function(dl){return'<div class="desl-item">'+dl+'</div>';}).join('')):'';return{nb:'<button class="day-nav-btn" onclick="jumpToDay('+d.num+')" id="day-nav-'+d.num+'"><span class="day-nav-num">'+d.num+'</span><span class="day-nav-label">'+((d.titulo||'Dia').substring(0,10))+'</span><div class="day-nav-dots">'+dots+'</div>'+(d.data?'<span style="font-size:9px;color:var(--muted2);margin-top:-2px">'+fmtDateBR(d.data).substring(0,5)+'</span>':'')+' </button>',bl:'<div class="day-block" id="day-'+d.num+'"><button class="day-toggle" onclick="toggleDay(this)"><div class="day-num-badge">'+String(d.num).padStart(2,'0')+'</div><div class="day-toggle-info">'+(d.data?'<div class="day-toggle-date">'+fmtDateBR(d.data)+'</div>':'')+' <div class="day-toggle-title">'+(d.titulo||'Dia '+d.num)+'</div>'+(d.resumo?'<div class="day-toggle-summary">'+d.resumo+'</div>':'')+' </div>'+(d.energia?'<span class="day-energy">'+d.energia+'</span>':'')+' <span class="day-chevron">▾</span></button><div class="day-content">'+ah+dh+'</div></div>'};}
function rR(){if(typeof ROTEIRO_DATA==='undefined')return;var D=ROTEIRO_DATA;if(D.heroImage)document.getElementById('hero-img').style.backgroundImage="url('"+D.heroImage+"')";document.getElementById('hero-eyebrow').textContent=D.eyebrow||'Travel Concierge';document.getElementById('hero-title').innerHTML=(D.titulo||'').replace(' & ','<br>');document.getElementById('hero-subtitle').textContent=D.subtitulo||'';document.getElementById('hero-pills').innerHTML=(D.pills||[]).map(function(p){return'<span class="pill">'+p+'</span>';}).join('');var nl=[['#visao-geral','Visão Geral']].concat(D.voos&&D.voos.length?[['#voos','Voos']]:[]).concat(D.hospedagem&&D.hospedagem.length?[['#hospedagem','Hotel']]:[]).concat(D.servicos&&D.servicos.length?[['#servicos','Serviços']]:[]).concat(D.dias&&D.dias.length?[['#roteiro','Roteiro']]:[]).concat(D.documentos&&D.documentos.length?[['#documentos','Documentos']]:[]);document.getElementById('topbar-nav').innerHTML=nl.map(function(n){return'<a href="'+n[0]+'">'+n[1]+'</a>';}).join('');var cards=D.visaoGeral||[];document.getElementById('overview-grid').innerHTML=cards.map(function(c){return'<div class="info-card '+(c.variant||'')+'"><span class="info-card-label">'+c.label+'</span><span class="info-card-value">'+c.value+'</span></div>';}).join('');if(D.obs){document.getElementById('obs-box').style.display='';document.getElementById('obs-text').innerHTML=D.obs;}if(D.voos&&D.voos.length){document.getElementById('voos').style.display='';document.getElementById('voos-container').innerHTML=D.voos.slice().sort(function(a,b){return((a.data||'')+' '+(a.horaPartida||'')).localeCompare((b.data||'')+' '+(b.horaPartida||''));}).map(bVC).join('');}if(D.hospedagem&&D.hospedagem.length){document.getElementById('hospedagem').style.display='';document.getElementById('hr-hospedagem').style.display='';document.getElementById('hospedagem-container').innerHTML=D.hospedagem.slice().sort(function(a,b){return(a.checkin||'').localeCompare(b.checkin||'');}).map(bHC).jo  extraCards){if(!existingIds.has(ex.docId))_docsList.push(ex);}_docsUploadados={};Object.entries(meta).forEach(function(entry){const fileName=entry[0];const info=entry[1];if(fileName.indexOf('_')===0)return;const fileId=fileName.replace(/\.[^.]+$/,'');const docId=fileId.replace(/_\d+$/,'');const rawUrl='https://raw.githubusercontent.com/davileles/roteiros/main/'+slug+'/docs/'+fileName;if(!_docsUploadados[docId])_docsUploadados[docId]=[];if(!_docsUploadados[docId].some(function(x){return x.fileId===fileId;}))_docsUploadados[docId].push({nome:info.nome||fileName,rawUrl:rawUrl,mediaType:info.mediaType||'',fileId:fileId});});_redrawDocs();}function renderDocCards(documentos){_docsList=documentos.map(function(doc,i){return Object.assign({},doc,{docId:doc.docId||('doc_'+i)});});_redrawDocs();const slug=ROTEIRO_DATA&&ROTEIRO_DATA._slug;if(slug)carregarDocsUpload(slug);}function triggerUpload(docId){const el=document.getElementById('input-'+docId);if(el)el.click();}async function handleDocUpload(docId,nomeDoc,input){const selecionados=Array.from(input.files||[]);if(!selecionados.length)return;const slug=ROTEIRO_DATA&&ROTEIRO_DATA._slug;if(!slug){alert('Slug do roteiro nao definido.');input.value='';return;}const maxMB=8;const grandes=selecionados.filter(function(f){return f.size>maxMB*1024*1024;});const fila=selecionados.filter(function(f){return f.size<=maxMB*1024*1024;});if(grandes.length)alert('Ignorado(s) por passar de '+maxMB+'MB:\n'+grandes.map(function(f){return f.name;}).join('\n'));if(!fila.length){input.value='';return;}const elUp=document.getElementById('uploading-'+docId);const erros=[];for(var i=0;i<fila.length;i++){const file=fila[i];if(elUp){elUp.textContent=fila.length>1?('Enviando '+(i+1)+'/'+fila.length+'...'):'Enviando...';elUp.style.display='';}const ext=file.name.split('.').pop().toLowerCase();const fileId=docId+'_'+(Date.now()+i);const fileName=fileId+'.'+ext;try{const b64=await new Promise(function(res,rej){const r=new FileReader();r.onload=function(){res(r.result.split(',')[1]);};r.onerror=rej;r.readAsDataURL(file);});const resp=await fetch(PROXY+'/roteiros/doc-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:slug,docId:fileName,nome:file.name,tipo:ext,base64:b64,mediaType:file.type})});const data=await resp.json();if(!data.ok)throw new Error(data.erro||'Erro no upload');if(!_docsUploadados[docId])_docsUploadados[docId]=[];_docsUploadados[docId].push({nome:file.name,rawUrl:data.rawUrl,mediaType:file.type,fileId:fileId});const st=document.getElementById('upload-status-'+docId);if(st)st.innerHTML=_fileListHtml(docId);}catch(e){erros.push(file.name+' - '+e.message);}}if(elUp){elUp.style.display='none';elUp.textContent='Enviando...';}if(erros.length)alert('Erro ao enviar arquivo(s):\n'+erros.join('\n'));input.value='';}async function removerDocArquivo(docId,fi){const files=_docsUploadados[docId]||[];const f=files[fi];if(!f)return;if(!confirm('Remover "'+f.nome+'"?'))return;_docsUploadados[docId].splice(fi,1);document.getElementById('upload-status-'+docId).innerHTML=_fileListHtml(docId);const slug=ROTEIRO_DATA&&ROTEIRO_DATA._slug;if(!slug)return;const ext=f.rawUrl.split('.').pop().toLowerCase();const fileName=f.fileId+'.'+ext;try{await fetch(PROXY+'/roteiros/doc-upload',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:slug,docId:fileName})});}catch(e){}}async function removerDocCard(docId){if(!confirm('Remover este cartao de documento?'))return;const slug=ROTEIRO_DATA&&ROTEIRO_DATA._slug;_docsList=_docsList.filter(function(d){return d.docId!==docId;});delete _docsUploadados[docId];_redrawDocs();if(!slug)return;const meta=await _metaGet(slug);const deleted=new Set(meta._deletedCards||[]);deleted.add(docId);const extras=(meta._extraCards||[]).filter(function(e){return e.docId!==docId;});meta._deletedCards=Array.from(deleted);meta._extraCards=extras;await _metaSave(slug,meta);}async function adicionarDocCard(){const titulo=prompt('Nome do documento:');if(!titulo)return;const slug=ROTEIRO_DATA&&ROTEIRO_DATA._slug;const newId='doc_extra_'+Date.now();const novoCard={docId:newId,icon:'📄',titulo:titulo,meta:'Adicionado manualmente',badge:''};_docsList.push(novoCard);_redrawDocs();if(!slug)return;const meta=await _metaGet(slug);meta._extraCards=(meta._extraCards||[]).concat([novoCard]);await _metaSave(slug,meta);}function mostrarDocAnexado(docId){}async function removerDoc(docId){await removerDocArquivo(docId,0);}
