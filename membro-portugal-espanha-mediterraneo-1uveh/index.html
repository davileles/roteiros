<style>
/* Modelo de roteiro · Travel Concierge / Clube do Viajante.
   Layout: capa escura com foto escurecida; abertura de cada dia escura; conteúdo em creme,
   coluna única de leitura pensada primeiro para o celular. */
:root{
  --ink:#0B0D0F; --ink2:#14171A;
  --paper:#F4EFE7; --card:#FBF8F3;
  --text:#14171A; --muted:#55524C; --line:rgba(20,23,26,.14);
  --gold:#9A7B36; --gold-soft:rgba(154,123,54,.12);
  --on-ink:#F4EFE7; --on-ink-muted:rgba(244,239,231,.74); --on-ink-line:rgba(244,239,231,.16);
  --gold-hi:#C8A45C; --gold-pale:#E3C589;
  --warn:#9A4A2E; --warn-soft:rgba(154,74,46,.10);
  --ok:#3F6B45; --ok-soft:rgba(63,107,69,.10);
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:Manrope,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14171A; --card:#1B1F23; --text:#EFEAE1; --muted:#B4AEA4; --line:rgba(244,239,231,.14);
  --gold:#D2B06B; --gold-soft:rgba(200,164,92,.12); --warn:#E08F6C; --warn-soft:rgba(224,143,108,.12);
  --ok:#8CC394; --ok-soft:rgba(140,195,148,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14171A; --card:#1B1F23; --text:#EFEAE1; --muted:#B4AEA4; --line:rgba(244,239,231,.14);
  --gold:#D2B06B; --gold-soft:rgba(200,164,92,.12); --warn:#E08F6C; --warn-soft:rgba(224,143,108,.12);
  --ok:#8CC394; --ok-soft:rgba(140,195,148,.12); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink2)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:400}
p{margin:0;text-wrap:pretty}
a{color:inherit}
b,strong{font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.26em;text-transform:uppercase;font-weight:600}
.tnum{font-variant-numeric:tabular-nums}
em.g{font-style:italic;color:var(--gold-hi)}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
button{font:inherit;color:inherit}

/* ── Capa ── */
.cover{position:relative;overflow:hidden;background-color:var(--ink);background-size:cover;background-position:center;color:var(--on-ink)}
.cover::after{content:"";position:absolute;width:640px;height:640px;left:-220px;top:-260px;border-radius:50%;background:radial-gradient(circle,rgba(200,164,92,.18),transparent 62%);pointer-events:none}
.cover .wrap{position:relative;z-index:1;padding-block:84px 40px;display:flex;flex-direction:column;gap:18px;min-height:min(520px,82vh);justify-content:flex-end}
.brand{position:absolute;z-index:1;top:22px;left:0;right:0}
.brand .wrap{min-height:0;padding-block:0;font-family:var(--serif);font-size:22px;color:var(--on-ink);display:block}
.brand span,.foot-brand span{font-style:italic;color:var(--gold-hi)}
.cover .eyebrow{color:var(--gold-hi);display:flex;align-items:center;gap:12px}
.cover .eyebrow::before{content:"";width:40px;height:1px;background:var(--gold-hi);flex:none}
.cover h1{font-family:var(--serif);font-size:clamp(52px,14vw,100px);line-height:.95;letter-spacing:-.02em}
.cover .sub{font-size:19px;color:var(--on-ink-muted);max-width:30em}
.facts{display:flex;flex-wrap:wrap;gap:8px;padding-top:18px;border-top:1px solid var(--on-ink-line)}
.facts span{font-size:14px;font-weight:500;padding:5px 11px;border:1px solid rgba(200,164,92,.45);color:var(--on-ink);background:rgba(11,13,15,.35)}

/* ── Barra de navegação ── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink2);border-bottom:1px solid rgba(200,164,92,.25)}
.bar .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:9px;scrollbar-width:none}
.bar .wrap::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;min-height:46px;padding:5px 9px;border-radius:8px;text-decoration:none;color:var(--on-ink-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid transparent}
.chip b{font-size:17px;color:var(--on-ink);font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums}
.chip.sec{font-weight:600;font-size:12px}
.chip:hover,.chip.on{border-color:rgba(200,164,92,.55);color:var(--gold-pale)}
.bar .sep{flex:none;width:1px;margin:8px 4px;background:var(--on-ink-line)}

/* ── Seções ── */
section.blk{padding-block:44px 8px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 66px)}
.blk-h{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.blk-h .eyebrow{color:var(--gold)}
.blk-h h2{font-family:var(--serif);font-size:clamp(34px,8vw,46px);line-height:1.05;letter-spacing:-.01em}
.blk-h h2 em{font-style:italic;color:var(--gold)}

.overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.overview > div{background:var(--paper);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.overview .lb{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.overview .vl{font-weight:500;font-size:16px;overflow-wrap:anywhere}
.overview .green .vl{color:var(--gold);font-family:var(--serif);font-size:24px;font-weight:400;line-height:1.1}
.overview .coral{box-shadow:inset 2px 0 0 var(--gold)}
.overview .coral .vl{font-weight:600}
.overview > div:last-child:nth-child(odd){grid-column:1/-1}
.note{margin-top:18px;font-size:15px;color:var(--muted);padding-left:14px;border-left:1px solid var(--gold)}

/* Voos */
.flights{display:flex;flex-direction:column;gap:12px}
.leg-group{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-top:10px}
.flight{background:var(--card);border:1px solid var(--line);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px 12px;align-items:start}
.flight .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;font-size:14px;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.flight .meta b{color:var(--text)}
.ap{display:flex;flex-direction:column;min-width:0}
.ap.r{text-align:right;align-items:flex-end}
.ap .iata{font-size:30px;font-weight:700;letter-spacing:.02em;line-height:1}
.ap .time{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--gold)}
.ap .time small{font-size:12px;color:var(--muted);font-weight:600}
.ap .dt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ap .nm{font-size:13px;color:var(--muted);line-height:1.3}
.arrow{color:var(--gold);font-size:20px;padding-top:4px}
.flight .foot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:8px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.code{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--muted);max-width:100%}.code b{overflow-wrap:anywhere}
.code b{font-size:17px;letter-spacing:.08em;color:var(--text);font-variant-numeric:tabular-nums}
.copy{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--gold)}
.copy.ok{color:var(--ok);border-color:var(--ok)}
.tag{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:3px 8px;border:1px solid currentColor;white-space:nowrap}
.tag.warn{color:var(--warn);background:var(--warn-soft)}
.tag.gold{color:var(--gold);background:var(--gold-soft)}
.tag.ok{color:var(--ok);background:var(--ok-soft)}

/* Hospedagem */
.stays{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.stay{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;padding:16px 0;border-bottom:1px solid var(--line)}
.stay .n{grid-row:span 3;font-family:var(--serif);font-size:40px;line-height:1;color:var(--gold);min-width:46px}
.stay .n small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stay h3{font-size:17px;font-weight:600}
.stay p{font-size:15px;color:var(--muted)}

/* Reservas e serviços */
.todo{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.todo > div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:13px 0;border-bottom:1px solid var(--line)}
.todo .tag{grid-row:1/span 2;grid-column:2;align-self:center}
.todo .m{grid-column:1;font-size:15px;color:var(--muted)}

/* ── Dias ── */
.days-intro{padding-block:44px 0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.days-intro .blk-h{margin:0}
.all{font:600 14px/1 var(--sans);color:var(--gold);background:none;border:1px solid var(--gold);padding:11px 14px;cursor:pointer}
.day{margin-top:14px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px)}
.day-h{display:block;width:100%;border:0;text-align:left;font:inherit;cursor:pointer;background:var(--ink);color:var(--on-ink);padding:0}
.day-h:hover{background:#111418}
.day-h .wrap{padding-block:24px 22px;display:flex;flex-direction:column;gap:12px}
.day-h .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.day-h .eyebrow{color:var(--gold-hi)}
.day-h .h2{display:block;font-family:var(--serif);font-size:clamp(32px,8vw,46px);line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.day-h .sum{display:block;color:var(--on-ink-muted);font-size:16px;line-height:1.5}
.day-h .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:13px;font-weight:600;padding:5px 11px;border:1px solid rgba(200,164,92,.45);color:var(--gold-pale)}
.pill.solid{background:var(--gold-hi);color:var(--ink);border-color:var(--gold-hi)}
.more{font-size:13px;color:var(--on-ink-muted);margin-left:auto}
.chev{width:34px;height:34px;flex:none;border:1px solid rgba(200,164,92,.5);border-radius:50%;position:relative}
.chev::after{content:"";position:absolute;left:50%;top:44%;width:8px;height:8px;border-right:1.5px solid var(--gold-hi);border-bottom:1.5px solid var(--gold-hi);transform:translate(-50%,-50%) rotate(45deg);transition:transform .2s}
.day.open .chev::after{transform:translate(-50%,-25%) rotate(-135deg)}
.day-c{padding-bottom:22px;border-bottom:1px solid var(--line)}
.agenda{list-style:none;margin:0;padding:22px 0 0;display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:62px minmax(0,1fr);gap:0 16px;padding:16px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;line-height:1.35}
.act .t small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.act h3{font-size:17px;font-weight:600;line-height:1.35}
.act p,.act .d{font-size:16px;color:var(--muted);margin-top:4px}
.tip{margin-top:10px;font-size:15px;padding:10px 12px;background:var(--gold-soft);border-left:2px solid var(--gold)}
.tip::before{content:"Dica do concierge";display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-bottom:2px}
.nav{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.nav .dest{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.nav .dest span{overflow-wrap:anywhere}
.nav svg{width:14px;height:14px;fill:var(--gold);flex:none}
.nbs{display:flex;flex-wrap:wrap;gap:6px}
.nb{display:inline-flex;align-items:center;min-height:36px;padding:0 13px;font-size:14px;font-weight:600;text-decoration:none;color:var(--text);border:1px solid var(--line);background:var(--card)}
.nb:hover{border-color:var(--gold);color:var(--gold)}
.nb.waze{color:var(--gold);border-color:var(--gold)}
.nav.c{margin-top:8px}
.nav.c .nb{min-height:32px;padding:0 11px;font-size:13px}
.subgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;margin-top:28px}
@media (min-width:720px){.subgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sub-h{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold);padding-bottom:8px;border-bottom:1px solid var(--gold);margin-bottom:6px}
.moves{list-style:none;margin:0;padding:0}
.moves li{font-size:15px;padding:10px 0;border-bottom:1px solid var(--line)}
.costs{width:100%;border-collapse:collapse;font-size:15px}
.costs td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.costs td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px;font-weight:500}
.costs tr.total td{border-bottom:0;padding-top:12px;font-weight:700;font-size:17px}
.costs tr.total td:last-child{color:var(--gold)}

/* ── Documentos ── */
.docs-help{font-size:15px;color:var(--muted);margin:-8px 0 18px}
.docs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.doc{padding:16px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.doc .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.doc .h b{font-size:17px}
.doc .m{font-size:15px;color:var(--muted)}
.files{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card);border:1px solid var(--line);font-size:15px;min-width:0}
.file a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;text-decoration:none}
.file a:hover{color:var(--gold)}
.file svg{width:16px;height:16px;fill:var(--gold);flex:none}
.x{flex:none;background:none;border:0;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;padding:4px 2px}
.x:hover{color:var(--warn)}
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;padding:8px 10px;background:var(--warn-soft);border:1px solid var(--warn)}
.ask span{flex:1 1 160px}
.ask button,.addform button{font-size:13px;font-weight:700;padding:7px 12px;cursor:pointer;border:1px solid currentColor;background:none}
.ask .yes{color:var(--warn)}
.ask .no,.addform .no{color:var(--muted)}
.doc .acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:6px}
.up{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;font-size:14px;font-weight:700;cursor:pointer;color:var(--gold);border:1px solid var(--gold);background:var(--gold-soft)}
.up svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
.rmcard{background:none;border:0;cursor:pointer;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.status{font-size:14px;color:var(--gold);font-weight:600}
.status.err{color:var(--warn);white-space:pre-line}
.doc-input{display:none}
.add{margin-top:16px}
.addbtn{width:100%;min-height:52px;border:1px dashed var(--gold);background:none;color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.addform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border:1px solid var(--gold);background:var(--gold-soft)}
.addform label{flex:1 1 100%;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.addform input{flex:1 1 200px;min-width:0;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);background:var(--paper);color:var(--text)}
.addform .yes{color:var(--gold)}

/* Rodapé */
footer{background:var(--ink);color:var(--on-ink-muted);margin-top:56px}
footer .wrap{padding-block:40px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.foot-brand{font-family:var(--serif);font-size:30px;color:var(--on-ink)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chev::after{transition:none}}
</style>
</head>
<body>
<header class="cover" id="topo">
  <div class="brand"><div class="wrap" id="brand"></div></div>
  <div class="wrap" id="cover"></div>
</header>
<nav class="bar" aria-label="Navegação do roteiro"><div class="wrap" id="bar"></div></nav>
<main>
  <section class="blk" id="visao-geral"><div class="wrap">
    <div class="blk-h"><span class="eyebrow">Visão geral</span><h2>A <em>viagem</em></h2></div>
    <div class="overview" id="overview-grid"></div>
    <p class="note" id="obs-text" hidden></p>
  </div></section>
  <section class="blk" id="voos" hidden><div class="wrap">
    <div class="blk-h"><span class="eyebrow">Voos</span><h2>Ida e <em>volta</em></h2></div>
    <div class="flights" id="voos-container"></div>
  </div></section>
  <section class="blk" id="hospedagem" hidden><div class="wrap">
    <div class="blk-h"><span class="eyebrow">Hospedagem</span><h2>Onde <em>ficar</em></h2></div>
    <div class="stays" id="hospedagem-container"></div>
  </div></section>
  <section class="blk" id="servicos" hidden><div class="wrap">
    <div class="blk-h"><span class="eyebrow">Reservas e serviços</span><h2>Reservas e <em>serviços</em></h2></div>
    <div class="todo" id="servicos-grid"></div>
  </div></section>
  <div id="roteiro" hidden>
    <div class="wrap days-intro"><div class="blk-h"><span class="eyebrow">Dia a dia</span><h2>O <em>roteiro</em></h2></div>
      <button type="button" class="all" id="toggle-all">Abrir todos os dias</button></div>
    <div id="timeline"></div>
  </div>

<script>
const ROTEIRO_DATA = {"titulo":"Portugal, Espanha e Mediterrâneo","subtitulo":"Lisboa, Sintra, Andaluzia, Barcelona, cruzeiro pelo Mediterrâneo e Madri","eyebrow":"Clube do Viajante · Portugal · Espanha · Cruzeiro","heroImage":"https://upload.wikimedia.org/wikipedia/commons/b/b6/Plaza_de_Espa%C3%B1a_%28Sevilla%29_-_01.jpg","pills":["01 a 17 de janeiro","17 dias","Casal","Executiva + cruzeiro"],"visaoGeral":[{"label":"Período","value":"01/01 a 17/01 · 17 dias","variant":"coral"},{"label":"Viajantes","value":"Casal"},{"label":"Rota","value":"Lisboa → Sevilha → Córdoba → Granada → Barcelona → cruzeiro (Marselha, Gênova, Nápoles, Palermo, La Goulette) → Barcelona → Madri"},{"label":"Ritmo","value":"Moderado, com estratégias para evitar ladeiras e esforço físico","variant":"green"},{"label":"Destaques","value":"Sintra · Alcázar de Sevilha · Mesquita de Córdoba · Alhambra · Sagrada Família · Pompeia · Cartago · Museu do Prado"},{"label":"Gastos em terra","value":"~€1.273–1.630 por pessoa · ~€2.546–3.260 para o casal","variant":"coral"}],"obs":"<b>Sobre os valores:<\/b> as estimativas são de gastos em terra — transporte local, ingressos e alimentação. Não incluem passagens aéreas, hospedagem, cruzeiro, seguro viagem nem compras pessoais.<br><br><b>Reservar com antecedência:<\/b> Alhambra (Palácios Nasridas esgotam semanas ou meses antes), Sagrada Família, Alcázar de Sevilha, Palácio da Pena, Mesquita de Córdoba e Casa Batlló, além dos restaurantes marcados com reserva obrigatória.<br><br><b>Janeiro:<\/b> anoitece cedo (por volta das 18h) e as manhãs podem ser frias, principalmente em Granada e Madri. Em 01/01 alguns restaurantes de Lisboa podem fechar pelo feriado.","voos":[{"tipo":"ida","origemIata":"LIS","origemNome":"Lisboa","destinoIata":"SVQ","destinoNome":"Sevilha","data":"04/01","horaPartida":"08:00","horaChegada":"10:10","cia":"TAP"},{"tipo":"ida","origemIata":"GRX","origemNome":"Granada","destinoIata":"BCN","destinoNome":"Barcelona","data":"08/01","horaPartida":"09:05","horaChegada":"10:30","cia":"Companhia a confirmar"},{"tipo":"ida","origemIata":"BCN","origemNome":"Barcelona","destinoIata":"MAD","destinoNome":"Madri","data":"16/01","horaPartida":"13:35","horaChegada":"15:00","cia":"Iberia"},{"tipo":"volta","origemIata":"MAD","origemNome":"Madri","destinoIata":"REC","destinoNome":"Recife","data":"17/01","horaPartida":"16:30","cia":"Iberia","classe":"Executiva"}],"hospedagem":[{"nome":"Ibis Styles Lisboa Centro Marquês de Pombal","cidade":"Lisboa","checkin":"01/01","checkout":"04/01","noites":3,"hospedes":"2"},{"nome":"Ibis Styles Sevilha Santa Justa","cidade":"Sevilha","checkin":"04/01","checkout":"06/01","noites":2,"hospedes":"2"},{"nome":"Hotel Porcel Navas","cidade":"Granada","checkin":"06/01","checkout":"08/01","noites":2,"hospedes":"2"},{"nome":"Ibis Styles Barcelona City Bogatell","cidade":"Barcelona","checkin":"08/01","checkout":"09/01","noites":1,"hospedes":"2"},{"nome":"Cruzeiro pelo Mediterrâneo","cidade":"A bordo","checkin":"09/01","checkout":"16/01","noites":7,"hospedes":"2"},{"nome":"Novotel Madrid Center","cidade":"Madri","checkin":"16/01","checkout":"17/01","noites":1,"hospedes":"2"}],"servicos":[{"tipo":"ingresso","icon":"🏰","nome":"Alhambra · Palácios Nasridas","meta":"07/01 · www.alhambra-patronato.es · esgota semanas ou meses antes","badge":"Prioridade"},{"tipo":"ingresso","icon":"⛪","nome":"Sagrada Família","meta":"09/01 · www.sagradafamilia.org","badge":"Prioridade"},{"tipo":"ingresso","icon":"🏛️","nome":"Real Alcázar de Sevilha","meta":"05/01 · www.alcazarsevilla.org · horários da manhã esgotam","badge":"Prioridade"},{"tipo":"ingresso","icon":"🏰","nome":"Palácio Nacional da Pena","meta":"02/01 · www.parquesdesintra.pt","badge":"Reservar"},{"tipo":"ingresso","icon":"🕌","nome":"Mesquita-Catedral de Córdoba","meta":"06/01 · www.catedralcordoba.es","badge":"Reservar"},{"tipo":"ingresso","icon":"🏛️","nome":"Mosteiro dos Jerónimos","meta":"03/01 · www.mosteirojeronimos.gov.pt","badge":"Reservar"},{"tipo":"ingresso","icon":"🎨","nome":"Casa Batlló","meta":"09/01 · www.casabatllo.es","badge":"Reservar"},{"tipo":"ingresso","icon":"🏛️","nome":"Palazzo dei Normanni e Cappella Palatina","meta":"13/01 · www.federicosecondo.org","badge":"Reservar"},{"tipo":"restaurante","icon":"🍽️","nome":"Restaurantes com reserva obrigatória","meta":"Alma, Bairro do Avillez e Belcanto (Lisboa), Carmen de Aben Humeya (Granada), Chez Fonfon (Marselha), Sobrino de Botín (Madri)","badge":"Reservar"}],"documentos":[{"icon":"🛂","titulo":"Passaporte","meta":"Dos dois viajantes, válido para toda a viagem","badge":"Obrigatório","badgeClass":"badge-coral"},{"icon":"🛡️","titulo":"Seguro viagem","meta":"Cobertura para o espaço Schengen","badge":"Obrigatório","badgeClass":"badge-coral"},{"icon":"✈️","titulo":"Passagens aéreas","meta":"Voo internacional em executiva e trechos internos (TAP, Iberia)","badge":"Importante","badgeClass":"badge-gold"},{"icon":"🚢","titulo":"Bilhete do cruzeiro","meta":"Embarque em Barcelona em 09/01","badge":"Importante","badgeClass":"badge-gold"},{"icon":"🏨","titulo":"Vouchers dos hotéis","meta":"Lisboa, Sevilha, Granada, Barcelona e Madri","badge":"Importante","badgeClass":"badge-gold"},{"icon":"🎟️","titulo":"Ingressos","meta":"Alhambra, Sagrada Família, Alcázar, Pena e demais atrações","badge":"Importante","badgeClass":"badge-gold"}],"dias":[{"num":1,"data":"01/01 (quarta)","titulo":"Chegada a Lisboa — primeiro contato com a cidade","resumo":"Vocês chegam a Lisboa às 14h30 após uma longa viagem noturna em executiva — o conforto do voo ajuda, mas o cansaço vai estar presente. O plano para esse primeiro dia é leve e estratégico: check-in, primeiro contato com a cidade, um passeio tranquilo pelo bairro do hotel e uma boa janta portuguesa para celebrar a chegada. Nada de grandes monumentos hoje — guarde energia para os próximos dias!<br>Saída do hotel: <b>Sem pressa — chegada e acomodação primeiro<\/b>","energia":"Leve","atividades":[{"horario":"14h30","nome":"Chegada ao Aeroporto Humberto Delgado","descricao":"O aeroporto fica a cerca de 7km do hotel. A opção mais prática e confortável é o táxi ou Uber, que chegam rapidamente pelo app.","dica":"O metrô (linha Vermelha) também funciona e é barato, mas com bagagem pesada após voo longo, o táxi vale a pena. Custo estimado: €10–14."},{"horario":"15h30 – 16h30","nome":"Check-in no Ibis Styles Lisboa Centro Marquês de Pombal","descricao":"O hotel fica na Avenida da Liberdade, uma das principais avenidas de Lisboa, com comércio, cafés e fácil acesso ao centro.","dica":"Peça um quarto em andar alto para vista da avenida. Se o quarto não estiver pronto, deixe as malas na recepção e saia para explorar."},{"horario":"16h30 – 18h30","nome":"Passeio pela Avenida da Liberdade e Praça dos Restauradores","descricao":"A Avenida da Liberdade é o boulevard mais elegante de Lisboa, com árvores, calçada portuguesa e lojas sofisticadas. Um passeio leve e plano, perfeito para o primeiro contato com a cidade sem esforço físico.<br>A Praça dos Restauradores, no final da avenida, tem a coluna comemorativa da independência portuguesa e uma energia muito agradável.","dica":"Fique de olho nos cafés ao longo da avenida — é o momento perfeito para o primeiro café português e um pastel de nata! ☕🥐"},{"horario":"18h30 – 19h30","nome":"Pausa no hotel — descanso e troca de roupa","descricao":"Após o voo longo e o primeiro passeio, um descanso rápido faz toda a diferença para aproveitar a janta com energia.","dica":""},{"horario":"20h00","nome":"Jantar — celebração da chegada","descricao":"Lisboa no dia 01/01 pode ter alguns restaurantes fechados por ser feriado. Recomendo confirmar funcionamento com antecedência.","dica":"A região do Chiado e do Bairro Alto, a cerca de 20 minutos a pé ou 10 de Uber do hotel, tem boa concentração de restaurantes que costumam abrir mesmo em feriados."},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• <b>Taberna da Rua das Flores<\/b> — Portuguesa contemporânea | Petiscos sofisticados em ambiente acolhedor | ~€30–40 por pessoa | Reserva recomendada<br>• <b>O Corvo<\/b> — Tasca tradicional | Ambiente informal, comida caseira portuguesa | ~€20–25 por pessoa<br>• <b>Alma<\/b> — Alta gastronomia portuguesa | Para uma celebração especial da chegada | ~€60–80 por pessoa | Reserva obrigatória<br><br><b>Links úteis<\/b><br>• Uber em Lisboa: app Uber funciona normalmente<br>• Metro Lisboa: www.metrolisboa.pt<br>• Reservas: www.thefork.pt","dica":""}],"deslocamentos":["Aeroporto → Hotel: Táxi ou Uber, ~20–25 min, €10–14","Hotel → Praça dos Restauradores: A pé, ~5 min, plano, gratuito","Hotel → Chiado (jantar): Uber ou táxi ~10 min, €5–7 / ou a pé ~20 min com leve descida"],"custos":[{"label":"Táxi aeroporto → hotel","valor":"€7"},{"label":"Café + pastel de nata no passeio","valor":"€4"},{"label":"Jantar","valor":"€25–35"}],"custoTotal":"~€36–46 por pessoa"},{"num":2,"data":"02/01 (quinta)","titulo":"Bate-volta a Sintra — Palácio da Pena e Quinta da Regaleira","resumo":"Hoje é dia de bate-volta a Sintra, uma das experiências mais deslumbrantes de Portugal! Vocês vão acordar cedo, pegar o trem direto do centro de Lisboa e chegar a um cenário de conto de fadas — palácios coloridos, jardins neblinosos e uma natureza exuberante. O foco será o Palácio da Pena e a Quinta da Regaleira, duas das atrações mais incríveis da Europa. Atenção redobrada: Sintra tem muitas ladeiras, mas há estratégias para minimizar o esforço físico, que vou detalhar!<br>Saída do hotel: 08h00","energia":"Moderado","atividades":[{"horario":"08h00 – 08h30","nome":"Café da manhã e deslocamento até a Estação do Rossio","descricao":"Tomem café da manhã no hotel ou em um café próximo na Avenida da Liberdade.<br>A Estação do Rossio fica a ~15 minutos a pé do hotel, passando pela Praça dos Restauradores — caminho plano e agradável.","dica":"Comprem as passagens do trem na máquina automática na estação. Aceitam cartão. Guarde o bilhete para validar na volta também."},{"horario":"09h00","nome":"Trem Lisboa (Rossio) → Sintra","descricao":"Trens saem a cada 20 minutos aproximadamente. Viagem de ~40 minutos, muito panorâmica!","dica":"Evite o trem das 08h00–09h00 de fim de semana — pode lotar com turistas. Em dia útil de janeiro, tende a ser mais tranquilo."},{"horario":"09h45 – 10h00","nome":"Chegada à Estação de Sintra","descricao":"Da estação até o centro histórico é uma caminhada de ~10 minutos, mas há um serviço de tuk-tuk e táxi disponível.","dica":"Na estação, peguem o ônibus 434 — ele faz o circuito Centro → Castelo dos Mouros → Palácio da Pena → Centro, e economiza muito esforço nas subidas. Bilhete: ~€6,90 (ilimitado no dia)."},{"horario":"10h00 – 12h30","nome":"Palácio Nacional da Pena","descricao":"Um dos palácios mais espetaculares da Europa — cores vibrantes, estilo romântico e vista deslumbrante sobre Sintra e o Atlântico. Vale cada minuto!<br>O ônibus 434 deixa vocês na entrada do parque. Da parada até o palácio há uma subida de ~10 minutos a pé, mas há um transfer interno pago (€3) que leva até a porta do palácio — recomendado para evitar a ladeira!","dica":"<b>Reserve os ingressos online com antecedência<\/b> em www.parquesdesintra.pt — em janeiro há menos fila, mas a reserva online garante horário de entrada. Ingresso: ~€14 por pessoa (palácio + parque)."},{"horario":"12h30 – 13h00","nome":"Deslocamento Pena → Quinta da Regaleira","descricao":"O ônibus 434 faz a conexão. Desçam no centro de Sintra e a Quinta fica a ~5 minutos a pé do centro, em terreno mais plano.","dica":""},{"horario":"13h00 – 13h30","nome":"Almoço em Sintra","descricao":"Aproveitem para almoçar no centro antes de entrar na Quinta.","dica":"Experimente as famosas travesseiras de Sintra — um doce folhado com recheio de ovos, típico da cidade! 🥐"},{"horario":"13h30 – 15h30","nome":"Quinta da Regaleira","descricao":"Uma propriedade absolutamente mágica — palácio neogótico, jardins cheios de simbolismo maçônico, torres e o famoso Poço Iniciático, um poço invertido com escadaria em espiral.","dica":"O Poço Iniciático tem escadas em espiral para descer — se preferirem evitar, é possível apreciar a vista de cima sem descer. O jardim tem caminhos alternativos mais planos. Ingresso: ~€10 por pessoa. Reserve em www.regaleira.pt."},{"horario":"15h30 – 16h00","nome":"Passeio pelo centro histórico de Sintra + compras","descricao":"O centro tem lojas de artesanato, cerâmica portuguesa e doces típicos. Um passeio leve para fechar o dia.","dica":""},{"horario":"16h30","nome":"Trem de volta para Lisboa","descricao":"Da estação de Sintra para o Rossio: ~40 minutos.","dica":""},{"horario":"17h30 – 19h30","nome":"Chegada a Lisboa — descanso no hotel","descricao":"Após o dia em Sintra, um descanso antes do jantar é muito bem-vindo.","dica":""},{"horario":"20h00","nome":"Jantar em Lisboa","descricao":"Aproveitem para jantar no Chiado ou Bairro Alto, bairros animados e com ótimas opções gastronômicas.","dica":""},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• Em Sintra (almoço):<br>• <b>Tascantiga<\/b> — Portuguesa | Petiscos e pratos tradicionais no centro de Sintra | ~€15–20 por pessoa<br>• Em Lisboa (jantar):<br>• <b>Bairro do Avillez<\/b> — Portuguesa moderna | Restaurante do chef José Avillez, um dos mais renomados de Portugal | ~€40–55 por pessoa | Reserva obrigatória<br>• <b>A Cevicheria<\/b> — Frutos do mar criativos | Ambiente descontraído e vibrante | ~€30–40 por pessoa | Reserva recomendada<br>• <b>Taberna da Rua das Flores<\/b> — Petiscos tradicionais | Caso não tenham ido no dia 1 | ~€25–35 por pessoa<br><br><b>Links úteis<\/b><br>• Ingressos Palácio da Pena: www.parquesdesintra.pt<br>• Ingressos Quinta da Regaleira: www.regaleira.pt<br>• Trens Lisboa–Sintra: www.cp.pt<br>• Ônibus 434 Sintra: www.scotturb.com","dica":""}],"deslocamentos":["Hotel → Estação do Rossio: A pé ~15 min, plano, gratuito","Rossio → Sintra (trem): ~40 min, €2,40 por pessoa (ida)","Sintra: Ônibus 434 circuito completo: €6,90 por pessoa","Sintra → Rossio (trem): ~40 min, €2,40 por pessoa (volta)","Hotel → Jantar (Chiado): Uber ~10 min, €5–7"],"custos":[{"label":"Trem ida e volta","valor":"€4,80"},{"label":"Ônibus 434 Sintra","valor":"€6,90"},{"label":"Palácio da Pena (ingresso)","valor":"€14"},{"label":"Transfer interno Pena (opcional)","valor":"€3"},{"label":"Quinta da Regaleira (ingresso)","valor":"€10"},{"label":"Almoço em Sintra","valor":"€15–20"},{"label":"Travesseiras de Sintra + café","valor":"€5"},{"label":"Jantar em Lisboa","valor":"€25–35"},{"label":"Uber jantar","valor":"€6"}],"custoTotal":"~€90–104 por pessoa"},{"num":3,"data":"03/01 (sexta)","titulo":"Lisboa — Belém, Alfama e Castelo de São Jorge","resumo":"Hoje é o grande dia de Lisboa! Vocês vão explorar dois dos bairros mais icônicos da cidade — Belém, com seus monumentos históricos à beira do Tejo, e Alfama, o bairro mais antigo e charmoso de Lisboa. A estratégia é começar por Belém de manhã, quando há menos turistas, e ir para Alfama à tarde, aproveitando a luz dourada do fim do dia nos mirantes. Atenção especial à topografia de Alfama — vou indicar o caminho mais suave!<br>Saída do hotel: 08h45","energia":"Moderado","atividades":[{"horario":"08h45 – 09h15","nome":"Deslocamento ao bairro de Belém","descricao":"De Uber ou táxi é a opção mais confortável — ~15 minutos e €8–10. Alternativamente, o elétrico 15E sai da Praça da Figueira e vai até Belém em ~30 minutos por €2,10, mas pode ser lotado.","dica":"O Uber é altamente recomendado pela praticidade, especialmente para chegar descansados e prontos para explorar."},{"horario":"09h15 – 09h45","nome":"Fábrica dos Pastéis de Belém","descricao":"A fábrica original dos pastéis de nata, fundada em 1837, é uma experiência obrigatória! O pastel aqui é diferente — a receita é segredo e o resultado é incomparável. Coma na hora, polvilhado com canela e açúcar de confeiteiro.","dica":"Em janeiro a fila tende a ser menor, mas chegue cedo mesmo assim. Peça pelo menos 2 cada! O café com leite português aqui é excelente. Custo: ~€2 por pastel."},{"horario":"09h45 – 11h15","nome":"Mosteiro dos Jerônimos","descricao":"Um dos maiores tesouros do patrimônio mundial — construído no século XVI em estilo manuelino, é simplesmente deslumbrante por dentro e por fora. Abriga os túmulos de Vasco da Gama e Luís de Camões.<br>Fica a 2 minutos a pé da fábrica dos pastéis.","dica":"<b>Reserve os ingressos online<\/b> em www.mosteirojeronimos.gov.pt — €10 por pessoa. A entrada pela manhã cedo tem luz natural maravilhosa no claustro. Dediquem pelo menos 1h30 aqui."},{"horario":"11h15 – 12h00","nome":"Torre de Belém","descricao":"Ícone absoluto de Lisboa, a torre fica a ~15 minutos a pé do Mosteiro, à beira do rio Tejo. O caminho é plano e muito agradável, com vista para o rio.","dica":"A fila pode ser longa mesmo em janeiro. Reserve online se possível em www.torrebelem.gov.pt — €6 por pessoa. O interior tem escadas estreitas e íngremes — se preferirem, admirar por fora já vale muito!"},{"horario":"12h00 – 13h00","nome":"Almoço em Belém","descricao":"A região tem boas opções de restaurantes à beira do Tejo, com vista para a Torre.","dica":""},{"horario":"13h00 – 13h30","nome":"Deslocamento Belém → Alfama","descricao":"Uber ou táxi direto, ~20 minutos, €8–12. É a opção mais inteligente para poupar energia para Alfama.","dica":""},{"horario":"13h30 – 14h30","nome":"Castelo de São Jorge","descricao":"O castelo mouro que domina Lisboa tem uma vista panorâmica de tirar o fôlego sobre a cidade e o rio Tejo. O caminho de acesso tem ladeira, mas há uma opção de táxi/Uber até a porta do castelo — recomendado!","dica":"Peçam ao Uber para ir até a entrada principal do castelo. Ingresso: €15 por pessoa. Reserve em www.castelodesaojorge.pt. Dediquem ~1h explorando as muralhas e o jardim interno."},{"horario":"14h30 – 16h30","nome":"Bairro de Alfama","descricao":"Desçam do castelo a pé pelo lado mais suave — a rua de Santa Cruz do Castelo e depois a Rua do Limoeiro têm menos degraus que os outros caminhos. O bairro é charmoso, com vielas, azulejos e roupas penduradas nas janelas.","dica":"Não tentem explorar Alfama toda — é um labirinto! Foquem na descida suave até o Miradouro das Portas do Sol, que tem uma vista linda e acesso razoavelmente plano vindo do castelo. Evitem o Miradouro da Graça, que exige mais subida."},{"horario":"16h30 – 17h00","nome":"Miradouro das Portas do Sol","descricao":"Um dos mirantes mais bonitos de Lisboa, com vista sobre Alfama e o rio. Perfeito para fotos no fim da tarde com a luz dourada.","dica":"Há um café bem simpático no mirante — ótimo para uma pausa com vista!"},{"horario":"17h00 – 17h30","nome":"Deslocamento para o hotel","descricao":"Uber ou táxi direto do mirante ao hotel — ~15 minutos, €7–10.","dica":""},{"horario":"17h30 – 19h30","nome":"Descanso no hotel","descricao":"","dica":""},{"horario":"20h00","nome":"Jantar — última noite em Lisboa","descricao":"Aproveitem para uma experiência gastronômica especial, já que amanhã partem para Sevilha!","dica":""},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• Almoço em Belém:<br>• <b>Vela Latina<\/b> — Portuguesa | À beira do Tejo, frutos do mar frescos | ~€25–30 por pessoa<br>• <b>Espaço Espelho d'Água<\/b> — Café e refeições leves | Vista linda para o rio | ~€15–20 por pessoa<br>• Jantar (última noite em Lisboa):<br>• <b>Belcanto<\/b> — Alta gastronomia | 2 estrelas Michelin, do chef José Avillez | ~€120–150 por pessoa | Reserva obrigatória e com muita antecedência<br>• <b>Solar dos Presuntos<\/b> — Portuguesa tradicional | Clássico de Lisboa, especialidade em bacalhau | ~€35–45 por pessoa | Reserva recomendada<br>• <b>Zé da Mouraria<\/b> — Tasca histórica | Autêntica, barata e deliciosa | ~€20–25 por pessoa<br><br><b>Links úteis<\/b><br>• Mosteiro dos Jerônimos: www.mosteirojeronimos.gov.pt<br>• Torre de Belém: www.torrebelem.gov.pt<br>• Castelo de São Jorge: www.castelodesaojorge.pt","dica":""}],"deslocamentos":["Hotel → Belém: Uber ~15 min, €8–10","Pastéis de Belém → Mosteiro: A pé ~2 min, plano","Mosteiro → Torre de Belém: A pé ~15 min, plano, à beira do rio","Belém → Alfama: Uber ~20 min, €8–12","Castelo → Miradouro das Portas do Sol: A pé ~15 min, descida suave","Miradouro → Hotel: Uber ~15 min, €7–10"],"custos":[{"label":"Uber (trajetos do dia)","valor":"~€20"},{"label":"Pastéis de Belém (3 pastéis + café)","valor":"€8"},{"label":"Mosteiro dos Jerônimos","valor":"€10"},{"label":"Torre de Belém","valor":"€6"},{"label":"Castelo de São Jorge","valor":"€15"},{"label":"Almoço","valor":"€20–25"},{"label":"Jantar","valor":"€30–40"}],"custoTotal":"~€109–124 por pessoa"},{"num":4,"data":"04/01 (sábado)","titulo":"Lisboa → Sevilha — chegada à Andaluzia","resumo":"Dia de transferência! O voo é cedo — saída às 8h de Lisboa — então o café da manhã será rápido e o check-out acontece antes do amanhecer. Vocês chegam a Sevilha às 10h10 com o dia todo pela frente. A tarde será dedicada a um primeiro passeio leve pela cidade, descobrindo o bairro próximo ao hotel e sentindo o espírito andaluz. Sevilha tem um charme diferente de Lisboa — mais quente, mais colorida e com um ritmo todo especial!<br>Saída do hotel: 05h30","energia":"Leve (dia de transferência)","atividades":[{"horario":"05h30","nome":"Check-out do Ibis Styles Lisboa e deslocamento ao aeroporto","descricao":"Recomendo reservar um táxi com antecedência para as 05h30 — o Uber funciona nesse horário em Lisboa, mas um táxi pré-agendado traz mais segurança.","dica":"Confirme o check-out na véspera e deixe as malas prontas na noite anterior. O aeroporto fica a ~20 minutos do hotel nesse horário."},{"horario":"06h00","nome":"Chegada ao Aeroporto de Lisboa — check-in e embarque","descricao":"Voo TAP às 8h00 para Sevilha. Chegar com 2h de antecedência é suficiente para voo doméstico/europeu.","dica":"O aeroporto de Lisboa é compacto e tranquilo de madrugada — não precisam se estressar!"},{"horario":"10h10","nome":"Chegada ao Aeroporto de Sevilha (San Pablo)","descricao":"O aeroporto fica a ~10km do centro. Táxi ou Uber até o hotel: ~20 minutos, €20–25.","dica":"O Uber funciona normalmente em Sevilha. Alternativamente, há ônibus EA (Especial Aeropuerto) por €4 até o centro, mas com malas o táxi vale mais a pena."},{"horario":"10h30 – 11h30","nome":"Check-in no Ibis Styles Sevilha Santa Justa","descricao":"O hotel fica próximo à Estação de Santa Justa, bem localizado para explorar o centro histórico a pé. O bairro é plano e de fácil locomoção.","dica":"Se o quarto não estiver pronto, deixem as malas e saiam para explorar."},{"horario":"11h30 – 13h00","nome":"Primeiro passeio — arredores do hotel e Estação de Santa Justa","descricao":"A Estação de Santa Justa é uma obra arquitetônica impressionante — uma das maiores da Espanha. Vale dar uma olhada por fora e por dentro.<br>As Setas de Sevilha (Metropol Parasol) ficam a ~10 minutos a pé do hotel — uma estrutura moderna e imponente que contrasta lindamente com o entorno histórico.","dica":""},{"horario":"13h00 – 14h00","nome":"Almoço — primeira refeição em Sevilha!","descricao":"Experimente o gazpacho, o salmorejo e as tapas andaluzas. Sevilha é uma das melhores cidades da Espanha para comer bem e barato!","dica":"Em Sevilha é tradição que muitos bares sirvam uma tapa gratuita com cada bebida — aproveitem!"},{"horario":"14h00 – 15h30","nome":"Setas de Sevilha (Metropol Parasol)","descricao":"A maior estrutura de madeira do mundo, inaugurada em 2011, oferece uma vista panorâmica deslumbrante sobre Sevilha a partir de sua passarela elevada. O contraste com a cidade histórica ao redor é fascinante.","dica":"Ingresso para a passarela panorâmica: ~€5 por pessoa e inclui uma consumação. O elevador evita qualquer esforço físico! Compre no local ou em www.setasdesevilla.com. O pôr do sol daqui é lindo — se puderem, voltem noutro dia no fim da tarde."},{"horario":"15h30 – 17h00","nome":"Torre del Oro e beira do Rio Guadalquivir","descricao":"A Torre del Oro é uma torre árabe do século XIII à beira do Guadalquivir, símbolo de Sevilha. O passeio ao longo do rio é plano, agradável e muito fotogênico.","dica":"Ingresso do museu interno: €3 por pessoa. A vista de fora já é deslumbrante e gratuita. O calçadão à beira do rio é perfeito para uma caminhada leve."},{"horario":"17h00 – 18h00","nome":"Passeio leve pelo Bairro de Santa Cruz","descricao":"Um primeiro contato com o bairro mais charmoso de Sevilha — vielas brancas, laranjeiras e azulejos. Deixem a exploração completa para o dia seguinte.","dica":"O bairro é relativamente plano no centro, mas tem algumas ruelas com paralelepípedos irregulares — sapato confortável é essencial!"},{"horario":"18h00 – 19h30","nome":"Descanso no hotel","descricao":"","dica":""},{"horario":"20h30","nome":"Jantar — sabores da Andaluzia","descricao":"Em Sevilha o jantar costuma ser mais tarde — 20h30–21h é o horário local. Entrar no ritmo espanhol vale a pena!","dica":""},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• Almoço:<br>• <b>Bar El Comercio<\/b> — Tapas tradicionais | Clássico sevilhano, frequentado por locais | ~€10–15 por pessoa<br>• 2","dica":""}],"deslocamentos":["Hotel Lisboa → Aeroporto Lisboa: Táxi pré-agendado ~20 min, €15–20","Aeroporto Sevilha → Hotel: Táxi ou Uber ~20 min, €20–25","Hotel → Setas de Sevilha: A pé ~10 min, plano","Setas → Torre del Oro: A pé ~15 min, plano, pela Calle Sierpes","Torre del Oro → Bairro de Santa Cruz: A pé ~10 min, plano","Santa Cruz → Hotel: A pé ~10 min"],"custos":[{"label":"Táxi Lisboa → aeroporto","valor":"€10"},{"label":"Táxi/Uber Sevilha aeroporto → hotel","valor":"€12"},{"label":"Setas de Sevilha (passarela)","valor":"€5"},{"label":"Torre del Oro (museu)","valor":"€3"},{"label":"Almoço","valor":"€15–20"},{"label":"Jantar","valor":"€25–35"}],"custoTotal":"~€70–85 por pessoa"},{"num":5,"data":"05/01 (domingo)","titulo":"Sevilha — Alcázar, Catedral, Santa Cruz e Plaza de España","resumo":"Hoje é o grande dia de Sevilha! Vocês vão explorar os monumentos mais impressionantes da cidade — o Real Alcázar e a Catedral com a Giralda — além de se perder pelas vielas do Bairro de Santa Cruz e sentir a energia vibrante da Plaza de España. É um dia rico em história e beleza, mas com percursos relativamente planos e bem conectados entre si. Prepare-se para se apaixonar pela Andaluzia! 🌸🏰<br>Saída do hotel: 08h30","energia":"Moderado","atividades":[{"horario":"08h30 – 09h00","nome":"Deslocamento ao Real Alcázar","descricao":"O Alcázar fica a ~20 minutos a pé do hotel, caminho plano pelo centro histórico. Uber também é opção rápida (~€5).","dica":"<b>Reserve os ingressos com bastante antecedência<\/b> em www.alcazarsevilla.org — os horários da manhã esgotam rapidamente, mesmo em janeiro. Ingresso: ~€14,50 por pessoa. Cheguem 10 minutos antes do horário reservado."},{"horario":"09h00 – 11h00","nome":"Real Alcázar","descricao":"Um dos palácios mais extraordinários do mundo — arquitetura mourisca deslumbrante, jardins imensos e uma história de mais de mil anos. Fez parte da série Game of Thrones (Dorne)! Os jardins são planos e muito agradáveis para caminhar.","dica":"Dediquem pelo menos 2 horas. Os jardins são tão impressionantes quanto o interior — não pulem essa parte! Baixem o áudio-guia gratuito pelo app do Alcázar antes de ir."},{"horario":"11h00 – 11h15","nome":"Deslocamento Alcázar → Catedral de Sevilha","descricao":"A pé, são apenas 3 minutos — os dois monumentos ficam lado a lado!","dica":""},{"horario":"11h15 – 13h00","nome":"Catedral de Sevilha + Giralda","descricao":"A maior catedral gótica do mundo e um dos edifícios mais impressionantes que vocês já verão. Abriga o túmulo de Cristóvão Colombo. A Giralda, antiga torre árabe transformada em campanário, oferece vista panorâmica — e o melhor: a subida é feita por rampas, não por escadas! Perfeito para vocês.","dica":"Reserve em www.catedraldesevilla.es — ~€12 por pessoa. A rampa da Giralda tem 35 lances mas é suave — a maioria das pessoas sobe sem dificuldade. A vista de cima vale muito!"},{"horario":"13h00 – 14h00","nome":"Bairro de Santa Cruz","descricao":"Com os grandes monumentos visitados, agora é hora de se perder nas vielas brancas e perfumadas de laranjeira do bairro mais charmoso de Sevilha. Sem roteiro fixo — só caminhar, fotografar e curtir.","dica":"Procurem a Plaza de Doña Elvira e o Callejón del Agua — dois dos cantos mais bonitos e menos lotados do bairro. O terreno é relativamente plano no miolo do bairro."},{"horario":"14h00 – 15h30","nome":"Almoço no Bairro de Santa Cruz ou arredores","descricao":"","dica":""},{"horario":"15h30 – 16h00","nome":"Deslocamento ao Parque de María Luisa e Plaza de España","descricao":"A pé do Bairro de Santa Cruz são ~15 minutos de caminho plano e muito agradável pelo centro histórico.","dica":""},{"horario":"16h00 – 17h30","nome":"Plaza de España","descricao":"Uma das praças mais espetaculares da Europa — construída em 1929, semicircular, com azulejos representando todas as províncias da Espanha. É gratuita e absolutamente fotogênica. Passeio de barco nos canais da praça é uma opção romântica!","dica":"Entrada gratuita. Passeio de barco: ~€6 por pessoa, ~35 minutos — muito recomendado para o casal! 🚣 Em janeiro o movimento é bem menor que no verão. Fiquem atentos ao horário — anoitece cedo em janeiro (por volta das 18h)."},{"horario":"17h30 – 18h00","nome":"Retorno ao hotel","descricao":"A pé pelo Parque de María Luisa (~20 min, plano e muito bonito) ou Uber (~€6).","dica":""},{"horario":"18h00 – 20h00","nome":"Descanso no hotel","descricao":"","dica":""},{"horario":"20h30","nome":"Jantar — penúltima noite em Sevilha","descricao":"","dica":""},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• Almoço (Bairro de Santa Cruz):<br>• <b>Restaurante Modesto<\/b> — Andaluza tradicional | Frutos do mar e tapas | ~€20–25 por pessoa<br>• <b>El Rincón de Anselma<\/b> — Tapas sevilhanas | Ambiente típico e animado | ~€15–20 por pessoa<br>• Jantar:<br>• <b>Eslava<\/b> — Tapas criativas | Um dos melhores bares de tapas de Sevilha, muito premiado | ~€20–30 por pessoa | Reserva recomendada<br>• <b>Az-Zait<\/b> — Andaluza contemporânea | Ambiente sofisticado perto do Alcázar | ~€35–45 por pessoa | Reserva recomendada<br>• <b>Bar Alfalfa<\/b> — Tapas tradicionais | Frequentado por locais, preço justo | ~€15–20 por pessoa<br><br><b>Links úteis<\/b><br>• Real Alcázar: www.alcazarsevilla.org<br>• Catedral de Sevilha: www.catedraldesevilla.es","dica":""}],"deslocamentos":["Hotel → Real Alcázar: A pé ~20 min, plano / Uber ~€5","Alcázar → Catedral: A pé ~3 min, plano","Catedral → Bairro de Santa Cruz: A pé ~5 min","Santa Cruz → Plaza de España: A pé ~15 min, plano","Plaza de España → Hotel: A pé ~20 min pelo parque / Uber ~€6"],"custos":[{"label":"Real Alcázar","valor":"€14,50"},{"label":"Catedral de Sevilha + Giralda","valor":"€12"},{"label":"Passeio de barco Plaza de España","valor":"€6"},{"label":"Almoço","valor":"€15–20"},{"label":"Jantar","valor":"€25–35"},{"label":"Uber (se necessário)","valor":"€5–6"}],"custoTotal":"~€78–94 por pessoa"},{"num":6,"data":"06/01 (segunda)","titulo":"Córdoba (Mesquita, Judería, Ponte Romana) e chegada a Granada","resumo":"Hoje é um dia duplo e muito especial — de manhã vocês exploram Córdoba, uma das cidades mais fascinantes da Andaluzia, com sua incrível Mesquita-Catedral e o charmoso bairro judeu. À tarde, o trem leva vocês para Granada, onde a viagem ganha um novo capítulo. É um dia mais intenso por ser de transferência, mas bem organizado para não cansar demais. Atenção: é 06/01, Dia de Reis em Espanha — feriado nacional! Alguns estabelecimentos podem estar fechados ou com horário reduzido.<br>Saída do hotel: 08h00","energia":"Moderado a Intenso","atividades":[{"horario":"08h00 – 08h15","nome":"Check-out do Ibis Styles Sevilha e deslocamento à Estação Santa Justa","descricao":"A estação fica a 5 minutos a pé do hotel — deixem as malas no hotel até a hora de partir ou guardem na consigna da estação (€3–5 por mala).","dica":"Confirme com o hotel se é possível deixar as malas até a hora do trem — a maioria dos Ibis permite isso sem custo."},{"horario":"09h34","nome":"Trem Sevilha → Córdoba (Renfe)","descricao":"Viagem de apenas 41 minutos de trem de alta velocidade AVE. Muito confortável!","dica":"<b>Compre os bilhetes com antecedência<\/b> em www.renfe.com — os preços sobem muito perto da data. Custo estimado: €15–30 por pessoa (ida)."},{"horario":"10h15 – 10h45","nome":"Chegada a Córdoba e deslocamento ao centro histórico","descricao":"A estação de Córdoba fica a ~20 minutos a pé da Mesquita ou ~€7 de táxi. Com o dia cheio, o táxi é a melhor opção.","dica":""},{"horario":"10h45 – 12h30","nome":"Mesquita-Catedral de Córdoba","descricao":"Uma das maravilhas arquitetônicas do mundo — uma mesquita árabe do século VIII com uma catedral gótica construída no seu interior. O resultado é de tirar o fôlego e absolutamente único. Patrimônio Mundial da UNESCO.","dica":"<b>Reserve os ingressos online<\/b> em www.catedralcordoba.es — ~€13 por pessoa. A entrada pela manhã tem luz natural entrando pelas janelas que cria um efeito mágico nas colunas. Dediquem pelo menos 1h30."},{"horario":"12h30 – 13h30","nome":"Judería — Bairro Judeu","descricao":"O bairro judeu medieval é um labirinto de ruelas brancas e floridas, considerado um dos mais bem preservados da Europa. Fica a 5 minutos a pé da Mesquita.<br>Destaque para a Sinagoga de Córdoba — uma das três sinagogas medievais preservadas em Espanha. Ingresso: ~€0,30 (simbólico).","dica":"Atenção ao Dia de Reis — a Sinagoga e alguns museus podem estar com horário reduzido. Confirme em www.turismodecordoba.org."},{"horario":"13h30 – 14h30","nome":"Almoço em Córdoba","descricao":"Aproveitem para experimentar o salmorejo cordobés — a versão local do gaspacho, mais cremosa e servida com presunto e ovo. É o prato símbolo da cidade!","dica":""},{"horario":"14h30 – 15h30","nome":"Ponte Romana + Torre da Calahorra","descricao":"A Ponte Romana sobre o Rio Guadalquivir é um passeio plano e deslumbrante, com vista para a Mesquita ao fundo — a foto mais icônica de Córdoba. A Torre da Calahorra no final da ponte abriga um museu interativo sobre Al-Ândalus.","dica":"Ingresso da Torre: ~€4,50 por pessoa. A vista da ponte já vale muito por si só — o museu é opcional dependendo do tempo disponível."},{"horario":"15h30 – 16h00","nome":"Patios de Córdoba","descricao":"Os famosos pátios floridos de Córdoba — quintais privados cheios de flores e azulejos que os moradores abrem ao público. Em janeiro muitos pátios estão fechados (a época principal é maio), mas alguns permanecem abertos no bairro de San Basilio.","dica":"Mesmo que poucos estejam abertos, o passeio pelo bairro de San Basilio vale pela arquitetura e pelo charme das ruas. Verifique quais estão abertos em www.turismodecordoba.org."},{"horario":"16h00 – 16h30","nome":"Retorno à estação de Córdoba","descricao":"Táxi ou Uber do centro até a estação: ~€7, 10 minutos.","dica":""},{"horario":"17h00","nome":"Café/lanche na estação antes do trem","descricao":"","dica":""},{"horario":"18h30","nome":"Trem Córdoba → Granada (Renfe)","descricao":"Viagem de ~2h40 minutos. Confortável para descansar após o dia intenso em Córdoba.","dica":"<b>Compre com antecedência<\/b> em www.renfe.com. Custo estimado: €20–35 por pessoa. Aproveitem para descansar no trem!"},{"horario":"21h10","nome":"Chegada a Granada","descricao":"A estação de ônibus/trem de Granada fica a ~3km do centro. Táxi ou Uber direto ao Hotel Porcel Navas: ~€8–10, 10 minutos.","dica":""},{"horario":"21h30","nome":"Check-in no Hotel Porcel Navas e jantar leve","descricao":"Após um dia longo, um jantar mais leve e perto do hotel é o ideal. O hotel fica na Calle Navas, uma das ruas mais animadas de Granada — cheia de bares e restaurantes excelentes logo na porta!","dica":"Em Granada é tradicional que os bares sirvam tapas gratuitas com cada bebida — e as tapas aqui são generosas, às vezes substituem o jantar! 🍺🥘"},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• Almoço em Córdoba:<br>• <b>Casa Pepe de la Judería<\/b> — Andaluza tradicional | Ótimo salmorejo e rabo de toro | ~€20–25 por pessoa | Reserva recomendada<br>• <b>Taberna Salinas<\/b> — Cordobesa clássica | Fundada em 1879, ambiente histórico | ~€20–30 por pessoa<br>• Jantar leve em Granada (Calle Navas):<br>• <b>Bar Los Diamantes<\/b> — Frutos do mar e tapas | Ícone de Granada, sempre movimentado | ~€15–20 por pessoa","dica":""}],"deslocamentos":["Hotel Sevilha → Estação Santa Justa: A pé ~5 min","Sevilha → Córdoba (AVE): 41 min, ~€15–30 por pessoa","Estação Córdoba → Mesquita: Táxi ~10 min, €7","Mesquita → Judería: A pé ~5 min, plano","Judería → Ponte Romana: A pé ~5 min, plano","Ponte → Patios (San Basilio): A pé ~10 min, plano","Centro Córdoba → Estação: Táxi ~10 min, €7","Córdoba → Granada (trem): ~2h40 min, ~€20–35 por pessoa","Estação Granada → Hotel Porcel Navas: Táxi ~10 min, €8–10"],"custos":[{"label":"Trem Sevilha → Córdoba","valor":"€20"},{"label":"Táxi Córdoba (estação → centro e volta)","valor":"€14"},{"label":"Mesquita-Catedral","valor":"€13"},{"label":"Sinagoga de Córdoba","valor":"€0,30"},{"label":"Torre da Calahorra","valor":"€4,50"},{"label":"Trem Córdoba → Granada","valor":"€25"},{"label":"Táxi Granada (estação → hotel)","valor":"€9"},{"label":"Almoço em Córdoba","valor":"€15–20"},{"label":"Jantar leve em Granada","valor":"€15–20"}],"custoTotal":"~€116–126 por pessoa"},{"num":7,"data":"07/01 (terça)","titulo":"Granada — Alhambra, Albaicín e Sacromonte","resumo":"O dia mais esperado em Granada chegou! A Alhambra é um dos monumentos mais extraordinários do mundo — um palácio nasrida do século XIV que parece ter saído de um sonho árabe. À tarde, vocês vão explorar o Albaicín, o bairro mourisco de Granada, com suas vielas brancas e a melhor vista possível da Alhambra ao entardecer. Atenção especial ao planejamento: a Alhambra exige reserva antecipada e tem regras rígidas de horário de entrada. O Albaicín tem topografia desafiadora, mas vou indicar o caminho mais suave!<br>Saída do hotel: 08h15","energia":"Moderado","atividades":[{"horario":"08h15 – 08h45","nome":"Deslocamento ao complexo da Alhambra","descricao":"A Alhambra fica no topo de uma colina a ~2km do hotel. Táxi ou Uber até a entrada principal (Puerta de la Justicia) é a opção mais confortável — evita completamente a subida a pé.","dica":"Peçam ao motorista para ir até a entrada principal da Alhambra. Custo: ~€6–8. Evitem a subida a pé pela Cuesta de Gomérez — é longa e íngreme."},{"horario":"09h00 – 12h30","nome":"Alhambra — Palácios Nasridas, Generalife e Alcazaba","descricao":"A visita completa inclui três partes: os Palácios Nasridas (o coração da Alhambra, com detalhes em estuque que parecem renda), o Generalife (jardins e palácio de verão) e a Alcazaba (fortaleza com vista panorâmica de Granada).<br>O complexo é imenso mas relativamente plano dentro — os caminhos entre as seções têm algumas rampas suaves.","dica":"<b>RESERVA OBRIGATÓRIA e com muita antecedência<\/b> em www.alhambra-patronato.es — os ingressos para os Palácios Nasridas esgotam semanas ou meses antes! Ingresso completo: ~€19 por pessoa. O horário de entrada nos Palácios Nasridas é fixo e deve ser respeitado rigorosamente — não se atrasem! Baixem o áudio-guia pelo app oficial."},{"horario":"12h30 – 13h00","nome":"Pausa no interior do complexo","descricao":"Há um café dentro do complexo da Alhambra (Parador de Granada) para uma pausa merecida após a visita.","dica":"O Parador de Granada é um hotel de luxo dentro da Alhambra — o café ou até um almoço aqui é uma experiência especial, mesmo para não hóspedes. Ambiente histórico único!"},{"horario":"13h00 – 13h30","nome":"Descida da Alhambra","descricao":"Táxi ou Uber do complexo de volta ao centro: ~€6–8. Alternativa mais suave: há um ônibus turístico (linha C3) que desce até a Plaza Nueva por €1,40.","dica":""},{"horario":"13h30 – 14h30","nome":"Almoço no centro de Granada","descricao":"A Plaza Nueva e a Calle Navas têm ótimas opções a poucos minutos do hotel.","dica":""},{"horario":"14h30 – 16h30","nome":"Albaicín — o bairro mourisco","descricao":"O Albaicín é o bairro árabe medieval de Granada, Patrimônio Mundial da UNESCO. O destino principal é o Mirador de San Nicolás, que oferece a vista mais famosa da Alhambra — especialmente linda no fim da tarde com a luz dourada.","dica":"O Albaicín tem muitas ladeiras. A forma mais inteligente para vocês é pegar o minibus C31 na Plaza Nueva até perto do Mirador de San Nicolás — sobe a colina sem esforço físico (€1,40). Depois façam a descida a pé pelo caminho mais suave, a Carrera del Darro, que corre à beira do rio e é praticamente plana. Evitem subir a pé!"},{"horario":"16h30 – 17h30","nome":"Sacromonte — o bairro das cavernas","descricao":"Após descer do Albaicín pela Carrera del Darro, o Sacromonte fica a ~10 minutos a pé. É o bairro cigano de Granada, famoso pelas casas-caverna escavadas na rocha e pelo flamenco espontâneo nas ruas.","dica":"O início do Sacromonte (Calle del Sacromonte) é relativamente plano — não precisam subir até as grutas no alto. Aproveitem a atmosfera única da rua, os murais e os bares ciganos."},{"horario":"17h30 – 18h00","nome":"Retorno ao hotel","descricao":"A pé do Sacromonte ao hotel são ~15 minutos pelo centro histórico, praticamente plano.","dica":""},{"horario":"18h00 – 20h00","nome":"Descanso no hotel","descricao":"Granada em janeiro pode ser bastante fria à noite — um descanso aquecido antes do jantar é muito bem-vindo! 🧥","dica":""},{"horario":"20h30","nome":"Jantar — última noite em Granada","descricao":"A Calle Navas, logo na porta do hotel, é perfeita para uma última experiência gastronômica granadina!","dica":""},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• Pausa na Alhambra:<br>• <b>Parador de Granada<\/b> — Histórico | Café ou almoço leve dentro da Alhambra | ~€20–30 por pessoa<br>• Almoço no centro:<br>• <b>Los Diamantes<\/b> — Frutos do mar e tapas | Ícone de Granada | ~€15–20 por pessoa<br>• <b>Restaurante Chikito<\/b> — Granadina tradicional | Frequentado por García Lorca, ambiente histórico | ~€20–25 por pessoa<br>• Jantar (última noite em Granada):<br>• <b>Restaurante Arrayanes<\/b> — Cozinha árabe-granadina | Uma das melhores experiências gastronômicas da cidade | ~€25–35 por pessoa | Reserva recomendada<br>• <b>Carmen de Aben Humeya<\/b> — Andaluza com vista para a Alhambra | Ambiente romântico e sofisticado | ~€35–45 por pessoa | Reserva obrigatória<br>• <b>Bar Poe<\/b> — Tapas criativas | Ambiente boêmio e descontraído | ~€15–20 por pessoa","dica":""}],"deslocamentos":["Hotel → Alhambra: Táxi ~10 min, €6–8","Alhambra → Centro (almoço): Ônibus C3 ~15 min, €1,40 / Táxi €6–8","Centro → Albaicín (Mirador San Nicolás): Minibus C31 ~15 min, €1,40","Albaicín → Sacromonte: A pé ~10 min, descida suave pela Carrera del Darro","Sacromonte → Hotel: A pé ~15 min, plano"],"custos":[{"label":"Táxi hotel → Alhambra","valor":"€7"},{"label":"Alhambra (ingresso completo)","valor":"€19"},{"label":"Ônibus C3 Alhambra → centro","valor":"€1,40"},{"label":"Minibus C31 → Albaicín","valor":"€1,40"},{"label":"Almoço","valor":"€15–20"},{"label":"Jantar","valor":"€20–30"}],"custoTotal":"~€64–79 por pessoa"},{"num":8,"data":"08/01 (quarta)","titulo":"Granada → Barcelona — Bairro Gótico e La Boqueria","resumo":"Mais um dia de transferência, mas com chegada cedo o suficiente para aproveitar uma boa tarde em Barcelona! O voo matinal leva vocês diretamente de Granada para a capital catalã às 10h30. Após o check-in, a tarde será dedicada a uma primeira imersão em Barcelona — o Bairro Gótico e o Mercado de La Boqueria são o programa perfeito para um primeiro contato com a cidade. À noite, uma janta espetacular para celebrar a última noite antes do cruzeiro!<br>Saída do hotel: 06h30","energia":"Leve a Moderado","atividades":[{"horario":"06h30","nome":"Check-out do Hotel Porcel Navas e deslocamento ao aeroporto","descricao":"O Aeroporto Federico García Lorca de Granada fica a ~15km do centro. Táxi pré-agendado é essencial nesse horário — solicite na véspera pela recepção do hotel ou pelo app.","dica":"Custo do táxi: ~€20–25. Confirme o agendamento na noite anterior. Lembre-se que em janeiro as manhãs em Granada são muito frias — casaco e luvas na mochila de mão!"},{"horario":"07h00","nome":"Chegada ao aeroporto de Granada — check-in e embarque","descricao":"Voo às 9h05 para Barcelona. Chegar 2h antes é suficiente — o aeroporto de Granada é pequeno e tranquilo.","dica":""},{"horario":"10h30","nome":"Chegada ao Aeroporto de Barcelona — El Prat","descricao":"Um dos maiores aeroportos da Europa, com dois terminais. O Ibis Styles Barcelona City Bogatell fica no bairro do Poblenou, a ~25 minutos de táxi do aeroporto.","dica":"Táxi do aeroporto ao hotel: ~€30–35 (tarifa tabelada). O Aerobús (ônibus oficial) custa €6,75 e vai até a Plaça de Catalunya em ~35 minutos — com malas, o táxi é mais prático."},{"horario":"11h00 – 12h00","nome":"Check-in no Ibis Styles Barcelona City Bogatell","descricao":"O hotel fica no bairro do Poblenou, moderno e bem localizado, a ~20 minutos a pé da Barceloneta e bem conectado de metrô ao centro.","dica":"Se o quarto não estiver pronto, deixem as malas e partam para explorar — o dia é precioso!"},{"horario":"12h00 – 13h00","nome":"Deslocamento ao centro e almoço","descricao":"De metrô (linha 4 — amarela) do Bogatell até o centro histórico são ~15 minutos. Saltem na estação Jaume I para o Bairro Gótico.","dica":""},{"horario":"13h00 – 15h00","nome":"Bairro Gótico","descricao":"O coração medieval de Barcelona — ruas estreitas, igrejas milenares e uma energia incrível. Destaque para a Catedral de Barcelona (entrada gratuita pela manhã — à tarde cobra €9), a Plaça de Sant Jaume e a Plaça Reial.","dica":"O Bairro Gótico é relativamente plano — ótimo para vocês! Evitem as horas de pico do turismo (14h–16h) nas ruelas mais estreitas. Em janeiro o movimento é bem menor que no verão."},{"horario":"15h00 – 16h00","nome":"Mercado de La Boqueria","descricao":"O mercado mais famoso da Espanha, à beira das Ramblas — frutas exóticas, jamón, queijos, frutos do mar e um visual extraordinário. Mais turístico que gastronômico hoje em dia, mas a experiência visual e sensorial é incrível.","dica":"Evitem comer refeição completa aqui — os preços são turísticos. Aproveitem para petiscar frutas, experimentar um copo de cava ou comprar alguns produtos para levar. Chegue pela entrada lateral (Carrer de la Petxina) para evitar o fluxo principal."},{"horario":"16h00 – 17h00","nome":"Las Ramblas — passeio rápido","descricao":"O famoso boulevard de Barcelona merece uma caminhada do mercado até a estátua de Colombo à beira-mar. Cerca de 1,2km, plano e muito animado.","dica":"Atenção aos pertences nas Ramblas — é uma área conhecida por batedores de carteira. Mantenham as bolsas na frente e os celulares guardados quando não estiverem usando."},{"horario":"17h00 – 17h30","nome":"Retorno ao hotel","descricao":"Metrô linha 4 de Barceloneta ou Drassanes até Bogatell: ~15 minutos, €2,40.","dica":""},{"horario":"17h30 – 19h30","nome":"Descanso e preparação para o jantar","descricao":"Aproveitem para organizar as malas pensando no embarque do cruzeiro amanhã!","dica":""},{"horario":"20h30","nome":"Jantar especial — última noite em terra antes do cruzeiro!","descricao":"Essa merece uma experiência gastronômica memorável. Barcelona tem uma cena gastronômica entre as melhores do mundo!","dica":""},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• Almoço (Bairro Gótico):<br>• <b>Bar del Pla<\/b> — Catalã moderna | Tapas criativas e excelente relação custo-benefício | ~€20–25 por pessoa<br>• <b>El Xampanyet<\/b> — Tradicional catalã | Famoso pelo cava da casa e anchovas | ~€15–20 por pessoa<br>• Jantar especial:<br>• <b>Bodega Sepúlveda<\/b> — Catalã contemporânea | Vinhos excepcionais e cozinha de produto | ~€35–45 por pessoa | Reserva recomendada<br>• <b>Parking Pizza<\/b> — Italiana contemporânea | Surpreendentemente incrível, muito querido pelos barceloneses | ~€25–30 por pessoa<br>• <b>Tickets<\/b> — Alta gastronomia criativa | Bar de tapas do chef Albert Adrià, irmão de Ferran Adrià | ~€60–80 por pessoa | Reserva com meses de antecedência<br><br><b>Links úteis<\/b><br>• Metrô Barcelona: www.tmb.","dica":""}],"deslocamentos":["Hotel Granada → Aeroporto Granada: Táxi pré-agendado ~20 min, €22","Aeroporto Barcelona → Hotel Bogatell: Táxi ~25 min, €32","Hotel Bogatell → Bairro Gótico: Metrô L4 ~15 min, €2,40","Bairro Gótico → La Boqueria: A pé ~10 min, plano","La Boqueria → Fin das Ramblas: A pé ~15 min, plano","Barceloneta → Hotel Bogatell: Metrô L4 ~10 min, €2,40"],"custos":[{"label":"Táxi Granada → aeroporto","valor":"€22"},{"label":"Táxi aeroporto Barcelona → hotel","valor":"€32"},{"label":"Metrô Barcelona (trajetos do dia)","valor":"€5"},{"label":"Petiscos La Boqueria","valor":"€10"},{"label":"Almoço","valor":"€15–20"},{"label":"Jantar especial","valor":"€40–60"}],"custoTotal":"~€124–149 por pessoa"},{"num":9,"data":"09/01 (quinta)","titulo":"Barcelona — Sagrada Família, Casa Batlló e embarque no cruzeiro","resumo":"O último dia em terra antes do cruzeiro é cheio de Gaudí e maravilhas! Pela manhã vocês visitam a Sagrada Família, a obra-prima inacabada mais visitada da Europa, e à tarde a Casa Batlló, um dos edifícios mais criativos que já existiram. O embarque no cruzeiro acontece à tarde — a estratégia é fazer as atrações pela manhã, almoçar, buscar as malas no hotel e embarcar com tranquilidade. Uma logística bem pensada para não perder nenhum minuto!<br>Saída do hotel: 08h30","energia":"Moderado","atividades":[{"horario":"08h30 – 09h00","nome":"Deslocamento à Sagrada Família","descricao":"De metrô do Bogatell até a estação Sagrada Família (linha 2 — lilás, com baldeação, ou linha 5 — azul): ~20 minutos, €2,40. Táxi: ~€10, 15 minutos.","dica":"O metrô é a opção mais prática e rápida. A Sagrada Família tem sua própria estação de metrô homônima — saída direta para a basílica."},{"horario":"09h00 – 11h00","nome":"Sagrada Família","descricao":"A obra-prima inacabada de Antoni Gaudí é simplesmente indescritível — torres que tocam o céu, vitrais que transformam a luz em cor e uma espiritualidade que emociona até os menos religiosos. Está em construção desde 1882 e a previsão é de conclusão em 2026!<br>O interior é plano e acessível. As torres têm elevador — confirme disponibilidade no ingresso.","dica":"<b>Reserve com muita antecedência<\/b> em www.sagradafamilia.org — os ingressos esgotam rapidamente! Ingresso básico: ~€26 por pessoa. Com torre: ~€36. A visita matinal tem a luz dos vitrais do lado do Nascimento mais intensa — espetacular! Dediquem pelo menos 1h30–2h."},{"horario":"11h00 – 11h30","nome":"Passeio pela Avinguda de Gaudí e Passeig de Gràcia","descricao":"Após a Sagrada Família, caminhem pela Avinguda de Gaudí até o Passeig de Gràcia — o boulevard mais elegante de Barcelona, com mansões modernistas e lojas sofisticadas. Caminho plano de ~15 minutos.","dica":""},{"horario":"11h30 – 13h00","nome":"Casa Batlló","descricao":"Um dos edifícios mais criativos e perturbadores do mundo — a fachada parece um ser vivo, com escamas de dragão e ossos humanos. A visita interna usa tecnologia de realidade aumentada e é uma experiência absolutamente imersiva.","dica":"<b>Reserve online<\/b> em www.casabatllo.es — ingresso: ~€35 por pessoa. A fila sem reserva pode ser enorme. A visita dura cerca de 1h–1h30. Caso prefiram economizar, a Casa Milà (La Pedrera), a 5 minutos a pé, tem ingresso ~€25 e é igualmente extraordinária — escolham uma das duas para não sobrecarregar o dia."},{"horario":"13h00 – 14h00","nome":"Almoço no Passeig de Gràcia","descricao":"A região tem ótimas opções para um almoço descontraído antes do embarque.","dica":""},{"horario":"14h00 – 14h30","nome":"Retorno ao hotel para buscar as malas e fazer check-out","descricao":"De táxi do Passeig de Gràcia ao hotel: ~€10, 15 minutos.","dica":"Combinem com a recepção para deixar as malas guardadas desde cedo — assim não precisam voltar ao hotel entre as atrações e o embarque."},{"horario":"15h00 – 16h00","nome":"Deslocamento ao Terminal de Cruzeiros de Barcelona","descricao":"O Terminal de Cruzeiros fica no Port Vell, próximo às Ramblas e à estátua de Colombo — cerca de 20 minutos de táxi do hotel com malas (~€15).","dica":"Verifique com a companhia do cruzeiro o horário exato de abertura do embarque — geralmente abre às 14h e fecha 2h antes da partida. Chegar entre 15h e 16h é confortável e evita a fila do início."},{"horario":"16h00 em diante","nome":"Embarque no cruzeiro — explore o navio e descanse!","descricao":"Após o embarque e instalação no camarote, aproveitem para explorar o navio — piscinas, restaurantes, deck panorâmico. Hoje é dia de conhecer o navio e descansar para a aventura que começa amanhã!","dica":"O jantar a bordo no primeiro dia costuma ser no restaurante principal do navio — uma boa oportunidade para conhecer outros passageiros e sentir o clima do cruzeiro!"},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• Almoço (Passeig de Gràcia):<br>• <b>Cervecería Catalana<\/b> — Catalã e tapas | Um clássico de Barcelona, ótimo custo-benefício | ~€20–25 por pessoa | Pode ter fila — chegue cedo<br>• <b>La Pepita<\/b> — Montaditos e tapas criativas | Ambiente jovial e muito saboroso | ~€15–20 por pessoa<br>• <b>Moments<\/b> — Alta gastronomia catalã | 2 estrelas Michelin no Hotel Mandarin Oriental | ~€80–120 por pessoa | Para uma despedida de terra inesquecível<br><br><b>Links úteis<\/b><br>• Sagrada Família: www.sagradafamilia.org<br>• Casa Batlló: www.casabatllo.es<br>• Terminal de Cruzeiros Barcelona: www.portdebarcelona.cat","dica":""}],"deslocamentos":["Hotel → Sagrada Família: Metrô ~20 min, €2,40 / Táxi ~€10","Sagrada Família → Casa Batlló: A pé ~15 min pelo Passeig de Gràcia, plano","Casa Batlló → Hotel (buscar malas): Táxi ~15 min, €10","Hotel → Terminal de Cruzeiros: Táxi ~20 min, €15"],"custos":[{"label":"Metrô ou táxi → Sagrada Família","valor":"€5"},{"label":"Sagrada Família (ingresso com torre)","valor":"€36"},{"label":"Casa Batlló (ingresso)","valor":"€35"},{"label":"Táxi Passeig de Gràcia → hotel","valor":"€10"},{"label":"Táxi hotel → Terminal de Cruzeiros","valor":"€15"},{"label":"Almoço","valor":"€20–25"}],"custoTotal":"~€121–126 por pessoa"},{"num":10,"data":"10/01 (sexta)","titulo":"Cruzeiro — Marselha, França","resumo":"Primeira parada do cruzeiro e primeira vez em solo francês para vocês! Marselha é a cidade mais antiga da França — fundada pelos gregos há mais de 2.600 anos — e tem um charme bruto e autêntico muito diferente de Paris. O destaque absoluto é o Vieux-Port, o porto velho cheio de vida, e a Notre-Dame de la Garde, a basílica que domina a cidade do alto. Um dia intenso mas muito recompensador!<br>Navio: Verifique o horário de atracação e all aboard com a companhia — geralmente atracam às 7h–8h e o retorno é por volta das 18h–19h.","energia":"Moderado","atividades":[{"horario":"","nome":"Chegada ao Porto de Marselha","descricao":"O navio atraca no Terminal de Cruzeiros de Marselha, localizado no J4, a cerca de 1,5km do Vieux-Port — caminho plano e muito agradável à beira-mar.","dica":"Confirme com a companhia se há transfer do navio ao centro ou se é necessário caminhar/pegar táxi. A caminhada até o Vieux-Port é plana e dura ~20 minutos."},{"horario":"Manhã","nome":"Vieux-Port — O Velho Porto de Marselha","descricao":"O coração de Marselha — um porto ativo e vibrante cercado de bares, restaurantes e mercados de peixe. Chegue cedo para ver os pescadores vendendo o peixe fresco do dia, ingrediente principal da famosa bouillabaisse!","dica":"O Marché du Vieux-Port (mercado de peixe) acontece todas as manhãs bem cedo — uma experiência sensorial única. Entrada gratuita."},{"horario":"Manhã","nome":"MuCEM — Museu das Civilizações da Europa e do Mediterrâneo","descricao":"Um museu extraordinário com arquitetura contemporânea impressionante, conectado ao Fort Saint-Jean por uma passarela sobre o mar. A vista da passarela sobre o porto e o Mediterrâneo é de tirar o fôlego.","dica":"Ingresso: ~€11 por pessoa. A passarela e a área externa são gratuitas — mesmo que não entrem no museu, vale muito visitar o exterior. Fica a 5 minutos a pé do Vieux-Port."},{"horario":"Meio-dia","nome":"Almoço — Bouillabaisse, o prato símbolo de Marselha!","descricao":"A bouillabaisse é uma sopa de frutos do mar e peixe com açafrão, servida com rouille e croutons — um prato que Marselha leva muito a sério. Comer aqui é uma experiência gastronômica única!","dica":"A bouillabaisse tradicional em Marselha custa entre €40–60 por pessoa — é cara mas inesquecível. Se preferirem algo mais acessível, a região tem excelentes opções de frutos do mar a preços menores."},{"horario":"Tarde","nome":"Notre-Dame de la Garde","descricao":"A basílica romano-bizantina que domina Marselha do alto de uma colina a 149 metros. A vista de lá de cima é absolutamente espetacular — dá para ver o navio no porto e as ilhas ao largo!","dica":"A subida a pé é íngreme — recomendo fortemente o petit train turístico (trenzinho) que sai do Vieux-Port e sobe até a basílica: ~€8 por pessoa. Alternativa: táxi até a entrada. Entrada na basílica: gratuita."},{"horario":"Final da tarde","nome":"Retorno ao navio","descricao":"Fique atento ao horário de all aboard informado pela companhia — nunca perca esse horário! Recomendo voltar ao navio com pelo menos 1h de antecedência.","dica":""},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• <b>Chez Fonfon<\/b> — Provençal | O restaurante mais famoso de Marselha para bouillabaisse desde 1952 | ~€50–70 por pessoa | Reserva obrigatória<br>• <b>Le Rhul<\/b> — Frutos do mar | Outra referência histórica para bouillabaisse à beira-mar | ~€45–60 por pessoa<br>• <b>L'Épuisette<\/b> — Mediterrânea | 1 estrela Michelin, vista deslumbrante sobre o mar | ~€60–80 por pessoa | Para uma experiência premium<br><br><b>Links úteis<\/b><br>• Turismo Marselha: www.marseille-tourisme.com<br>• MuCEM: www.mucem.org<br>• Petit train Notre-Dame: confirme com operadores locais no Vieux-Port","dica":""}],"deslocamentos":["Terminal → Vieux-Port: A pé ~20 min, plano / Táxi ~€8","Vieux-Port → MuCEM: A pé ~5 min, plano","Vieux-Port → Notre-Dame de la Garde: Petit train ~€8 / Táxi ~€10","Notre-Dame → Terminal: Táxi ~€12"],"custos":[{"label":"Transporte local (petit train + táxi)","valor":"€20"},{"label":"MuCEM (ingresso)","valor":"€11"},{"label":"Almoço (bouillabaisse)","valor":"€40–60"},{"label":"Petiscos e café","valor":"€10"}],"custoTotal":"~€81–101 por pessoa"},{"num":11,"data":"11/01 (sábado)","titulo":"Cruzeiro — Gênova, Itália","resumo":"Bem-vindos à Itália! Gênova é uma cidade surpreendente e muito subestimada pelos turistas — um labirinto medieval de vielas chamadas \"caruggi\", palácios renascentistas e uma história marítima riquíssima. Foi aqui que nasceu Cristóvão Colombo! A cidade tem um charme autêntico e menos turístico que Roma ou Florença, o que torna a visita ainda mais especial. Um dia perfeito para explorar o centro histórico, almoçar muito bem e se encantar com a arquitetura!<br>Navio: Verifique horário de atracação e all aboard com a companhia — geralmente atracam às 7h–8h e retorno por volta das 18h–19h.","energia":"Moderado","atividades":[{"horario":"","nome":"Chegada ao Porto de Gênova","descricao":"O porto de Gênova é central e integrado à cidade — a maioria dos pontos turísticos fica a poucos minutos a pé ou de táxi do terminal.","dica":"Confirme com a companhia se há transfer ou shuttle do terminal ao centro. O centro histórico fica a ~15 minutos a pé do porto — caminho plano pela orla."},{"horario":"Manhã","nome":"Porto Antico — O Porto Antigo","descricao":"A área do Porto Antigo foi revitalizada pelo arquiteto Renzo Piano e é o ponto de partida perfeito para explorar Gênova. Destaque para o Aquário de Gênova — um dos maiores da Europa — e a Biosfera, uma estufa de vidro futurista à beira-mar.","dica":"O Aquário é fantástico mas exige 2–3 horas — se o tempo for curto, optem pela Biosfera (~€5) e aproveitem a vista do porto. Aquário: ~€26 por pessoa. Façam a escolha conforme o tempo disponível."},{"horario":"Manhã","nome":"Caruggi — O Labirinto Medieval","descricao":"O centro histórico de Gênova é o maior conjunto medieval preservado da Europa — uma teia de vielas estreitas e escuras chamadas caruggi, com lojas, igrejas e mercados. É Patrimônio Mundial da UNESCO.","dica":"Os caruggi são relativamente planos no miolo do centro histórico — evitem se aventurar nas vielas que sobem as colinas laterais. Não há necessidade de roteiro fixo — simplesmente se percam e aproveitem!"},{"horario":"Meio-dia","nome":"Almoço — Pesto genovês na terra natal!","descricao":"Gênova é a capital mundial do pesto — e aqui ele é completamente diferente do que conhecemos. As troffie al pesto e as trenette al pesto são obrigatórias. Também experimente a focaccia genovesa — vendida em padarias por toda a cidade, é leve, oleosa e deliciosa!","dica":"As padarias dos caruggi vendem focaccia fresquinha por €1–2 a fatia — um lanche perfeito durante o passeio. Para o almoço completo, sente-se em uma trattoria do centro histórico."},{"horario":"Tarde","nome":"Strada Nuova — Palazzi dei Rolli","descricao":"A Via Garibaldi (antiga Strada Nuova) é uma das ruas mais elegantes do Renascimento europeu — ladeada por palácios monumentais que hoje abrigam museus. Patrimônio Mundial da UNESCO.<br>Destaque para os Musei di Strada Nuova — três palácios (Rosso, Bianco e Tursi) com coleções de arte extraordinárias.","dica":"Ing
