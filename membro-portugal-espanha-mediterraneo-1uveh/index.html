resso combinado para os três palácios: ~€9 por pessoa. Mesmo que não entrem, a rua por si só é deslumbrante e gratuita. O terreno é completamente plano!"},{"horario":"Tarde","nome":"Catedral de San Lorenzo","descricao":"A catedral medieval de Gênova, com fachada em mármore branco e preto listrado, fica a 5 minutos a pé da Via Garibaldi. Entrada gratuita.","dica":"O interior guarda uma relíquia curiosíssima — o Sacro Catino, um prato de vidro verde que a tradição diz ser o Santo Graal. Visita rápida e muito interessante!"},{"horario":"Final da tarde","nome":"Retorno ao navio","descricao":"Fique atento ao horário de all aboard. Volte com pelo menos 1h de antecedência.","dica":""},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• <b>Trattoria da Maria<\/b> — Genovesa tradicional | Ambiente familiar, preços honestos, frequentada por locais desde 1945 | ~€15–20 por pessoa<br>• <b>Il Genovese<\/b> — Italiana clássica | Especialidade em massas frescas com pesto artesanal | ~€20–25 por pessoa<br>• <b>Ristorante Zeffirino<\/b> — Genovesa refinada | Frequentado por celebridades, pesto premiado | ~€35–45 por pessoa | Reserva recomendada<br><br><b>Links úteis<\/b><br>• Turismo Gênova: www.visitgenoa.it<br>• Musei di Strada Nuova: www.museidigenova.it<br>• Aquário de Gênova: www.acquariodigenova.it","dica":""}],"deslocamentos":["Terminal → Porto Antico: A pé ~10 min, plano","Porto Antico → Caruggi: A pé ~10 min, plano","Caruggi → Via Garibaldi: A pé ~10 min, plano","Via Garibaldi → Catedral San Lorenzo: A pé ~5 min, plano","Centro → Terminal: A pé ~15 min / Táxi ~€8"],"custos":[{"label":"Biosfera (se optarem)","valor":"€5"},{"label":"Musei di Strada Nuova","valor":"€9"},{"label":"Focaccia e café no passeio","valor":"€8"},{"label":"Almoço (trattoria)","valor":"€20–25"},{"label":"Táxi retorno (se necessário)","valor":"€8"}],"custoTotal":"~€50–55 por pessoa"},{"num":12,"data":"12/01 (domingo)","titulo":"Cruzeiro — Nápoles e Pompeia, Itália","resumo":"Nápoles é uma das cidades mais intensas, caóticas e fascinantes do mundo — um turbilhão de sabores, história e vida nas ruas. É aqui que a pizza foi inventada, onde o Vesúvio domina a paisagem e onde a humanidade guarda alguns de seus maiores tesouros arqueológicos. Com um dia apenas, a estratégia é focar no centro histórico de Nápoles pela manhã e usar a tarde para uma excursão a Pompeia — uma das experiências mais marcantes que um viajante pode ter. Preparem-se para um dia memorável!<br>Navio: Verifique horário de atracação e all aboard — geralmente chegam às 7h–8h, com retorno às 18h–19h.","energia":"Moderado a Intenso","atividades":[{"horario":"","nome":"Chegada ao Porto de Nápoles","descricao":"O porto fica no centro da cidade — a Piazza del Municipio e o centro histórico estão a menos de 10 minutos a pé.","dica":"Confirme com a companhia se há shuttle ou transfer. O centro de Nápoles é acessível a pé do terminal."},{"horario":"Manhã","nome":"Centro Storico de Nápoles — Spaccanapoli","descricao":"A espinha dorsal do centro histórico de Nápoles é a famosa Spaccanapoli — uma rua longa e reta que literalmente \"corta\" a cidade ao meio. Igrejas barrocas, mercados improvisados, vendedores de rua e uma energia caótica e irresistível.<br>Destaque para a Igreja de San Gregorio Armeno — a rua dos artesãos de presépios napolitanos, famosa no mundo todo.","dica":"O centro histórico de Nápoles é Patrimônio Mundial da UNESCO. As ruas principais são relativamente planas — evitem as subidas laterais. Atenção aos pertences em Nápoles — é uma cidade com bastante movimento e aglomeração."},{"horario":"Manhã","nome":"Castel Nuovo (Maschio Angioino)","descricao":"O castelo medieval que domina o porto de Nápoles, com torres imponentes e um arco triunfal renascentista deslumbrante. Fica entre o porto e o centro histórico — perfeito para ver no caminho.","dica":"Ingresso: ~€6 por pessoa. A vista das muralhas sobre o golfo de Nápoles e o Vesúvio ao fundo é extraordinária."},{"horario":"Meio-dia","nome":"Almoço — Pizza napolitana na terra natal!","descricao":"Comer pizza em Nápoles é uma experiência transformadora — massa fininha, molho de tomate san marzano, muçarela de búfala e forno a lenha. A pizza margherita aqui é completamente diferente de qualquer outra que já comeram!","dica":"As pizzarias mais famosas têm fila — chegue antes das 13h para garantir lugar. Uma pizza individual custa €5–8 nas pizzarias tradicionais — absurdamente barato!"},{"horario":"Tarde","nome":"Pompeia","descricao":"Uma das experiências mais impressionantes do mundo — uma cidade romana soterrada pelo Vesúvio em 79 d.C. e preservada intacta por quase 2.000 anos. Caminhar pelas ruas de Pompeia é literalmente viajar no tempo.","dica":"De Nápoles, pegue o trem Circumvesuviana na Estação Garibaldi até a parada Pompei Scavi — Villa dei Misteri: ~35 minutos, €2,80 por pessoa (ida). Ingresso de Pompeia: ~€16 por pessoa. O sítio é grande mas relativamente plano — use sapatos confortáveis. Dediquem pelo menos 2 horas. Atenção ao horário de retorno ao navio — saiam de Pompeia com pelo menos 2h30 de antecedência!"},{"horario":"Final da tarde","nome":"Retorno ao navio","descricao":"Trem de Pompeia a Nápoles (~35 min) e depois a pé ou táxi ao porto (~10 min).","dica":"Este é o dia que exige mais atenção ao horário de all aboard — a distância de Pompeia ao porto pode trair! Planeje a saída de Pompeia com folga generosa."},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• Pizza (almoço em Nápoles):<br>• <b>L'Antica Pizzeria da Michele<\/b> — Napolitana clássica | A mais famosa de Nápoles desde 1870, só serve margherita e marinara | ~€5–8 por pizza | Fila garantida — chegue cedo!<br>• <b>Pizzeria Sorbillo<\/b> — Napolitana tradicional | Outro ícone absoluto, variedade maior de sabores | ~€7–10 por pizza<br>• <b>Di Matteo<\/b> — Napolitana de rua | Pizza frita (fritta) — a versão de rua inventada em Nápoles | ~€3–5 por peça<br><br><b>Links úteis<\/b><br>• Pompeia: www.pompeiisites.org<br>• Circumvesuviana: www.eavsrl.it<br>• Turismo Nápoles: www.inaples.it","dica":""}],"deslocamentos":["Terminal → Centro histórico: A pé ~10 min, plano","Centro → Castel Nuovo: A pé ~5 min, plano","Centro → Estação Garibaldi (trem Pompeia): A pé ~15 min / Táxi €8","Nápoles → Pompeia (Circumvesuviana): ~35 min, €2,80","Pompeia → Nápoles (trem): ~35 min, €2,80","Estação Garibaldi → Porto: Táxi ~€8"],"custos":[{"label":"Castel Nuovo","valor":"€6"},{"label":"Pizza napolitana (almoço)","valor":"€10–15"},{"label":"Trem Nápoles → Pompeia (ida e volta)","valor":"€5,60"},{"label":"Ingresso Pompeia","valor":"€16"},{"label":"Café e petiscos","valor":"€8"},{"label":"Táxi (trajetos)","valor":"€10"}],"custoTotal":"~€56–61 por pessoa"},{"num":13,"data":"13/01 (segunda)","titulo":"Cruzeiro — Palermo, Sicília","resumo":"Palermo é a capital da Sicília e uma das cidades mais fascinantes do Mediterrâneo — uma mistura explosiva de culturas árabe, normanda, espanhola e italiana que resultou em uma arquitetura única no mundo e uma gastronomia extraordinária. A cidade tem um charme bruto e autêntico que conquista qualquer viajante. Hoje vocês vão explorar os mercados mais vibrantes da Europa, igrejas de tirar o fôlego e comer muito bem!<br>Navio: Verifique horário de atracação e all aboard com a companhia — geralmente atracam às 7h–8h e retorno por volta das 18h–19h.","energia":"Moderado","atividades":[{"horario":"","nome":"Chegada ao Porto de Palermo","descricao":"O porto fica bem central — o coração histórico da cidade está a menos de 15 minutos a pé do terminal.","dica":"Confirme com a companhia se há shuttle ao centro. A caminhada do porto ao centro histórico é plana e muito agradável pela orla."},{"horario":"Manhã","nome":"Mercado de Ballarò","descricao":"O mercado de rua mais antigo e autêntico de Palermo — e um dos mais incríveis da Europa. Uma explosão de cores, cheiros, gritos dos vendedores e sabores mediterrâneos. Frutas exóticas, especiarias, peixes frescos, carnes e street food siciliano em cada esquina.","dica":"Chegue cedo — o mercado é mais vibrante entre 8h e 12h. Entrada gratuita. Experimente o arancino (bolinho de arroz recheado) e a panelle (fritter de grão-de-bico) — street food típico siciliano por €1–2 cada. O mercado tem terreno plano e ruas largas!"},{"horario":"Manhã","nome":"Cattedrale di Palermo","descricao":"Uma das catedrais mais extraordinárias do mundo — construída pelos normandos no século XII sobre uma mesquita árabe, com influências árabes, normandas e barrocas convivendo na mesma fachada. Um resumo perfeito da história de Palermo.","dica":"Entrada na catedral: gratuita. Acesso ao telhado e tumbas reais: ~€5 por pessoa. Fica a 10 minutos a pé do Mercado de Ballarò — caminho plano pela Corso Vittorio Emanuele."},{"horario":"Manhã","nome":"Cappella Palatina — A Joia de Palermo","descricao":"Dentro do Palazzo dei Normanni, a Capela Palatina é considerada uma das obras de arte mais perfeitas do mundo medieval — mosaicos bizantinos dourados cobrindo cada centímetro das paredes e teto, criados por artesãos árabes, normandos e gregos no século XII.","dica":"Ingresso: ~€12 por pessoa (inclui acesso ao Palazzo e à Cappella). <b>Reserve online<\/b> em www.federicosecondo.org — as filas podem ser longas. Fica a 5 minutos a pé da Catedral!"},{"horario":"Meio-dia","nome":"Almoço — Gastronomia siciliana!","descricao":"A cozinha siciliana é uma das mais ricas da Itália — influências árabes, normandas e gregas resultaram em pratos únicos. Experimente a pasta con le sarde (massa com sardinha e passas), a caponata e os cannoli siciliani de sobremesa!","dica":""},{"horario":"Tarde","nome":"Quattro Canti e Piazza Pretoria","descricao":"O Quattro Canti é a praça barroca no coração de Palermo — um cruzamento de quatro esquinas simétricas com fachadas monumentais do século XVII. A Piazza Pretoria, a 2 minutos a pé, tem uma fonte renascentista espetacular conhecida pelos palermitanos como \"Fontana della Vergogna\" (Fonte da Vergonha) pelas estátuas nuas!","dica":"Ambas as atrações são gratuitas e ficam no centro histórico — terreno plano e fácil de explorar a pé."},{"horario":"Tarde","nome":"La Martorana","descricao":"Uma das igrejas mais belas do mundo — mosaicos bizantinos dourados do século XII em um ambiente intimista e emocionante. Fica a 2 minutos do Quattro Canti.","dica":"Ingresso: ~€2 por pessoa. Pode estar fechada para almoço entre 13h–15h30 — planejem a visita para depois das 15h30."},{"horario":"Final da tarde","nome":"Retorno ao navio","descricao":"Fique atento ao horário de all aboard. Volte com pelo menos 1h de antecedência.","dica":""},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• Almoço:<br>• <b>Trattoria Ai Cascinari<\/b> — Siciliana tradicional | Frequentada por locais, longe do circuito turístico | ~€20–25 por pessoa | Reserva recomendada<br>• <b>Osteria dei Vespri<\/b> — Siciliana refinada | No centro histórico, ambiente elegante | ~€35–45 por pessoa | Reserva recomendada<br>• <b>Focacceria San Francesco<\/b> — Street food histórico | Aberta desde 1834, especialidade em vastedda (sanduíche siciliano) | ~€10–15 por pessoa<br>• Sobremesa obrigatória:<br>• <b>Pasticceria Cappello<\/b> — Confeitaria siciliana | Os melhores cannoli de Palermo | ~€3–5 por cannolo<br><br><b>Links úteis<\/b><br>• Cappella Palatina: www.federicosecondo.org<br>• Turismo Palermo: www.comune.palermo.it","dica":""}],"deslocamentos":["Terminal → Mercado de Ballarò: A pé ~15 min, plano / Táxi ~€8","Ballarò → Catedral: A pé ~10 min, plano","Catedral → Cappella Palatina: A pé ~5 min, plano","Cappella → Quattro Canti: A pé ~10 min, plano","Quattro Canti → La Martorana: A pé ~2 min, plano","Centro → Terminal: A pé ~15 min / Táxi ~€8"],"custos":[{"label":"Street food no Ballarò (arancino, panelle, café)","valor":"€8"},{"label":"Catedral (telhado e tumbas)","valor":"€5"},{"label":"Cappella Palatina + Palazzo","valor":"€12"},{"label":"La Martorana","valor":"€2"},{"label":"Almoço","valor":"€15–20"},{"label":"Táxi (se necessário)","valor":"€8"}],"custoTotal":"~€50–55 por pessoa"},{"num":14,"data":"14/01 (terça)","titulo":"Cruzeiro — La Goulette e Tunis, Tunísia","resumo":"Uma parada verdadeiramente especial e diferente de tudo que vocês já viram — a Tunísia é o único destino africano do cruzeiro e oferece uma imersão em uma cultura completamente diferente! La Goulette é o porto que serve a capital Tunis e a antiga Cartago. Hoje vocês têm duas opções magníficas: explorar a Medina de Tunis, um dos centros históricos islâmicos mais preservados do mundo, ou visitar as ruínas de Cartago, a cidade fenícia destruída por Roma. Idealmente, dá para fazer os dois!<br>Navio: Verifique horário de atracação e all aboard com a companhia.<br><br><b>Atenção especial:<\/b> A Tunísia tem algumas particularidades importantes que vocês devem saber antes de desembarcar. O dinar tunisino (TND) é a moeda local — cartões internacionais são aceitos em alguns lugares, mas tenha dinares em mãos para o mercado e pequenas compras. A compra de dinares só é possível dentro da Tunísia — troque no porto ou em um banco local. Respeitem os costumes locais: é um país muçulmano e o vestuário discreto é valorizado, especialmente na Medina.","energia":"Moderado","atividades":[{"horario":"","nome":"Chegada ao Porto de La Goulette","descricao":"La Goulette é basicamente um porto — o interesse turístico está em Tunis (30 min) e Cartago (15 min).","dica":"A companhia de cruzeiros certamente oferecerá excursões organizadas para Tunis e Cartago — avalie se vale contratar a bordo para ter guia e transporte garantido. Alternativamente, táxis coletivos (louages) e táxis individuais estão disponíveis no porto."},{"horario":"Manhã","nome":"Cartago — As Ruínas da Cidade Eterna Rival de Roma","descricao":"Cartago foi a maior cidade do Mediterrâneo antes de ser destruída por Roma em 146 a.C. As ruínas incluem as Termas de Antonino (as maiores termas romanas fora de Roma), o Tofet (santuário fenício) e o Museu Nacional de Cartago, com vistas deslumbrantes sobre o Golfo de Tunis.","dica":"O sítio arqueológico de Cartago é Patrimônio Mundial da UNESCO. Ingresso combinado para todos os sítios de Cartago: ~€8 por pessoa. O terreno tem algumas subidas suaves — nada intenso. De La Goulette, táxi até Cartago custa ~€10–15."},{"horario":"Meio-dia","nome":"Almoço em Sidi Bou Said","descricao":"A caminho de Tunis ou de volta, parem em Sidi Bou Said — uma vila absolutamente deslumbrante com casas brancas e azuis à beira do Mediterrâneo, frequentemente comparada a Santorini. É um dos lugares mais fotogênicos da África.","dica":"Experimente o brik (pastel tunisino recheado com ovo) e o thé à la menthe (chá de hortelã com pinhão) — a experiência gastronômica mais autêntica da Tunísia! A vila tem algumas escadarias — tenham cuidado com o trajeto."},{"horario":"Tarde","nome":"Medina de Tunis","descricao":"O centro histórico de Tunis é um dos mais bem preservados do mundo islâmico — um labirinto de 700 anos com souks (mercados), mesquitas, madrassas e palácios. Patrimônio Mundial da UNESCO.<br>Destaque para a Grande Mesquita de Zitouna — a mais antiga de Tunis, do século VII — e os souks de perfumes, especiarias, tapetes e artesanato ao redor.","dica":"Entrada na Grande Mesquita: gratuita para não-muçulmanos nas áreas externas. Nos souks, a barganha é parte da cultura — os preços iniciais são sempre negociáveis! Levem dinares para as compras. O terreno da Medina é relativamente plano no centro."},{"horario":"Final da tarde","nome":"Retorno ao navio em La Goulette","descricao":"Atenção redobrada ao horário de all aboard — este é um porto internacional e o navio não espera! Volte com pelo menos 1h30 de antecedência.","dica":""},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• Almoço em Sidi Bou Said:<br>• <b>Café des Nattes<\/b> — Tunisiana | O café mais famoso e fotogênico da Tunísia, no alto da vila | ~€10–15 por pessoa<br>• <b>Restaurant Dar Zarrouk<\/b> — Mediterrânea tunisiana | Vista panorâmica sobre o golfo, ambiente sofisticado | ~€25–35 por pessoa<br>• Na Medina de Tunis:<br>• <b>Dar El Jeld<\/b> — Alta gastronomia tunisiana | Em um palácio do século XVIII | ~€30–40 por pessoa | Reserva recomendada<br><br><b>Links úteis<\/b><br>• Turismo Tunísia: www.tourismtunisia.com<br>• Cartago UNESCO: whc.unesco.org","dica":""}],"deslocamentos":["La Goulette → Cartago: Táxi ~15 min, €10–15","Cartago → Sidi Bou Said: Táxi ou trem TGM ~10 min, €2–5","Sidi Bou Said → Medina de Tunis: Táxi ~20 min, €8–10","Medina → La Goulette: Táxi ~30 min, €12–15"],"custos":[{"label":"Ingresso combinado Cartago","valor":"€8"},{"label":"Transporte local (táxis)","valor":"€25–30"},{"label":"Almoço em Sidi Bou Said","valor":"€15–20"},{"label":"Chá de hortelã e petiscos","valor":"€5"},{"label":"Compras nos souks (estimativa)","valor":"€20–30"}],"custoTotal":"~€73–93 por pessoa"},{"num":15,"data":"15/01 (quarta)","titulo":"Cruzeiro — Dia de navegação e descanso","resumo":"Hoje o navio navega de volta a Barcelona e não há parada em porto — é o dia de descanso e aproveitamento pleno do navio! Depois de dias intensos explorando Marselha, Gênova, Nápoles, Palermo e a Tunísia, esse dia de navegação é um presente. Aproveitem as estruturas do navio, relaxem, se mimem e comecem a preparar as malas para o desembarque amanhã. Um dia leve, gostoso e merecido! ☀️🛳️","energia":"Leve","atividades":[{"horario":"Manhã","nome":"Café da manhã especial e deck panorâmico","descricao":"Aproveitem o café da manhã com calma — sem pressa de desembarcar! Depois, subam ao deck panorâmico para curtir o Mediterrâneo em alto mar. Em janeiro o frio no deck pode ser intenso — levem o casaco!","dica":"Os navios de cruzeiro costumam ter programação matinal de atividades — ioga, aulas de culinária, palestras sobre o próximo destino. Consultem o programa diário do navio (geralmente entregue no camarote na noite anterior)."},{"horario":"Manhã/Tarde","nome":"Spa e relaxamento","descricao":"Um dia de navegação é a oportunidade perfeita para experimentar o spa do navio — massagem, sauna, jacuzzi. Após dias caminhando bastante, os corpos agradecem!","dica":"Os serviços de spa são pagos e costumam ser mais baratos se reservados com antecedência a bordo. Massagem de casal pode custar €80–150 dependendo da duração e do navio. Reserve na recepção do spa logo pela manhã para garantir horário."},{"horario":"Tarde","nome":"Piscina, leitura e deck","descricao":"Se o clima permitir (em janeiro pode estar frio no Mediterrâneo), aproveitem as áreas de lazer do navio. Muitos navios têm piscina coberta ou aquecida — perfeita para o inverno.","dica":"As piscinas e jacuzzis externos podem estar fechados ou muito frios em janeiro. Verifiquem quais estruturas estão disponíveis com a equipe do navio."},{"horario":"Tarde","nome":"Preparação das malas","descricao":"Amanhã é dia de desembarque! A maioria das companhias pede que as malas grandes sejam deixadas do lado de fora do camarote na noite anterior — verifiquem o horário exato com a companhia.","dica":"Separem uma mochila ou mala de mão com o necessário para o dia seguinte — documentos, itens de higiene, roupas para usar após o desembarque e o voo para Madri."},{"horario":"Tarde/Noite","nome":"Jantar especial — última noite no navio","descricao":"A última noite do cruzeiro merece uma celebração! Muitos navios têm restaurantes especiais (à la carte, com reserva) além do restaurante principal — uma boa oportunidade para uma experiência gastronômica diferenciada a bordo.","dica":"Reserve o jantar especial com antecedência na recepção do navio — os restaurantes premium costumam cobrar €25–50 por pessoa além do pacote do cruzeiro, mas a experiência vale para uma noite especial!"},{"horario":"Noite","nome":"Espetáculo ou entretenimento a bordo","descricao":"Os navios de cruzeiro costumam ter shows noturnos no teatro — musicais, mágica, comédia. Uma boa forma de encerrar a última noite com diversão!","dica":"Consultem a programação noturna no programa diário do navio e reservem os assentos com antecedência se necessário."}],"deslocamentos":[],"custos":[{"label":"Spa/massagem (opcional)","valor":"€60–80"},{"label":"Jantar especial a bordo (opcional)","valor":"€30–50"},{"label":"Drinks e extras a bordo","valor":"€20–30"},{"label":"Total mínimo (sem extras)","valor":"~€20–30 por pessoa"}],"custoTotal":"~€110–160 por pessoa (se optarem pelo spa e jantar especial)"},{"num":16,"data":"16/01 (quinta)","titulo":"Desembarque em Barcelona e chegada a Madri","resumo":"O cruzeiro chega ao fim e Barcelona recebe vocês de volta para uma última conexão antes do voo para Madri. O desembarque acontece pela manhã e o voo para Madri é às 13h35 — o tempo é justo mas suficiente se tudo correr bem. A estratégia é desembarcar com tranquilidade, ir direto ao aeroporto sem passar pelo centro de Barcelona e embarcar confortavelmente. À noite, Madri espera por vocês para uma última janta europeia inesquecível!<br>Navio: Siga as instruções da companhia para o desembarque — geralmente entre 7h e 10h.","energia":"Leve","atividades":[{"horario":"07h00 – 09h00","nome":"Desembarque do cruzeiro no Terminal de Barcelona","descricao":"O desembarque costuma ser organizado por grupos — a companhia informará o horário do seu grupo na noite anterior. As malas grandes são retiradas no píer após desembarcar.","dica":"Priorizem desembarcar cedo — quanto mais cedo saírem, mais tranquilo o trajeto ao aeroporto. Tentem estar no grupo de desembarque mais cedo possível, especialmente por causa do voo às 13h35."},{"horario":"09h00 – 09h30","nome":"Deslocamento do Terminal ao Aeroporto de Barcelona — El Prat","descricao":"Do Terminal de Cruzeiros ao aeroporto: táxi é a opção mais prática com malas — ~30 minutos, €35–40 (tarifa tabelada).","dica":"Não arrisquem transporte público com malas grandes nesse dia — o táxi garante pontualidade e conforto. Peçam um táxi de van se tiverem muitas malas."},{"horario":"09h30 – 11h30","nome":"Aeroporto de Barcelona — check-in, segurança e embarque","descricao":"Chegar às 9h30 para um voo às 13h35 dá uma margem confortável de 4 horas — suficiente para fazer check-in, despachar malas, passar pela segurança e ainda almoçar no aeroporto com calma.","dica":"O Aeroporto de Barcelona tem boas opções de restaurantes e lojas no lado ar (após a segurança). Aproveitem para um último café catalão!"},{"horario":"11h30 – 13h00","nome":"Almoço no aeroporto e embarque","descricao":"","dica":""},{"horario":"13h35 – 15h00","nome":"Voo Barcelona → Madri (Iberia)","descricao":"Voo de ~1h25. Aproveitem para descansar!","dica":""},{"horario":"15h00 – 16h00","nome":"Chegada ao Aeroporto de Madri — Barajas (MAD)","descricao":"Um dos maiores aeroportos da Europa — o Terminal 4 (onde geralmente operam voos domésticos Iberia) é moderno e bem sinalizado.","dica":"Do aeroporto ao Novotel Madrid Center, o metrô (linha 8 até Nuevos Ministerios, depois linha 6 ou 10) custa ~€5 mas é demorado com malas. O táxi custa ~€30–35 e leva ~25 minutos — muito mais prático."},{"horario":"16h00 – 17h00","nome":"Check-in no Novotel Madrid Center","descricao":"O hotel fica no coração de Madri, bem localizado para explorar a cidade a pé. Excelente escolha para a última noite!","dica":"O Novotel Madrid Center fica próximo à Gran Vía e ao Paseo del Prado — duas das principais atrações de Madri a poucos minutos a pé."},{"horario":"17h00 – 19h00","nome":"Passeio leve por Madri — Gran Vía e Puerta del Sol","descricao":"Vocês têm algumas horas para sentir o clima de Madri antes da janta! A Gran Vía é o boulevard mais vibrante da capital espanhola — arquitetura impressionante, lojas e um movimento incrível. A Puerta del Sol, a 10 minutos a pé, é o coração geográfico da Espanha.","dica":"O passeio é completamente plano e muito agradável. Em janeiro Madri pode estar fria (~5–10°C) mas a cidade é muito animada mesmo no inverno!"},{"horario":"20h30","nome":"Jantar especial — última noite na Europa!","descricao":"Madri tem uma das cenas gastronômicas mais vibrantes da Europa — a última janta merece ser memorável. Madri é famosa pelo cocido madrileño, o jamón ibérico e os churros com chocolate!","dica":""},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• Jantar em Madri (última noite na Europa):<br>• <b>Sobrino de Botín<\/b> — Espanhola clássica | O restaurante mais antigo do mundo em funcionamento (1725), especialidade em leitão e cordeiro assados | ~€40–55 por pessoa | Reserva obrigatória — www.botin.es<br>• <b>Casa Lucio<\/b> — Madrileña tradicional | Famoso pelos huevos rotos e frequentado por celebridades | ~€35–45 por pessoa | Reserva recomendada<br>• <b>DiverXO<\/b> — Alta gastronomia criativa | 3 estrelas Michelin, do chef David Muñoz | ~€200+ por pessoa | Para uma despedida absolutamente inesquecível | Reserva com meses de antecedência<br><br><b>Links úteis<\/b><br>• Sobrino de Botín: www.botin.es<br>• Táxi Barcelona (app): www.mytaxi.com<br>• Metrô Madri: www.metromadrid.es","dica":""}],"deslocamentos":["Terminal Cruzeiros → Aeroporto Barcelona: Táxi ~30 min, €35–40","Aeroporto Madri → Novotel: Táxi ~25 min, €32","Hotel → Gran Vía / Puerta del Sol: A pé ~10 min, plano"],"custos":[{"label":"Táxi Terminal → Aeroporto Barcelona","valor":"€18–20"},{"label":"Almoço no aeroporto Barcelona","valor":"€15–20"},{"label":"Táxi Aeroporto Madri → hotel","valor":"€16"},{"label":"Jantar especial em Madri","valor":"€35–55"}],"custoTotal":"~€84–111 por pessoa"},{"num":17,"data":"17/01 (sexta)","titulo":"Madri — Prado, Retiro e voo para casa","resumo":"O último dia na Europa merece ser aproveitado até o último segundo! O voo para Recife parte às 16h30, então vocês têm uma manhã inteira para explorar Madri com calma. A estratégia é visitar o Museu do Prado ou o Parque del Retiro pela manhã, almoçar bem, retornar ao hotel para buscar as malas e partir para o aeroporto com tranquilidade. Um final de viagem digno de tudo que viveram nestas semanas incríveis!<br>Saída do hotel: 09h00","energia":"Leve","atividades":[{"horario":"09h00 – 09h15","nome":"Saída do hotel rumo ao Paseo del Prado","descricao":"O Museu do Prado e o Parque del Retiro ficam a ~15 minutos a pé do Novotel, por um caminho plano e muito agradável.","dica":""},{"horario":"09h15 – 11h30","nome":"Museu do Prado","descricao":"Um dos maiores museus de arte do mundo — abriga obras de Velázquez, Goya, El Greco, Rubens e Rafael. Mesmo que não sejam grandes apreciadores de arte, a experiência de estar diante de obras como \"Las Meninas\" de Velázquez ou \"O Jardim das Delícias\" de Bosch é absolutamente emocionante.","dica":"Ingresso: ~€15 por pessoa. Das 18h às 20h a entrada é gratuita, mas vocês não estarão mais disponíveis nesse horário. Comprem online em www.museodelprado.es para evitar fila. Dediquem 2 horas focando nas obras principais — o museu é enorme e tentar ver tudo é exaustivo. Peçam o mapa das obras imperdíveis na entrada!"},{"horario":"11h30 – 12h30","nome":"Parque del Retiro","descricao":"O pulmão verde de Madri — um parque imenso e belíssimo com lago, estátuas, jardins e o Palácio de Cristal, uma estufa de vidro do século XIX absolutamente deslumbrante. Fica a 10 minutos a pé do Prado.","dica":"Entrada gratuita. O Palácio de Cristal também é gratuito e vale muito a visita — geralmente abriga exposições de arte contemporânea. O parque é plano e muito agradável para uma caminhada leve de despedida da Europa!"},{"horario":"12h30 – 13h30","nome":"Almoço — última refeição europeia!","descricao":"A região do Retiro tem boas opções de restaurantes. Aproveitem para um almoço descontraído e celebrativo!","dica":"Não almocem muito tarde — precisam estar de volta ao hotel às 14h para buscar as malas e partir para o aeroporto com tranquilidade."},{"horario":"14h00","nome":"Retorno ao hotel, check-out e buscar malas","descricao":"A pé do Retiro ao hotel: ~15 minutos, plano.","dica":""},{"horario":"14h30","nome":"Deslocamento ao Aeroporto de Madri — Barajas","descricao":"Táxi do hotel ao aeroporto: ~25–30 minutos, €30–35. Para um voo às 16h30, sair às 14h30 dá uma margem confortável de 2 horas.","dica":"O Terminal 4 de Madri é muito grande — contem com pelo menos 20 minutos para caminhar até o portão de embarque após passar pela segurança. Voos internacionais pedem check-in com 2h–2h30 de antecedência."},{"horario":"16h30","nome":"Voo Madri → Recife (Iberia) — executiva","descricao":"Aproveitem o conforto da executiva para descansar — vocês merecem depois de uma viagem tão incrível! O voo dura aproximadamente 9 horas.","dica":"Madri → Recife costuma fazer escala em Lisboa ou ser direto dependendo da operação Iberia. Confirme o itinerário exato do voo no e-ticket."},{"horario":"21h25","nome":"Chegada a Recife","descricao":"Conexão para Goiânia no dia seguinte.","dica":""},{"horario":"","nome":"Onde comer e links úteis","descricao":"<b>Restaurantes sugeridos<\/b><br>• Almoço (região do Retiro):<br>• <b>Lateral Retiro<\/b> — Espanhola moderna | Tapas e petiscos de qualidade, ótimo custo-benefício | ~€20–25 por pessoa<br>• <b>El Brillante<\/b> — Madrileña clássica | Famoso pelos bocadillos de calamares — o sanduíche símbolo de Madri | ~€10–15 por pessoa<br>• <b>Restaurante Palacio de Cristal del Retiro<\/b> — Café dentro do parque | Lanche leve e ambiente único | ~€10–15 por pessoa<br><br><b>Links úteis<\/b><br>• Museu do Prado: www.museodelprado.es<br>• Parque del Retiro: gratuito, sem reserva necessária","dica":""}],"deslocamentos":["Hotel → Museu do Prado: A pé ~15 min, plano","Prado → Parque del Retiro: A pé ~10 min, plano","Retiro → Hotel: A pé ~15 min, plano","Hotel → Aeroporto Madri: Táxi ~25–30 min, €32"],"custos":[{"label":"Museu do Prado","valor":"€15"},{"label":"Parque del Retiro e Palácio de Cristal","valor":"gratuito"},{"label":"Almoço","valor":"€20–30"},{"label":"Táxi hotel → aeroporto","valor":"€16"}],"custoTotal":"~€51–61 por pessoa"}],"footerNote":"Portugal, Espanha e Mediterrâneo · Roteiro personalizado","marcaTexto":"Clube do Viajante","marcaHTML":"Clube do <span>Viajante<\/span>","_slug":"membro-portugal-espanha-mediterraneo-1uveh"};

const noEmoji = s => String(s == null ? '' : s).replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}️‍⃣]/gu, '').replace(/[ \t]{2,}/g, ' ').trim();
const rich = s => noEmoji(s);                                                                         // HTML confiável do gerador
const WD = ['dom','seg','ter','qua','qui','sex','sáb'];
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const isoOk = iso => /^\d{4}-\d{2}-\d{2}/.test(String(iso || ''));
const dt = iso => { const [y,m,d] = String(iso).slice(0,10).split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); };
function fmtDateBR(iso) { if (!iso) return ''; const p = String(iso).split('-'); return p.length === 3 ? p[2]+'/'+p[1]+'/'+p[0] : iso; }
const dShort = iso => isoOk(iso) ? String(iso).slice(8,10) + '/' + String(iso).slice(5,7) : esc(iso);
const wd = iso => isoOk(iso) ? WD[dt(iso).getUTCDay()] : '';
const dLong = iso => { if (!isoOk(iso)) return esc(iso || ''); const x = dt(iso); return wd(iso) + ', ' + x.getUTCDate() + ' ' + MES[x.getUTCMonth()]; };
const hh = h => esc(String(h || '').replace(/^(\d{1,2}):(\d{2})$/, '$1h$2'));
const pad2 = n => String(n).padStart(2, '0');
const hojeSP = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);   // America/Sao_Paulo (-03:00 fixo)

let D = {};
function cityOf(iso) {
  const c = [];
  (D.hospedagem || []).slice().sort((a,b) => String(a.checkin||'').localeCompare(String(b.checkin||''))).forEach(h => {
    if (h.cidade && h.checkin && h.checkout && h.checkin <= iso && iso <= h.checkout && c[c.length-1] !== h.cidade) c.push(h.cidade);
  });
  return c.join(' → ');
}

/* ── Botão copiar (localizador, confirmação) ─────────────────────────── */
function copyBtn(v) { return '<button type="button" class="copy" data-copy="' + esc(v) + '">Copiar</button>'; }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const v = b.getAttribute('data-copy');
  const done = ok => { b.textContent = ok ? 'Copiado' : 'Selecionado'; b.classList.toggle('ok', ok); setTimeout(() => { b.textContent = 'Copiar'; b.classList.remove('ok'); }, 1800); };
  const sel = () => { const el = b.previousElementSibling; if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } done(false); };
  try { navigator.clipboard.writeText(v).then(() => done(true), sel); } catch (err) { sel(); }
});

/* ── Rotas: Google Maps e Waze ───────────────────────────────────────── */
// Com coordenadas (lat/lng preenchidos no concierge) a rota é exata.
// Sem coordenadas, o lugar sai do nome da atividade e ganha a cidade do dia.
const FIM = '(?![\\p{L}\\p{N}])';
const SEM_DESTINO = new RegExp('^(voo|descanso|almoço com|show|parada|café da manhã|segurança|caminhada|check-in \\+|check-in gol|desembarque gru|hotel|transfer|livre|tempo livre|custos|dicas|observações|checklist|encerramento)' + FIM, 'iu');
const GENERICO = new RegExp('^(check-in|almoço|jantar|desembarque|trem|rer|malas|sala vip|táxi|transfer|chegada|saída)' + FIM, 'iu');
const VAGO = new RegExp('(^(check-in|hotel|(gru )?t\\d\\w*)' + FIM + ')|^casa$|lounge|sala vip|a definir', 'iu');
function lugar(nome) {
  let n = noEmoji(txt(nome)).replace(/\(.*?\)/g, '').replace(/\|.*$/, '').replace(/Loc\..*$/i, '').trim();
  if (!n || SEM_DESTINO.test(n)) return '';
  if (n.includes('·')) {
    const [a, b] = n.split('·').map(x => x.trim());
    n = GENERICO.test(a) ? b : a;
  }
  if (n.includes('→')) {
    const parts = n.split('→').map(x => x.trim());
    const fim = parts[parts.length - 1];
    if (/^[a-zà-ú]/.test(fim)) {
      if (/^(táxi|voo|trem|transfer)/i.test(parts[0])) return '';
      n = parts[0];
    } else n = fim;
  }
  n = n.split('+')[0].trim();
  if (!n || /^[a-zà-ú]/.test(n) || VAGO.test(n)) return '';
  return n;
}
function cidadesConhecidas() {
  const s = new Set();
  (D.hospedagem || []).forEach(h => { if (h.cidade) s.add(String(h.cidade).trim()); });
  return [...s];
}
function contextoDia(d) {
  const cid = cidadesConhecidas();
  const estadia = isoOk(d.data) ? cityOf(d.data).split(' → ').filter(Boolean) : [];
  const titulo = txt(d.titulo);
  const excursao = cid.find(c => titulo.includes(c) && !estadia.includes(c)) || '';
  return { estadia, excursao, atual: estadia[0] || '' };
}
function consulta(l, cidade) {
  if (!l) return '';
  if (!cidade || /aeroporto/i.test(l) || l.includes(cidade)) return l;
  return l + ', ' + cidade;
}
function consultaAtividade(a, ctx) {
  const nome = noEmoji(txt(a.nome));
  if (/^voo/i.test(nome) && ctx.estadia[1]) ctx.atual = ctx.estadia[1];
  const l = lugar(nome);
  if (ctx.excursao && l === ctx.excursao) ctx.atual = ctx.excursao;
  const q = consulta(l, ctx.atual);
  if (ctx.excursao && /volta/i.test(nome)) ctx.atual = ctx.estadia[0] || '';
  return q;
}
function consultaDeslocamento(rota, ctx) {
  const partes = rota.split('→').map(x => x.trim());
  if (partes.length < 2) return '';
  if (/^aeroporto/i.test(partes[0]) && ctx.estadia[1]) ctx.atual = ctx.estadia[1];
  if (ctx.excursao && rota.includes(ctx.excursao)) ctx.atual = ctx.excursao;
  const ult = partes[partes.length - 1];
  const q = consulta(lugar(ult), ctx.atual);
  if (ctx.excursao && ctx.atual === ctx.excursao && !rota.includes(ctx.excursao) && /atocha|hotel|esta[cç][aã]o/i.test(ult)) ctx.atual = ctx.estadia[0] || '';
  return q;
}
const temCoord = a => a && a.lat !== undefined && a.lat !== '' && a.lng !== undefined && a.lng !== '' && !isNaN(parseFloat(a.lat)) && !isNaN(parseFloat(a.lng));
const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.3 7 13 7 13s7-7.7 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
// dest/orig: { q: texto da busca, ll: "lat,lng" opcional, rotulo }
function navHtml(dest, orig, compacto) {
  if (!dest || !(dest.q || dest.ll)) return '';
  const alvo = encodeURIComponent(dest.ll || dest.q);
  const daOrigem = orig && (orig.ll || orig.q) ? '&origin=' + encodeURIComponent(orig.ll || orig.q) : '';
  const dir = 'https://www.google.com/maps/dir/?api=1' + daOrigem + '&destination=' + alvo;
  const waze = dest.ll ? 'https://waze.com/ul?ll=' + encodeURIComponent(dest.ll) + '&navigate=yes' + (orig && orig.ll ? '&from=' + encodeURIComponent(orig.ll) : '')
                       : 'https://waze.com/ul?q=' + alvo + '&navigate=yes';
  const L = (href, t, cls) => '<a class="nb' + (cls ? ' ' + cls : '') + '" href="' + esc(href) + '" target="_blank" rel="noopener">' + t + '</a>';
  if (compacto) {
    return '<div class="nav c"><div class="nbs">' + L('https://www.google.com/maps/search/?api=1&query=' + alvo, 'Maps') + L(waze, 'Waze', 'waze') + '</div></div>';
  }
  const rot = (orig && orig.rotulo ? esc(orig.rotulo) + ' → ' : '') + esc(dest.rotulo || dest.q);
  return '<div class="nav"><span class="dest">' + PIN + '<span>' + rot + '</span></span><div class="nbs">' +
    L(dir + '&travelmode=walking', 'A pé') + L(dir + '&travelmode=driving', 'Carro') + L(dir + '&travelmode=transit', 'Transporte') + L(waze, 'Waze', 'waze') + '</div></div>';
}

/* ── Dia a dia ───────────────────────────────────────────────────────── */
function buildDayBlock(d) {
  let resumo = rich(d.resumo || '');
  let saida = '';
  const m = resumo.match(/\s*(Saída d[eo] [^:<]+):\s*([0-9]{1,2}h[0-9]{0,2}|[0-9]{1,2}:[0-9]{2})\.?/i);
  if (m) { saida = m[1].trim() + ' às ' + m[2].replace(':', 'h'); resumo = resumo.replace(m[0], ' ').trim(); }
  const ctxA = contextoDia(d), ctxD = contextoDia(d);
  const ativs = d.atividades || [];
  // Destino de cada atividade: coordenada se houver, senão nome + cidade
  const alvos = ativs.map(a => {
    const q = consultaAtividade(a, ctxA);
    const rotulo = lugar(a.nome) || noEmoji(txt(a.nome));
    if (temCoord(a)) return { ll: parseFloat(a.lat) + ',' + parseFloat(a.lng), q, rotulo };
    return q ? { q, rotulo } : null;
  });
  const acts = ativs.map((a, i) => {
    const [ini, fim] = String(a.horario || '').split(/\s*[–—-]\s*/);
    const dest = alvos[i];
    const orig = i > 0 ? alvos[i - 1] : null;
    // Mesmo ponto (mesmas coordenadas ou mesmo lugar) não gera rota
    const igual = dest && orig && ((dest.ll && dest.ll === orig.ll) || (!dest.ll && dest.q === orig.q));
    return '<li class="act"><div class="t">' + esc(ini || '') + (fim ? '<small>até ' + esc(fim) + '</small>' : '') + '</div><div>' +
      '<h3>' + rich(a.nome || '') + '</h3>' + (a.descricao ? '<div class="d">' + rich(a.descricao) + '</div>' : '') +
      (a.dica ? '<div class="tip">' + rich(a.dica) + '</div>' : '') +
      (igual ? '' : navHtml(dest, orig, false)) + '</div></li>';
  }).join('');
  const moves = (d.deslocamentos || []).map(s0 => {
    const s = rich(s0);
    const plano = txt(s);
    const i = plano.indexOf(':');
    const rota = i > 0 ? plano.slice(0, i) : plano;
    const q = consultaDeslocamento(rota, ctxD);
    const corpo = i > 0 && s === esc(plano) ? '<b>' + esc(rota) + '</b>' + esc(plano.slice(i)) : (i > 0 && !/<[a-z]/i.test(s) ? '<b>' + esc(rota) + '</b>' + esc(plano.slice(i)) : s);
    return '<li><div>' + corpo + '</div>' + navHtml(q ? { q } : null, null, true) + '</li>';
  }).join('');
  const custos = (d.custos || []).map(c => '<tr><td>' + rich(c.label) + '</td><td>' + rich(c.valor) + '</td></tr>').join('');
  const custosHtml = custos || d.custoTotal ? '<div><div class="sub-h">Custos estimados</div><table class="costs">' + custos +
    (d.custoTotal ? '<tr class="total"><td>Total estimado</td><td>' + rich(d.custoTotal) + '</td></tr>' : '') + '</table></div>' : '';
  const num = d.num != null ? d.num : '';
  const cidade = isoOk(d.data) ? cityOf(d.data) : '';
  const eyebrow = ['Dia ' + pad2(num), d.data ? dLong(d.data) : '', esc(cidade)].filter(Boolean).join(' · ');
  const aberto = isoOk(d.data) && String(d.data).slice(0,10) === hojeSP();
  const pills = (saida ? '<span class="pill solid tnum">' + esc(saida) + '</span>' : '') +
    (energiaTxt(d.energia) ? '<span class="pill">' + esc(energiaTxt(d.energia)) + '</span>' : '') +
    (d.custoTotal ? '<span class="pill tnum">' + esc(txt(d.custoTotal)) + '</span>' : '') +
    (ativs.length ? '<span class="more">' + ativs.length + (ativs.length > 1 ? ' atividades' : ' atividade') + '</span>' : '');
  return '<section class="day' + (aberto ? ' open' : '') + '" id="day-' + esc(num) + '">' +
    '<button type="button" class="day-h" aria-expanded="' + aberto + '" aria-controls="day-' + esc(num) + '-c"><span class="wrap">' +
      '<span class="top"><span class="eyebrow">' + eyebrow + '</span><span class="chev" aria-hidden="true"></span></span>' +
      '<span class="h2">' + titleHtml(d.titulo || ('Dia ' + num)) + '</span>' +
      (resumo ? '<span class="sum">' + resumo + '</span>' : '') +
      (pills ? '<span class="row">' + pills + '</span>' : '') +
    '</span></button>' +
    '<div class="day-c" id="day-' + esc(num) + '-c"' + (aberto ? '' : ' hidden') + '><div class="wrap">' +
      (acts ? '<ol class="agenda">' + acts + '</ol>' : '') +
      (moves || custosHtml ? '<div class="subgrid">' + (moves ? '<div><div class="sub-h">Deslocamentos</div><ul class="moves">' + moves + '</ul></div>' : '') + custosHtml + '</div>' : '') +
    '</div></div></section>';
}
// "🟢 Leve" → "Ritmo leve"; "🎉 Agenda Livre" fica como está
function energiaTxt(e) {
  const s = noEmoji(txt(e));
  if (!s) return '';
  return /^(leve|moderad|intens|tranquil|pesad|puxad)/i.test(s) ? 'Ritmo ' + s.charAt(0).toLowerCase() + s.slice(1) : s;
}
function setDia(sec, abrir) {
  if (!sec) return;
  const b = sec.querySelector('.day-h'), c = sec.querySelector('.day-c');
  sec.classList.toggle('open', abrir); b.setAttribute('aria-expanded', abrir); c.hidden = !abrir;
  atualizarBotaoTodos();
}
function toggleDay(btn) { const sec = btn.closest('.day'); setDia(sec, !sec.classList.contains('open')); }
function jumpToDay(n) { const sec = document.getElementById('day-' + n); if (!sec) return; setDia(sec, true); sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
function atualizarBotaoTodos() {
  const dias = [...document.querySelectorAll('.day')];
  const btn = document.getElementById('toggle-all');
  if (btn) btn.textContent = dias.length && dias.every(x => x.classList.contains('open')) ? 'Fechar todos os dias' : 'Abrir todos os dias';
}
function renderDias() {
  if (!(D.dias || []).length) return;
  document.getElementById('timeline').innerHTML = D.dias.map(buildDayBlock).join('');
  document.getElementById('roteiro').hidden = false;
  document.querySelectorAll('.day-h').forEach(b => b.addEventListener('click', () => toggleDay(b)));
  document.getElementById('toggle-all').addEventListener('click', () => {
    const dias = [...document.querySelectorAll('.day')];
    const abrir = !dias.every(x => x.classList.contains('open'));
    dias.forEach(x => setDia(x, abrir));
  });
  document.getElementById('bar').addEventListener('click', e => {
    const a = e.target.closest('a[href^="#day-"]'); if (!a) return;
    setDia(document.getElementById(a.getAttribute('href').slice(1)), true);
  });
  const h = (location.hash || '').match(/^#day-(\d+)$/);
  if (h) setTimeout(() => jumpToDay(h[1]), 50);
}
// Destaca na barra a seção ou o dia visível
function updateDayNav() {
  const chips = [...document.querySelectorAll('#bar .chip')];
  const alvos = chips.map(c => document.getElementById(c.getAttribute('href').slice(1))).filter(Boolean);
  if (!('IntersectionObserver' in window) || !alvos.length) return;
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    chips.forEach(c => c.classList.toggle('on', c.getAttribute('href') === '#' + e.target.id));
    const on = chips.find(c => c.classList.contains('on'));
    const bar = document.querySelector('#bar');
    if (on && bar) bar.scrollTo({ left: on.offsetLeft - bar.clientWidth / 2 + on.clientWidth / 2, behavior: 'smooth' });
  }), { rootMargin: '-30% 0px -65% 0px' });
  alvos.forEach(s => io.observe(s));
}

/* ════════════════════════════════════════════════════════════════════
   Pasta de documentos — anexos salvos via proxy (docs-meta.json no
   repositório roteiros). Mesmas rotas e mesmo formato dos modelos
   anteriores: /roteiros/doc-upload (GET/POST/DELETE) e /roteiros/doc-meta.
   ════════════════════════════════════════════════════════════════════ */
const PROXY = 'https://cdv-proxy-production.up.railway.app';
// _docsUploadados: { docId: [ {nome, rawUrl, mediaType, fileId}, ... ] }
let _docsUploadados = {};
let _docsList = [];
const _confirmando = {};   // docId -> índice do arquivo (ou 'card') aguardando confirmação
let _adicionando = false;

async function _metaGet(slug) {
  try {
    const r = await fetch(PROXY + '/roteiros/doc-upload?slug=' + encodeURIComponent(slug) + '&_=' + Date.now());
    const d = await r.json();
    return (d.ok && d.docs) ? d.docs : {};
  } catch (e) { return {}; }
}
async function _metaSave(slug, meta) {
  try {
    await fetch(PROXY + '/roteiros/doc-meta', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, meta })
    });
  } catch (e) {}
}
const FILE_ICO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 7V3.5L18.5 9z"/></svg>';
const UP_ICO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
function _fileListHtml(docId) {
  const files = _docsUploadados[docId] || [];
  return files.map((f, fi) => {
    if (_confirmando[docId] === fi) {
      return '<div class="ask"><span>Remover “' + esc(f.nome) + '”?</span>' +
        '<button type="button" class="yes" data-act="rmfile-ok" data-doc="' + esc(docId) + '" data-i="' + fi + '">Remover</button>' +
        '<button type="button" class="no" data-act="cancel" data-doc="' + esc(docId) + '">Cancelar</button></div>';
    }
    return '<div class="file">' + FILE_ICO + '<a href="' + esc(f.rawUrl) + '" target="_blank" rel="noopener" title="' + esc(f.nome) + '">' + esc(f.nome) + '</a>' +
      '<button type="button" class="x" data-act="rmfile" data-doc="' + esc(docId) + '" data-i="' + fi + '" aria-label="Remover ' + esc(f.nome) + '">Remover</button></div>';
  }).join('');
}
function _badgeHtml(doc) {
  const n = (_docsUploadados[doc.docId] || []).length;
  if (n && (!doc.badge || doc.badgeClass === 'pending')) return '<span class="tag ok">Anexado</span>';
  if (!doc.badge) return '';
  const cls = doc.badgeClass === 'badge-coral' ? 'warn' : doc.badgeClass === 'badge-green' ? 'ok' : 'gold';
  return '<span class="tag ' + cls + '">' + esc(noEmoji(txt(doc.badge))) + '</span>';
}
function _atualizarBadge(docId) {
  const el = document.getElementById('badge-' + docId);
  const doc = _docsList.find(d => d.docId === docId);
  if (el && doc) el.innerHTML = _badgeHtml(doc);
}
function _cardHtml(doc) {
  const id = doc.docId;
  const pedeCard = _confirmando[id] === 'card';
  return '<div class="doc" id="doccard-' + esc(id) + '">' +
    '<div class="h"><b>' + rich(doc.titulo || '') + '</b><span id="badge-' + esc(id) + '">' + _badgeHtml(doc) + '</span></div>' +
    (doc.meta ? '<span class="m">' + rich(doc.meta) + '</span>' : '') +
    '<div class="files" id="upload-status-' + esc(id) + '">' + _fileListHtml(id) + '</div>' +
    '<span class="status" id="uploading-' + esc(id) + '" hidden></span>' +
    (pedeCard
      ? '<div class="ask"><span>Remover o cartão “' + esc(txt(doc.titulo)) + '” e os arquivos dele?</span>' +
        '<button type="button" class="yes" data-act="rmcard-ok" data-doc="' + esc(id) + '">Remover</button>' +
        '<button type="button" class="no" data-act="cancel" data-doc="' + esc(id) + '">Cancelar</button></div>'
      : '<div class="acts"><button type="button" class="up" data-act="upload" data-doc="' + esc(id) + '">' + UP_ICO + 'Anexar arquivos</button>' +
        '<button type="button" class="rmcard" data-act="rmcard" data-doc="' + esc(id) + '">Remover cartão</button></div>') +
    '<input class="doc-input" type="file" multiple id="input-' + esc(id) + '" data-doc="' + esc(id) + '" accept=".pdf,.jpg,.jpeg,.png,.webp,.heic">' +
    '</div>';
}
function _redrawDocs() {
  document.getElementById('docs-grid').innerHTML = _docsList.map(_cardHtml).join('');
  document.getElementById('docs-add').innerHTML = _adicionando
    ? '<form class="addform" id="addform"><label for="novo-doc">Nome do documento</label><input id="novo-doc" type="text" maxlength="80" placeholder="Ex.: Ingresso do museu" autocomplete="off">' +
      '<button type="submit" class="yes">Adicionar</button><button type="button" class="no" data-act="add-cancel">Cancelar</button></form>'
    : '<button type="button" class="addbtn" data-act="add">+ Adicionar documento</button>';
  if (_adicionando) { const i = document.getElementById('novo-doc'); if (i) i.focus(); }
}
function _redrawCard(docId) {
  const el = document.getElementById('doccard-' + docId);
  const doc = _docsList.find(d => d.docId === docId);
  if (el && doc) el.outerHTML = _cardHtml(doc); else _redrawDocs();
}
async function carregarDocsUpload(slug) {
  const meta = await _metaGet(slug);
  const deletedCards = new Set(meta._deletedCards || []);
  const extraCards = meta._extraCards || [];
  _docsList = (_docsList.length ? _docsList : (D.documentos || []).map((d, i) => ({ ...d, docId: d.docId || ('doc_' + i) })))
    .filter(d => !deletedCards.has(d.docId));
  const existingIds = new Set(_docsList.map(d => d.docId));
  for (const ex of extraCards) if (!existingIds.has(ex.docId)) _docsList.push(ex);
  _docsUploadados = {};
  Object.entries(meta).forEach(([fileName, info]) => {
    if (fileName.startsWith('_')) return;
    const fileId = fileName.replace(/\.[^.]+$/, '');
    const docId = fileId.replace(/_\d+$/, '');
    const rawUrl = 'https://raw.githubusercontent.com/davileles/roteiros/main/' + slug + '/docs/' + fileName;
    if (!_docsUploadados[docId]) _docsUploadados[docId] = [];
    if (!_docsUploadados[docId].some(x => x.fileId === fileId))
      _docsUploadados[docId].push({ nome: (info && info.nome) || fileName, rawUrl, mediaType: (info && info.mediaType) || '', fileId });
  });
  _redrawDocs();
}
function renderDocCards(documentos) {
  _docsList = documentos.map((doc, i) => ({ ...doc, docId: doc.docId || ('doc_' + i) }));
  _redrawDocs();
  if (D._slug) carregarDocsUpload(D._slug);
}
function triggerUpload(docId) { const el = document.getElementById('input-' + docId); if (el) el.click(); }
function _status(docId, msg, erro) {
  const el = document.getElementById('uploading-' + docId); if (!el) return;
  el.textContent = msg || ''; el.hidden = !msg; el.classList.toggle('err', !!erro);
}
async function handleDocUpload(docId, nomeDoc, input) {
  // multi-arquivo: envia em série (evita conflito de SHA no docs-meta.json)
  const selecionados = Array.from(input.files || []);
  if (!selecionados.length) return;
  const slug = D._slug;
  if (!slug) { _status(docId, 'Este roteiro ainda não foi publicado, então não dá para anexar arquivos.', true); input.value = ''; return; }
  const maxMB = 8;
  const grandes = selecionados.filter(f => f.size > maxMB * 1024 * 1024);
  const fila = selecionados.filter(f => f.size <= maxMB * 1024 * 1024);
  const erros = grandes.map(f => f.name + ' passa de ' + maxMB + ' MB e não foi enviado.');
  for (let i = 0; i < fila.length; i++) {
    const file = fila[i];
    _status(docId, fila.length > 1 ? 'Enviando ' + (i + 1) + ' de ' + fila.length + '…' : 'Enviando…');
    const ext = file.name.split('.').pop().toLowerCase();
    const fileId = docId + '_' + (Date.now() + i);
    const fileName = fileId + '.' + ext;
    try {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
      const resp = await fetch(PROXY + '/roteiros/doc-upload', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug, docId: fileName, nome: file.name, tipo: ext, base64: b64, mediaType: file.type })
      });
      const data = await resp.json();
      if (!data.ok) throw new Error(data.erro || 'erro no envio');
      if (!_docsUploadados[docId]) _docsUploadados[docId] = [];
      _docsUploadados[docId].push({ nome: file.name, rawUrl: data.rawUrl, mediaType: file.type, fileId });
      const st = document.getElementById('upload-status-' + docId); if (st) st.innerHTML = _fileListHtml(docId);
      _atualizarBadge(docId);
    } catch (e) {
      erros.push(file.name + ' não foi enviado (' + (e && e.message ? e.message : 'falha de conexão') + '). Tente de novo.');
    }
  }
  _status(docId, erros.join('\n'), erros.length > 0);
  input.value = '';
}
async function removerDocArquivo(docId, fi, confirmado) {
  const files = _docsUploadados[docId] || [];
  const f = files[fi];
  if (!f) return;
  if (!confirmado) { _confirmando[docId] = fi; document.getElementById('upload-status-' + docId).innerHTML = _fileListHtml(docId); return; }
  delete _confirmando[docId];
  _docsUploadados[docId].splice(fi, 1);
  document.getElementById('upload-status-' + docId).innerHTML = _fileListHtml(docId);
  _atualizarBadge(docId);
  const slug = D._slug; if (!slug) return;
  const ext = String(f.rawUrl).split('.').pop().toLowerCase();
  const fileName = f.fileId + '.' + ext;
  try {
    await fetch(PROXY + '/roteiros/doc-upload', {
      method: 'DELETE', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, docId: fileName })
    });
  } catch (e) {}
}
async function removerDocCard(docId, confirmado) {
  if (!confirmado) { _confirmando[docId] = 'card'; _redrawCard(docId); return; }
  delete _confirmando[docId];
  const slug = D._slug;
  _docsList = _docsList.filter(d => d.docId !== docId);
  delete _docsUploadados[docId];
  _redrawDocs();
  if (!slug) return;
  const meta = await _metaGet(slug);
  const deleted = new Set(meta._deletedCards || []);
  deleted.add(docId);
  meta._deletedCards = [...deleted];
  meta._extraCards = (meta._extraCards || []).filter(e => e.docId !== docId);
  await _metaSave(slug, meta);
}
async function adicionarDocCard(titulo) {
  if (!titulo) { _adicionando = true; _redrawDocs(); return; }
  _adicionando = false;
  const slug = D._slug;
  const novoCard = { docId: 'doc_extra_' + Date.now(), icon: '📄', titulo, meta: 'Adicionado manualmente', badge: '' };
  _docsList.push(novoCard);
  _redrawDocs();
  if (!slug) return;
  const meta = await _metaGet(slug);
  meta._extraCards = [...(meta._extraCards || []), novoCard];
  await _metaSave(slug, meta);
}
// compat com os modelos anteriores
function mostrarDocAnexado(docId) {}
async function removerDoc(docId) { await removerDocArquivo(docId, 0, true); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const doc = b.getAttribute('data-doc'), i = parseInt(b.getAttribute('data-i'), 10);
  switch (b.getAttribute('data-act')) {
    case 'upload': triggerUpload(doc); break;
    case 'rmfile': removerDocArquivo(doc, i); break;
    case 'rmfile-ok': removerDocArquivo(doc, i, true); break;
    case 'rmcard': removerDocCard(doc); break;
    case 'rmcard-ok': removerDocCard(doc, true); break;
    case 'cancel': delete _confirmando[doc]; _redrawCard(doc); break;
    case 'add': adicionarDocCard(); break;
    case 'add-cancel': _adicionando = false; _redrawDocs(); break;
  }
});
document.addEventListener('change', e => {
  const inp = e.target.closest('.doc-input'); if (!inp) return;
  const docId = inp.getAttribute('data-doc');
  const doc = _docsList.find(d => d.docId === docId);
  handleDocUpload(docId, doc ? txt(doc.titulo) : 'doc', inp);
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'addform') return;
  e.preventDefault();
  const v = (document.getElementById('novo-doc').value || '').trim();
  if (v) adicionarDocCard(v);
});

/* ── Montagem da página ──────────────────────────────────────────────── */
function renderRoteiro() {
  if (typeof ROTEIRO_DATA === 'undefined') {
    document.body.innerHTML = '<p style="padding:40px 20px;text-align:center;font-family:sans-serif;color:#55524C">Nenhum roteiro carregado.</p>';
    return;
  }
  D = ROTEIRO_DATA || {};
  const tituloPg = noEmoji(txt(D.titulo || 'Roteiro')) + ' · ' + marcaTexto();
  document.title = tituloPg;
  const pt = document.getElementById('page-title'); if (pt) pt.textContent = tituloPg;
  renderCapa();
  renderBarra();
  renderVisao();
  renderVoos();
  renderHospedagem();
  renderServicos();
  renderDias();
  if ((D.documentos || []).length) {
    document.getElementById('documentos').hidden = false;
    renderDocCards(D.documentos);
  }
  document.getElementById('footer-note').textContent = noEmoji(txt(D.footerNote || D.titulo || ''));
  updateDayNav();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderRoteiro);
else renderRoteiro();
