"Almoço", "descricao": "Parada para comer e escapar do sol do meio-dia, impiedoso a 3° do Equador. Xica da Silva ~R$ 110 por pessoa.", "lat": -3.8672, "lng": -32.4247}, {"horario": "14:00 – 16:45", "nome": "Praia do Leão", "descricao": "A praia mais selvagem e vazia da ilha, batizada pela pedra ao largo com forma de leão-marinho deitado. Principal área de desova de tartarugas do arquipélago.", "lat": -3.8700825, "lng": -32.4371573, "dica": "Chegando às 14h vocês pegam a maré secando até 17:22, e as piscinas naturais nas pontas vão abrindo ao longo da tarde. Zero infraestrutura: sem quiosque, sem sombra, sem água. Levem tudo."}, {"horario": "17:15 – 18:20", "nome": "Pôr do sol no Mirante do Boldró", "descricao": "Segundo pôr do sol no Boldró, agora sem pressa depois de um dia inteiro de praia.", "lat": -3.8449028, "lng": -32.4268133, "dica": "O Forte dos Remédios não abre às segundas — por isso ele foi movido para amanhã. Sol se põe às 18:08."}], "deslocamentos": ["Maré: baixa 05:01 · ALTA 11:13 (ideal p/ Sueste) · baixa 17:22 · pôr do sol 18:08", "DIA DE BUGGY — retirada na véspera à noite", "Pousada → Sueste: 10 min pela BR-363", "Sueste → Praia do Leão: 10 min, acesso mais rústico", "Leão → Mirante do Boldró: 15 min", "Custo estimado do dia: R$ 635 por pessoa"]}, {"num": 4, "data": "2026-12-01", "titulo": "O dia do casal", "energia": "Leve", "resumo": "Ensaio fotográfico subaquático pela manhã, Cacimba do Padre à tarde e pôr do sol no Forte dos Remédios.", "atividades": [{"horario": "09:00 – 11:00", "nome": "Ensaio fotográfico subaquático", "descricao": "O casal mergulhando livre enquanto o fotógrafo trabalha embaixo d'água. Costuma ser feito na Praia do Porto ou no Sancho, com cerca de 1h de água mais orientação.", "lat": -3.8344673, "lng": -32.4013927, "dica": "Manhã é sempre melhor: mar mais calmo e luz no ângulo certo. Combine antes quantidade de fotos, prazo de edição e se há vídeo. Roupa de banho lisa e de cor sólida — estampa polui a foto embaixo d'água."}, {"horario": "11:30 – 13:00", "nome": "Almoço no Porto", "descricao": "Se o ensaio for na Praia do Porto, almoçar ali economiza um deslocamento inteiro.", "lat": -3.8344673, "lng": -32.4013927}, {"horario": "14:00 – 17:00", "nome": "Praia da Cacimba do Padre", "descricao": "A praia mais extensa da ilha, faixa de areia larga e os Dois Irmãos plantados na ponta. É onde acontecem as competições de surf quando a ondulação entra — e final de novembro é justamente a virada.", "lat": -3.8498785, "lng": -32.4387858, "dica": "Com a maré secando até 18:04, a faixa de areia só aumenta ao longo da tarde. Fiquem no trecho perto dos Dois Irmãos."}, {"horario": "17:15 – 18:30", "nome": "Forte dos Remédios ao pôr do sol", "descricao": "Ruínas de uma fortificação portuguesa do século XVIII. Aqui saem as camadas históricas da ilha: Noronha foi presídio político — recebeu presos no Estado Novo e na ditadura militar — e depois base militar americana na Segunda Guerra.", "lat": -3.8382591, "lng": -32.4102444, "dica": "Abre de terça a domingo, a partir das 14h — confirme na chegada. Sol se põe às 18:08 e o jantar fica logo abaixo, na Vila, sem precisar de transporte."}], "deslocamentos": ["Maré: baixa 05:43 · alta 11:56 · baixa 18:04 · pôr do sol 18:08", "Sem buggy — dia curto em quilometragem, táxi resolve", "Pousada → Porto → Cacimba → Forte: táxis · ~R$ 140 no total", "Custo estimado do dia: R$ 1.205 por pessoa (inclui o ensaio)"]}, {"num": 5, "data": "2026-12-02", "titulo": "O dia de não fazer nada", "energia": "Leve", "resumo": "Manhã de café e compras na Vila do Trinta, tarde inteira na Conceição e o jantar mais especial da viagem.", "atividades": [{"horario": "10:00 – 12:30", "nome": "Manhã de café e Vila do Trinta", "descricao": "Manhã lenta: café da manhã sem pressa, volta pelas lojinhas da Vila do Trinta e pelas cafeterias da ilha.", "lat": -3.8461265, "lng": -32.4082594, "dica": "Compre as lembranças hoje, não no último dia — na partida vocês vão estar de olho no relógio."}, {"horario": "13:00 – 18:30", "nome": "Praia da Conceição — tarde inteira", "descricao": "Cadeira, guarda-sol, água de coco e mais nada na agenda. É o dia que traduz o pedido de aproveitar o lugar em vez de percorrê-lo.", "lat": -3.8418634, "lng": -32.4180075, "dica": "A maré seca até 18:47, então a faixa de areia cresce à tarde. Ficando até o fim, vocês pegam o pôr do sol das 18:09 da própria areia, sem se deslocar."}, {"horario": "20:00 – 22:30", "nome": "Jantar especial", "descricao": "O jantar mais caprichado da viagem. Quarta-feira é tradicionalmente uma das noites do Festival Gastronômico do Zé Maria — reserva obrigatória, e os dias de operação precisam ser confirmados.", "lat": -3.8382591, "lng": -32.4102444, "dica": "Alternativas: Cacimba Bistrô (~R$ 200) para a melhor experiência de vinho da ilha, ou Corveta (~R$ 180) para algo mais intimista."}], "deslocamentos": ["Maré: baixa 06:25 · alta 12:38 · baixa 18:47 · pôr do sol 18:09", "Sem buggy — o dia é praticamente parado", "Táxis do dia: ~R$ 95 por pessoa", "Custo estimado do dia: R$ 605 por pessoa"]}, {"num": 6, "data": "2026-12-03", "titulo": "O cartão-postal do Brasil", "energia": "Intenso", "resumo": "Baía dos Porcos na maré mais seca da manhã e descida pela fenda até a Baía do Sancho. O dia mais fotografado da viagem.", "atividades": [{"horario": "08:00 – 09:45", "nome": "Baía dos Porcos", "descricao": "Pequena, sem infraestrutura nenhuma, e provavelmente a vista mais icônica do Brasil: piscinas naturais entre as rochas com o Morro Dois Irmãos ao fundo. Acesso a pé pela extremidade da Cacimba do Padre, atravessando um costão de pedra.", "lat": -3.8516165, "lng": -32.4413272, "dica": "A ORDEM AQUI É INEGOCIÁVEL. Baixamar às 07:09 (0,42 m). Às 08:00 o costão está seguro, mas a maré sobe rápido rumo à alta das 13:23 — atravessem primeiro e voltem até as 09:45. Calçado com aderência é obrigatório; chinelo liso não serve."}, {"horario": "10:15 – 13:00", "nome": "Baía do Sancho", "descricao": "Enseada fechada
