rlaken West (~15 min), coberto pelo Swiss Travel Pass.","dica":""},{"horario":"12h00","nome":"Almoço em Interlaken","descricao":"","dica":""},{"horario":"13h30","nome":"Trem Interlaken → Genebra (~2h50)","descricao":"Baldeação em Berna. O trecho entre Berna e Lausanne corre pelo planalto suíço e o final margeia o Lago Léman com os vinhedos de Lavaux em terraços — Patrimônio UNESCO — de um lado e a água do outro.","dica":"Sentar do lado esquerdo na direção de viagem para a vista do lago na aproximação de Genebra. Coberto pelo Swiss Travel Pass."},{"horario":"16h30","nome":"Chegada a Genève-Cornavin e check-in no Hôtel Kipling","descricao":"O hotel fica na Rue de la Navigation 27, a ~6 min a pé da estação pela Rue de Lausanne — não vale táxi. Boutique pequeno da Manotel, tranquilo, com café da manhã bem servido.","dica":"Pedir o Geneva Transport Card no balcão: é gratuito para hóspedes e cobre bondes, ônibus e as Mouettes do lago durante toda a estadia."},{"horario":"17h30 – 19h30","nome":"Primeiro contato — a orla do Léman","descricao":"Chegada sem pressa e um passeio curto pela beira do lago. Jet d’Eau — o jato de 140m que virou símbolo da cidade, visível de quase toda a orla. Jardin Anglais e a Horloge Fleurie, o relógio de flores. Travessia da Pont du Mont-Blanc ao pôr do sol, com o lago de um lado e a silhueta da Vieille Ville subindo do outro.","dica":"O Quai du Mont-Blanc fica a 5 min a pé do hotel — dá para sair andando sem plano nenhum. A cidade velha, a Catedral de São Pedro e o Muro dos Reformadores ficam para amanhã, com o dia inteiro disponível."},{"horario":"20h00","nome":"Jantar em Genebra — primeira das duas noites","descricao":"","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Trem Interlaken → Genebra</span><span>coberto pelo Swiss Travel Pass</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço em Interlaken</span><span>€40</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Compras chocolate/souvenirs</span><span>€64</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Transfer estação → hotel</span><span>a pé, 6 min</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar em Genebra</span><span>€60</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€164</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Café du Soleil</strong> — Petit-Saconnex | A fondue mais tradicional de Genebra, ambiente de bistrô de bairro | ~€35-45 por pessoa</div><div style='margin-bottom:6px'><strong>Brasserie des Halles de l’Île</strong> — Ilha do Ródano | Brasserie contemporânea sobre o rio, ambiente descontraído | ~€45-60 por pessoa</div><div style='margin-bottom:6px'><strong>Le Vallon</strong> — Champel | Cozinha suíça de bairro, longe do circuito turístico | ~€40-55 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Trens suíços e horários: sbb.ch · Swiss Travel Pass: swisstravelsystem.com · Turismo Genebra: geneve.com","dica":""}],"deslocamentos":["Beatenberg → Interlaken West: ônibus PostAuto 101, ~15 min, Swiss Travel Pass","Interlaken Ost → Genève-Cornavin: trem, ~2h50 com baldeação em Berna, Swiss Travel Pass","Genève-Cornavin → Hôtel Kipling: a pé, ~6 min pela Rue de Lausanne","Hotel → Quai du Mont-Blanc e Jet d’Eau: a pé, ~5 min"]},{"num":20,"data":"2026-09-05","titulo":"Genebra: na Cidade de Calvino","resumo":"Genebra é conhecida como a “Roma protestante” — foi daqui que a Reforma se espalhou pela Europa e chegou à Escócia, à França e, muito depois, ao Brasil. Um dia inteiro no lugar exato onde essa história aconteceu: a catedral em que João Calvino pregou por quase trinta anos, o auditório onde John Knox ensinou os refugiados que levariam o presbiterianismo para casa, e o Muro dos Reformadores. Tudo a pé, na Vieille Ville, num raio de dez minutos. À tarde, o Léman fecha o dia.","energia":"🟢 Leve-Moderado","atividades":[{"horario":"08h30","nome":"Café da manhã no hotel","descricao":"","dica":""},{"horario":"09h30 – 10h30","nome":"Auditoire de Calvin — o auditório da Reforma","descricao":"Capela gótica do século XV, colada à catedral, onde Calvino dava suas aulas de teologia e onde as congregações de refugiados protestantes — ingleses, escoceses, italianos e holandeses — cultuavam em suas próprias línguas. Foi deste púlpito que John Knox pregou entre 1556 e 1559, antes de voltar à Escócia e fundar a igreja que daria origem ao presbiterianismo. O interior é despojado ao extremo, exatamente como a teologia reformada pedia. Entrada gratuita.","dica":"Hoje o Auditoire pertence à Igreja da Escócia e ainda recebe cultos em inglês e em holandês. Os horários de visita são curtos e variam — confirmar na véspera em saint-pierre.epg.ch ou perguntar na recepção da catedral, que fica a trinta passos."},{"horario":"10h15 – 12h00","nome":"Catedral de São Pedro e a cadeira de Calvino","descricao":"A catedral é protestante desde 1535 e continua sendo o principal templo reformado da cidade. Ao adotar a Reforma, os genebrinos retiraram altares, imagens e ornamentos e cobriram as pinturas — o interior branco e nu que se vê hoje é uma declaração teológica, não uma falta de recursos. A cadeira de madeira usada por Calvino continua ali. Vale subir a torre norte: 157 degraus até uma vista de 360° sobre a cidade, o Léman e, em dia limpo, o Mont Blanc. No caminho ficam os sinos, entre eles La Clémence, de 1407, com seis toneladas.","dica":"ATENÇÃO — confirmar o horário de sábado em cathedrale-geneve.ch antes de sair: as fontes divergem entre abertura às 9h30 e às 12h. Se for 12h, inverter o dia: Auditoire, MIR e Parc des Bastions de manhã, catedral e torres à tarde. O acesso às torres fecha 30 min antes do templo."},{"horario":"12h00 – 12h45","nome":"Sítio arqueológico sob a catedral","descricao":"Um dos sítios arqueológicos mais importantes ao norte dos Alpes, escavado sob o piso da catedral: vestígios cristãos do século IV, batistérios, mosaicos e a cripta episcopal. Mostra que a colina já era um centro de fé mil anos antes de Calvino chegar. Incluído no bilhete combinado.","dica":"Percurso subterrâneo bem sinalizado, todo plano, com passarelas. ~45 min é suficiente."},{"horario":"13h00","nome":"Almoço na Place du Bourg-de-Four","descricao":"A praça mais antiga de Genebra, a dois minutos da catedral — antiga feira romana, depois ponto de encontro dos refugiados huguenotes que chegavam à cidade. Terraços, fonte central e sombra.","dica":""},{"horario":"14h30 – 16h15","nome":"MIR — Museu Internacional da Reforma","descricao":"Instalado na Maison Mallet, construída em 1723 sobre o antigo claustro da catedral — o lugar exato onde, em 21 de maio de 1536, a assembleia dos cidadãos votou a adesão de Genebra à Reforma. É o único museu do mundo inteiramente dedicado à história da Reforma e do protestantismo: bíblias, manuscritos, gravuras e a trajetória que vai de Lutero e Calvino aos mais de oitocentos milhões de protestantes de hoje. Audioguias gratuitos em quatorze idiomas.","dica":"Aberto de terça a domingo, 10h às 17h. O Swiss Travel Pass vale como Swiss Museum Pass e a entrada do MIR está incluída — apresentar o passe na bilheteria. Para a torre e o sítio arqueológico, o bilhete combinado do Espace Saint-Pierre segue valendo a pena."},{"horario":"16h30 – 18h00","nome":"Parc des Bastions — o Muro dos Reformadores","descricao":"Cem metros de muralha de pedra clara erguidos em 1909, nos 400 anos do nascimento de Calvino, contra as antigas fortificações da cidade. No centro, quatro estátuas de cinco metros: Guillaume Farel, que trouxe a Reforma a Genebra; João Calvino; Théodore de Bèze, seu sucessor; e John Knox. Ao redor, baixos-relevos com episódios da história protestante na Europa e nas Américas, e blocos laterais com os nomes de Lutero e Zwínglio. Entrada gratuita, aberto sempre.","dica":"No mesmo parque ficam a Promenade de la Treille, com o banco de madeira mais longo do mundo (126m), e o Collège Calvin, fundado por Calvino em 1559 junto com a Academia de Genebra — a instituição que formou pastores enviados a toda a Europa e que deu origem à universidade da cidade. A luz do fim de tarde bate de frente no muro: é o melhor horário para as fotos."},{"horario":"18h15 – 19h30","nome":"Fim de tarde à beira do Léman","descricao":"Descida do parque até a orla, ~10 min a pé. Se quiserem ver a cidade da água, as Mouettes Genevoises — pequenos barcos amarelos que cruzam a baía — custam quase nada e levam de uma margem à outra em poucos minutos, com o Jet d’Eau de perto.","dica":"O Geneva Transport Card, entregue de graça pelo hotel no check-in a todo hóspede, cobre ônibus, bondes e as Mouettes durante toda a estadia. Vale pedir na recepção."},{"horario":"20h00","nome":"Jantar na Vieille Ville","descricao":"","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Espace Saint-Pierre (catedral + torres + sítio + MIR)</span><span>€19</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Auditoire de Calvin</span><span>gratuito</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Muro dos Reformadores</span><span>gratuito</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço Bourg-de-Four</span><span>€40</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Mouettes Genevoises</span><span>Geneva Transport Card</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Café/extras</span><span>€15</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar na Vieille Ville</span><span>€65</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€139</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Les Armures</strong> — Vieille Ville, ao lado da catedral | Clássico absoluto da cidade velha — fondue, raclette e cozinha suíça | ~€55-70 por pessoa</div><div style='margin-bottom:6px'><strong>Chez Ma Cousine</strong> — Place du Bourg-de-Four | Instituição local, frango assado e batatas, simples e barato | ~€20-25 por pessoa</div><div style='margin-bottom:6px'><strong>Café du Centre</strong> — Place du Molard | Brasserie histórica de 1871, boa para almoço com terraço | ~€40-55 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Museu Internacional da Reforma: musee-reforme.ch · Catedral de São Pedro (horários e torres): cathedrale-geneve.ch · Paroisse Saint-Pierre e Auditoire: saint-pierre.epg.ch · Turismo Genebra: geneve.com","dica":""}],"deslocamentos":["Hôtel Kipling → Cour de Saint-Pierre: a pé, ~22 min pela Rue du Mont-Blanc, Pont du Mont-Blanc e a subida da cidade velha — o trajeto bonito, com o Jet d’Eau ao lado. Vale fazer a pé na ida.","Alternativa: bonde 15 ou ônibus 1 até Bel-Air/Molard + ~7 min de subida (~15 min no total), coberto pelo Geneva Transport Card","Catedral → MIR: 30 segundos a pé — ficam na mesma Cour de Saint-Pierre","Vieille Ville → Parc des Bastions: a pé, ~5 min","Parc des Bastions → orla do Léman: a pé, ~10 min","Volta para o hotel à noite: bonde/ônibus com o Transport Card — a subida cansa no fim do dia"]},{"num":21,"data":"2026-09-06","titulo":"Culto em Saint-Pierre → Paris: TGV Lyria","resumo":"A viagem se despede da Suíça de um jeito difícil de planejar melhor: um domingo em Genebra, com o culto das 10h na Catedral de São Pedro. Depois, almoço sem pressa à beira do Léman e o TGV Lyria direto até a Gare de Lyon. A última noite é no Hyatt House do aeroporto Charles de Gaulle — escolha logística para o voo das 10h20 de amanhã, que deixa a noite tranquila e o embarque sem risco.","energia":"🟢 Leve","atividades":[{"horario":"08h00","nome":"Café da manhã e check-out","descricao":"Check-out no Kipling e malas deixadas na recepção — o hotel guarda sem custo. A cidade velha é subida e não se carrega bagagem até lá.","dica":""},{"horario":"09h30","nome":"Subida até a Cour de Saint-Pierre","descricao":"Do hotel são ~22 min a pé ou ~15 min de bonde até Bel-Air e a subida final. Os sinos da catedral — L’Éveil, L’Espérance, La Collavine, La Bellerive e L’Accord — tocam na manhã de domingo anunciando o culto; dá para ouvir de longe.","dica":"Domingo o transporte roda com frequência menor. Sair 9h30 dá folga confortável para as 10h."},{"horario":"10h00 – 11h00","nome":"Culto dominical na Catedral de São Pedro","descricao":"A paróquia protestante de Saint-Pierre celebra culto todos os domingos, das 10h às 11h, aberto a qualquer pessoa. É a mesma catedral onde Calvino pregou de 1536 a 1564, e o culto segue a liturgia reformada: leitura, pregação, oração e cantos, sem imagens e sem ornamentos. Para Oswaldo e Mônica, é a chance de participar de um culto no lugar onde a própria tradição em que foram criados começou.","dica":"O culto é em francês, mas a estrutura é imediatamente reconhecível e há folhetos com a ordem do serviço. Chegar por volta das 9h45 garante bom lugar. Confirmar o horário na semana anterior em saint-pierre.epg.ch — em setembro pode haver alteração pelo Jeûne genevois."},{"horario":"11h15 – 12h15","nome":"Última caminhada pela orla","descricao":"Descida da cidade velha até o Quai du Mont-Blanc, com o Jet d’Eau ao lado e, em dia limpo, o Mont Blanc recortado no horizonte. Encerramento tranquilo dos onze dias de Suíça.","dica":"Domingo o comércio fecha em Genebra — compras de última hora só na estação Cornavin, que abre normalmente."},{"horario":"12h30","nome":"Almoço em Genebra","descricao":"","dica":""},{"horario":"13h30","nome":"Passar no hotel, pegar as malas e seguir para Cornavin","descricao":"O Kipling fica no caminho de volta da orla para a estação: pegar a bagagem na recepção e caminhar mais 6 min até Cornavin. Sem guarda-volumes, sem desvio.","dica":""},{"horario":"~14h40","nome":"TGV Lyria Genebra → Paris Gare de Lyon (~3h10)","descricao":"Trem direto, sem baldeação. Sai de Genebra, atravessa o Jura francês, Bourg-en-Bresse e a Borgonha até Paris. São cerca de oito partidas diárias, a cada duas horas — o culto da manhã encaixa confortavelmente com uma saída no início da tarde.","dica":"Horário exato a confirmar em lyria.com ou sncf-connect.com quando as grades de setembro de 2026 abrirem (reservas abrem ~4 meses antes). 1ª classe ~€100-150 por pessoa, com serviço de bordo incluído nos horários principais."},{"horario":"~17h50","nome":"Chegada Paris Gare de Lyon","descricao":"","dica":""},{"horario":"18h15","nome":"Gare de Lyon → Hyatt House Paris CDG","descricao":"O hotel fica em Roissy-en-France, 241 Rue de la Belle Étoile, ao lado do aeroporto — não no centro de Paris. Duas opções: táxi/Uber direto, ~45 min e € 65–80 com bagagem; ou RER D até Gare du Nord + RER B até Aéroport CDG 2 TGV (~50 min, € 12/pessoa) e de lá a van do hotel.","dica":"A van do Hyatt House sai da Plataforma 2, Nível 5 da estação RER/TGV do Terminal 2, a cada 30 min, € 7 por pessoa por trecho — precisa ser reservada em station.link. Com bagagem de 22 dias e domingo à noite (trânsito leve), o táxi direto compensa."},{"horario":"19h00","nome":"Check-in no Hyatt House Paris Charles de Gaulle","descricao":"Confirmação 72077244156342. Quartos amplos com kitchenette, piscina coberta, academia 24h e café da manhã buffet incluso. É um hotel de aeroporto, não de passeio — e é exatamente isso que se quer na véspera de um voo às 10h20.","dica":"Se ainda sobrar disposição para uma última noite parisiense, o RER B leva da estação do aeroporto até Gare du Nord em ~35 min e roda até por volta da meia-noite. Mas depois de 22 dias, jantar no hotel e dormir cedo é a escolha mais sensata."},{"horario":"20h00","nome":"Jantar de encerramento","descricao":"Última refeição de 22 dias de viagem. O restaurante do próprio Hyatt House resolve bem, e o Aeroville — shopping a 5 min de carro — tem opções melhores para quem quiser algo mais elaborado.","dica":"Domingo à noite boa parte de Paris fecha, então mesmo indo ao centro a escolha seria limitada às brasseries clássicas. Perto do hotel, o problema não existe."},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>TGV Lyria Genebra → Paris (1ª classe)</span><span>€125</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Culto na Catedral</span><span>gratuito</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço em Genebra</span><span>€40</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Transfer Gare de Lyon → Hyatt House CDG (casal)</span><span>€38</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar final</span><span>€80</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€260</span></div>","dica":""},{"horario":"🍽️","nome":"Onde jantar perto do hotel","descricao":"<div style='margin-bottom:6px'><strong>Restaurante do Hyatt House</strong> — no próprio hotel | Sem deslocamento nenhum na véspera do voo | ~€35-50 por pessoa</div><div style='margin-bottom:6px'><strong>Aeroville</strong> — 5 min de carro | Praça de alimentação e restaurantes variados, aberto domingo | ~€25-40 por pessoa</div><div style='margin-bottom:6px'><strong>Brasserie Lipp</strong> — Saint-Germain, Paris | Só vale se decidirem ir ao centro: clássico de 1880, abre todos os dias | ~€60-80 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Culto na Catedral de São Pedro: saint-pierre.epg.ch · TGV Lyria: lyria.com · Bilhetes: sncf-connect.com · Van do hotel (reserva obrigatória): station.link · Hyatt House CDG: +33 1 70 03 12 34","dica":""}],"deslocamentos":["Hôtel Kipling → Cathédrale Saint-Pierre: a pé ~22 min, ou bonde/ônibus até Bel-Air + subida (~15 min)","Vieille Ville → orla e Hôtel Kipling: a pé pela Pont du Mont-Blanc, ~20 min","Hôtel Kipling → Genève-Cornavin: a pé, ~6 min","Genebra → Paris: TGV Lyria direto, ~3h10, ~€100-150/pessoa (1ª classe)","Gare de Lyon → Hyatt House Paris CDG (Roissy-en-France): táxi ~45 min, € 65–80; ou RER D + RER B, ~50 min, €12/pessoa"]},{"num":22,"data":"2026-09-07","titulo":"Paris → Salvador → Belo Horizonte","resumo":"22 dias chegam ao fim. Do hotel ao terminal são 15 minutos de van — a grande vantagem de ter dormido no aeroporto. Executiva da Air France até Salvador e, à noite, a conexão da Gol até Confins. Atenção: são bilhetes separados, então em Salvador é preciso desembarcar, passar pela imigração e alfândega, pegar as malas e fazer novo check-in.","energia":"✈️ Dia de Viagem","atividades":[{"horario":"⚠️","nome":"Atenção — dois bilhetes separados","descricao":"CDG→SSA (Air France, PNR CM4JAX) e SSA→CNF (Gol, PNR YICNWR) são emissões independentes, em programas diferentes. A bagagem NÃO segue direto até Confins: em Salvador é obrigatório retirar as malas na esteira, passar pela Receita Federal e despachar novamente no balcão da Gol.","dica":"São 4h20 de conexão em Salvador (15h25 → 19h45) — tempo confortável, mas nada de sair do aeroporto."},{"horario":"06h30","nome":"Café da manhã e check-out","descricao":"Café buffet incluso no Hyatt House. Check-out tranquilo — o terminal está a 15 min.","dica":""},{"horario":"07h15","nome":"Van do hotel → Terminal 2","descricao":"A van deixa na estação RER/TGV do Terminal 2, Nível 5, Plataforma 2, a cada 30 min. € 7 por pessoa. Do ponto de desembarque até os balcões da Air France no 2E é uma caminhada curta e coberta.","dica":"Reservar a van em station.link na véspera, no check-in. Táxi/Uber é alternativa, ~15 min e ~€25."},{"horario":"07h30","nome":"Check-in Air France — Executiva","descricao":"Fila exclusiva Business e acesso ao lounge Air France no 2E. Três horas de antecedência para voo intercontinental.","dica":"O lounge do 2E tem chuveiro e boa mesa de café — vale usar em vez do café do hotel se quiserem sair mais cedo."},{"horario":"10h20","nome":"Voo AF 476 · Paris CDG → Salvador (Executiva)","descricao":"Air France, classe executiva, PNR CM4JAX. Chegada prevista às 15h25.","dica":""},{"horario":"15h25","nome":"Chegada a Salvador 🇧🇷","descricao":"Imigração, restituição de bagagem e Receita Federal. Depois, deslocamento até o balcão da Gol para o despacho do trecho doméstico.","dica":"Calcular 1h30 entre pousar e estar com as malas despachadas de novo. Ainda sobram ~2h30 de folga."},{"horario":"19h45","nome":"Voo G3 1948 · Salvador → Belo Horizonte","descricao":"Gol, econômica, PNR YICNWR. Chegada em Confins às 21h30.","dica":""},{"horario":"21h30","nome":"Chegada em Confins — fim da viagem","descricao":"Bem-vindos de volta! 22 dias entre Porto, Roma, Toscana, Florença, Bérgamo, Lago di Como, Alpes suíços, Genebra e Paris.","dica":""},{"horario":"🗺️","nome":"Resumo da Viagem Completa","descricao":"🇵🇹 Porto — 1 noite · Ribeira, Douro, Caves de Vinho do Porto<br>🇮🇹 Roma — 3 noites · Coliseu, Pantheon, Trastevere<br>🇮🇹 Siena e Val d'Orcia — 3 noites · Pienza, Montalcino, Brunello, strade bianche<br>🇮🇹 Florença — 3 noites · Casamento · Chianti · Ponte Vecchio<br>🇮🇹 Bérgamo e Menaggio — 3 noites · Città Alta, Bellagio, Varenna, triângulo de balsas<br>🇨🇭 Beatenberg / Interlaken — 6 noites · Lauterbrunnen, Grindelwald, Jungfraujoch, Brienz, Berna, Harder Kulm<br>🇨🇭 Genebra — 2 noites · Catedral de São Pedro, Auditoire de Calvin, Museu da Reforma, Muro dos Reformadores<br>🇫🇷 Paris CDG — 1 noite · Escala de conexão","dica":""}],"deslocamentos":["Hyatt House CDG → Terminal 2: van do hotel, ~15 min, € 7/pessoa (reserva em station.link)","Paris CDG → Salvador: AF 476, 10h20 → 15h25","Salvador → Belo Horizonte: G3 1948, 19h45 → 21h30"]}],"documentos":[{"icon":"✈️","titulo":"Passagens Aéreas","meta":"CNF→VCP (VMTI6G) · VCP→OPO (MM4NTJ) · OPO→FCO (B67Q5X) · CDG→SSA (CM4JAX) · SSA→CNF (YICNWR)","badge":"Confirmado"},{"icon":"🏨","titulo":"Vouchers de Hotel","meta":"Mercure Porto · NH Collection Roma (3) · NH Siena · c-hotels Ambasciatori (2) · Excelsior San Marco · Bellavista Menaggio · Fassbind Beausite · Kipling · Hyatt House CDG","badge":"Confirmado"},{"icon":"🚐","titulo":"Locações de Carro","meta":"Autovia van 19–25/08 (conf. 64WZ4E6) · Autovia Audi A3 25–29/08 (conf. AUT-26291758)","badge":"Confirmado"},{"icon":"🛂","titulo":"Passaportes e PID","meta":"Oswaldo Luiz e Mônica — passaporte + Permissão Internacional para Dirigir","badge":"Verificar validade","badgeClass":"pending"},{"icon":"🏨","titulo":"Pendências de hospedagem","meta":"Florença 24–26/08 (casamento) — única hospedagem ainda sem reserva","badge":"A reservar","badgeClass":"pending"}],"_slug":"entre-ciprestes-e-alpes","footerNote":"Entre ciprestes e Alpes · Oswaldo Luiz"};
function fmtDateBR(iso){if(!iso)return'';var p=iso.split('-');if(p.length===3)return p[2]+'/'+p[1]+'/'+p[0];return iso;}
function bVC(v){return'<div class="voo-card"><div class="voo-lado"><div class="voo-city">'+(v.origemIata||'???')+'</div><div class="voo-airport">'+(v.origemNome||'')+'</div><div class="voo-time">'+(v.horaPartida||'—')+'</div><div class="voo-date">'+(v.data?fmtDateBR(v.data):'')+'</div></div><div class="voo-center"><span class="voo-arrow">✈</span><div class="voo-duration">Voo '+(v.tipo==='ida'?'Ida':'Volta')+(v.nvoo?' · '+v.nvoo:'')+'</div><span class="voo-badge">'+(v.cia||'Companhia a confirmar')+(v.classe?' · '+v.classe:'')+'</span>'+(v.conexao?'<div style="font-size:11px;color:var(--muted);margin-top:4px">Conexão: '+v.conexao+'</div>':'')+(v.pnr?'<div class="voo-pnr">Localizador: <strong>'+v.pnr+'</strong></div>':'')+'</div><div class="voo-lado" style="text-align:right"><div class="voo-city">'+(v.destinoIata||'???')+'</div><div class="voo-airport">'+(v.destinoNome||'')+'</div><div class="voo-time">'+(v.horaChegada||'—')+'</div><div class="voo-date">'+(v.dataChegada?fmtDateBR(v.dataChegada):'')+'</div></div></div>';}
function bHC(h){return'<div class="hotel-card"><div class="hotel-icon">🏨</div><div class="hotel-info"><div class="hotel-nome">'+(h.nome||'Hotel')+'</div><div class="hotel-meta">'+(h.cidade?'<span>📍 '+h.cidade+'</span>':'')+(h.hospedes?'<span>👥 '+h.hospedes+'</span>':'')+(h.noites?'<span>🌙 '+h.noites+' noite'+(h.noites!=1?'s':'')+'</span>':'')+'</div><div class="hotel-periodo">'+(h.checkin?fmtDateBR(h.checkin):'')+(h.checkout?' → '+fmtDateBR(h.checkout):'')+'</div>'+(h.conf?'<span class="hotel-conf">Conf. '+h.conf+'</span>':'')+'</div></div>';}
function bSC(s){return'<div class="serv-card"><div class="serv-card-header"><span class="serv-icon">'+(s.icon||'📋')+'</span><span class="serv-nome">'+(s.nome||'')+'</span></div><div class="serv-meta">'+(s.meta||'')+'</div>'+(s.badge?'<span class="serv-badge">'+s.badge+'</span>':'')+'</div>';}
function bTB(from,to){if(!from||!to||!from.lat||!from.lng||!to.lat||!to.lng)return'';if(from.lat===to.lat&&from.lng===to.lng)return'';var mC='https://www.google.com/maps/dir/?api=1&origin='+from.lat+','+from.lng+'&destination='+to.lat+','+to.lng+'&travelmode=driving';var mW='https://www.google.com/maps/dir/?api=1&origin='+from.lat+','+from.lng+'&destination='+to.lat+','+to.lng+'&travelmode=walking';var mT='https://www.google.com/maps/dir/?api=1&origin='+from.lat+','+from.lng+'&destination='+to.lat+','+to.lng+'&travelmode=transit';var wz='https://waze.com/ul?ll='+to.lat+','+to.lng+'&navigate=yes&from='+from.lat+','+from.lng;return'<div class="travel-block"><div class="travel-route"><span class="travel-route-from">'+from.nome+'</span><span class="travel-route-arrow">→</span><span class="travel-route-to">'+to.nome+'</span></div><div class="travel-modes"><a class="travel-mode-pill" href="'+mW+'" target="_blank"><span class="travel-mode-pill-icon">🚶</span><span>A pé</span></a><a class="travel-mode-pill" href="'+mC+'" target="_blank"><span class="travel-mode-pill-icon">🚗</span><span>Carro</span></a><a class="travel-mode-pill" href="'+mT+'" target="_blank"><span class="travel-mode-pill-icon">🚌</span><span>Transporte</span></a></div><div class="travel-nav-btns"><a class="travel-nav-btn travel-nav-btn-maps" href="'+mC+'" target="_blank">🗺️ Google Maps</a><a class="travel-nav-btn travel-nav-btn-waze" href="'+wz+'" target="_blank">🚦 Waze</a></div></div>';}

 extraCards){if(!existingIds.has(ex.docId))_docsList.push(ex);}_docsUploadados={};Object.entries(meta).forEach(function(entry){const fileName=entry[0];const info=entry[1];if(fileName.indexOf('_')===0)return;const fileId=fileName.replace(/\.[^.]+$/,'');const docId=fileId.replace(/_\d+$/,'');const rawUrl='https://raw.githubusercontent.com/davileles/roteiros/main/'+slug+'/docs/'+fileName;if(!_docsUploadados[docId])_docsUploadados[docId]=[];if(!_docsUploadados[docId].some(function(x){return x.fileId===fileId;}))_docsUploadados[docId].push({nome:info.nome||fileName,rawUrl:rawUrl,mediaType:info.mediaType||'',fileId:fileId});});_redrawDocs();}function renderDocCards(documentos){_docsList=documentos.map(function(doc,i){return Object.assign({},doc,{docId:doc.docId||('doc_'+i)});});_redrawDocs();const slug=ROTEIRO_DATA&&ROTEIRO_DATA._slug;if(slug)carregarDocsUpload(slug);}function triggerUpload(docId){const el=document.getElementById('input-'+docId);if(el)el.click();}async function handleDocUpload(docId,nomeDoc,input){const selecionados=Array.from(input.files||[]);if(!selecionados.length)return;const slug=ROTEIRO_DATA&&ROTEIRO_DATA._slug;if(!slug){alert('Slug do roteiro nao definido.');input.value='';return;}const maxMB=8;const grandes=selecionados.filter(function(f){return f.size>maxMB*1024*1024;});const fila=selecionados.filter(function(f){return f.size<=maxMB*1024*1024;});if(grandes.length)alert('Ignorado(s) por passar de '+maxMB+'MB:\n'+grandes.map(function(f){return f.name;}).join('\n'));if(!fila.length){input.value='';return;}const elUp=document.getElementById('uploading-'+docId);const erros=[];for(var i=0;i<fila.length;i++){const file=fila[i];if(elUp){elUp.textContent=fila.length>1?('Enviando '+(i+1)+'/'+fila.length+'...'):'Enviando...';elUp.style.display='';}const ext=file.name.split('.').pop().toLowerCase();const fileId=docId+'_'+(Date.now()+i);const fileName=fileId+'.'+ext;try{const b64=await new Promise(function(res,rej){const r=new FileReader();r.onload=function(){res(r.result.split(',')[1]);};r.onerror=rej;r.readAsDataURL(file);});const resp=await fetch(PROXY+'/roteiros/doc-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:slug,docId:fileName,nome:file.name,tipo:ext,base64:b64,mediaType:file.type})});const data=await resp.json();if(!data.ok)throw new Error(data.erro||'Erro no upload');if(!_docsUploadados[docId])_docsUploadados[docId]=[];_docsUploadados[docId].push({nome:file.name,rawUrl:data.rawUrl,mediaType:file.type,fileId:fileId});const st=document.getElementById('upload-status-'+docId);if(st)st.innerHTML=_fileListHtml(docId);}catch(e){erros.push(file.name+' - '+e.message);}}if(elUp){elUp.style.display='none';elUp.textContent='Enviando...';}if(erros.length)alert('Erro ao enviar arquivo(s):\n'+erros.join('\n'));input.value='';}async function removerDocArquivo(docId,fi){const files=_docsUploadados[docId]||[];const f=files[fi];if(!f)return;if(!confirm('Remover "'+f.nome+'"?'))return;_docsUploadados[docId].splice(fi,1);document.getElementById('upload-status-'+docId).innerHTML=_fileListHtml(docId);const slug=ROTEIRO_DATA&&ROTEIRO_DATA._slug;if(!slug)return;const ext=f.rawUrl.split('.').pop().toLowerCase();const fileName=f.fileId+'.'+ext;try{await fetch(PROXY+'/roteiros/doc-upload',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:slug,docId:fileName})});}catch(e){}}async function removerDocCard(docId){if(!confirm('Remover este cartao de documento?'))return;const slug=ROTEIRO_DATA&&ROTEIRO_DATA._slug;_docsList=_docsList.filter(function(d){return d.docId!==docId;});delete _docsUploadados[docId];_redrawDocs();if(!slug)return;const meta=await _metaGet(slug);const deleted=new Set(meta._deletedCards||[]);deleted.add(docId);const extras=(meta._extraCards||[]).filter(function(e){return e.docId!==docId;});meta._deletedCards=Array.from(deleted);meta._extraCards=extras;await _metaSave(slug,meta);}async function adicionarDocCard(){const titulo=prompt('Nome do
