con":"🚄","nome":"TGV Lyria 9774 — Genève Cornavin → Paris Gare de Lyon · 2ª classe","meta":"🛫 06/09/2026 · 14:27 → 17:42 · Voiture 18, lugares 810 (Mônica) e 811 (Oswaldo)<br>Dossiê 9T7GTV · Assentos prioritários no andar inferior · Semi Flex Standard · € 204,00 total<br>Presença obrigatória no cais 2 min antes da partida","badge":"Confirmado"},{"icon":"🚐","nome":"Transfer Hyatt House → T2TGV (van do hotel)","meta":"🛫 07/09/2026 · saída 07h00 · 2 lugares<br>Reserva station.link CABNOW-352 · QR Code individual por passageiro<br>Destino: estação T2TGV, Nível 5, Plataforma 2 · Operador: +33 1 85 43 17 21","badge":"Confirmado"},{"icon":"🚠","nome":"Jungfraujoch — Top of Europe (2 pessoas)","meta":"🛫 01/09/2026 · Interlaken Ost 10:04 → Jungfraujoch 11:41 · retorno 14:45 → Interlaken Ost 16:24<br>Reserva #401902 · Via Eiger Express (Grindelwald Terminal / Eigergletscher)<br>Reserva de assento obrigatória incluída — válida apenas para esta conexão","badge":"Confirmado"}],"dias":[{"num":1,"data":"2026-08-17","titulo":"Porto: Vinho, Alma e o Douro","resumo":"Chegam às 09h20 após voo noturno na executiva — descansados o suficiente para aproveitar o dia. Porto é uma cidade que se revela devagar, entre ruelas de azulejo, pontes icônicas e copos de vinho do Porto à beira do Douro. Um dia leve e contemplativo, perfeito para o início da viagem.","energia":"🟢 Leve","atividades":[{"horario":"09h20","nome":"Chegada ao Aeroporto Francisco Sá Carneiro","descricao":"Transfer para o hotel: ~25 min de táxi ou Uber (~€25). Não vale aluguel de carro para um dia só em Porto — a cidade é compacta e melhor a pé.","dica":""},{"horario":"10h30 – 12h00","nome":"Ribeira e primeiro passeio","descricao":"O bairro histórico à beira do Douro, Patrimônio Mundial da UNESCO. Ruelas de paralelepípedo, fachadas de azulejo, barcos rabelos no rio. Ideal para caminhar sem pressa e tomar o primeiro café português.","dica":"Peça uma francesinha no almoço — o prato típico portuense. Restaurante Café Santiago é clássico e sem frescura."},{"horario":"12h00 – 13h30","nome":"Almoço na Ribeira","descricao":"","dica":""},{"horario":"14h00 – 16h00","nome":"Caves de Vinho do Porto — Vila Nova de Gaia","descricao":"Do outro lado da Ponte Dom Luís, as caves guardam os melhores vinhos do Porto envelhecendo em barris. Vale fazer uma visita guiada com degustação.","dica":"Caves Graham's ou Ramos Pinto oferecem experiências premium com degustação de 3-5 vinhos. Reservar com antecedência. ~€20-35 por pessoa."},{"horario":"16h00 – 17h30","nome":"Ponte Dom Luís I e vista panorâmica","descricao":"A ponte icônica de ferro, com dois tabuleiros. Subir ao tabuleiro superior oferece uma das melhores vistas de Porto. Dá para caminhar até o Jardim do Morro para o pôr do sol.","dica":"Leve câmera — o fim de tarde aqui é fotográfico demais."},{"horario":"18h00 – 19h00","nome":"Descanso no hotel","descricao":"","dica":""},{"horario":"20h00","nome":"Jantar especial","descricao":"Se hospedados no The Yeatman: o restaurante do hotel tem estrela Michelin e vista noturna deslumbrante — experiência imperdível para a primeira noite. Reserva obrigatória. ~€120-180 por pessoa. Alternativa: DOP do chef Rui Paula, no centro histórico — cozinha portuguesa contemporânea. ~€60-90 por pessoa.","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Transfer aeroporto</span><span>€12</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Visita + degustação caves</span><span>€30</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço</span><span>€25</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar (The Yeatman)</span><span>€150</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Extras/café</span><span>€15</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€230</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Café Santiago</strong> — tradicional | A francesinha original de Porto | ~€15-20 por pessoa</div><div style='margin-bottom:6px'><strong>The Yeatman Restaurant</strong> — alta gastronomia | Vista noturna + estrela Michelin | ~€150 por pessoa</div><div style='margin-bottom:6px'><strong>DOP</strong> — portuguesa contemporânea | Chef premiado, ambiente elegante | ~€70 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Caves Graham's: grahams1820.com · Reservas The Yeatman: theyeatman.com · Transfer aeroporto: uber.com ou táxi fixo no aeroporto","dica":""}],"deslocamentos":["Aeroporto → Hotel: Uber/táxi, ~25 min, ~€25","Hotel → Ribeira: a pé (se Ribeira) ou Uber (~€8)","Ribeira → Caves Gaia: a pé pela Ponte Dom Luís, ~15 min"]},{"num":2,"data":"2026-08-18","titulo":"Porto → Roma: Chegada e Primeiro Sabor","resumo":"Manhã tranquila em Porto para um último café e passeio leve antes do voo das 14h45. Chegam em Roma ao fim da tarde — tempo suficiente para se instalar, caminhar pelo bairro do hotel e jantar bem. Roma não é o foco da viagem, então nada de correria: a cidade é o ponto de partida para a estrada.","energia":"🟢 Leve","atividades":[{"horario":"⚠️","nome":"Atenção","descricao":"VOOS RYANAIR: check-in online obrigatório (abre 60 dias antes, fecha 2h antes do embarque). Confirmar bagagem despachada com antecedência — taxas altas no aeroporto. O voo FR 6008 chega em ROMA FIUMICINO (FCO), não em Ciampino. Aeroporto de Porto (OPO) recomenda chegada 2h antes.","dica":""},{"horario":"08h00 – 10h00","nome":"Café da manhã e passeio final em Porto","descricao":"Último café com pastel de nata. Se o hotel for na Ribeira, um passeio matinal tranquilo antes de preparar as malas.","dica":""},{"horario":"10h30","nome":"Check-out e transfer para aeroporto","descricao":"Uber/táxi: ~25 min, ~€25. Chegada ao aeroporto ~12h30, confortável para voo 14h45.","dica":""},{"horario":"14h45","nome":"Voo Porto → Roma (Ryanair)","descricao":"Ryanair FR 6008 · OPO 14:45 → FCO 18:40 · PNR B67Q5X.","dica":"Este voo pousa em Fiumicino (FCO) — o terminal Ryanair é o T1. Bem mais perto do centro que Ciampino."},{"horario":"18h40","nome":"Chegada em Roma — Fiumicino (FCO)","descricao":"Transfer FCO → NH Collection Roma Giustiniano (bairro Prati, junto ao Vaticano): táxi com tarifa fixa de € 55 para o centro, ~45 min. Alternativa: Leonardo Express até Termini (32 min, € 14/pessoa) + táxi curto até Prati.","dica":"Com bagagem de 22 dias, o táxi fixo compensa. Pegar sempre na fila oficial branca — nunca aceitar oferta dentro do saguão."},{"horario":"20h00 – 21h00","nome":"Instalação no hotel + banho","descricao":"","dica":""},{"horario":"21h00","nome":"Jantar próximo ao hotel","descricao":"Roma tem uma oferta gastronômica incrível. Um jantar leve e sem pressa para a chegada.","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Transfer Porto → aeroporto</span><span>€12</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Bagagem Ryanair (se necessário)</span><span>€30-50</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Transfer FCO → hotel (táxi fixo, casal)</span><span>€28</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar chegada</span><span>€45</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€110-130</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos (Roma — jantar de chegada)","descricao":"<div style='margin-bottom:6px'><strong>La Pergola</strong> — alta gastronomia | 3 estrelas Michelin, vista panorâmica de Roma | ~€200+ por pessoa (reserva com meses de antecedência)</div><div style='margin-bottom:6px'><strong>Osteria dell'Enoteca</strong> — italiana clássica | Ambiente acolhedor, boa carta de vinhos | ~€50-70 por pessoa</div><div style='margin-bottom:6px'><strong>Il Sorpasso</strong> — moderna e descontraída | Ótimo para uma chegada sem cerimônia | ~€30-40 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Check-in Ryanair: ryanair.com · Leonardo Express FCO–Termini: trenitalia.com · Táxi tarifa fixa Roma: comune.roma.it","dica":""}],"deslocamentos":["Hotel Porto → Aeroporto OPO: Uber, ~25 min, ~€25","Aeroporto FCO Roma → NH Collection Roma Giustiniano: táxi tarifa fixa, ~45 min, € 55 o carro"]},{"num":3,"data":"2026-08-19","titulo":"Roma: Dia Extra — Coliseu, Fontana di Trevi e Trastevere","resumo":"Dia duplo: Roma clássica pela manhã e a retirada do carro no início da tarde. O Coliseu abre cedo e é o melhor horário do dia; às 11:00 está marcada a retirada da van na Autovia, dentro da Estação Termini. Depois de deixar o carro estacionado, o resto do dia segue a pé — centro histórico à tarde e Trastevere à noite.","energia":"🟡 Moderado","atividades":[{"horario":"⚠️","nome":"Atenção — retirada do carro hoje","descricao":"A locação da van (Autovia, conf. 64WZ4E6) começa HOJE, 19/08, às 11:00, na Estação Roma Termini — Via Giovanni Giolitti, 34. Levar passaporte, CNH e a PID (Permissão Internacional para Dirigir), todas obrigatórias. Caução a partir de € 950 bloqueada no cartão de crédito do condutor (Oswaldo L. C. Queiroz).","dica":"Chegar 15–20 min antes: o balcão da Autovia em Termini costuma ter fila e a vistoria do veículo leva tempo. Fotografar o carro inteiro antes de sair."},{"horario":"07h45","nome":"Café da manhã cedo no hotel","descricao":"Dia com hora marcada — vale antecipar o café.","dica":""},{"horario":"08h30 – 10h30","nome":"Coliseu","descricao":"Entrada com horário marcado às 08h30, logo na abertura. Com foco só no Coliseu (sem Fórum e Palatino), duas horas bastam com folga e o calor de agosto ainda não apertou.","dica":"Reservar em coopculture.it — ingressos de agosto esgotam semanas antes. Se quiserem incluir Fórum e Palatino, o bilhete é válido para o mesmo dia e dá para voltar no fim da tarde."},{"horario":"10h40","nome":"Coliseu → Estação Termini","descricao":"~15 min a pé pela Via dei Serpenti/Via Cavour, ou uma parada de metrô na linha B (Colosseo → Termini, 3 min).","dica":""},{"horario":"11h00","nome":"Retirada da van — Autovia, Roma Termini","descricao":"Ford Tourneo Custom (ou similar), 9 lugares, automático, ar-condicionado, quilometragem livre. € 91,50 a pagar no balcão.","dica":"Conferir no contrato se o veículo tem autorização para circular e se a locadora entrega o Telepass — os pedágios da A1 até Siena somam ~€ 15."},{"horario":"11h45","nome":"Levar a van para a garagem e deixá-la parada","descricao":"O centro de Roma é ZTL e uma van de 9 lugares é o pior carro possível para circular na cidade. A recomendação é sair de Termini direto para uma garagem coberta em Prati, perto do hotel, e não tocar mais no carro até amanhã.","dica":"Garagens em Prati custam ~€ 30–40/dia. Pedir a indicação na recepção do NH Collection no check-in de ontem já adianta o problema — o hotel não tem estacionamento próprio."},{"horario":"12h30","nome":"Almoço no bairro Monti ou em Prati","descricao":"Depois de resolvido o carro, o dia volta a ser a pé.","dica":""},{"horario":"14h30 – 17h00","nome":"Centro histórico a pé — Pantheon, Fontana di Trevi e Piazza Navona","descricao":"Trajeto clássico e compacto, tudo a poucos minutos a pé: o Pantheon (entrada gratuita, arquitetura romana intacta), a Fontana di Trevi e a Piazza Navona, com as fontes barrocas de Bernini.","dica":"Jogar uma moeda na Fontana di Trevi de costas, com a mão direita sobre o ombro esquerdo — a tradição garante o retorno a Roma."},{"horario":"17h30","nome":"Descanso no hotel","descricao":"","dica":""},{"horario":"19h30","nome":"Trastevere — jantar e passeio noturno","descricao":"O bairro mais charmoso de Roma à noite: ruelas de paralelepípedo, trattorias tradicionais e atmosfera boêmia.","dica":"Ir e voltar de táxi ou a pé pela Ponte Sisto — a van fica na garagem."},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Coliseu</span><span>€18</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Taxa balcão da locadora (€91,50 / 2)</span><span>€46</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Garagem em Prati (por dia, dividida)</span><span>€18</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço</span><span>€30</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar Trastevere</span><span>€60</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€172</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Trattoria Monti</strong> — Monti | Cozinha regional simples, perto do Coliseu | ~€30-40 por pessoa</div><div style='margin-bottom:6px'><strong>Da Enzo al 29</strong> — Trastevere | Clássico romano, cacio e pepe imperdível, reserva recomendada | ~€35-50 por pessoa</div><div style='margin-bottom:6px'><strong>Roma Sparita</strong> — Trastevere | Famoso pela carbonara servida na casca de parmesão | ~€40-55 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Ingressos Coliseu: coopculture.it · Mapa da ZTL de Roma: romamobilita.it · Garagens em Prati: parkingroma.it","dica":""}],"deslocamentos":["Hotel → Coliseu: táxi ou metrô linha B (Colosseo), ~20 min","Coliseu → Roma Termini: a pé ~15 min ou metrô B, 3 min","Termini → garagem em Prati: van, ~20 min","Centro histórico → Trastevere: a pé pela Ponte Sisto, ~15 min"]},{"num":4,"data":"2026-08-20","titulo":"Roma → Siena: Direto ao Coração Medieval","resumo":"Manhã final livre em Roma e saída no início da tarde. A estrada até Siena é curta — dá para chegar com luz do dia e ainda fazer a primeira caminhada pela cidade medieval. O NH Siena fica na Piazza La Lizza, logo fora da ZTL, a 10 minutos a pé da Piazza del Campo.","energia":"🟢 Leve","atividades":[{"horario":"09h00","nome":"Café da manhã e manhã livre no hotel","descricao":"Última manhã em Roma — malas prontas, sem compromisso.","dica":""},{"horario":"10h30","nome":"Retirada da van na garagem","descricao":"A van já está com vocês desde ontem — hoje é só buscá-la na garagem em Prati e carregar as malas.","dica":"Conferir o nível de combustível e o Telepass antes de pegar a A1."},{"horario":"12h00","nome":"Check-out e almoço leve em Roma","descricao":"Check-out ao meio-dia. Almoço rápido antes da estrada.","dica":""},{"horario":"13h00","nome":"Saída de Roma rumo a Siena","descricao":"Rota sugerida: Roma → A1 (Autostrada del Sole) → Raccordo Siena-Firenze. ~2h45 de viagem (~230 km).","dica":""},{"horario":"15h45","nome":"Chegada a Siena — estacionamento","descricao":"O centro histórico de Siena é ZTL. O NH Siena fica na Piazza La Lizza, logo FORA da ZTL — dá para chegar de carro até a porta do hotel sem multa. O hotel não tem garagem própria: usa estacionamento conveniado a 200 m, por ~€ 30–35/dia, e a recepção também indica vagas gratuitas na região da Fortezza.","dica":"Perguntar na recepção pelas vagas gratuitas antes de pagar o estacionamento conveniado — com 3 diárias a diferença passa de € 100."},{"horario":"16h15","nome":"Check-in no NH Siena","descricao":"Piazza La Lizza, 1 — antigo NH Excelsior, 4 estrelas, 129 quartos. Fica entre a Fortezza Medicea e a estação de ônibus, a ~10 min a pé da Piazza del Campo e do Duomo, tudo em descida na ida. Confirmação 72077611276109, 3 hóspedes, 3 noites.","dica":"Check-in a partir das 15:00 e check-out até 12:00. Pedir quarto nos andares altos voltado para a cidade velha ou para o San Domenico — a vista compensa."},{"horario":"18h00 – 19h30","nome":"Primeira caminhada até a Piazza del Campo","descricao":"A poucos minutos do hotel. A praça em forma de concha ao entardecer, com a luz dourada refletindo nos palácios medievais ao redor — um primeiro contato inesquecível com Siena.","dica":""},{"horario":"20h00","nome":"Jantar em Siena","descricao":"","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Diária da van (já paga na reserva)</span><span>—</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Pedágios Roma → Siena</span><span>€15</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço leve em Roma</span><span>€20</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Estacionamento Siena</span><span>€15</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar em Siena</span><span>€50</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€135</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Trattoria Papei</strong> — perto da Piazza del Campo, simples e autêntico | ~€25-35 por pessoa</div><div style='margin-bottom:6px'><strong>Osteria Le Logge</strong> — clássico elegante, favorito dos locais, reserva recomendada | ~€50-65 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"NH Siena: nh-hotels.com/hotel/nh-siena · Estacionamentos de Siena: sienaparcheggi.it · ZTL de Siena: comune.siena.it","dica":""}],"deslocamentos":["Roma → Siena: carro, ~2h45, ~€15 de pedágio","Parcheggio → Relais degli Angeli: a pé, ~10 min"]},{"num":5,"data":"2026-08-21","titulo":"Montalcino: Bicicleta, Ciprestes e Brunello","resumo":"Dia de estrada até o coração da Val d'Orcia. Saída de Siena de manhã rumo a San Quirico d'Orcia, para um passeio de bicicleta pelas estradas de terra entre ciprestes e colinas — as famosas strade bianche. À tarde, uma visita a uma cantina de Brunello di Montalcino para degustação, com retorno a Siena ao entardecer.","energia":"🟡 Moderado","atividades":[{"horario":"08h00","nome":"Café da manhã no hotel","descricao":"","dica":""},{"horario":"09h00 – 11h30","nome":"Passeio de bicicleta — Strade Bianche","descricao":"As estradas de terra branca entre San Quirico d'Orcia e Montichiello são um dos cenários mais fotografados da Toscana. Percurso leve de ~15-20 km (ida e volta) com paradas para fotos.","dica":"O próprio agriturismo costuma ter bicicletas para hóspedes ou indica locadora próxima. Sair cedo para evitar o calor de agosto (~32°C no meio do dia). Levar água e protetor solar. Bicicletas podem ser alugadas em San Quirico d'Orcia — combine com antecedência já que agora é um passeio de carro + bike, não saindo direto da hospedagem."},{"horario":"12h00","nome":"Montichiello","descricao":"Vilarejo medieval minúsculo no topo da colina, quase intacto. Almoço com vista panorâmica para o vale.","dica":""},{"horario":"14h30 – 17h00","nome":"Degustação de Brunello em Montalcino","descricao":"Montalcino fica a ~25 min de carro. O Brunello di Montalcino é um dos maiores vinhos da Itália. Já que conhecem a região, desta vez vale uma experiência mais aprofundada numa cantina premium.","dica":"Biondi-Santi é a cantina histórica — berço do Brunello. Banfi ou Casanova di Neri oferecem visitas guiadas com degustação premium. Reservar com antecedência. ~€40-80 por pessoa."},{"horario":"17h30","nome":"Fortaleza de Montalcino","descricao":"Vista de 360° sobre a Val d'Orcia. Entrada ~€5. Enoteca dentro da fortaleza para mais uma taça antes de voltar.","dica":""},{"horario":"19h30","nome":"Retorno a Siena","descricao":"","dica":""},{"horario":"20h30","nome":"Jantar","descricao":"","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Aluguel de bicicleta (se necessário)</span><span>€15-20</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço Montichiello</span><span>€35</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Degustação Brunello</span><span>€60</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Entrada Fortaleza</span><span>€5</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar</span><span>€50</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€165</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Osteria La Porta</strong> — Montichiello | Vista deslumbrante, cozinha local autêntica | ~€40-50 por pessoa</div><div style='margin-bottom:6px'><strong>Re di Macchia</strong> — Montalcino | Especialidade em carnes e Brunello | ~€45-60 por pessoa</div><div style='margin-bottom:6px'><strong>Ristorante Banfi</strong> — cantina Banfi | Jantar entre vinhedos, experiência completa | ~€70-90 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Biondi-Santi: biondisanti.it · Casanova di Neri: casanovadineri.com · Banfi: castellobanfi.com","dica":""}],"deslocamentos":["Siena → San Quirico d'Orcia: carro, ~50 min","San Quirico → Montalcino: carro, ~25 min","Montalcino → Siena: carro, ~50 min"]},{"num":6,"data":"2026-08-22","titulo":"Pienza e San Quirico d'Orcia","resumo":"Dia mais tranquilo, dedicado aos vilarejos renascentistas da Val d'Orcia. Pienza pela manhã, com calma — queijos, lojas artesanais e a Piazza Pio II. San Quirico à tarde, com seus jardins renascentistas. Retorno a Siena para uma última noite explorando a cidade — a Catedral, os bairros históricos (contrade) e um jantar de despedida antes da estrada do Chianti.","energia":"🟡 Moderado","atividades":[{"horario":"08h30","nome":"Café da manhã no hotel","descricao":"","dica":""},{"horario":"09h30","nome":"Saída de Siena rumo a Pienza","descricao":"Trajeto de carro, ~1h10 pela SR2/SP146.","dica":""},{"horario":"10h45 – 12h30","nome":"Pienza com calma","descricao":"Explorar o Corso Rossellino, entrar nas lojas de pecorino, azeite e mel artesanal. A Catedral e a Piazza Pio II merecem atenção pela arquitetura renascentista impecável.","dica":"Comprar pecorino stagionato e pecorino al tartufo direto dos produtores locais — ótima lembrança comestível."},{"horario":"13h00","nome":"Almoço em Pienza","descricao":"","dica":""},{"horario":"14h30 – 15h30","nome":"Horti Leonini — San Quirico d'Orcia","descricao":"Jardins renascentistas do século XVI no centro do vilarejo — entrada gratuita, absolutamente serenos.","dica":"~10 min de carro entre Pienza e San Quirico."},{"horario":"16h00","nome":"Retorno a Siena","descricao":"Trajeto de carro, ~50 min.","dica":""},{"horario":"17h00 – 18h00","nome":"Catedral de Siena (Duomo)","descricao":"Uma das mais belas fachadas góticas da Itália — por fora já impressiona muito. Entrar vale pela arquitetura interior única, com pavimento de mármores incrustados.","dica":"Entrada ~€8. Não é museu — é arquitetura pura."},{"horario":"18h00 – 19h00","nome":"Passeio pelos bairros (contrade)","descricao":"Siena é dividida em 17 bairros históricos chamados contrade — cada um com sua identidade, fonte e igreja. Caminhar sem mapa por essas ruelas fecha bem a passagem pela cidade.","dica":""},{"horario":"20h00","nome":"Jantar de despedida em Siena","descricao":"","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Compras locais (queijos, azeite)</span><span>€30</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço Pienza</span><span>€35</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Horti Leonini</span><span>—</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Catedral de Siena</span><span>€8</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar em Siena</span><span>€50</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€123</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Latte di Luna</strong> — Pienza | Pasta caseira e pecorino fresco | ~€35-45 por pessoa</div><div style='margin-bottom:6px'><strong>Osteria del Leone</strong> — San Quirico | Cozinha toscana honesta | ~€30-40 por pessoa</div><div style='margin-bottom:6px'><strong>Osteria La Chiacchera</strong> — Siena, perto do Duomo | Tradicional e despretensioso | ~€30-40 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Duomo de Siena: operaduomo.siena.it","dica":""}],"deslocamentos":["Siena → Pienza: carro, ~1h10","Pienza → San Quirico: carro, ~10 min","San Quirico → Siena: carro, ~50 min"]},{"num":7,"data":"2026-08-23","titulo":"Estrada do Chianti: Vinhedos até Florença","resumo":"Último dia de base em Siena — check-out e partida rumo a Florença pela famosa Chiantigiana (SS222), a estrada do vinho que corta os vinhedos do Chianti entre Siena e Florença. Uma das drives mais bonitas da Itália. Paradas em cantinas e vilarejos pelo caminho, chegando a Florença no fim da tarde para se instalar antes do casamento.","energia":"🟢 Leve-Moderado","atividades":[{"horario":"08h00","nome":"Café da manhã e check-out","descricao":"","dica":""},{"horario":"09h00","nome":"Saída rumo ao Chianti pela SS222","descricao":"A Chiantigiana é uma estrada secundária sinuosa entre vinhedos, olivais e castelos medievais. Não tem pressa — essa é a viagem.","dica":""},{"horario":"10h00","nome":"Greve in Chianti","descricao":"Principal cidade da região, com uma praça triangular charmosa e ótimas enotecas. Vale uma parada para café e compras de vinho.","dica":"Enoteca Falorni é uma das mais tradicionais do Chianti — degustação de vinhos e embutidos locais. ~€20-30 por pessoa."},{"horario":"11h30","nome":"Castello di Brolio","descricao":"Castelo medieval da família Ricasoli — criadores históricos do Chianti Classico. Vista deslumbrante sobre os vinhedos. Visita ao jardim e enoteca.","dica":"Não precisa fazer tour interno — o jardim e a vista já valem a parada. Entrada jardim ~€5. Reservar degustação na cantina com antecedência."},{"horario":"13h00","nome":"Almoço em Panzano in Chianti","descricao":"Panzano tem o famoso Dario Cecchini — o açougueiro mais famoso da Itália, com restaurante e experiência gastronômica única.","dica":"Solociccia de Dario Cecchini é uma experiência e meia — reserva obrigatória com semanas de antecedência. ~€50-60 por pessoa."},{"horario":"15h00","nome":"Continuação rumo a Florença (~45 min pela SS222)","descricao":"","dica":""},{"horario":"16h00","nome":"Chegada e check-in no c-hotels Ambasciatori","descricao":"Florença tem uma das ZTLs mais rígidas da Itália, com câmeras em todos os acessos. Informar a placa da van ao hotel ANTES da chegada — o c-hotels Ambasciatori registra o veículo junto à prefeitura e libera o acesso temporário para desembarque. Sem esse registro, a multa chega em casa meses depois. Duas reservas para o grupo: conf. 72077118207546 (4 hóspedes) e 72077810885573 (1 hóspede).","dica":"Combinar também onde a van fica estacionada nas noites de Florença — garagem conveniada custa ~€ 30–40/dia e é a única forma segura de deixar o carro."},{"horario":"17h00 – 19h00","nome":"Instalação e descanso","descricao":"","dica":""},{"horario":"20h00","nome":"Jantar tranquilo em Florença","descricao":"","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Degustação Enoteca Falorni</span><span>€25</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Entrada Castello di Brolio</span><span>€5</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço Panzano (Dario Cecchini)</span><span>€55</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Compras de vinho pelo caminho</span><span>€30-50</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar Florença</span><span>€55</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€155</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Solociccia</strong> — Panzano | Dario Cecchini, experiência única de carne toscana | ~€50-60/pessoa (reserva obrigatória)</div><div style='margin-bottom:6px'><strong>Buca Mario</strong> — Florença | O restaurante mais antigo de Florença | ~€45-55 por pessoa</div><div style='margin-bottom:6px'><strong>Il Latini</strong> — Florença | Mesas compartilhadas, ambiente animado, toscana raiz | ~€35-45 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Dario Cecchini reservas: dariocecchini.com · Enoteca Falorni: falorni.it · Castello di Brolio: ricasoli.com","dica":""}],"deslocamentos":["Siena → Greve in Chianti: van, ~50 min","Greve → Castello di Brolio: van, ~20 min","Brolio → Panzano/Radda: van, ~15 min","Panzano → Florença: van, ~45 min — informar a placa ao hotel antes de entrar na ZTL"]},{"num":8,"data":"2026-08-24","titulo":"Florença — Agenda Livre (Casamento)","resumo":"Dias reservados ao casamento e seus desdobramentos sociais. Nenhuma sugestão de passeio — Oswaldo e Mônica têm compromisso especial. Aproveitar a manhã com calma no hotel, café tranquilo, e se preparar para a celebração.","energia":"🎉 Agenda Livre","atividades":[{"horario":"🎉","nome":"Agenda Livre — Casamento","descricao":"Esse dia está reservado para o casamento e seus desdobramentos sociais. O roteiro retoma no Dia 11 — 27 de agosto, com a partida de Florença rumo ao norte da Itália.","dica":""},{"horario":"💡","nome":"Sugestão para os momentos livres","descricao":"Aproveitar os momentos livres para descansar, explorar Florença no próprio ritmo ou participar dos eventos do casamento sem compromisso de agenda. Florença tem muito a oferecer sem precisar entrar em museu nenhum — as pontes sobre o Arno, o bairro Oltrarno, o Mercato Centrale com seus produtos locais, sorveterias premiadas e cafés históricos como o Caffè Rivoire na Piazza della Signoria.","dica":"Giardino di Boboli (jardins do Palazzo Pitti) é perfeito para um passeio leve ao ar livre. Entrada ~€10."},{"horario":"🍽️","nome":"Restaurantes em Florença para os dias livres","descricao":"<div style='margin-bottom:6px'><strong>Buca Mario</strong> — o mais antigo de Florença, cozinha tradicional | ~€45-55 por pessoa</div><div style='margin-bottom:6px'><strong>Il Latini</strong> — mesas compartilhadas, ambiente animado e toscano | ~€35-45 por pessoa</div><div style='margin-bottom:6px'><strong>Osteria dell'Enoteca</strong> — elegante, boa carta de vinhos | ~€60-80 por pessoa</div><div style='margin-bottom:6px'><strong>Buca dell'Orafo</strong> — à beira do Arno, junto à Ponte Vecchio | ~€50-65 por pessoa</div>","dica":""}],"deslocamentos":[]},{"num":9,"data":"2026-08-25","titulo":"Florença — Casamento + Troca de Carros no Aeroporto","resumo":"Dia de agenda livre para o casamento, com uma única obrigação no meio da manhã: às 11:00 termina a locação da van e às 11:30 começa a do Audi, as duas no Aeroporto de Florença Peretola (FLR). São 30 minutos entre uma coisa e outra, no mesmo balcão da Autovia — mas é preciso sair do centro a tempo.","energia":"🎉 Agenda Livre + 1 compromisso","atividades":[{"horario":"⚠️","nome":"Compromisso do dia — troca de veículo","descricao":"Devolução da van Ford Tourneo (conf. 64WZ4E6) às 11:00 e retirada do Audi A3 Sportback (conf. AUT-26291758) às 11:30, ambos na Autovia do Aeroporto de Florença Peretola — Via Palagio degli Spini s/n. É o mesmo balcão, então a troca é rápida, mas os horários são contratuais.","dica":"A partir daqui a viagem volta a ser só do casal, então o Audi A3 dá conta com folga. Vale só conferir se a bagagem extra do casamento cabe no porta-malas de um hatch — se tiver crescido muito, dá para pedir upgrade à Autovia com antecedência."},{"horario":"09h00","nome":"Manhã livre — casamento","descricao":"Nenhuma sugestão de roteiro. Café tranquilo e tempo com os convidados.","dica":""},{"horario":"10h15","nome":"Saída do centro rumo ao aeroporto","descricao":"Do centro de Florença até Peretola são ~15–20 min de carro pelo Viale Guidoni. Sair às 10h15 dá folga confortável.","dica":"Abastecer antes de devolver — a van sai com tanque cheio e a locadora cobra o reabastecimento com ágio. Há postos na Via Pratese, junto ao aeroporto."},{"horario":"11h00 – 11h45","nome":"Devolução da van + retirada do Audi","descricao":"Vistoria de saída da van, assinatura e retirada do carro novo. Fotografar os dois veículos — o que está sendo devolvido e o que está sendo retirado.","dica":"A caução de € 950 da primeira locação leva alguns dias para ser desbloqueada e a segunda bloqueia outro valor igual. Conferir o limite do cartão do Oswaldo antes da viagem."},{"horario":"12h15","nome":"Retorno ao centro de Florença","descricao":"Mesma atenção à ZTL — placa nova, registro novo. Informar ao hotel/hospedagem do casamento a placa do Audi assim que souberem.","dica":"Esse é o erro mais comum da viagem: registrar a placa do primeiro carro e esquecer de atualizar depois da troca."},{"horario":"13h00","nome":"Resto do dia livre — casamento","descricao":"O roteiro retoma amanhã à tarde, com a partida de Florença rumo a Bérgamo.","dica":""},{"horario":"🍽️","nome":"Restaurantes em Florença para os dias livres","descricao":"<div style='margin-bottom:6px'><strong>Buca Mario</strong> — o mais antigo de Florença, cozinha tradicional | ~€45-55 por pessoa</div><div style='margin-bottom:6px'><strong>Il Latini</strong> — mesas compartilhadas, ambiente animado e toscano | ~€35-45 por pessoa</div><div style='margin-bottom:6px'><strong>Osteria dell'Enoteca</strong> — elegante, boa carta de vinhos | ~€60-80 por pessoa</div><div style='margin-bottom:6px'><strong>Buca dell'Orafo</strong> — à beira do Arno, junto à Ponte Vecchio | ~€50-65 por pessoa</div>","dica":""}],"deslocamentos":["Centro de Florença → Aeroporto Peretola (FLR): carro, ~15–20 min pelo Viale Guidoni","Aeroporto Peretola → centro de Florença: carro, ~20 min — atualizar a placa junto à hospedagem"]},{"num":10,"data":"2026-08-26","titulo":"Florença → Bérgamo: Rumo ao Norte","resumo":"Manhã ainda pertence ao casamento — despedidas, café sem pressa e nenhum compromisso de agenda. À tarde, a viagem retoma rumo ao norte. Bérgamo é a parada perfeita para quebrar a estrada até o Lago di Como: a Città Alta é uma cidade medieval murada no alto de uma colina, cercada por muralhas venezianas do século XVI, e ao entardecer fica praticamente só para quem dorme lá dentro.","energia":"🟢 Leve","atividades":[{"horario":"🎉","nome":"Manhã livre — encerramento do casamento","descricao":"Sem nenhuma sugestão de roteiro. Café tranquilo, despedidas dos convidados e tempo para arrumar as malas com calma. A viagem só retoma depois do almoço.","dica":""},{"horario":"11h30","nome":"Check-out da hospedagem do casamento","descricao":"","dica":""},{"horario":"12h00","nome":"Saída de Florença rumo a Bérgamo","descricao":"Rota pela A1 até Piacenza, depois A21 e A4 — ~3h15 de viagem (~310 km) no Audi. Estrada boa e sem trechos complicados.","dica":"Abastecer antes de pegar a autoestrada — combustível em área de serviço italiana é bem mais caro."},{"horario":"13h30","nome":"Parada para almoço em rota","descricao":"","dica":""},{"horario":"16h00","nome":"Chegada a Bérgamo e check-in no Hotel Excelsior San Marco","descricao":"Piazzale della Repubblica, 6 — o hotel fica na Città Bassa, de frente para um parque, e NÃO está dentro da ZTL: chega-se de carro sem restrição. Tem estacionamento externo privativo e garagem próprios, ~€ 25/dia. A estação do funicular que sobe para a Città Alta fica a 2 minutos a pé da porta. Confirmação 72077372111397.","dica":"O Roof Garden, no 8º andar, tem vista frontal para a Città Alta iluminada. Em agosto o restaurante abre só para o jantar — vale reservar já no check-in."},{"horario":"17h00 – 19h30","nome":"Città Alta ao entardecer","descricao":"Piazza Vecchia — considerada por Le Corbusier uma das praças mais bonitas do mundo, com o Palazzo della Ragione e a Fonte Contarini. Basilica di Santa Maria Maggiore e a Cappella Colleoni, com fachada de mármore policromado. Muralhas venezianas — Patrimônio UNESCO, com caminhada panorâmica sobre a cidade baixa e a planície lombarda.","dica":"O funicular de San Vigilio sobe mais um nível e entrega o melhor pôr do sol da cidade. São 5 minutos e vale cada um."},{"horario":"20h00","nome":"Jantar na Città Alta","descricao":"Cozinha bergamasca: casoncelli (massa recheada com carne, manteiga e sálvia), polenta taragna e queijos do vale Brembana.","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Pedágios e combustível</span><span>€28</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço em rota</span><span>€28</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Funiculares Città Alta e San Vigilio</span><span>€6</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar na Città Alta</span><span>€50</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€112</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Da Mimmo</strong> — Città Alta | Instituição da cidade desde 1956, massas e forno a lenha | ~€35-50 por pessoa</div><div style='margin-bottom:6px'><strong>Ristorante Il Sole</strong> — Città Alta | Cozinha bergamasca clássica em pátio interno | ~€45-60 por pessoa</div><div style='margin-bottom:6px'><strong>Baretto di San Vigilio</strong> — San Vigilio | Terraço panorâmico sobre a cidade — ideal para o pôr do sol | ~€50-70 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Hotel Excelsior San Marco: hotelsanmarco.com · Turismo Bérgamo: visitbergamo.net · Funiculares Città Alta e San Vigilio: atb.bergamo.it · Pedágios Itália: autostrade.it","dica":""}],"deslocamentos":["Florença → Bérgamo: carro, ~3h15 (~310 km), ~€30 de pedágio","Hotel Excelsior San Marco → funicular da Città Alta: a pé, ~2 min","Città Alta → San Vigilio: funicular, ~5 min"]},{"num":11,"data":"2026-08-27","titulo":"Bérgamo → Menaggio: Travessia de Balsa para o Lago","resumo":"Manhã inteira na Città Alta, sem a pressa de quem só passou a noite. Depois do almoço, a estrada corta até Varenna pela SS36 e a chegada ao lago é feita do jeito mais bonito possível: de balsa, com o carro a bordo, atravessando até Menaggio. O hotel fica na própria orla, a poucos passos do embarcadouro — a partir daqui, tudo no plano.","energia":"🟢 Leve","atividades":[{"horario":"08h30","nome":"Café da manhã no Excelsior San Marco","descricao":"","dica":""},{"horario":"09h30 – 12h00","nome":"Manhã na Città Alta","descricao":"Tempo para o que não coube no entardecer da véspera: subir o Campanone (Torre Civica) para a vista de 360° sobre a cidade e a planície, percorrer a Via Colleoni com suas pastelarias históricas, e caminhar um trecho das muralhas venezianas.","dica":"Provar a polenta e osei — o doce típico de Bérgamo, em massapão amarelo. A Pasticceria Cavour, na Città Bassa, é a referência e fica perto do hotel."},{"horario":"12h00","nome":"Check-out e retirada do carro na garagem do hotel","descricao":"","dica":""},{"horario":"12h30","nome":"Almoço em Bérgamo","descricao":"","dica":""},{"horario":"14h00","nome":"Bérgamo → Varenna pela SS36","descricao":"~75 km, cerca de 1h15. A SS36 é superstrada de pista dupla com túneis, contornando o ramo de Lecco — estrada rápida e tranquila, sem as curvas da beira do lago.","dica":"Seguir as placas para o 'Traghetto' / 'Imbarcadero' ao chegar em Varenna. O acesso ao terminal de balsas é sinalizado e fica no nível da água."},{"horario":"15h15","nome":"Balsa Varenna → Menaggio (com o carro)","descricao":"A travessia leva ~20 min e é operada pela Navigazione Laghi. O carro embarca junto — basta entrar na fila de veículos, comprar o bilhete no guichê e aguardar o embarque. Em agosto as saídas são frequentes, mas a fila de carros pode custar uma travessia de espera.","dica":"Vale ficar no convés durante a travessia: é a melhor vista de Bellagio que a viagem oferece, com o promontório de frente e as duas margens abrindo dos lados. ~€ 15–20 o carro com dois passageiros."},{"horario":"16h00","nome":"Check-in no Hotel Bellavista — Menaggio","descricao":"Via IV Novembre, 21 — hotel na beira do lago, no centro de Menaggio, a ~150 m do embarcadouro. Quarto duplo panorâmico com vista para o lago, café da manhã incluso. Confirmação 72077968953788. Elevador, piscina externa e terraço panorâmico do Ristorante del Porto.","dica":"IMPORTANTE: a recepção funciona das 08h às 22h e não aceita check-in depois das 22h. A garagem é paga e fica do outro lado da rua — descarregar as malas na porta primeiro e só depois levar o carro."},{"horario":"17h30 – 19h00","nome":"Menaggio a pé","descricao":"Menaggio é a mais plana das vilas do centro-lago: calçadão largo à beira d'água, praça central com cafés e nenhuma ladeira. Um primeiro passeio sem esforço, com Bellagio de frente do outro lado da água.","dica":"O fim de tarde ilumina o promontório de Bellagio bem em frente ao hotel — a vista do terraço já entrega o cartão-postal sem sair do lugar."},{"horario":"20h00","nome":"Jantar à beira do lago","descricao":"","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Campanone (Torre Civica)</span><span>€5</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço em Bérgamo</span><span>€35</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Combustível e pedágio</span><span>€10</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Balsa Varenna → Menaggio (carro, dividido)</span><span>€9</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Garagem do hotel (por dia, dividida)</span><span>€13</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar em Menaggio</span><span>€55</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€127</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Ristorante del Porto</strong> — no próprio hotel | Veranda panorâmica sobre o lago, peixes do Como | ~€45-60 por pessoa</div><div style='margin-bottom:6px'><strong>Osteria Il Pozzo</strong> — centro de Menaggio | Cozinha local honesta, ambiente simples | ~€35-45 por pessoa</div><div style='margin-bottom:6px'><strong>Ristorante La Vetta</strong> — Menaggio | Boa carta de vinhos e clássicos lombardos | ~€40-55 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Balsas e horários (inclusive travessia de carro): navigazionelaghi.it · Hotel Bellavista: hotel-bellavista.org · Turismo Menaggio: menaggio.com","dica":""}],"deslocamentos":["Bérgamo → Varenna: carro pela SS36, ~1h15 (~75 km)","Varenna → Menaggio: balsa com o carro, ~20 min, ~€ 15–20","Embarcadouro de Menaggio → Hotel Bellavista: ~150 m a pé, no plano"]},{"num":12,"data":"2026-08-28","titulo":"O Triângulo do Lago: Bellagio e Varenna","resumo":"Menaggio é um dos três vértices do triângulo de balsas do centro-lago, e hoje o dia é todo sobre isso. O carro fica na garagem: de manhã, travessia de 15 minutos até Bellagio; à tarde, Varenna do outro lado; e no fim do dia, de volta a Menaggio para o pôr do sol. Nenhum trecho de estrada, nenhuma ladeira obrigatória — só barco e beira d'água.","energia":"🟢 Leve","atividades":[{"horario":"08h00","nome":"Café da manhã no hotel","descricao":"Incluso na diária, servido com vista para o lago.","dica":""},{"horario":"09h15","nome":"Balsa Menaggio → Bellagio (~15 min)","descricao":"O embarcadouro fica a 150 m do hotel, tudo plano. Saídas frequentes ao longo do dia.","dica":"Comprar bilhete de ida e volta ou passe diário no guichê — sai mais barato que trechos avulsos e permite improvisar os horários."},{"horario":"09h30 – 12h30","nome":"Bellagio — 'A Pérola do Lago'","descricao":"Chegando de barco, o desembarque é na orla, no nível da água — evita-se toda a subida que quem chega de carro enfrenta. A caminhada pela Riva e pelo calçadão é plana. Os Jardins de Villa Melzi ficam a ~10 min a pé pela beira do lago, também sem escadaria, e estão entre os mais bonitos do Como (entrada ~€8).","dica":"As famosas ruelas em escadaria de Bellagio são bonitas mas íngremes — dá para ver a base delas sem subir. Villa Melzi entrega mais beleza com muito menos esforço."},{"horario":"12h30","nome":"Almoço em Bellagio","descricao":"","dica":""},{"horario":"14h30","nome":"Balsa Bellagio → Varenna (~15 min)","descricao":"O segundo lado do triângulo. Varenna é mais reservada e menos turística que Bellagio.","dica":""},{"horario":"15h00 – 17h00","nome":"Varenna — Passeggiata degli Innamorati e Villa Monastero","descricao":"O calçadão dos namorados corre rente à água, sobre passarelas — plano e curto. A Villa Monastero tem jardim botânico à beira do lago, estendido por quase 2 km de terraços (~€5 entrada).","dica":"O centro histórico de Varenna sobe em degraus a partir da orla. A parte boa do passeio é justamente a de baixo, então não há motivo para encarar a subida."},{"horario":"17h30","nome":"Balsa Varenna → Menaggio (~20 min)","descricao":"O terceiro lado do triângulo fecha o dia de volta à base.","dica":"Conferir o horário da última travessia ainda de manhã — em agosto a operação vai até o começo da noite, mas os intervalos aumentam depois das 19h."},{"horario":"18h15","nome":"Fim de tarde no hotel — piscina e terraço","descricao":"O terraço panorâmico do hotel olha direto para o promontório de Bellagio. É a melhor hora da luz e não exige sair do lugar.","dica":""},{"horario":"20h00","nome":"Jantar — última noite no lago","descricao":"","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Passe diário de balsas do centro-lago</span><span>€20</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jardins de Villa Melzi</span><span>€8</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Villa Monastero</span><span>€5</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço em Bellagio</span><span>€45</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Garagem do hotel</span><span>€13</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar</span><span>€60</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€151</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Ristorante Bilacus</strong> — Bellagio | Tradicional, reserva recomendada | ~€50-65 por pessoa</div><div style='margin-bottom:6px'><strong>Albergo Milano</strong> — Varenna | Terraço sobre a água, atmosfera romântica | ~€55-70 por pessoa</div><div style='margin-bottom:6px'><strong>Ristorante del Porto</strong> — Hotel Bellavista, Menaggio | Jantar sem deslocamento nenhum na última noite | ~€45-60 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Horários das balsas do centro-lago: navigazionelaghi.it · Villa Melzi: villamelzi.it · Villa Monastero: villamonastero.eu","dica":""}],"deslocamentos":["Hotel → embarcadouro de Menaggio: ~150 m a pé, no plano","Menaggio → Bellagio: balsa, ~15 min","Bellagio → Varenna: balsa, ~15 min","Varenna → Menaggio: balsa, ~20 min","O carro fica na garagem o dia inteiro"]},{"num":13,"data":"2026-08-29","titulo":"Menaggio → Milão → Interlaken","resumo":"Despedida do lago e entrada na Suíça. A devolução do Audi está marcada para as 11:30 na Estação Milano Centrale, e a saída de Menaggio precisa ser cedo: a SS340 até Como é estreita e imprevisível em agosto. Depois, almoço na estação e o EuroCity 42 pela rota do Simplon até Brig, onde o Swiss Travel Pass assume: duas conexões curtas e a chegada em Interlaken West às 16:53.","energia":"🟢 Leve","atividades":[{"horario":"⚠️","nome":"Atenção — saída às 08h30, sem balsa","descricao":"A tentação é atravessar de balsa até Varenna e pegar a SS36, mas em agosto a fila de veículos no embarcadouro não é previsível e a devolução às 11:30 é contratual. A rota segura é por terra: SS340 até Como e A9 até Milão, ~85 km e 1h30 a 1h45.","dica":"Num sábado de manhã de fim de agosto o fluxo pesado é no sentido contrário — gente subindo para o lago. Vocês estarão na direção boa."},{"horario":"07h30","nome":"Café da manhã no hotel","descricao":"O café do Bellavista está incluso e começa cedo — vale aproveitar antes de pegar a estrada.","dica":""},{"horario":"08h15","nome":"Check-out e retirada do carro na garagem","descricao":"O check-out é até as 11h, então há folga. Carregar as malas na porta do hotel e trazer o carro da garagem em frente.","dica":""},{"horario":"08h30","nome":"Menaggio → Milano Centrale","descricao":"Descida pela SS340 (Via Regina) margeando o lago até Como, depois A9 e A8 até Milão. ~1h30 a 1h45 com o trânsito de agosto.","dica":"Abastecer o Audi antes de entrar em Milão: devolver com o tanque cheio evita a cobrança de reabastecimento com ágio. Há postos na saída de Como."},{"horario":"11h30","nome":"Devolução do Audi — Autovia, Milano Centrale","descricao":"Devolução contratual às 11:30 na Estação Milano Centrale (conf. AUT-26291758). A partir daqui a viagem é 100% de trem, teleférico e a pé.","dica":"Fotografar o carro na entrega e guardar o comprovante — a caução de € 950 só é liberada depois da vistoria."},{"horario":"11h45 – 12h40","nome":"Milão Centrale — almoço","descricao":"A Centrale tem guarda-volumes (Kipoint), mas com o trem às 13:10 provavelmente nem será necessário. Almoço leve na própria estação ou no entorno. Estar na plataforma ~12:50 — as portas do EuroCity fecham 2 minutos antes da partida.","dica":"Não há necessidade de explorar Milão — é parada logística."},{"horario":"13h10 – 15h18","nome":"EuroCity 42 · Milão Centrale → Brig (1ª classe)","descricao":"Bilhetes emitidos (PNR JTWX7N): carro 1, assentos 73 e 75, 1ª classe. Embarque em Milano Centrale — as portas fecham 2 minutos antes da partida. Rota do Simplon: planície lombarda, Lago Maggiore, Domodossola e o túnel do Simplon até Brig, já no Valais suíço.","dica":"⚠️ A linha Milão–Domodossola está em obras ao longo de 2026, por vezes com aviso curto. Conferir no app da SBB ou da Trenitalia 3–4 dias antes se o EC 42 de 29/08 segue partindo de Milão Centrale às 13:10 ou se haverá ônibus substitutivo Milão → Domodossola — o bilhete continua válido, mas o horário e o ponto de embarque mudam."},{"horario":"15h45 – 16h21","nome":"IC 6 · Brig → Spiez (Swiss Travel Pass)","descricao":"27 minutos de folga em Brig, na mesma estação. Daqui em diante tudo é coberto pelo Swiss Travel Pass, sem reserva: basta embarcar e apresentar o passe com o passaporte.","dica":"Sentar do lado esquerdo — o trem margeia o vale do Ródano e depois o Lago Thun aparece na aproximação de Spiez."},{"horario":"16h35 – 16h53","nome":"IC 81 · Spiez → Interlaken West (Swiss Travel Pass)","descricao":"Troca de trem em Spiez com 14 minutos de folga. Desembarque em Interlaken West — melhor que Ost neste caso: o ônibus para Beatenberg sai da porta da estação.","dica":""},{"horario":"17h05 – 17h37","nome":"PostAuto 101 · Interlaken West → Beatenberg","descricao":"O hotel fica em Beatenberg, vilarejo a 1.200 m de altitude com vista para o Eiger, Mönch, Jungfrau e o Lago Thun. O ônibus PostAuto linha 101 sai em frente à estação de Interlaken West às 17:05 e chega a Beatenberg às 17:37 — coberto pelo Swiss Travel Pass.","dica":"Se perderem o das 17:05, o próximo sai às 17:35. Alternativa cênica: ônibus 21 até Beatenbucht + funicular histórico até Beatenberg."},{"horario":"17h45","nome":"Check-in no Hotel Fassbind Beausite — Beatenberg","descricao":"Seis noites no mesmo hotel, de 29/08 a 04/09. Confirmação 72077216978910.","dica":"A partir daqui não há mais malas para arrumar por seis dias — o ritmo da viagem muda completamente."},{"horario":"20h00","nome":"Jantar em Beatenberg","descricao":"","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>EC 42 Milão → Brig (já pago, PNR JTWX7N)</span><span>—</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Brig → Interlaken West</span><span>coberto pelo Swiss Travel Pass</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Combustível e pedágio até Milão</span><span>€18</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço Milão</span><span>€25</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar em Beatenberg</span><span>€55</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€173</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Restaurant Schuh</strong> — Interlaken | Clássico suíço, ambiente histórico, vista para o Jungfrau | ~€50-65 por pessoa</div><div style='margin-bottom:6px'><strong>Laterne</strong> — Interlaken | Cozinha suíça contemporânea, aconchegante | ~€40-55 por pessoa</div><div style='margin-bottom:6px'><strong>Restaurante do Fassbind Beausite</strong> — Beatenberg | Jantar no próprio hotel, sem deslocamento na noite da chegada | ~€45-60 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Trens suíços e Swiss Travel Pass: sbb.ch / swisstravelsystem.com · Horários PostAuto 101: postauto.ch · Trânsito na SS340: autostrade.it","dica":""}],"deslocamentos":["Menaggio → Milano Centrale: carro pela SS340 e A9, ~1h30–1h45 (~85 km) — saída às 08h30","Milão → Interlaken Ost: trem EuroCity, ~3h30, ~€70/pessoa","A partir de agora: apenas trem, teleférico e a pé — carro devolvido","Interlaken West → Beatenberg: ônibus PostAuto linha 101, ~15 min, Swiss Travel Pass"]},{"num":14,"data":"2026-08-30","titulo":"Lauterbrunnen: o Vale das Cachoeiras","resumo":"Lauterbrunnen é um dos vales mais espetaculares da Europa — 72 cachoeiras despencando das paredes rochosas que cercam o vilarejo. De trem de Interlaken, chegam em minutos a um cenário que parece irreal. Passeio tranquilo pelo vale, a famosa Staubbach Falls e a tarde livre para contemplar.","energia":"🟢 Leve","atividades":[{"horario":"08h30","nome":"Café da manhã no hotel","descricao":"","dica":""},{"horario":"09h15","nome":"Trem Interlaken Ost → Lauterbrunnen (~20 min)","descricao":"Coberto pelo Swiss Travel Pass.","dica":""},{"horario":"09h35","nome":"Chegada a Lauterbrunnen","descricao":"O vale se revela imediatamente ao sair da estação — paredes rochosas de 300m e cachoeiras por toda parte.","dica":""},{"horario":"10h00 – 12h00","nome":"Passeio pelo vale — Staubbach Falls","descricao":"Caminhada leve pela estrada principal do vale — plana, sem esforço. Staubbach Falls — a cachoeira mais famosa, 297m de queda livre, acessível a pé da estação. Entrada gratuita.","dica":"A névoa da cachoeira refresca no calor de agosto — levar uma camada leve caso queiram chegar perto."},{"horario":"11h00","nome":"Trümmelbach Falls (imperdível)","descricao":"Cachoeiras dentro da montanha — únicas no mundo. Acesso por elevador interno na rocha. ~20 min de caminhada do centro ou táxi local.","dica":"Entrada ~CHF 14 (~€15) por pessoa. Vale muito — é uma experiência geológica única. Moderadamente úmido dentro — levar jaqueta leve."},{"horario":"13h00","nome":"Almoço em Lauterbrunnen","descricao":"","dica":""},{"horario":"14h30","nome":"Mürren — vilarejo sem carros no alto do vale","descricao":"De Lauterbrunnen, teleférico + trem de montanha até Mürren (~25 min). Vilarejo alpino suspenso a 1.650m, sem carro nenhum, com vista direta para o Eiger, Mönch e Jungfrau.","dica":"Coberto pelo Swiss Travel Pass. Caminhar pelo vilarejo, tomar um café e simplesmente existir naquele cenário já é suficiente."},{"horario":"16h30","nome":"Retorno a Interlaken","descricao":"","dica":""},{"horario":"17h00","nome":"Descanso no hotel — spa ou piscina","descricao":"","dica":""},{"horario":"20h00","nome":"Jantar em Interlaken","descricao":"","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Swiss Travel Pass 8 dias (já emitido)</span><span>amortizado em todos os dias</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Trümmelbach Falls</span><span>€15</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço Lauterbrunnen</span><span>€32</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Café em Mürren</span><span>€16</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar Interlaken</span><span>€58</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€121 (+ Pass amortizado)</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Restaurant Horner</strong> — Lauterbrunnen | Vista para o vale, rösti e fondue | ~€35-45 por pessoa</div><div style='margin-bottom:6px'><strong>Eiger Guesthouse</strong> — Mürren | Café e almoço leve com vista para o Eiger | ~€25-35 por pessoa</div><div style='margin-bottom:6px'><strong>Restaurant du Nord</strong> — Interlaken | Jantar clássico suíço, ambiente familiar | ~€40-55 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Trümmelbach Falls: truemmelbach.ch · Teleférico Lauterbrunnen-Mürren: schilthornbahn.ch · Swiss Travel Pass: swisstravelsystem.com","dica":""}],"deslocamentos":["Beatenberg → Interlaken: ônibus PostAuto, ~15 min, Swiss Travel Pass","Interlaken → Lauterbrunnen: trem, ~20 min, Swiss Travel Pass","Lauterbrunnen → Trümmelbach: a pé ~20 min ou táxi local ~CHF 10","Lauterbrunnen → Mürren: teleférico + trem, ~25 min, Swiss Travel Pass","Mürren → Interlaken: trem + teleférico, ~40 min, Swiss Travel Pass","Interlaken → Beatenberg: ônibus, ~15 min, Swiss Travel Pass"]},{"num":15,"data":"2026-08-31","titulo":"Grindelwald: o Eiger de Perto","resumo":"Grindelwald é o vilarejo alpino mais dramático da região — dominado pela face norte do Eiger, uma das paredes rochosas mais famosas do mundo. De trem de Interlaken, chegam em 35 minutos a um cenário de cartão-postal. Passeio pela vila, subida de gôndola e tarde contemplativa com os Alpes na janela.","energia":"🟢 Leve-Moderado","atividades":[{"horario":"08h30","nome":"Café da manhã no hotel","descricao":"","dica":""},{"horario":"09h15","nome":"Trem Interlaken Ost → Grindelwald (~35 min)","descricao":"Coberto pelo Swiss Travel Pass. A viagem já é bonita — vale sentar do lado direito para ver o Eiger aparecer.","dica":""},{"horario":"10h00 – 12h00","nome":"Passeio por Grindelwald","descricao":"Vila charmosa de casas de madeira com o Eiger ao fundo. Rua principal com lojas de artesanato, chocolates e queijos suíços. O Grindelwald Terminal é o hub das gôndolas — moderno e bem sinalizado.","dica":""},{"horario":"10h30","nome":"First Cliff Walk — subida de gôndola até First (2.168m)","descricao":"A First Cliff Walk é uma passarela suspensa sobre o precipício com vista para o vale e as geleiras.","dica":"Gôndola ~CHF 50 ida e volta por pessoa (Swiss Travel Pass dá desconto de 25% — ~CHF 37). Nível físico: leve — a passarela é plana e com corrimão. Duração ~1h. Levar casaco — ventoso no alto."},{"horario":"12h30","nome":"Almoço no alto — Restaurante First","descricao":"Almoço com vista panorâmica para o Eiger e o vale de Grindelwald lá embaixo.","dica":""},{"horario":"14h00","nome":"Retorno de gôndola e passeio livre em Grindelwald","descricao":"Compras de chocolate, queijo e lembranças. Café na praça central.","dica":""},{"horario":"15h30","nome":"Trem Grindelwald → Interlaken (~35 min)","descricao":"","dica":""},{"horario":"16h30","nome":"Chegada e tarde livre no hotel","descricao":"","dica":""},{"horario":"20h00","nome":"Jantar especial em Interlaken","descricao":"","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Gôndola First (com desconto Swiss Pass)</span><span>€40</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço First</span><span>€43</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Café/compras Grindelwald</span><span>€27</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar Interlaken</span><span>€64</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€174</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Restaurant First</strong> — First (2.168m) | Almoço com vista para o Eiger | ~€40-50 por pessoa</div><div style='margin-bottom:6px'><strong>Café 3692</strong> — Grindelwald | Moderno e descontraído, no centro do vilarejo | ~€30-40 por pessoa</div><div style='margin-bottom:6px'><strong>Restaurant Schmitte</strong> — Interlaken | Jantar suíço tradicional, ambiente rústico elegante | ~€55-70 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Swiss Travel Pass: swisstravelsystem.com · Trens suíços: sbb.ch · Gôndolas Grindelwald: jungfrau.ch","dica":""}],"deslocamentos":["Beatenberg → Interlaken: ônibus PostAuto, ~15 min, Swiss Travel Pass","Interlaken → Grindelwald: trem, ~35 min, Swiss Travel Pass","Grindelwald → First: gôndola, ~25 min, ~CHF 37 com desconto Pass","Retorno: trem Grindelwald → Interlaken, ~35 min","Interlaken → Beatenberg: ônibus, ~15 min, Swiss Travel Pass"]},{"num":16,"data":"2026-09-01","titulo":"Jungfraujoch: o Topo da Europa (3.454m)","resumo":"O dia mais alto da viagem — literalmente. O Jungfraujoch (3.454m) é chamado de 'Topo da Europa' e é uma das experiências mais extraordinárias dos Alpes. Bilhetes emitidos (reserva #401902): saída de Interlaken Ost às 10h04, subida pelo Eiger Express e cerca de três horas no topo, com retorno às 16h24. Neve em pleno setembro, geleiras infinitas e um silêncio que impressiona.","energia":"🟢 Leve (atenção à altitude)","atividades":[{"horario":"⚠️","nome":"Atenção","descricao":"ALTITUDE (3.454m): Algumas pessoas sentem leve tontura ou cansaço — completamente normal. Recomendações: subir devagar, não fazer esforço físico, beber bastante água, evitar álcool antes da subida. Se sentirem desconforto, descansar na estação — não há risco real para pessoas saudáveis.","dica":""},{"horario":"08h30","nome":"Café da manhã sem pressa","descricao":"A saída é às 10h04 — não há necessidade de acordar cedo. Manhã tranquila no hotel antes de descer para Interlaken Ost.","dica":"Conferir a webcam ao vivo do topo em jungfrau.ch no café da manhã. Se o dia estiver fechado, a reserva pode ser remarcada pelo próprio site."},{"horario":"09h15 – 10h04","nome":"Beatenberg → Interlaken Ost (Swiss Travel Pass)","descricao":"PostAuto 101 até Interlaken West e conexão até Interlaken Ost, ou o ônibus 21 + funicular. Coberto pelo Swiss Travel Pass. Chegar com folga: o trem sai da Plataforma 2B às 10h04 em ponto.","dica":""},{"horario":"10h04 – 11h41","nome":"Subida ao Jungfraujoch pelo Eiger Express (reserva #401902)","descricao":"Três etapas, todas já emitidas: trem R61 de Interlaken Ost (Plataforma 2B) até Grindelwald Terminal às 10h33; gôndola Eiger Express (GB2444) das 10h43 até Eigergletscher às 11h01, com o Eiger a poucos metros da janela; e o trem cremalheira CC65 das 11h13, por dentro da montanha, até Jungfraujoch às 11h41 (Plataforma 3).","dica":"Esta é a rota moderna, mais rápida e com menos escadas que a antiga via Kleine Scheidegg. A reserva de assento no trecho final é obrigatória e já está incluída — vale apenas para esta conexão específica, então não dá para antecipar ou atrasar os trens no caminho. Duas trocas de veículo, ambas planas e sinalizadas."},{"horario":"11h41 – 14h45","nome":"Jungfraujoch (3.454m)","descricao":"Sphinx Observatory — terraço com vista 360° para as geleiras e os Alpes. Geleira Aletsch — a maior geleira dos Alpes, visível do alto, 23km de comprimento. Palácio de Gelo — túneis e esculturas esculpidos dentro da geleira. Snow Fun Park — área de neve ao ar livre para fotos e primeiras pisadas na neve.","dica":"Levar óculos de sol escuros obrigatoriamente — a reverberação da neve machuca os olhos. Casaco de inverno essencial mesmo em setembro."},{"horario":"12h30","nome":"Almoço no Crystal Restaurant — Jungfraujoch","descricao":"Almoço no restaurante dentro da estação, a 3.454m. Não é gourmet, mas a experiência de almoçar no alto dos Alpes não tem preço. Deixa a tarde livre para o Sphinx e o Palácio de Gelo.","dica":""},{"horario":"14h45 – 16h24","nome":"Descida — Jungfraujoch → Interlaken Ost","descricao":"Mesma rota ao contrário: CC65 das 14h45 (Plataforma 3) até Eigergletscher às 15h11; Eiger Express das 15h20 até Grindelwald Terminal às 15h38; e o trem R61 das 15h51 (Plataforma 1) chegando a Interlaken Ost às 16h24 (Plataforma 2).","dica":"Estar na plataforma do Jungfraujoch alguns minutos antes das 14h45 — a reserva de assento vale só para este horário."},{"horario":"16h24","nome":"Chegada a Interlaken","descricao":"","dica":""},{"horario":"17h00","nome":"Descanso total no hotel","descricao":"Após a altitude, o corpo pede repouso. Spa, piscina ou simplesmente a cama.","dica":""},{"horario":"20h00","nome":"Jantar tranquilo","descricao":"","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jungfraujoch (já pago, reserva #401902)</span><span>—</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço no topo</span><span>€37</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Extras (loja de lembrança, fotos)</span><span>€21</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar Interlaken</span><span>€58</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€271</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Crystal Restaurant</strong> — Jungfraujoch | Almoço histórico no topo da Europa | ~€35-45 por pessoa</div><div style='margin-bottom:6px'><strong>Restaurant Metropole</strong> — Interlaken | Jantar com vista para o Jungfrau, ambiente refinado | ~€55-70 por pessoa</div><div style='margin-bottom:6px'><strong>Thai Garden</strong> — Interlaken | Para variar após dias de culinária europeia | ~€30-40 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Jungfraujoch reservas e webcam: jungfrau.ch · Swiss Travel Pass: swisstravelsystem.com · Trens suíços: sbb.ch","dica":""}],"deslocamentos":["Beatenberg → Interlaken: ônibus PostAuto, ~15 min, Swiss Travel Pass","Interlaken → Jungfraujoch: trem cremalheira, ~2h, ~CHF 145/pessoa com Good Morning Ticket","Retorno: mesmo trajeto, ~2h","Interlaken → Beatenberg: ônibus, ~15 min, Swiss Travel Pass"]},{"num":17,"data":"2026-09-02","titulo":"Lago de Brienz, Iseltwald e Harder Kulm","resumo":"Depois da intensidade do Jungfraujoch, um dia de beleza serena à beira d’água. O Lago de Brienz é de um azul-turquesa impossível — um dos mais bonitos da Suíça. Passeio de barco, o vilarejo de Iseltwald que viralizou no mundo todo, e no fim da tarde a subida ao Harder Kulm: a mesma paisagem vista de cima, com os dois lagos lado a lado na melhor luz do dia.","energia":"🟢 Leve","atividades":[{"horario":"09h00","nome":"Café da manhã tranquilo no hotel","descricao":"","dica":""},{"horario":"10h00","nome":"Barco Interlaken → Brienz (~1h15)","descricao":"O barco pelo Lago de Brienz é uma das experiências mais relaxantes da região — ~1h15 de travessia em águas turquesa com os Alpes ao redor.","dica":"Verificar horários em bls.ch — saídas regulares pela manhã. Sentar no convés externo para aproveitar a vista."},{"horario":"11h15","nome":"Brienz","descricao":"Pequeno vilarejo famoso pela tradição de entalhes em madeira — artesanato suíço mais autêntico. Passeio tranquilo, lojas artesanais e café à beira do lago.","dica":"Brienz Rothorn — trem a vapor histórico que sobe até 2.350m com vista deslumbrante. ~CHF 80 ida e volta. Opcional — leva ~3h entre subida, topo e descida. Bom para quem quiser mais montanha."},{"horario":"12h30","nome":"Almoço em Brienz","descricao":"","dica":""},{"horario":"14h00","nome":"Iseltwald — O Píer Famoso","descricao":"O píer de madeira que avança sobre o lago turquesa — ficou mundialmente famoso após aparecer na série coreana Crash Landing on You. Uma das fotos mais icônicas da Suíça.","dica":"De Brienz, pegar o barco ou trem de volta até Interlaken e descer em Iseltwald (~20 min). Entrada no píer ~CHF 5. Ir dia de semana — fins de semana têm fila."},{"horario":"15h30","nome":"Retorno a Interlaken","descricao":"","dica":""},{"horario":"16h30","nome":"Funicular Interlaken Ost → Harder Kulm (1.322m, ~10 min)","descricao":"A estação do funicular fica a poucos passos de Interlaken Ost. Subida curta e íngreme por dentro da floresta.","dica":"Bilhete ~CHF 34 ida e volta por pessoa; Swiss Travel Pass dá 25% de desconto (~CHF 26). Conferir o horário do último funicular de descida em harderkulm.ch antes de subir."},{"horario":"16h45 – 18h30","nome":"Harder Kulm — Two Lakes Bridge","descricao":"A plataforma panorâmica avança sobre o precipício com vista simultânea para o Lago Thun e o Lago Brienz, além do Eiger, Mönch e Jungfrau ao fundo. Fim de tarde é o melhor horário: a névoa da manhã já se dissipou e a luz fica dourada sobre os dois lagos.","dica":"Depois de atravessar o lago de barco pela manhã, ver o mesmo lago de 1.322m fecha o dia de um jeito difícil de superar."},{"horario":"18h45","nome":"Descida do funicular","descricao":"","dica":""},{"horario":"19h30","nome":"Jantar em Interlaken","descricao":"","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Barcos e trens</span><span>cobertos pelo Swiss Travel Pass</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Entrada píer Iseltwald</span><span>€5</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço em Brienz</span><span>€40</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Funicular Harder Kulm (com desconto Swiss Pass)</span><span>€28</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar em Interlaken</span><span>€55</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€128</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Restaurant Lindenhügel</strong> — Brienz | Cozinha suíça clássica à beira do lago | ~€35-45 por pessoa</div><div style='margin-bottom:6px'><strong>Belvédère Strandhotel</strong> — Iseltwald | Almoço com vista direta para o lago turquesa | ~€40-55 por pessoa</div><div style='margin-bottom:6px'><strong>Restaurant Harder Kulm</strong> — topo do funicular | Café ou aperitivo com vista panorâmica sobre os dois lagos | ~€25-35 por pessoa</div><div style='margin-bottom:6px'><strong>Laterne</strong> — Interlaken | Cozinha suíça contemporânea, aconchegante | ~€40-55 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Harder Kulm horários e último funicular: harderkulm.ch · Barcos nos lagos: bls.ch · Trens suíços: sbb.ch","dica":""}],"deslocamentos":["Beatenberg → Interlaken: ônibus PostAuto, ~15 min, Swiss Travel Pass","Interlaken → Brienz: barco, ~1h15, Swiss Travel Pass","Iseltwald → Interlaken: barco ou ônibus, ~30 min, Swiss Travel Pass","Interlaken Ost → Harder Kulm: funicular, ~10 min","Interlaken → Beatenberg: ônibus PostAuto, ~15 min — conferir horário do último ônibus da noite"]},{"num":18,"data":"2026-09-03","titulo":"Berna: a Capital Medieval","resumo":"Escapada de um dia à capital suíça — Berna surpreende pela beleza medieval intacta, as arcadas cobertas (laubengänge) que protegem do sol e da chuva, e o charme despreocupado de uma cidade que não precisa se esforçar para impressionar. Arquitetura sem museus — exatamente o que Oswaldo e Mônica gostam.","energia":"🟢 Leve-Moderado","atividades":[{"horario":"09h00","nome":"Café da manhã no hotel","descricao":"","dica":""},{"horario":"09h45","nome":"Trem Interlaken → Berna (~50 min)","descricao":"Coberto pelo Swiss Travel Pass.","dica":""},{"horario":"10h40","nome":"Chegada a Berna","descricao":"","dica":""},{"horario":"11h00 – 13h00","nome":"Centro histórico de Berna — Patrimônio UNESCO","descricao":"As Laubengänge — 6km de arcadas cobertas medievais que percorrem o centro histórico. Zytglogge — torre do relógio astronômico do século XIII com mecanismo animado que funciona a cada hora cheia. Münster de Berna — catedral gótica com torre de 100m. Subir é opcional — ~254 degraus, vista panorâmica dos Alpes.","dica":"O centro de Berna é completamente plano e todo a pé — ótimo para o ritmo deles. Evitar a subida da torre no calor se estiverem cansados."},{"horario":"13h00","nome":"Almoço em Berna","descricao":"","dica":""},{"horario":"14h30 – 16h00","nome":"Rosengarten e vista panorâmica","descricao":"O Jardim das Rosas de Berna fica num morro com vista panorâmica para o centro histórico medieval e os Alpes ao fundo — uma das melhores vistas urbanas da Suíça. Entrada gratuita.","dica":"~15 min a pé do centro ou táxi (~CHF 10). O jardim tem café simpático para uma pausa."},{"horario":"16h30","nome":"Trem Berna → Interlaken (~50 min)","descricao":"","dica":""},{"horario":"17h30","nome":"Chegada e descanso","descricao":"","dica":""},{"horario":"20h00","nome":"Jantar — penúltima noite na Suíça","descricao":"","dica":""},{"horario":"💰","nome":"Custos Estimados (por pessoa)","descricao":"<div style='display:flex;justify-content:space-between;padding:2px 0'><span>Trens</span><span>cobertos pelo Swiss Travel Pass</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Münster (subida torre, opcional)</span><span>€5</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Almoço Berna</span><span>€43</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Café Rosengarten</span><span>€16</span></div><div style='display:flex;justify-content:space-between;padding:2px 0'><span>Jantar Interlaken</span><span>€64</span></div><div style='display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--accent)'><span>Total estimado do dia</span><span>~€128</span></div>","dica":""},{"horario":"🍽️","nome":"Restaurantes Sugeridos","descricao":"<div style='margin-bottom:6px'><strong>Restaurant Lötschberg</strong> — Berna | Especialidade em raclette e fondue, ambiente histórico | ~€40-55 por pessoa</div><div style='margin-bottom:6px'><strong>Café du Commerce</strong> — Berna | Almoço descontraído sob as arcadas medievais | ~€30-40 por pessoa</div><div style='margin-bottom:6px'><strong>Restaurant Metropole</strong> — Interlaken | Jantar elegante, boa carta de vinhos | ~€60-75 por pessoa</div>","dica":""},{"horario":"🔗","nome":"Links Úteis","descricao":"Turismo Berna: bern.com · Zytglogge: bern.com/zytglogge · Trens: sbb.ch","dica":""}],"deslocamentos":["Beatenberg → Interlaken: ônibus PostAuto, ~15 min, Swiss Travel Pass","Interlaken → Berna: trem, ~50 min, Swiss Travel Pass","Berna: todo a pé ou táxi local","Berna → Interlaken: trem, ~50 min, Swiss Travel Pass","Interlaken → Beatenberg: ônibus, ~15 min, Swiss Travel Pass"]},{"num":19,"data":"2026-09-04","titulo":"Despedida dos Alpes → Genebra","resumo":"Depois de seis dias de montanha, o último merece ser o mais lento de todos. Manhã inteiramente livre em Beatenberg e Interlaken — sem funicular, sem trem de montanha, sem hora marcada. À tarde, o trem atravessa o planalto suíço até Genebra, onde ficam duas noites. O entardecer de hoje é só um primeiro contato com a beira do Léman — a cidade velha e a rota da Reforma ficam inteiras para amanhã.","energia":"🟢 Leve","atividades":[{"horario":"08h30","nome":"Café da manhã sem hora marcada","descricao":"A varanda do hotel em Beatenberg entrega Eiger, Mönch e Jungfrau de frente. Vale um café demorado só olhando.","dica":""},{"horario":"09h00 – 11h30","nome":"Manhã livre","descricao":"Nenhuma sugestão de passeio — dia para respirar. Quem quiser descer a Interlaken tem a Höheweg para uma última caminhada com vista para o Jungfrau e as lojas para as compras finais.","dica":"Läderach tem loja em Interlaken — o melhor chocolate suíço fre
