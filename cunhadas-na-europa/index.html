onferir no cartão de embarque o terminal de saída — em Lisboa, parte das companhias low-cost opera no Terminal 2, ligado ao Terminal 1 por ônibus gratuito.","dica":"Fazer o check-in online antes de chegar ao aeroporto: algumas low-cost cobram pelo check-in no balcão."},{"horario":"14:00","nome":"Voo LIS → MXP (Milão Malpensa)","descricao":"Localizador KD63M49 · 1 bagagem despachada por passageira · chegada às 17:35 (horário da Itália, 1h à frente de Lisboa).","dica":""},{"horario":"17:35","nome":"Malpensa → centro de Milão","descricao":"O Malpensa Express liga o aeroporto à estação Milano Centrale em cerca de 50 minutos. Táxi e transfer também são opções com bagagem.","dica":"Milano Centrale é a estação de partida de quase todos os trens da semana — hospedagem perto dela facilita muito as manhãs."},{"horario":"Noite","nome":"Check-in no hotel e jantar leve","descricao":"Primeira noite na Itália depois de um dia longo — jantar perto do hotel e descanso.","dica":""}],"deslocamentos":[]},{"num":3,"data":"2026-10-17","titulo":"Milão","resumo":"Dia livre para se ambientar e recuperar do fuso.","energia":"🔋 Leve","atividades":[{"horario":"Manhã","nome":"Duomo di Milano e terraços","descricao":"A catedral é o cartão-postal da cidade. Os terraços no telhado têm vista de perto das agulhas góticas e de toda a praça.","dica":"Ingressos com horário marcado evitam fila, principalmente no sábado."},{"horario":"Tarde","nome":"Galleria Vittorio Emanuele II e Castello Sforzesco","descricao":"A galeria fica colada à Piazza del Duomo. Uma caminhada pela Via Dante leva ao castelo e ao Parque Sempione.","dica":""},{"horario":"Noite","nome":"Recolher cedo","descricao":"O trem de amanhã sai às 06:20 da Milano Centrale. Deixar roupa de frio, passaporte e bilhetes separados.","dica":"Levar um lanche para o trem: o café da manhã do hotel provavelmente ainda não estará aberto."}],"deslocamentos":[]},{"num":4,"data":"2026-10-18","titulo":"Tirano e St. Moritz","resumo":"Bate-volta de trem pelos Alpes: Lago de Como, Valtellina e a Linha Bernina até a Suíça.","energia":"🔋 Intenso","atividades":[{"horario":"06:20","nome":"Trem Milano Centrale → Tirano · Regionale 2812","descricao":"Chegada às 08:52 · 2ª classe, sem assento marcado. Bilhetes 2944862866 e 2944862865.","dica":"No trecho à beira do Lago de Como a água fica do lado esquerdo do trem, e o dia amanhece durante o percurso."},{"horario":"09:41","nome":"Trem Tirano → St. Moritz · Linha Bernina","descricao":"Chegada às 12:11. A estação da Ferrovia Rética fica ao lado da estação italiana em Tirano. A linha é Patrimônio Mundial da UNESCO: passa pelo viaduto em espiral de Brusio, pelas geleiras e pelo Passo do Bernina, a mais de 2.200 m.","dica":"Bilhetes pessoais, válidos em qualquer trem do dia: apresentar junto com o passaporte. A Suíça usa franco suíço (CHF), mas cartão é aceito em quase todo lugar."},{"horario":"12:11 – 16:30","nome":"St. Moritz","descricao":"Almoço e caminhada ao redor do lago, com as montanhas da Engadina em volta. A cidade fica a cerca de 1.800 m de altitude.","dica":"Meados de outubro é entressafra em St. Moritz: parte do comércio e dos restaurantes fecha. Levar casaco — pode fazer frio de inverno."},{"horario":"16:48","nome":"Trem St. Moritz → Tirano","descricao":"Chegada prevista às 19:02. Mesmo percurso pela Linha Bernina, agora no fim da tarde.","dica":""},{"horario":"20:08","nome":"Trem Tirano → Milano Centrale · Regionale 2843","descricao":"Chegada às 22:40 · 2ª classe, sem assento marcado. Bilhetes 2944862863 e 2944862862.","dica":"Há cerca de 1h em Tirano antes do trem — dá para um lanche rápido perto da estação."}],"deslocamentos":[]},{"num":5,"data":"2026-10-19","titulo":"Bologna","resumo":"Bate-volta à capital gastronômica da Itália.","energia":"🔋 Moderado","atividades":[{"horario":"07:00","nome":"Frecciarossa 9607 · Milano Centrale → Bologna Centrale","descricao":"Chegada às 08:04 · Carro 10, assentos 10D (Léia) e 9D (Jane) · PNR VXF69N.","dica":"As portas fecham 1 minuto antes da partida. O número da plataforma aparece no painel cerca de 15 minutos antes."},{"horario":"Manhã","nome":"Piazza Maggiore e Basílica de San Petronio","descricao":"Da estação são uns 15 a 20 minutos a pé pela Via dell'Indipendenza, sempre sob os pórticos que são Patrimônio da UNESCO. Na praça ficam a basílica, a Fonte de Netuno e os palácios medievais.","dica":""},{"horario":"Almoço","nome":"Quadrilatero","descricao":"Ruelas medievais de mercado atrás da Piazza Maggiore. Lugar para provar tagliatelle al ragù, tortellini e mortadela.","dica":""},{"horario":"Tarde","nome":"Archiginnasio e Due Torri","descricao":"O antigo prédio da universidade tem o Teatro Anatômico em madeira. As duas torres inclinadas são o símbolo da cidade.","dica":"Segunda-feira muitos museus italianos fecham — as ruas, praças e igrejas seguem abertas."},{"horario":"19:06","nome":"Italo 9948 · Bologna Centrale → Milano Centrale","descricao":"Chegada às 20:20 · Carro 7, assentos 5 e 6 · Código QKEDRK.","dica":"A volta é pela Italo, outra companhia: não embarcar no Frecciarossa. Os trens de alta velocidade saem da parte subterrânea da estação — chegar com 20 minutos de folga."}],"deslocamentos":[]},{"num":6,"data":"2026-10-20","titulo":"Verona","resumo":"Bate-volta à cidade de Romeu e Julieta e da Arena romana.","energia":"🔋 Moderado","atividades":[{"horario":"07:25","nome":"Trem Milano Centrale → Verona Porta Nuova · Regionale Trenord 2615","descricao":"Chegada às 09:17 · 2ª classe, sem assento marcado. Bilhetes 2944931268 e 2944931269.","dica":"Bilhete regional: deixar o QR Code do app à mão e, se o app pedir check-in, fazer antes de embarcar."},{"horario":"Manhã","nome":"Arena di Verona e Piazza Bra","descricao":"Da estação são uns 20 minutos a pé. A arena romana do século I segue em uso para óperas.","dica":""},{"horario":"Meio do dia","nome":"Via Mazzini, Casa di Giulietta e Piazza delle Erbe","descricao":"A rua de compras leva ao pátio com a varanda da Julieta e à praça do antigo fórum. A Torre dei Lamberti tem a melhor vista do centro.","dica":""},{"horario":"Fim da tarde","nome":"Ponte Pietra e mirante de Castel San Pietro","descricao":"A ponte romana atravessa o Adige; do outro lado, o mirante mostra a cidade toda.","dica":""},{"horario":"19:02","nome":"Frecciarossa 9752 · Verona Porta Nuova → Milano Centrale","descricao":"Chegada às 20:17 · Carro 7, assentos 18C (Léia) e 18D (Jane) · PNR VXTVSN.","dica":""}],"deslocamentos":[]},{"num":7,"data":"2026-10-21","titulo":"Milão","resumo":"Dia livre em Milão, sem horários de trem.","energia":"🔋 Leve","atividades":[{"horario":"Manhã","nome":"A Última Ceia (Cenacolo Vinciano)","descricao":"O afresco de Leonardo da Vinci fica em Santa Maria delle Grazie.","dica":"Só entra com ingresso antecipado e eles esgotam cedo — reservar com antecedência."},{"horario":"Tarde","nome":"Brera","descricao":"Bairro de ruas de pedra, galerias e cafés, com a Pinacoteca de Brera.","dica":""},{"horario":"Noite","nome":"Aperitivo nos Navigli","descricao":"Os canais ficam animados no fim do dia, com bares servindo aperitivo.","dica":""}],"deslocamentos":[]},{"num":8,"data":"2026-10-22","titulo":"Lago de Como","resumo":"Bate-volta ao Lago de Como.","energia":"🔋 Moderado","atividades":[{"horario":"07:43","nome":"Trem Milano Centrale → Como Lago","descricao":"Trenord 25508 até Como Camerlata (08:17) e troca para o Regionale 117 às 08:34, com chegada em Como Lago às 08:44. Bilhetes 2944947497 e 2944947499.","dica":"A troca em Camerlata tem 17 minutos — conferir a plataforma assim que desembarcar."},{"horario":"Manhã","nome":"Centro de Como e Duomo","descricao":"A estação fica na beira do lago. O centro histórico e a catedral estão a poucos minutos a pé.","dica":""},{"horario":"Meio do dia","nome":"Funicular Como–Brunate","descricao":"Subida rápida até Brunate, com vista de todo o primeiro braço do lago e dos Alpes ao fundo.","dica":""},{"horario":"Tarde","nome":"Passeio de barco ou orla até Villa Olmo","descricao":"Os barcos da Navigazione Laghi saem em frente à estação. A caminhada pela orla até os jardins de Villa Olmo é a alternativa tranquila.","dica":"Em outubro os barcos já têm horário reduzido: conferir o horário de volta antes de embarcar."},{"horario":"17:16","nome":"Trem Como Lago → Milano Centrale","descricao":"Regionale 166 até Como Camerlata (17:25) e troca para o Trenord 25529 às 17:41, com chegada em Milão às 18:17. Bilhetes 2944947496 e 2944947498.","dica":""},{"horario":"Noite","nome":"Arrumar as malas","descricao":"Amanhã cedo é dia de mudar de cidade.","dica":""}],"deslocamentos":[]},{"num":9,"data":"2026-10-23","titulo":"Milão → Veneza","resumo":"Frecciarossa em Business até Veneza e primeiro dia nos canais.","energia":"🔋 Moderado","atividades":[{"horario":"Cedo","nome":"Check-out em Milão","descricao":"Sair do hotel com folga para estar na Milano Centrale por volta das 06:55, com as malas.","dica":""},{"horario":"07:15","nome":"Frecciarossa 9705 · Milano Centrale → Venezia S. Lucia · Business","descricao":"Chegada às 09:44 · Carro 3, assentos 5B (Léia) e 5D (Jane) · PNR VXYT8N.","dica":"Tarifa FrecciaDAYS: não permite alteração nem reembolso."},{"horario":"09:44","nome":"Chegada a Veneza","descricao":"A estação Santa Lucia sai direto no Grande Canal. Vaporetto (linhas 1 ou 2) ou táxi aquático até o hotel.","dica":"Veneza tem muitas pontes com escadas: quanto mais leve a bagagem, melhor. Se o quarto não estiver pronto, deixar as malas no hotel."},{"horario":"Tarde","nome":"Grande Canal de vaporetto e Rialto","descricao":"A linha 1 percorre o Grande Canal devagar, parando em todas as margens — é o passeio mais bonito pelo preço de um bilhete.","dica":""},{"horario":"Fim da tarde","nome":"Piazza San Marco","descricao":"A praça fica mais tranquila no fim do dia. Depois, cicchetti e spritz num bacaro.","dica":""}],"deslocamentos":[]},{"num":10,"data":"2026-10-24","titulo":"Veneza","resumo":"Dia inteiro em Veneza e nas ilhas.","energia":"🔋 Moderado","atividades":[{"hora
