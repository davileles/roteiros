Confins (CNF)","descricao":"Voo doméstico às 12:00. Cheguem com cerca de 1h30 de antecedência para despacho de bagagem — as malas seguirão até Guarulhos apenas, não até a Europa.","dica":"Passaportes, cartões de embarque e o comprovante da Air France separados na bagagem de mão desde já.","lat":-19.6336,"lng":-43.9686},{"horario":"11:25 – 11:40","nome":"Embarque em Confins · Seção 4","descricao":"Janela oficial de embarque do voo Azul 4236. Localizador CMRBMT. Assentos: Maria 16D · Miguel 16C.","dica":"","lat":-19.6336,"lng":-43.9686},{"horario":"12:00 – 13:15","nome":"Voo Confins → Guarulhos · Azul 4236","descricao":"Embraer 195-2 operado pela Azul Linhas Aéreas. 1h15 de duração, sem escalas.","dica":"","lat":-23.4356,"lng":-46.4731},{"horario":"13:15 – 18:05","nome":"Guarulhos: Retirada de Bagagem e Troca para o Terminal 3","descricao":"Atenção: os bilhetes são separados (Azul CMRBMT × Air France CSNWC5). As malas NÃO seguem automaticamente — é preciso retirá-las na esteira doméstica e redespachá-las no balcão da Air France, no Terminal 3.","dica":"A folga é grande de propósito. Almocem com calma, mas façam o redespacho antes de relaxar — o bag drop da Air France fecha às 18:35.","lat":-23.4356,"lng":-46.4731},{"horario":"18:05 – 18:35","nome":"Check-in Air France · Terminal 3 (bag drop até 18:35)","descricao":"Franquia do bilhete executivo: 2 malas de porão de até 32kg cada (máx. 158cm somados), 2 bagagens de mão 55×35×25cm (18kg no total) e 1 item pequeno 40×30×15cm sob o assento.","dica":"","lat":-23.4356,"lng":-46.4731},{"horario":"18:45 – 19:15","nome":"Embarque AF459 · Portão fecha às 19:15","descricao":"Após o fechamento do portão o embarque não é mais possível. Assentos executivos: Miguel 10D · Maria 10A.","dica":"Confiram mudanças de portão no app da Air France ou nos painéis do aeroporto.","lat":-23.4356,"lng":-46.4731},{"horario":"19:35 – 11:55 (+1)","nome":"Voo Guarulhos → Paris CDG · AF459 · Executiva","descricao":"Voo noturno de ~11h20 operado pela Air France. Chegada em Paris às 11:55 do dia 31, no Terminal 2E. Localizador CSNWC5.","dica":"Durmam o quanto puderem — o dia 31 ainda tem conexão em Paris e chegada em Munique à noite.","lat":49.0097,"lng":2.5479}],"deslocamentos":["✈ Confins → Guarulhos: Azul 4236 · 12:00 → 13:15 · PNR CMRBMT · assentos 16D/16C","🧳 GRU doméstico → Terminal 3: retirar e redespachar bagagem (bilhetes separados)","✈ Guarulhos → Paris CDG: AF459 · 19:35 → 11:55 (+1) · Executiva · PNR CSNWC5 · assentos 10D/10A"]},{"num":1,"data":"2026-07-31","titulo":"Chegada e Primeira Noite Romântica em Munique","resumo":"Manhã de conexão em Paris com troca de terminal, chegada em Munique no fim da tarde e primeira noite da Maria na Europa: hotel bonito, banho, descanso e jantar com atmosfera especial no centro histórico.","energia":"Leve","atividades":[{"horario":"11:55 – 12:40","nome":"Chegada em Paris CDG · Terminal 2E","descricao":"Desembarque do AF459. Como a conexão é no mesmo bilhete (CSNWC5), a bagagem segue automaticamente até Munique — vocês não precisam retirá-la aqui.","dica":"","lat":49.0097,"lng":2.5479},{"horario":"12:40 – 15:15","nome":"Conexão em Paris: Terminal 2E → Terminal 1","descricao":"Atenção: o voo para Munique parte de um terminal diferente. A ligação entre o 2E e o Terminal 1 é feita pelo CDGVAL (trem automático gratuito), com cerca de 15-20 min de trajeto mais deslocamento interno. São ~3h50 de conexão no total, folga confortável.","dica":"Sobra tempo para almoço ou lounge no Terminal 1. Façam a troca de terminal primeiro e relaxem depois.","lat":49.0097,"lng":2.5479},{"horario":"15:15 – 15:25","nome":"Embarque AF1822 · Terminal 1 · Portão fecha às 15:25","descricao":"Janela de embarque curta. Assentos executivos: Miguel 02A · Maria 02C.","dica":"","lat":49.0097,"lng":2.5479},{"horario":"15:45 – 17:20","nome":"Voo Paris CDG → Munique · AF1822 · Executiva","descricao":"Trecho intraeuropeu de ~1h35 operado pela Air France. Chegada em Munique às 17:20, no Terminal 1.","dica":"","lat":48.3538,"lng":11.7861},{"horario":"17:20 – 18:20","nome":"Chegada em Munique + Imigração / Bagagens","descricao":"Desembarque no Terminal 1 de Munique. Considerem cerca de 40-60 min para imigração (primeiro ponto Schengen do trajeto foi Paris), retirada das 2 malas de porão e saída do aeroporto.","dica":"Com mala grande e chegada no fim do dia, recomenda-se Uber ou táxi oficial, não trem.","lat":48.3538,"lng":11.7861},{"horario":"18:20 – 19:10","nome":"Uber/Táxi Aeroporto de Munique → Mercure Hotel Muenchen City Center","descricao":"O aeroporto é conectado ao centro pelas linhas S1 e S8, com cerca de 40 min até a estação central — e o hotel fica a 4-5 min a pé da Hauptbahnhof. Ainda assim, com mala grande e chegada no fim do dia, o melhor custo-conforto é ir direto de carro. O S-Bahn funciona bem como plano B.","dica":"Plano B: Airport-City-Day-Ticket, válido entre aeroporto e centro no dia.","lat":48.1381556,"lng":11.5602535},{"horario":"19:10 – 20:15","nome":"Check-in no Mercure Hotel Muenchen City Center","descricao":"Senefelderstraße 9, reserva 202-9059440 — 2 noites, de 31/07 a 02/08. Fica a 4-5 min a pé da estação central e a cerca de 15-20 min a pé de Marienplatz.","dica":"Peçam ao hotel ajuda para reservar o jantar antes da viagem. 31/07 é alta temporada europeia.","lat":48.1381556,"lng":11.5602535},{"horario":"20:30 – 22:15","nome":"Jantar Especial de Chegada — Munich Sushi Club","descricao":"Rooftop do Mandarin Oriental. Cozinha japonesa-peruana, vista da cidade e dress code smart casual. Funciona de 1º de maio a 18 de setembro, jantar das 17h às 21h.","dica":"Reserve mesa para 20:30. Avise que será a primeira noite da Maria na Europa.","lat":48.1373,"lng":11.5754},{"horario":"22:15 – 22:40","nome":"Caminhada Noturna pelo Centro Histórico","descricao":"Volta leve pela região de Marienplatz / Frauenkirche, sem compromisso. É só para a Maria sentir a atmosfera europeia pela primeira vez.","dica":"Se estiverem cansados, voltem direto de carro app/táxi. O objetivo do dia é chegar bem.","lat":48.1374,"lng":11.5755}],"deslocamentos":["✈ Paris CDG → Munique: AF1822 · 15:45 → 17:20 · Executiva · assentos 02A/02C","🚈 CDG Terminal 2E → Terminal 1: CDGVAL (gratuito) · 15-20 min","✈ Aeroporto → Hotel: Uber ou táxi oficial · 35-50 min · ~€40-55/casal","🚗 Hotel → Munich Sushi Club: Táxi curto · ~10 min (a pé são ~25 min)","💰 Total estimado do dia: R$ 768 – 1.182 por pessoa"]},{"num":2,"data":"2026-08-01","titulo":"Munique Clássica: Cultura, Moda e Rooftop","resumo":"Primeiro dia inteiro da Maria na Europa: centro histórico, mercado gastronômico, palácio real, ruas elegantes e fim de tarde bonito. Munique sem pressa, com estética, cultura e bons pontos para fotografia.","energia":"Moderado","atividades":[{"horario":"09:30 – 10:00","nome":"Caminhada até Marienplatz","descricao":"Praça mais simbólica de Munique, com arquitetura clássica, fachadas históricas e aquele impacto visual de \"cheguei na Europa\".","dica":"Cheguem antes do pico do meio-dia para fotos melhores e menos multidão.","lat":48.1374,"lng":11.5755},{"horario":"10:00 – 11:15","nome":"Marienplatz + Arredores da Frauenkirche","descricao":"Passeio leve pelo coração antigo da cidade, ótimo para fotos, vitrines e cafés. Primeiro contato europeu bem forte para a Maria, sem exigir deslocamento.","dica":"Façam uma parada rápida para café antes de seguir ao mercado.","lat":48.1385,"lng":11.5733},{"horario":"11:15 – 12:30","nome":"Viktualienmarkt","descricao":"Mercado histórico ao ar livre de Munique. Produtos locais, flores, bancas gastronômicas e referências visuais. Funciona seg-sáb, 8h-20h; domingo fechado.","dica":"Ótimo para refeição leve, fotos espontâneas e compra de pequenos itens gastronômicos.","lat":48.1351,"lng":11.5763},{"horario":"12:30 – 14:00","nome":"Almoço Leve no Centro Histórico","descricao":"Almoço no próprio Viktualienmarkt ou em brasserie próxima. A ideia é não pesar o dia, porque a tarde tem palácio e compras.","dica":"Evitem almoço longo demais; deixem o jantar como refeição principal.","lat":48.1351,"lng":11.5763},{"horario":"14:15 – 16:15","nome":"Munich Residenz","descricao":"Antiga residência dos governantes da Baviera. Salas históricas e interiores fotogênicos. Abre 9h-18h (última entrada 17h), de 28/03 a 19/10. Ingresso combinado Residence Museum + Treasury + Cuvilliés Theatre: €20 em 2026.","dica":"Comprem online se possível.","lat":48.1416,"lng":11.5786},{"horario":"16:15 – 17:45","nome":"Maximilianstraße + Lojas e Referências de Moda","descricao":"Rua mais elegante de Munique: vitrines de luxo, arquitetura imponente e ótimas referências de visual merchandising para as marcas Tailor's Mind e Ziv.","dica":"Observem vitrine, styling, materiais, paleta de cores e experiência de loja.","lat":48.1394,"lng":11.5824},{"horario":"17:45 – 19:00","nome":"Pausa no Hotel","descricao":"Banho, troca de roupa e descanso antes do jantar. Respiro importante para manter o ritmo sem correria.","dica":"","lat":48.1381556,"lng":11.5602535},{"horario":"19:30 – 21:45","nome":"Jantar com Vista / Rooftop","descricao":"Munich Sushi Club ou Roof Garden Terrace no Bayerischer Hof — atmosfera acima dos telhados da cidade. Em agosto, reservar com antecedência é essencial.","dica":"Peçam mesa externa se o clima permitir.","lat":48.1404,"lng":11.5757}],"deslocamentos":["🚶 Hotel → Marienplatz: A pé · ~18-20 min · ou S-Bahn da Hauptbahnhof · 2 paradas","🚶 Marienplatz → Viktualienmarkt: A pé · 5 min","🚶 Viktualienmarkt → Residenz: A pé · 12-15 min / táxi curto se muito calor","🚶 Residenz → Maximilianstraße → Hotel: A pé ou táxi curto","💰 Total estimado do dia: R$ 815 – 1.330 por pessoa"]},{"num":3,"data":"2026-08-02","titulo":"Munique → Nápoles → Chegada de Barco em Amalfi","resumo":"A virada cinematográfica da viagem: saída de madrugada de Munique, pouso em Nápoles às 08:15 e chegada à Costa Amalfitana pelo mar ainda no início da tarde. Dia curto de logística e longo de paisagem — Amalfi aparecendo entre montanhas, mar e casinhas coloridas.","energia":"Moderado a Intenso","atividades":[{"horario":"03:45 – 04:15","nome":"Despertar e Check-out Expresso em Munique","descricao":"Voo às 06:30 e bag drop fechando às 05:50 — malas prontas na noite anterior e check-out adiantado com a recepção do Mercure Hotel Muenchen City Center.","dica":"Deixem passaporte, cartão de embarque e um casaco leve à mão. Todo o resto vai despachado.","lat":48.1381556,"lng":11.5602535},{"horario":"04:15 – 04:55","nome":"Uber/Táxi Hotel → Aeroporto de Munique","descricao":"Uber ou táxi, agendado na véspera. Nesse horário o S-Bahn ainda não é opção confiável; de carro são ~35-40 min sem trânsito.","dica":"Agendem o Uber na véspera ou peçam um táxi à recepção no dia anterior, e reconfirmem o horário à noite.","lat":48.3538,"lng":11.7861},{"horario":"04:55 – 06:10","nome":"Check-in, Bagagem e Segurança · Terminal 2 (bag drop até 05:50)","descricao":"Voo VL1888, operado pela Air Dolomiti para a Lufthansa — Terminal 2 de Munique. Portão K12, embarque às 06:00, portão fecha às 06:15. Franquia: 1 mala despachada de 23kg + 1 bagagem de mão de 8kg + 1 item pessoal por pessoa.","dica":"Confiram o portão nos painéis: o K12 fica na área Schengen do T2 e o deslocamento interno é longo.","lat":48.3538,"lng":11.7861},{"horario":"06:30 – 08:15","nome":"Voo Munique → Nápoles · VL1888","descricao":"Voo direto, 1h45 de duração, sem conexão. Tarifa Eco Comfort. Localizador CC6PPS. Assentos: Maria 14D · Miguel 14E.","dica":"Durmam nesse trecho — o dia ainda tem ferry e chegada em Amalfi.","lat":40.886,"lng":14.2908},{"horario":"08:15 – 09:00","nome":"Chegada em Nápoles + Retirada de Bagagem","descricao":"Sigam direto para a esteira. Não marquem nada em Nápoles — o foco do dia é garantir o ferry das 10:45.","dica":"","lat":40.886,"lng":14.2908},{"horario":"09:00 – 09:35","nome":"Aeroporto de Nápoles → Molo Beverello","descricao":"Táxi oficial com tarifa fixa entre Capodichino e o porto (~25-30 min). Alternativa: Alibus, que liga o aeroporto ao Molo Beverello.","dica":"Peçam a tarifa predeterminada ao taxista antes de embarcar, com as malas.","lat":40.8385,"lng":14.254},{"horario":"09:35 – 10:45","nome":"Check-in do Ferry e Pausa no Porto","descricao":"Cerca de 1h de folga no Molo Beverello. O check-in deve ser feito com no mínimo 30 minutos de antecedência, no dock de embarque. Confirmação Positano Jet 0000233982 (agência Ferryhopper), 2 passageiros + 2 bagagens.","dica":"O embarque do Positano Jet costuma ser no Dock 6 (alternativos 4 a 7). Confirmem no painel do terminal.","lat":40.8385,"lng":14.254},{"horario":"10:45 – 12:35","nome":"Ferry Napoli Beverello → Amalfi · Positano Jet","descricao":"Travessia de ~1h50 no Positano Jet 2. Atenção: o bilhete indica troca de embarcação em Positano — vocês desembarcam e reembarcam ali antes de seguir para Amalfi. É o trecho mais bonito da viagem, com a Costa Amalfitana aparecendo pelo mar.","dica":"Fiquem atentos ao aviso da tripulação na parada de Positano para não perder a troca de navio. Área externa na aproximação de Positano e Amalfi é a foto do dia.","lat":40.634,"lng":14.6027},{"horario":"12:35 – 13:15","nome":"Desembarque em Amalfi + Espera do Shuttle","descricao":"Chegada prevista no porto de Amalfi às 12:35. O shuttle do Grand Hotel Excelsior tem horário fixo e já está agendado para as 13:15 — é a saída mais próxima da chegada de vocês. São cerca de 40 min de espera, com o porto e a marina ali do lado para um primeiro olhar sobre Amalfi.","dica":"Não é preciso chamar táxi. O embarque é no ponto de ônibus ao lado do porto, muito fácil de identificar.","lat":40.634,"lng":14.6027},{"horario":"13:15 – 13:35","nome":"Shuttle do Hotel → Grand Hotel Excelsior","descricao":"Transfer do próprio hotel, com horário fixo já agendado para as 13:15. O embarque acontece no ponto de ônibus ao lado do porto de Amalfi, muito fácil de identificar.","dica":"","lat":40.628,"lng":14.598},{"horario":"13:35 – 15:00","nome":"Almoço com Vista no Hotel","descricao":"Vocês chegam antes do horário padrão de check-in. Deixem as malas na recepção e almocem no próprio hotel, com vista para o mar, enquanto o quarto é liberado.","dica":"Avisem o hotel do horário de chegada — com antecedência, costumam liberar o quarto mais cedo.","lat":40.628,"lng":14.598},{"horario":"15:00 – 17:30","nome":"Check-in, Banho e Primeira Tarde com Vista","descricao":"Peçam quarto com vista para o mar. Depois da madrugada em Munique, essa tarde é para não fazer nada: varanda, piscina e descanso.","dica":"","lat":40.628,"lng":14.598},{"horario":"17:30 – 19:30","nome":"Primeiro Contato com o Centro de Amalfi (opcional)","descricao":"Se a energia permitir, shuttle até o centro para uma caminhada leve pela Piazza del Duomo no fim de tarde. Se estiverem cansados, pulem sem culpa — o dia seguinte é inteiro em Amalfi.","dica":"","lat":40.634,"lng":14.6027},{"horario":"20:30 – 22:30","nome":"Jantar de Chegada — Marina Grande Restaurant","descricao":"Direto na praia, vista para o mar, frutos do mar e cozinha clássica (Guia Michelin). Reservem mesa externa e mencionem que é a primeira noite na Costa Amalfitana.","dica":"","lat":40.6337,"lng":14.6023}],"deslocamentos":["🚗 Hotel Munique → Aeroporto: Uber ou táxi · 35-40 min (madrugada) · agendar na véspera","✈ Munique → Nápoles: VL1888 (Air Dolomiti/Lufthansa) · 06:30 → 08:15 · 1h45 · T2, portão K12 · PNR CC6PPS","🚗 Aeroporto Nápoles → Molo Beverello: Táxi com tarifa fixa · 25-35 min (ou Alibus)","⛴ Napoli Beverello → Amalfi: Positano Jet · 10:45 → 12:35 · troca de navio em Positano · check-in 30 min antes · Conf. 0000233982","🚐 Porto de Amalfi → Hotel: Shuttle do próprio hotel · horário fixo agendado às 13:15 · embarque no ponto de ônibus ao lado do porto","Plano B: em caso de mar agitado, Uber ou táxi Nápoles → Amalfi por estrada (~2h) ou ferry via Salerno","💰 Total estimado do dia: R$ 1.682 – 3.020 por pessoa"]},{"num":4,"data":"2026-08-03","titulo":"Amalfi Sem Pressa: Praia Privativa, Centro Histórico e Jantar com Vista","resumo":"Primeiro dia inteiro para viver Amalfi sem correria, agora com a manhã inteira na praia privativa do hotel. Mare Club pela manhã, banho e troca no hotel, centro histórico e Duomo no fim de tarde, e jantar romântico no terraço.","energia":"Leve a Moderado","atividades":[{"horario":"09:00 – 09:20","nome":"Hotel → Mare Club (Shuttle + Elevador)","descricao":"Shuttle gratuito do Grand Hotel Excelsior até o acesso da praia (~5 min), seguido do elevador escavado na rocha que abre direto na Spiaggia del Duoglio.","dica":"Reservem o shuttle pelo tablet do quarto — é possível agendar com até 48h de antecedência, e em agosto os horários enchem.","lat":40.6355,"lng":14.5825},{"horario":"09:20 – 13:00","nome":"Praia Privativa Mare Club — Spiaggia del Duoglio","descricao":"Lido exclusivo do hotel, com espreguiçadeiras, guarda-sóis, vestiário, banheiro e chuveiro inclusos para hóspedes. Aberta de 1º/06 a 30/09, das 9h às 17h, conforme condições do mar. Uma das praias mais bonitas da Costa Amalfitana e sem custo adicional.","dica":"Praia de pedra — levem sandália de água. Manhã é o melhor horário: menos sol a pino e mar mais calmo.","lat":40.6355,"lng":14.5825},{"horario":"13:00 – 14:15","nome":"Almoço na Praia — Bar do Mare Club","descricao":"Refeição leve no próprio lido: paninis, saladas, fritas e drinks servidos na areia. Evita deslocamento e mantém o ritmo do dia solto.","dica":"Se quiserem almoço mais elaborado, a alternativa é subir e almoçar no restaurante do hotel com vista.","lat":40.6355,"lng":14.5825},{"horario":"14:15 – 15:15","nome":"Retorno ao Hotel + Banho e Troca","descricao":"Shuttle de volta ao hotel. Intervalo para tirar o sal, trocar de roupa e descansar antes da tarde no centro.","dica":"","lat":40.628,"lng":14.598},{"horario":"15:30 – 15:45","nome":"Hotel → Centro de Amalfi (Shuttle Gratuito)","descricao":"Shuttle gratuito do Grand Hotel Excelsior até o centro (~10 min). Reservem também este trecho pelo tablet do quarto.","dica":"","lat":40.634,"lng":14.6027},{"horario":"15:45 – 16:30","nome":"Café e Doce na Piazza del Duomo","descricao":"Café, sfogliatella ou doce de limão perto da Piazza del Duomo. Pausa bonita e bem italiana antes da catedral.","dica":"Mesa externa no fim de tarde é mais agradável que ao meio-dia — e melhor para fotos.","lat":40.634,"lng":14.6027},{"horario":"16:30 – 17:45","nome":"Duomo di Amalfi / Catedral de Sant'Andrea","descricao":"Escadaria e fachada marcantes. A visita vale pelo impacto visual e histórico, e a luz do fim de tarde na escadaria é a melhor do dia.","dica":"Confirmem horários na recepção do hotel — podem variar por celebrações religiosas. O Chiostro del Paradiso tem ingresso pago na bilheteria.","lat":40.634,"lng":14.6023},{"horario":"17:45 – 19:15","nome":"Ruas Históricas, Lojas Locais e Referências Visuais","descricao":"Ruas estreitas próximas ao Duomo: cerâmica, moda resort, papel artesanal, sandálias e produtos de limão. Ótimo para vitrine, embalagem, paleta de cores, materiais naturais e narrativa mediterrânea.","dica":"As lojas do centro ficam abertas até tarde no verão — dá tempo com folga antes do jantar.","lat":40.6338,"lng":14.6021},{"horario":"19:15 – 20:00","nome":"Aperitivo ao Pôr do Sol / Marina Grande (opcional)","descricao":"Descida curta até a orla para um aperitivo com vista antes do jantar. Se preferirem, sigam direto ao restaurante.","dica":"","lat":40.6337,"lng":14.6023},{"horario":"20:00 – 22:15","nome":"Jantar Romântico com Vista — Locanda della Canonica","descricao":"Terraço ao ar livre com vista para o Mediterrâneo, a poucos minutos a pé do Duomo. Primeiro grande jantar romântico oficial da Costa Amalfitana.","dica":"Peçam mesa no terraço e reservem com antecedência. Confirmem o horário do último shuttle do hotel antes de sentar para jantar.","lat":40.6345,"lng":14.6035}],"deslocamentos":["🚐 Hotel → Mare Club (Spiaggia del Duoglio): Shuttle gratuito + elevador · ~5 min · reservar pelo tablet do quarto (até 48h antes)","🚐 Mare Club → Hotel: Shuttle gratuito · ~5 min","🚐 Hotel → Centro de Amalfi: Shuttle gratuito · ~10 min","🚶 Centro → Duomo → Ruas → Marina Grande → Locanda della Canonica: A pé · 2-8 min","🚐 Centro → Hotel (após o jantar): Confirmar horário do último shuttle na recepção · táxi local como plano B","💰 Total estimado do dia: R$ 899 – 1.780 por pessoa (praia privativa inclusa na diária — sem custo de beach club)"]},{"num":5,"data":"2026-08-04","titulo":"Capri, Gruta Azul, Monte Solaro e Faraglioni","resumo":"Um dos dias mais memoráveis da viagem: Capri vista pelo mar e do alto. Começar com Gruta Azul e Faraglioni, subir ao Monte Solaro de teleférico, passar pela Piazzetta e retornar de funicular antes do ferry de volta para Amalfi.","energia":"Moderado","atividades":[{"horario":"08:00 – 08:20","nome":"Hotel → Porto de Amalfi","descricao":"Shuttle ou táxi. Em agosto, ferries e embarques ficam mais cheios — saiam com folga.","dica":"","lat":40.634,"lng":14.6027},{"horario":"08:50 – 10:00","nome":"Ferry Amalfi → Capri (Marina Grande)","descricao":"Ferry direto Amalfi → Capri. Comprem ida e volta com antecedência. Lugar externo para curtir a chegada pelo mar.","dica":"","lat":40.5532,"lng":14.234},{"horario":"10:15 – 12:30","nome":"Passeio de Barco + Gruta Azul + Faraglioni","descricao":"Passeio de barco com prioridade para Gruta Azul (depende do mar — tentar cedo). Inclui passagem pelos Faraglioni.","dica":"A Gruta Azul exige trocar para barcos a remo na entrada. Protejam câmera. Levem dinheiro/cartão.","lat":40.5439,"lng":14.2429},{"horario":"12:30 – 13:15","nome":"Marina Grande → Anacapri","descricao":"Táxi conversível (mais confortável, rápido e fotogênico) ou ônibus local (econômico, lotado em agosto).","dica":"","lat":40.5548,"lng":14.2136},{"horario":"13:15 – 14:30","nome":"Almoço Leve em Anacapri","descricao":"Anacapri é um pouco menos caótica que Capri town — boa pausa no meio do dia. Não transformem em refeição longa.","dica":"","lat":40.5548,"lng":14.2136},{"horario":"14:30 – 15:45","nome":"Monte Solaro de Teleférico / Chairlift","descricao":"Teleférico de cadeirinhas individuais em Anacapri. ~13 min cada sentido. Vista de cima é uma das mais bonitas de Capri.","dica":"Aberto e individual — pode incomodar quem tem muito medo de altura. Confirmem horários no site oficial.","lat":40.5497,"lng":14.2109},{"horario":"15:45 – 16:30","nome":"Anacapri → Capri Town / Piazzetta","descricao":"Táxi ou ônibus. Passagem pela Piazzetta e ruas de boutiques, perfumes, sandálias e moda resort — ótimo para pesquisa visual: vitrines, styling, experiência de loja e comportamento de compra.","dica":"","lat":40.551,"lng":14.2429},{"horario":"16:30 – 17:15","nome":"Piazzetta → Funicular: Capri Town → Marina Grande","descricao":"Caminhem até a estação do Funicolare di Capri. ~3-5 min até Marina Grande. Não saiam tarde — em agosto pode haver fila para o funicular.","dica":"","lat":40.5532,"lng":14.234},{"horario":"17:30 – 18:45","nome":"Ferry Capri → Amalfi","descricao":"Cheguem ao píer com 30-40 min de folga. Agosto é alta temporada.","dica":"","lat":40.634,"lng":14.6027},{"horario":"20:30 – 22:30","nome":"Jantar Leve em Amalfi","descricao":"Centro de Amalfi ou hotel. Evitem deslocamento longo — o dia já terá sido bem completo.","dica":"","lat":40.634,"lng":14.6027}],"deslocamentos":["⛴ Amalfi ↔ Capri: Ferry direto (ida+volta antecipado)","🚗 Marina Grande → Anacapri: Táxi conversível (preferencial) ou ônibus","🚶 Anacapri → Monte Solaro: A pé até estação + chairlift (~13 min/sentido)","🚡 Capri Town → Marina Grande: Funicular · ~3-5 min","💰 Total estimado do dia: R$ 1.369 – 2.553 por pessoa"]},{"num":6,"data":"2026-08-05","titulo":"Fiordo di Furore e Positano de Ônibus","resumo":"Vocês conhecem o Fiordo di Furore e seguem para Positano de ônibus pela estrada costeira. Versão mais terrestre e econômica, mantendo os visuais clássicos da Costa Amalfitana, mas exigindo paciência com filas, lotação e escadas.","energia":"Moderado a Intenso","atividades":[{"horario":"08:15 – 08:35","nome":"Hotel → Ponto SITA em Amalfi","descricao":"Shuttle ou táxi até o centro. Comprem bilhetes antes de embarcar — normalmente não vendidos dentro do ônibus.","dica":"","lat":40.634,"lng":14.6027},{"horario":"08:45 – 09:10","nome":"Ônibus SITA Sud: Amalfi → Fiordo di Furore","descricao":"Rota Amalfi → Positano/Sorrento. Peçam ao motorista para avisar a parada do Fiordo di Furore.","dica":"Sentem do lado direito (sentido Amalfi → Positano) para melhores vistas do mar.","lat":40.6187,"lng":14.5589},{"horario":"09:10 – 10:15","nome":"Fiordo di Furore","descricao":"Fotos da ponte, do fiorde e da pequena praia — um dos cenários mais dramáticos da Costa Amalfitana. A praia é pequena e fica cheia rapidamente.","dica":"Acesso pode envolver escadas. Trate como parada visual, não manhã longa de praia.","lat":40.6187,"lng":14.5589},{"horario":"10:15 – 10:45","nome":"Espera pelo Ônibus → Positano","descricao":"Voltem ao ponto com antecedência. Risco de o ônibus passar cheio. Tenham margem e não marquem almoço cedo.","dica":"","lat":40.6187,"lng":14.5589},{"horario":"10:45 – 11:30","nome":"Ônibus Fiordo di Furore → Positano (Sponda)","descricao":"Continuem pela estrada costeira. Chegada sugerida: Positano Sponda, ponto mais prático para o centro e a praia.","dica":"","lat":40.628,"lng":14.485},{"horario":"11:30 – 12:30","nome":"Descida por Positano até a Spiaggia Grande","descricao":"Descendo em direção à Spiaggia Grande: lojinhas, moda resort, cerâmicas, sandálias e cafés. A volta exigirá subida — façam tudo sem pressa.","dica":"","lat":40.6263,"lng":14.4859},{"horario":"12:30 – 14:15","nome":"Almoço em Positano","descricao":"Restaurante perto da praia. Reservem com antecedência — agosto é muito concorrido.","dica":"","lat":40.6263,"lng":14.4859},{"horario":"14:15 – 16:30","nome":"Praia, Lojas e Fotografia em Positano","descricao":"Spiaggia Grande, lojas de resortwear, beachwear, sandálias e cafés. Ótimo para vitrine, curadoria de produto e paleta mediterrânea.","dica":"","lat":40.6263,"lng":14.4859},{"horario":"16:30 – 17:15","nome":"Subida até o Ponto de Ônibus (Positano Sponda)","descricao":"Esta será a parte mais cansativa do dia.","dica":"Se muito quente, considerem táxi interno até o ponto.","lat":40.628,"lng":14.485},{"horario":"17:15 – 18:15","nome":"Ônibus SITA Sud: Positano → Amalfi","descricao":"Fim de tarde em agosto pode ter fila e ônibus cheio. Cheguem cedo ao ponto e mantenham flexibilidade.","dica":"","lat":40.634,"lng":14.6027},{"horario":"18:15 – 19:30","nome":"Amalfi → Hotel + Descanso","descricao":"Shuttle ou táxi. Deixem esse intervalo livre para banho e descanso após calor, ônibus e escadas.","dica":"","lat":40.628,"lng":14.598},{"horario":"20:15 – 22:15","nome":"Jantar em Amalfi","descricao":"Centro de Amalfi ou hotel. Evitem Atrani neste dia — a logística terrestre já terá sido mais cansativa.","dica":"","lat":40.634,"lng":14.6027}],"deslocamentos":["🚌 Amalfi → Fiordo → Positano → Amalfi: SITA Sud (rota Amalfi-Positano-Sorrento)","🚶 Positano interno: A pé (escadas) · evite compras pesadas antes da subida ao ponto","💰 Total estimado do dia: R$ 1.184 – 2.730 por pessoa"]},{"num":7,"data":"2026-08-06","titulo":"Amalfi → Salerno → Roma e Primeira Noite na Cidade Eterna","resumo":"Dia de dar adeus à Costa Amalfitana. Ferry de Amalfi para Salerno pela manhã, uma caminhada curta do porto até a estação central e o Frecciarossa até Roma. À tarde, chegada leve na Cidade Eterna, com Fontana di Trevi, Piazza di Spagna e jantar romântico.","energia":"Moderado","atividades":[{"horario":"09:45 – 10:30","nome":"Check-out e Hotel → Porto de Amalfi","descricao":"Check-out com calma. Shuttle ou táxi ao porto. Com mala grande, não recomendo caminhar. Confirmem o horário do shuttle na noite anterior.","dica":"","lat":40.634,"lng":14.6027},{"horario":"11:20 – 12:20","nome":"Ferry Amalfi → Salerno Concordia · Travelmar","descricao":"Travessia de 1h com desembarque no porto turístico Masuccio Salernitano, na Piazza della Concordia — e não na estação marítima principal. Código de reserva TRB2638167, 2 adultos. O QR code do bilhete precisa estar acessível no celular para o embarque direto.","dica":"Bagagem de mão permitida: até 45×35×20cm. Malas maiores podem exigir suplemento pago no embarque — cheguem ao molo com ~30 min de antecedência.","lat":40.6743,"lng":14.7679},{"horario":"12:20 – 12:40","nome":"Porto de Salerno → Estação Central (a pé)","descricao":"Do porto até a estação central são cerca de 650 metros, algo em torno de 10 minutos de caminhada, considerando que estarão com as malas. O trem parte às 12:50 e o embarque encerra um minuto antes da partida. Normalmente a plataforma é divulgada uns 15 minutos antes. Ou seja: vocês têm tempo tranquilo, mas é justamente o tempo do deslocamento.","dica":"Se precisarem resolver alguma coisa, façam já na estação, com calma, para evitarmos qualquer tipo de desgaste. Desembarquem entre os primeiros e sigam direto — quem preferir não caminhar com as malas encontra táxi na saída do porto (5-8 min).","lat":40.6707,"lng":14.7898},{"horario":"12:50 – 14:55","nome":"Trem Salerno → Roma Termini · Frecciarossa 9544","descricao":"Trem já emitido: 2ª classe Standard, coche 5, assentos 15D (Maria) e 16D (Miguel). PNR Q78ZT5. Duração de 2h05. As portas fecham 1 minuto antes da partida.","dica":"Informem o PNR à tripulação quando solicitado e tenham documento com foto à mão. A tarifa FrecciaDAYS não permite alteração nem reembolso.","lat":41.9007,"lng":12.5015},{"horario":"14:55 – 15:30","nome":"Roma Termini → Hotel","descricao":"Como estarão com malas, sugiro pegarem um Uber ou táxi oficial em vez de ônibus para fazer esse deslocamento. Destino: Mercure Roma Centro Colosseo, Via Labicana 144 — confirmação 992166535, 2 noites (06 a 08/08). São cerca de 10 min de carro da Termini, e o Coliseu fica a 5 min a pé do hotel.","dica":"","lat":41.8901238,"lng":12.4981257},{"horario":"15:30 – 17:30","nome":"Check-in, Banho e Descanso","descricao":"Nada de agenda pesada. Deixem Coliseu e Vaticano para dias com mais energia — inclusive porque o Coliseu está literalmente na porta do hotel e vocês o veem amanhã cedo.","dica":"","lat":41.8901238,"lng":12.4981257},{"horario":"17:30 – 18:30","nome":"Via Condotti, Via del Babuino e Cafés do Centro","descricao":"Região elegante: moda, vitrines, fotografia e referências de branding para as marcas Tailor's Mind e Ziv.","dica":"Do hotel até a Piazza di Spagna são ~10 min de táxi. A partir dali, todo o trecho é a pé.","lat":41.9058,"lng":12.4788},{"horario":"18:30 – 20:00","nome":"Fontana di Trevi + Piazza di Spagna","descricao":"Primeira caminhada clássica por Roma. Para a Maria, é o impacto cinematográfico logo na chegada.","dica":"A Trevi fica cheia em agosto. Vale como primeiro contato; depois encaixem uma visita cedo em outro dia.","lat":41.9057,"lng":12.4823},{"horario":"20:30 – 22:30","nome":"Jantar Romântico em Roma","descricao":"Restaurante bonito, bem localizado, sem deslocamento longo. Reservem mesa com antecedência.","dica":"","lat":41.9057,"lng":12.4823}],"deslocamentos":["🚐 Hotel Amalfi → Porto: Shuttle ou táxi · sair às 09:45","⛴ Amalfi → Salerno Concordia: Ferry Travelmar · 11:20 → 12:20 · Conf. TRB2638167","🚶 Porto de Salerno (Piazza della Concordia) → Estação Central: ~650 m a pé · ~10 min com malas · táxi como alternativa","🚄 Salerno → Roma Termini: Frecciarossa 9544 · 12:50 → 14:55 · Coche 5, assentos 15D/16D · PNR Q78ZT5","🚗 Roma Termini → Mercure Roma Centro Colosseo: Uber ou táxi oficial · ~10 min (com malas, evitem ônibus)","💰 Total estimado do dia: R$ 736 – 1.699 por pessoa"]},{"num":8,"data":"2026-08-07","titulo":"Roma Clássica: Coliseu, Centro Histórico e Trastevere","resumo":"Primeiro dia inteiro em Roma: Coliseu, Fórum Romano, Pantheon, cafés, ruas históricas e jantar em Trastevere. Clássico, mas organizado para não virar maratona.","energia":"Moderado a Intenso","atividades":[{"horario":"08:15 – 08:45","nome":"Hotel → Coliseu (a pé)","descricao":"O Mercure Roma Centro Colosseo fica a cerca de 5 min a pé do Coliseu — não precisa de táxi. Saiam cedo mesmo assim: agosto em Roma é quente e começar cedo faz muita diferença.","dica":"","lat":41.8902,"lng":12.4922},{"horario":"09:00 – 11:30","nome":"Coliseu + Fórum Romano + Palatino","descricao":"Ingresso reservado. Para a primeira vez da Maria, recomendo tour guiado privado ou grupo pequeno — Roma ganha muito com contexto. Levem garrafa de água.","dica":"","lat":41.8925,"lng":12.4853},{"horario":"11:30 – 12:00","nome":"Pausa para Café / Água / Sombra","descricao":"Saindo da área arqueológica, faça uma pausa curta antes de seguir.","dica":"","lat":41.8925,"lng":12.4853},{"horario":"12:00 – 13:00","nome":"Caminhada: Piazza Venezia / Via dei Fori Imperiali","descricao":"Região monumental com vistas fortes para ruínas, colunas e arquitetura romana. Ótimo para fotos amplas — sem ficar muito tempo no sol.","dica":"","lat":41.8955,"lng":12.4823},{"horario":"13:00 – 14:30","nome":"Almoço no Centro Histórico","descricao":"Entre Piazza Venezia, Pantheon ou Campo de' Fiori. Evitem restaurantes com cardápio turístico exposto e fotos de pratos na porta.","dica":"","lat":41.8955,"lng":12.472},{"horario":"14:45 – 15:30","nome":"Pantheon","descricao":"Uma das visitas mais impactantes de Roma. Reservem ingresso/horário se necessário.","dica":"","lat":41.8986,"lng":12.4769},{"horario":"15:30 – 16:15","nome":"Piazza Navona","descricao":"Uma das praças mais bonitas de Roma. Café, fotos e pausa visual.","dica":"","lat":41.8992,"lng":12.4731},{"horario":"16:15 – 17:30","nome":"Pausa no Hotel","descricao":"Banho, descanso e troca de roupa. Esse respiro evita que o jantar vire cansaço.","dica":"","lat":41.8901238,"lng":12.4981257},{"horario":"18:30 – 19:30","nome":"Passeio pelo Trastevere antes do Jantar","descricao":"Trastevere à noite: Roma mais boêmia, ruas estreitas, luz bonita. Cheguem antes do jantar para caminhar e fotografar.","dica":"","lat":41.8898,"lng":12.4695},{"horario":"20:00 – 22:15","nome":"Jantar em Trastevere","descricao":"Comida romana em ambiente charmoso. Reservem mesa — Trastevere fica cheio no verão.","dica":"","lat":41.8898,"lng":12.4695}],"deslocamentos":["🚶 Hotel → Coliseu: A pé · ~5 min","🚶 Coliseu → Fórum → Palatino → Piazza Venezia → Pantheon → Piazza Navona: A pé","🚗 Centro → Hotel → Trastevere: Táxi · ~15-25 min","💰 Total estimado do dia: R$ 1.159 – 2.423 por pessoa"]},{"num":9,"data":"2026-08-08","titulo":"Roma → Amsterdam: Canais e Jordaan","resumo":"Vocês deixam Roma e seguem para Amsterdam: canais, cafés, design e lojas-conceito — contraste lindo com Costa Amalfitana e Roma.","energia":"Moderado","atividades":[{"horario":"08:30 – 09:15","nome":"Hotel Roma → Aeroporto Fiumicino","descricao":"Uber ou táxi por causa das malas. Cheguem com margem para bagagem despachada.","dica":"","lat":41.8003,"lng":12.2389},{"horario":"11:30 – 14:00","nome":"Voo Roma → Amsterdam","descricao":"Janela ideal: chegar até o meio da tarde. KLM ou ITA conforme melhor horário/tarifa. Duração ~2h30.","dica":"","lat":52.3086,"lng":4.7639},{"horario":"14:00 – 15:15","nome":"Chegada em Schiphol → Mövenpick Amsterdam City Centre","descricao":"Piet Heinkade 11, confirmação 992169335 — 2 noites, de 08 a 10/08. Fica ao lado da Amsterdam Centraal, a cerca de 10 min a pé da estação. Uber ou táxi é mais confortável com mala grande; o trem Intercity Direct de Schiphol até a Centraal leva ~17 min.","dica":"","lat":52.3781145,"lng":4.9141941},{"horario":"15:15 – 17:00","nome":"Check-in e Pausa no Hotel","descricao":"Banho e troca de roupa. Amsterdam é ótima para caminhar, mas calçadas, pontes e bicicletas exigem atenção.","dica":"","lat":52.3781145,"lng":4.9141941},{"horario":"17:00 – 18:30","nome":"Jordaan + De 9 Straatjes","descricao":"Canais, cafés, lojas independentes. Combina muito com as marcas: menos luxo óbvio, mais curadoria, branding e estética cotidiana.","dica":"","lat":52.3731,"lng":4.8836},{"horario":"18:30 – 19:30","nome":"Canais no Golden Hour","descricao":"Prinsengracht, Keizersgracht ou Herengracht. Excelente horário para fotos do casal e da cidade.","dica":"","lat":52.3745,"lng":4.8823},{"horario":"20:00 – 22:15","nome":"Jantar em Amsterdam (Jordaan ou Canal Belt)","descricao":"Do hotel até o Jordaan são ~10 min de táxi ou tram — nada de deslocamento longo depois do voo. Reservar é importante: agosto é alta temporada.","dica":"","lat":52.3738,"lng":4.8823}],"deslocamentos":["🚗 Hotel Roma → Aeroporto Fiumicino: Uber ou táxi · ~45-60 min","✈ Roma → Amsterdam: Voo direto · ~2h30","🚗 Schiphol → Mövenpick Amsterdam City Centre: Táxi · ~25 min · ou trem Intercity Direct até Centraal (~17 min) + 10 min a pé","💰 Total estimado do dia: R$ 1.418 – 3.191 por pessoa"]},{"num":10,"data":"2026-08-09","titulo":"Amsterdam: Arte, Canais, Cafés e Lojas-Conceito","resumo":"Dia inteiro em Amsterdam: arte, fotografia, cafés, design, canais e lojas independentes. Um museu principal e o restante do dia mais fluido.","energia":"Moderado","atividades":[{"horario":"09:00 – 09:30","nome":"Hotel → Museumplein (Tram ou Táxi)","descricao":"Ingressos com horário marcado — obrigatório em agosto.","dica":"","lat":52.3579,"lng":4.885},{"horario":"09:30 – 12:00","nome":"Rijksmuseum ou Van Gogh Museum (escolher um)","descricao":"Rijksmuseum: 9h-17h, €25. Van Gogh: 9h-18h, €25. Para a Maria: Van Gogh para emoção/arte direta; Rijksmuseum para impacto histórico e grandes mestres.","dica":"Ingresso com horário marcado — não se consegue entrar sem reserva prévia em agosto.","lat":52.36,"lng":4.8852},{"horario":"12:15 – 13:45","nome":"Almoço em De Pijp ou Museum Quarter","descricao":"De Pijp: cafés e restaurantes mais jovens e autênticos. Almoço leve e bom café.","dica":"","lat":52.3557,"lng":4.8942},{"horario":"14:00 – 15:30","nome":"De 9 Straatjes + Lojas-Conceito","descricao":"Lojas independentes, moda, acessórios, decoração e cafés. Excelente para referências de branding, curadoria e visual merchandising.","dica":"","lat":52.3731,"lng":4.8836},{"horario":"15:30 – 17:30","nome":"Café Especial + Jordaan / Canais","descricao":"Pausa em café bonito perto dos canais, seguida de caminhada lenta pelo Jordaan.","dica":"","lat":52.3738,"lng":4.8823},{"horario":"19:30 – 22:00","nome":"Jantar Final em Amsterdam","descricao":"Reservem e deixem a mala parcialmente pronta ao voltar.","dica":"","lat":52.3738,"lng":4.8823}],"deslocamentos":["🚊 Hotel → Museumplein: Tram 26 até Centraal + tram 2/12 · ~20 min · ou táxi ~12 min","🚶 Museumplein → De Pijp → De 9 Straatjes → Jordaan: A pé ou tram","💰 Total estimado do dia: R$ 857 – 1.625 por pessoa"]},{"num":11,"data":"2026-08-10","titulo":"Amsterdam → Düsseldorf de Trem e Noite Final","resumo":"Transição final com saída cedo: o ICE 225 parte de Amsterdam às 08:31 e o bilhete é vinculado a este trem específico, sem direito a cancelamento. Chegada em Düsseldorf antes das 11h deixa o dia inteiro livre para a Kö, o Reno e a última noite na Europa.","energia":"Leve","atividades":[{"horario":"06:45 – 07:30","nome":"Check-out + Hotel → Amsterdam Centraal","descricao":"Saída cedo: o trem parte às 08:31 e o bilhete Super Sparpreis Europa é vinculado a este trem específico (Zugbindung). O Mövenpick fica a ~10 min a pé da Amsterdam Centraal, então o deslocamento é curto.","dica":"Com malas, o táxi resolve em ~5 min — peçam na recepção na noite anterior e deixem tudo pronto.","lat":52.3791,"lng":4.8994},{"horario":"07:30 – 08:31","nome":"Amsterdam Centraal · Plataforma 5b","descricao":"Café da manhã rápido na estação e localização da plataforma. O ICE 225 parte da plataforma 5b. Reserva nº 804760252567 · ticketcode 7BZDPVCF.","dica":"O documento com foto é obrigatório junto ao bilhete na conferência a bordo.","lat":52.3791,"lng":4.8994},{"horario":"08:31 – 10:45","nome":"Trem ICE 225: Amsterdam Centraal → Düsseldorf Hbf","descricao":"Trem direto de 2h14 via Arnhem Centraal, 2ª classe. Lugares reservados: vagão 21, poltronas 67 e 68 (Handybereich — área onde o uso de celular é permitido). Chegada na plataforma 16 de Düsseldorf.","dica":"","lat":51.2199,"lng":6.7943},{"horario":"10:45 – 11:30","nome":"Düsseldorf Hbf → Novotel Düsseldorf Airport (deixar as malas)","descricao":"Wanheimer Straße 78, reserva 202-9059498 — 1 noite (10 a 11/08). Táxi direto da estação central, ou S11 até Düsseldorf Flughafen (~12 min) e um trecho curto de carro. O check-in oficial é à tarde, mas as malas podem ficar guardadas na recepção.","dica":"","lat":51.2832084,"lng":6.7844765},{"horario":"11:45 – 13:15","nome":"Almoço na Altstadt","descricao":"Centro histórico de Düsseldorf, com cervejarias tradicionais e ruas agradáveis. Primeira parada do dia livre.","dica":"","lat":51.2264,"lng":6.7735},{"horario":"13:15 – 15:00","nome":"Königsallee","descricao":"Caminhada leve pela Kö. Últimas compras, vitrines e referências de moda europeia.","dica":"","lat":51.2225,"lng":6.793},{"horario":"15:00 – 16:00","nome":"Rheinuferpromenade","descricao":"Caminhada curta à beira do Reno. Ritmo leve para encerrar a viagem.","dica":"","lat":51.2264,"lng":6.7735},{"horario":"16:30 – 18:30","nome":"Check-in, Banho e Organização da Mala Final","descricao":"Retorno ao hotel, check-in efetivo e mala pronta para o voo do dia seguinte cedo.","dica":"Separem documentos, cartões e etiquetas de bagagem ainda hoje.","lat":51.2832084,"lng":6.7844765},{"horario":"19:00 – 21:00","nome":"Jantar Final","descricao":"No restaurante do próprio Novotel ou nas imediações — a região é de aeroporto, sem muitas opções a pé. Terminar cedo e dormir bem: a saída do dia seguinte é às 05:45.","dica":"","lat":51.2832084,"lng":6.7844765}],"deslocamentos":["🚶 Mövenpick → Amsterdam Centraal: ~10 min a pé ou táxi ~5 min · sair às 06:45","🚄 Amsterdam Centraal (plat. 5b) → Düsseldorf Hbf (plat. 16): ICE 225 · 08:31 → 10:45 · 2h14 via Arnhem · vagão 21, lug. 67/68","🚗 Düsseldorf Hbf → Hotel: Táxi · ~15 min / S11 · ~12 min","💰 Total estimado do dia: R$ 799 – 1.714 por pessoa"]},{"num":12,"data":"2026-08-11","titulo":"Düsseldorf → Amsterdam → São Paulo","resumo":"Dia de retorno: saída cedo do hotel, voo das 08:15 para Amsterdam, conexão de quase 4h em Schiphol e o transatlântico das 13:00 em executiva KLM, com chegada em Guarulhos às 19:50.","energia":"Leve","atividades":[{"horario":"05:45 – 06:10","nome":"Novotel Düsseldorf Airport → Terminal","descricao":"O hotel fica a poucos minutos do aeroporto — de táxi são cerca de 5-10 min. Combinem o táxi com a recepção na véspera; a pé seriam ~20 min, inviável com mala grande.","dica":"Deixem documentos, cartões e etiquetas de bagagem prontos na noite anterior.","lat":51.2895,"lng":6.7668},{"horario":"06:10 – 07:30","nome":"Check-in, Segurança e Embarque","descricao":"Voo às 08h15 — chegar às 06h10-06h30 dá margem confortável para fila de check-in e segurança.","dica":"","lat":51.2895,"lng":6.7668},{"horario":"08:15 – 09:10","nome":"Voo Düsseldorf → Amsterdam Schiphol · KL1798","descricao":"Primeiro trecho do retorno, ~55 min. Chegada em Schiphol às 09:10. Mesmo bilhete (PNR EUJIBL), então a bagagem segue automaticamente até Guarulhos.","dica":"","lat":52.3086,"lng":4.7639},{"horario":"09:10 – 13:00","nome":"Conexão em Amsterdam Schiphol","descricao":"Conexão de 3h50, das 09:10 às 13:00. Usem o lounge KLM conforme bilhete/status e não saiam do aeroporto.","dica":"","lat":52.3086,"lng":4.7639},{"horario":"13:00 – 19:50","nome":"Voo Amsterdam → São Paulo · KL791 · Executiva","descricao":"Cerca de 11h50 de voo, com chegada em Guarulhos às 19:50. Ajustem sono e hidratação para reduzir o cansaço pós-viagem.","dica":"","lat":-23.4356,"lng":-46.4731}],"deslocamentos":["🚗 Novotel Düsseldorf Airport → Terminal: Táxi · ~5-10 min (hotel ao lado do aeroporto)","✈ Düsseldorf → Amsterdam: KL1798 · 08:15 → 09:10 · ~55 min · PNR EUJIBL","✈ Amsterdam → São Paulo: KL791 · 13:00 → 19:50 · Executiva · ~11h50","💰 Total estimado do dia: R$ 106 – 236 por pessoa"]}],"documentos":[{"icon":"✈️","titulo":"Passagens Aéreas","meta":"CNF→GRU (Azul 4236) · GRU→CDG→MUC (AF459/AF1822) · M
